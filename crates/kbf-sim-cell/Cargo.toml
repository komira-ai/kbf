[package]
name = "kbf-sim-cell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
futures.workspace = true
kbf-caps.workspace = true
kbf-front.workspace = true
kbf-log.workspace = true
kbf-meta.workspace = true
kbf-raft.workspace = true
kbf-segments.workspace = true
kbf-server.workspace = true
kbf-sim.workspace = true
kbf-store.workspace = true
kbf-tier.workspace = true
kbf-types.workspace = true
tokio = { workspace = true, features = ["rt"] }

[lints]
workspace = true

[package.metadata.buildrules]
# The farm lane's `//:ci` (docs/farm.md) checks the format of, builds and lints this package but
# does not run its tests: tests/cell.rs holds an `#[ignore]`d test, and buildrules' test gate
# refuses a test target with an ignored test. They run in ci.yml alone.

[package.metadata.buildrules.actions]
ci = ["fmt", "lint"]
