[package]
name = "kbf-setup"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The first configuration of a kbf host, as a library: `kbf-installer setup` (the `setup`
# module and the flags it takes, `cli`), the files it writes (`installer_toml`, the layout of
# the host's directories in `layout`), the state database it creates or brings forward
# (`database`) and the exit codes it ends with (`exit`). Every change to the host goes
# through kbf-host's plan of steps. kbf-installer re-exports these modules under their old
# paths; this crate never depends on it.
#
# Two programs run this library: `kbf-installer setup` and `kbf setup` (crates/kbf-cli). Only the
# first sets a host up behind `kbf-installer proxy`, so the proxy's side is the `proxy` feature,
# which kbf-installer turns on and kbf-cli does not: the `kbf` binary links no kbf-proxy
# (tests/layering.rs in kbf-integration-test checks the tree of `cargo build -p kbf-cli`).

[features]
# `proxy`: `setup --proxy` and its flags (`setup::proxy`), the `[proxy]` table of installer.toml
# (`installer_toml`) and the host's proxy units. Without it a `[proxy]` table is refused, never
# rewritten, and `--mode=all-in-one` (always behind the proxy) is refused.
proxy = ["dep:kbf-proxy"]

[dependencies]
clap.workspace = true
hex.workspace = true
kbf-host.workspace = true
kbf-proxy = { workspace = true, optional = true }
# `postgres`: the schema's migrations and the client that applies them (`database` module).
kbf-state = { workspace = true, features = ["postgres"] }
serde.workspace = true
thiserror.workspace = true
toml.workspace = true

[dev-dependencies]
kbf-host = { workspace = true, features = ["testkit"] }
# A Postgres database of its own for each test that needs a server (`database` tests).
kbf-state = { workspace = true, features = ["test-database"] }
# The test Postgres server's URL (kbf_testkit::database).
kbf-testkit = { workspace = true, features = ["postgres"] }
postgres.workspace = true
rustix = { workspace = true, features = ["process"] }
serde_json.workspace = true

[lints]
workspace = true
