[package]
name = "kbf-task"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "kbf-task"
path = "src/main.rs"

# A helper for the tests (tests/network.rs); the release builds `--bin kbf-task` only.
[[bin]]
name = "socket_probe"
path = "src/bin/socket_probe.rs"
test = false

[dependencies]
clap.workspace = true
hex.workspace = true
kbf-outputs.workspace = true
kbf-proto.workspace = true
kbf-task-pack.workspace = true
kbf-types.workspace = true
libc.workspace = true
prost.workspace = true
sha2.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
thiserror.workspace = true
ureq.workspace = true
tokio = { workspace = true, features = ["rt", "fs", "process", "time", "io-util"] }

[dev-dependencies]
kbf-segments.workspace = true
kbf-testkit.workspace = true
prost-types.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
