[package]
name = "kbf-log"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
kbf-meta.workspace = true
kbf-proto.workspace = true
kbf-types.workspace = true
prost.workspace = true
thiserror.workspace = true

[dev-dependencies]
hex.workspace = true

[lints]
workspace = true

[package.metadata.buildrules]
# The farm lane's `//:ci` (docs/farm.md) checks the format of, builds and lints this package but
# does not run its tests: tests/golden_corpus.rs holds an `#[ignore]`d test, and buildrules' test
# gate refuses a test target with an ignored test. They run in ci.yml alone.

[package.metadata.buildrules.actions]
ci = ["fmt", "lint"]
