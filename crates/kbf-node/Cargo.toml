[package]
name = "kbf-node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The worker daemon: the `kbf_node` library (the flags, the driver set-up, the serve loop)
# and the thin `kbf-daemon` binary over it. It lives apart from the `kbf-daemon` library because it
# names the drivers, and the drivers depend on that library.
[[bin]]
name = "kbf-daemon"
path = "src/main.rs"

[dependencies]
clap.workspace = true
kbf-daemon.workspace = true
kbf-driver-native.workspace = true
# The S3 client the daemon reads packs with, and its read-only key (`pack_read`).
kbf-objstore.workspace = true
kbf-outputs.workspace = true
# The packing client's reader and read cache (`pack_read`).
kbf-pack.workspace = true
# The pack index trait the reader finds blobs through (`tierstore`).
kbf-pack-index.workspace = true
# The tierstore client: its bodies, its one HTTP/1.1 exchange a read over a connection it dials
# (no proxy, no redirect, the `Host` it signs), and its request signature (`tierstore::client`).
bytes.workspace = true
# The futures the pack reader's wrapper and the client's dial answer (`tierstore`).
futures.workspace = true
hex.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
sha2.workspace = true
kbf-threads.workspace = true
kbf-transfer.workspace = true
kbf-types.workspace = true
# The key pair file of `--pack-store-credentials-file` (`pack_read`).
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tonic.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# The wipe of the credentials file's text once it is read (`pack_read`). Only that text: the
# parsed key pair lives as long as the object-store client holds it, and is not wiped.
zeroize.workspace = true

# The container driver runs rootless `crun` under cgroup v2, and builds on Linux only.
[target.'cfg(target_os = "linux")'.dependencies]
kbf-driver-container.workspace = true

[dev-dependencies]
kbf-integration-test.workspace = true
kbf-map.workspace = true
# The in-memory pack index the tierstore read tests place blobs in (src/tierstore/tests.rs).
kbf-pack-index = { workspace = true, features = ["test-support"] }
# The HMAC the in-process tierstore checks the client's signatures with, apart from the
# client's own (src/tierstore/tests/wire.rs).
hmac.workspace = true
kbf-state = { workspace = true, features = ["test-support"] }
# The in-process storage service of the member the tierstore refusal test starts over.
kbf-storage.workspace = true
kbf-types.workspace = true
# The CAS the restart test's daemon reads its action from (tests/binary.rs).
kbf-front.workspace = true
kbf-proto.workspace = true
# The server the start-up test's daemon says Hello to (src/startup_tests.rs).
kbf-server.workspace = true
libc.workspace = true
prost.workspace = true
rcgen.workspace = true
# A layer tar for the `__unpack-layers` helper test (tests/binary/cache.rs).
tar.workspace = true
# What the unit tests give the daemon to run: kbf-testkit's act verbs and its fake
# xcrun, xcodebuild and sandbox-exec, through links to the test binary.
kbf-testkit.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "test-util", "time"] }

[lints]
workspace = true
