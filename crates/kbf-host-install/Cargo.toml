[package]
name = "kbf-host-install"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The root side of the host-driven package update: the forced command of the key that
# `kbf-updater` holds (docs/deploy/host-install.md). sshd runs it with the command the
# updater asked for in `SSH_ORIGINAL_COMMAND`; it accepts three verbs, checks an install
# against a root-owned allowlist and runs `apt-get` for the one package, one source, no shell,
# and restarts a frontend unit with `systemctl`. On a Mac it installs the release tarball into
# the kit layout instead.
[[bin]]
name = "kbf-host-install"
path = "src/main.rs"

[dependencies]
# The refusal and failure lines, the audit line and the allowlist file.
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# The audit line's time, and `O_NOFOLLOW` for the files read as root.
time.workspace = true
rustix = { workspace = true, features = ["fs", "process"] }
toml.workspace = true
# The Mac side: the release tarball (gzip and tar) and its sha256.
flate2.workspace = true
sha2.workspace = true
tar.workspace = true

# The Linux side of the local socket moves releases in the layout, with the state and the
# verify pipeline of `kbf-installer`, so a host has one of each. (The Mac side does not need
# them, and the program builds without them there.)
[target.'cfg(target_os = "linux")'.dependencies]
kbf-host.workspace = true
kbf-installer.workspace = true
kbf-update.workspace = true

[dev-dependencies]
kbf-testkit.workspace = true
rustix = { workspace = true, features = ["net"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
kbf-host = { workspace = true, features = ["testkit"] }
kbf-installer = { workspace = true, features = ["testkit"] }

[lints]
workspace = true
