// kbf.log.v1: the payload of a command entry in the replicated log
// (docs/design/ha.md, sections 4.1 and 4.6).
//
// This file changes additively, and a reader skips what it does not know instead of
// refusing it. Allowed: a new field (a reader that does not know it ignores it, so the
// field must mean nothing at its zero value), a new command or other `oneof` arm, a new
// message. Not allowed: renumbering a field, removing or reinterpreting one, a new value
// in an enum a reader acts on (add a field instead), a required field. A new command
// must be safe for an older reader to skip, and the change that adds it says what that
// reader loses.
//
// The decoder (kbf-log) therefore:
// - ignores a field this file does not name, and decodes the rest of the message;
// - reads a message whose `oneof` is unset (an arm this file does not name) as an unknown
//   command, and so a command with an enum value this file does not name, or the
//   UNSPECIFIED zero that every enum has: it is never read as a default;
// - reads the bytes of a value however they are written (an explicit zero, a varint that
//   is not minimal, a field repeated or out of order);
// - decodes every command below under every format version.
// It still refuses what no later version makes right: bytes that are not a well-formed
// message, a message field the domain value requires when it is absent, a hash that is
// not 32 bytes, and a set that is not in strictly increasing order (there are no `map`
// fields; a set is a repeated field). A refused entry is a decode error, which stops the
// replica.
//
// The encoder writes every command it knows under every format: the log's format version
// records the highest `machine_version` entry committed in the log, and no command
// depends on it. A new command needs no raise; a reader that does not know it skips it.
// Format 1 is this file as it first was. Bootstrap and the control commands (`farm` to
// `machine_version`) joined format 1 before any log was written (the Raft metadata log of
// kbf-server is the first writer, and it writes only `meta` and `bootstrap`).
//
// Format 2 is format 1 plus the write tier's metadata commands (MetaCommand fields 10
// to 14, docs/design/write-path.md section 6.5).
//
// Format 3 is format 2 plus `EvictObjects` (MetaCommand field 15), which forgets the
// objects the store no longer holds.
//
// Format 4 is format 3 plus node writers (`SetWriter`, and an `ObjectId` naming a node or
// another log's epoch) and the commands of a rebuild of the index from the store
// (`AdoptSegment`, `RebuildProgress`, `RebuildDone`: MetaCommand fields 16 to 19).
//
// Format 5 is format 4 plus `ReseatStaged` (MetaCommand field 20), which moves a staged
// object's records to another object in one step.
syntax = "proto3";

package kbf.log.v1;

// The payload of a command entry: the commands of ha.md section 4.1.
message LogCommand {
  oneof command {
    MetaCommand meta = 1;
    Bootstrap bootstrap = 2;
    FarmBatch farm = 3;
    Report report = 4;
    Takeover takeover = 5;
    Checkpoint checkpoint = 6;
    MachineVersion machine_version = 7;
  }
}

// The first command of a log (ha.md section 4.11): the id drawn when the log was
// created, never zero, and the key prefix every object the farm writes goes under,
// the same for every start over the log. A replica takes the first committed
// Bootstrap and treats any later one as a no-op.
message Bootstrap {
  uint64 log_id = 1;
  string store_prefix = 2;
}

// One command of the metadata state machine (kbf-meta's Command).
message MetaCommand {
  oneof command {
    Tick tick = 1;
    AllocEpoch alloc_epoch = 2;
    PutBlob put_blob = 3;
    PutBlobs put_blobs = 4;
    PutAction put_action = 5;
    Touch touch = 6;
    ObjectUnreachable object_unreachable = 7;
    ObjectReachable object_reachable = 8;
    Collect collect = 9;
    // Format 2.
    AddTier add_tier = 10;
    PutStaged put_staged = 11;
    SealStaged seal_staged = 12;
    ObjectFlushed object_flushed = 13;
    FlushConflict flush_conflict = 14;
    // Format 3.
    EvictObjects evict_objects = 15;
    // Format 4.
    SetWriter set_writer = 16;
    AdoptSegment adopt_segment = 17;
    RebuildProgress rebuild_progress = 18;
    RebuildDone rebuild_done = 19;
    // Format 5.
    ReseatStaged reseat_staged = 20;
  }
}

// Advances farm time to `farm_time_ms`, milliseconds of farm time.
message Tick {
  uint64 farm_time_ms = 1;
}

// Allocates a writer epoch.
message AllocEpoch {}

// The hash function of a Digest.
enum DigestFunction {
  DIGEST_FUNCTION_UNSPECIFIED = 0;
  DIGEST_FUNCTION_SHA256 = 1;
}

// A content digest. `hash` is exactly 32 bytes.
message Digest {
  DigestFunction function = 1;
  bytes hash = 2;
  uint64 size_bytes = 3;
}

// An object in the object store: its writer and a sequence number within it. The
// writer is an epoch (`epoch` not zero, `member`, `boot` and `log` zero) or, from format
// 4, a registered storage node (`epoch` and `log` zero, `member` and `boot` not zero) or
// an epoch of another log (`epoch` and `log` not zero, `member` and `boot` zero). Before
// format 4 `member`, `boot` and `log` are always zero.
message ObjectId {
  uint64 epoch = 1;
  uint64 seq = 2;
  uint64 member = 3;
  uint64 boot = 4;
  uint64 log = 5;
}

// A record `offset` bytes into an object of store `store` (at most 65535).
message Location {
  uint32 store = 1;
  ObjectId object = 2;
  uint64 offset = 3;
}

// Records that a blob's bytes are durable at a location.
message PutBlob {
  Digest digest = 1;
  Location location = 2;
}

// Records several blobs, in order; a digest may repeat.
message PutBlobs {
  repeated PutBlob blobs = 1;
}

// Who asks to write the action cache.
enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_DAEMON = 1;
  ROLE_CLIENT = 2;
}

// An action-cache entry: the ActionResult blob and its closure (a set).
message ActionRecord {
  Digest result = 1;
  repeated Digest closure = 2;
}

// Writes the action-cache entry for `action`.
message PutAction {
  Role role = 1;
  Digest action = 2;
  ActionRecord record = 3;
}

// Touches blob and action-cache entries (two sets).
message Touch {
  repeated Digest blobs = 1;
  repeated Digest actions = 2;
}

// Why an object is marked unreachable.
enum UnreachableReason {
  UNREACHABLE_REASON_UNSPECIFIED = 0;
  UNREACHABLE_REASON_MISSING = 1;
  UNREACHABLE_REASON_CORRUPT = 2;
}

// A read could not use the object; the entry's log index becomes the mark's generation.
message ObjectUnreachable {
  ObjectId object = 1;
  UnreachableReason reason = 2;
}

// The object is reachable again, if its mark's generation is still `generation`.
message ObjectReachable {
  ObjectId object = 1;
  uint64 generation = 2;
}

// Removes every blob and action entry whose retention has run out.
message Collect {}

// Registers `tier` as server `server`'s local write tier.
message AddTier {
  uint64 server = 1;
  uint64 tier = 2;
}

// A record of a staged object: a blob at `offset` in the object's block.
message StagedBlob {
  Digest digest = 1;
  uint64 offset = 2;
}

// One object of a PutStaged: records below `end`, synced; `seal` seals it in the same
// commit.
message StagedObject {
  ObjectId object = 1;
  uint64 end = 2;
  bool seal = 3;
  repeated StagedBlob blobs = 4;
}

// Records blobs synced to block files on `tier`, and marks their objects staged there.
message PutStaged {
  uint64 tier = 1;
  repeated StagedObject objects = 2;
}

// Seals a staged object.
message SealStaged {
  ObjectId object = 1;
}

// The store holds a sealed staged object; it is no longer staged.
message ObjectFlushed {
  ObjectId object = 1;
}

// The store holds different bytes under a sealed staged object's key.
message FlushConflict {
  ObjectId object = 1;
}

// Moves the records of staged object `from` to object `to` (see kbf-meta's
// Command::ReseatStaged): `stored` says `to` is in the store, not staged. Format 5.
message ReseatStaged {
  uint64 tier = 1;
  ObjectId from = 2;
  StagedObject to = 3;
  bool stored = 4;
}

// Forgets `objects` (a set, ordered as kbf-meta orders object ids: epoch writers by
// epoch, then node writers by member and boot, then seq): every blob whose current
// location is in one of them, and every action-cache entry that needs such a blob. A
// staged object is skipped.
message EvictObjects {
  repeated ObjectId objects = 1;
}

// Makes boot `boot` of member `member` (both not zero) the node writer every later put
// of a node object names. Format 4.
message SetWriter {
  uint64 member = 1;
  uint64 boot = 2;
}

// Indexes the records of a segment the store holds that this log did not write, each
// only if its digest is not indexed. `entries` are in the order of the segment's footer; a digest
// may repeat, and the first is the one held. Format 4.
message AdoptSegment {
  ObjectId object = 1;
  repeated AdoptedBlob entries = 2;
}

// A record of an adopted segment: a blob at `offset` in the object.
message AdoptedBlob {
  Digest digest = 1;
  uint64 offset = 2;
}

// Every object key up to and including `after_key` (not empty) is handled by the
// rebuild of the index. Format 4.
message RebuildProgress {
  string after_key = 1;
}

// The rebuild of the index is complete. Format 4.
message RebuildDone {}

// ---- Control commands: the farm machine's inputs (ha.md sections 4.2 to 4.9). ----

// Scheduler and farm inputs the leader batched, all at farm time `farm_time_ms`.
// `wall_time_ns` is the leader's wall clock when it formed the batch, in nanoseconds
// since the Unix epoch: every wall-clock time the farm machine records while it applies
// the batch (a caller's queue time, a Start's send time) is this value, never a clock
// read. The inputs apply in order.
message FarmBatch {
  uint64 farm_time_ms = 1;
  uint64 wall_time_ns = 2;
  repeated FarmInput inputs = 3;
}

// One input of a FarmBatch: the scheduler's events (kbf-sched's Event, but for Report,
// which is its own command) and the farm machine's own.
message FarmInput {
  oneof input {
    WorkerUp worker_up = 1;
    Capacity capacity = 2;
    Heartbeat heartbeat = 3;
    Submit submit = 4;
    ControlRecord committed = 5;
    Started started = 6;
    SchedulerTick tick = 7;
    Cordon cordon = 8;
    Drain drain = 9;
    Uncordon uncordon = 10;
    Disconnected disconnected = 11;
  }
}

// A worker registered, from daemon process `instance`, with `capacity` and `caps`.
message WorkerUp {
  string worker = 1;
  string instance = 2;
  Resources capacity = 3;
  NodeCaps caps = 4;
  // The predecessor of `instance` was proven stopped (kbf.worker.v1 Hello).
  bool predecessor_stopped = 5;
}

// A registered worker's capacity or capabilities changed on the same stream.
message Capacity {
  string worker = 1;
  Resources capacity = 2;
  NodeCaps caps = 3;
}

// A worker's heartbeat, with the leases it holds, in the order it listed them.
message Heartbeat {
  string worker = 1;
  repeated LeaseId running = 2;
}

// A caller asks for `request` to run. It names no waiter: the farm machine assigns the
// caller's id when it applies the input.
message Submit {
  Request request = 1;
}

// A record the scheduler asked to commit.
message ControlRecord {
  oneof record {
    LeaseGrant lease = 1;
    ResultRecord result = 2;
    RefusalRecord refusal = 3;
  }
}

// The worker holding `lease` started `operation`.
message Started {
  uint64 operation = 1;
  LeaseId lease = 2;
}

// A placement round and lease expiry, at the batch's farm time.
message SchedulerTick {}

// An operator cordons `worker`.
message Cordon {
  string worker = 1;
}

// An operator drains `worker`, pausing at farm time `deadline_ms`.
message Drain {
  string worker = 1;
  uint64 deadline_ms = 2;
}

// An operator returns `worker` to placement.
message Uncordon {
  string worker = 1;
}

// The newest stream of node `worker` closed.
message Disconnected {
  string worker = 1;
}

// A worker's result, at farm time `farm_time_ms`, as one command with the action-cache
// entry it writes if the scheduler accepts it (ha.md section 4.3). `action_entry` is
// absent when the result writes none (a failure, an uncached action).
message Report {
  uint64 farm_time_ms = 1;
  uint64 operation = 2;
  LeaseId lease = 3;
  Outcome outcome = 4;
  ActionEntry action_entry = 5;
}

// The action-cache entry a Report writes, as a daemon's PutAction.
message ActionEntry {
  Digest action = 1;
  ActionRecord record = 2;
}

// A new leader's first command: its Raft term (never zero) and the farm time it starts
// from.
message Takeover {
  uint64 term = 1;
  uint64 farm_time_ms = 2;
}

// The SHA-256 digest (32 bytes) of the leader's state at log index `index`
// (ha.md section 4.9).
message Checkpoint {
  uint64 index = 1;
  bytes digest = 2;
}

// Raises the machine version (ha.md section 4.7) to `version`, never zero.
message MachineVersion {
  uint32 version = 1;
}

// ---- The values control commands carry. ----

// A request vector or a capacity.
message Resources {
  uint64 cpu_millis = 1;
  uint64 memory_bytes = 2;
  uint64 gpus = 3;
  uint64 vms = 4;
  // The most Action leases a node runs at once; unset: no cap.
  optional uint64 leases = 5;
  // Bytes of scratch disk, added after format 1 (as an additive field): a log written before it
  // has no field 6, which reads as 0 (books no disk), and 0 is not written.
  uint64 disk_bytes = 6;
}

// A key and a value: a request property, or an exact capability a node reports.
message Property {
  string key = 1;
  string value = 2;
}

// What a node offers (kbf-caps NodeCaps). `exact`, `members`, `consumables` and
// `devices` (by id) are maps written in key order; `drivers` and every `values` are sets
// in increasing order.
message NodeCaps {
  CpuCaps cpu = 1;
  repeated Property exact = 2;
  repeated MemberSet members = 3;
  repeated ConsumableAmount consumables = 4;
  repeated string drivers = 5;
  repeated Device devices = 6;
}

// A ready iOS device a node reports: its id (the UDID) and its other attributes
// (`class`, `os_version`, ...), a map written in key order.
message Device {
  string id = 1;
  repeated Property attributes = 2;
}

// A CPU's architecture and its features, a set; its ISA level follows from them.
message CpuCaps {
  Arch arch = 1;
  repeated string features = 2;
}

// A CPU architecture.
enum Arch {
  ARCH_UNSPECIFIED = 0;
  ARCH_X86_64 = 1;
  ARCH_ARM64 = 2;
}

// A set a node reports under `key` (`xcode`, `vm.image`).
message MemberSet {
  string key = 1;
  repeated string values = 2;
}

// A countable capacity.
message ConsumableAmount {
  Consumable consumable = 1;
  uint64 amount = 2;
}

// A countable resource.
enum Consumable {
  CONSUMABLE_UNSPECIFIED = 0;
  CONSUMABLE_CPUS = 1;
  CONSUMABLE_MEM_GIB = 2;
  CONSUMABLE_NVME_GIB = 3;
  CONSUMABLE_GPUS = 4;
  CONSUMABLE_DISK_GIB = 5;
}

// One execution request (kbf-sched's Request). `needs` is the capability request as the
// properties it parses from, in the order kbf-caps writes them.
message Request {
  ActionKey key = 1;
  Qos qos = 2;
  LeaseKind kind = 3;
  Resources resources = 4;
  repeated Property needs = 5;
  bool hermetic = 6;
  bool do_not_cache = 7;
}

// An instance name and an action digest.
message ActionKey {
  string instance = 1;
  Digest action = 2;
}

// A QoS level: built in, or defined by the deployment.
message Qos {
  oneof level {
    BuiltinQos builtin = 1;
    CustomQos custom = 2;
  }
}

// The built-in QoS levels.
enum BuiltinQos {
  BUILTIN_QOS_UNSPECIFIED = 0;
  BUILTIN_QOS_INTERACTIVE = 1;
  BUILTIN_QOS_CI = 2;
  BUILTIN_QOS_BATCH = 3;
}

// A deployment-defined QoS level; `urgency` fits in 16 bits.
message CustomQos {
  string name = 1;
  uint32 urgency = 2;
}

// What a lease takes.
enum LeaseKind {
  LEASE_KIND_UNSPECIFIED = 0;
  LEASE_KIND_ACTION = 1;
  LEASE_KIND_WHOLE_MACHINE = 2;
  LEASE_KIND_VM = 3;
}

// A lease id: the scheduler term and a sequence number within it.
message LeaseId {
  uint64 term = 1;
  uint64 seq = 2;
}

// A lease grant: `operation` runs on `worker` under `lease`.
message LeaseGrant {
  LeaseId lease = 1;
  uint64 operation = 2;
  string worker = 3;
  // What admission charged the lease. Absent when the grant carries the default cost
  // (a grant written before costs were kept, or one built by hand); a reader without
  // this field skips it.
  LeaseCost cost = 4;
}

// What admission charged one lease, as `LeaseCost` of the scheduler holds it.
message LeaseCost {
  uint64 cpu_millis = 1;
  uint64 memory_bytes = 2;
  uint64 limit_bytes = 3;
  bool cold = 4;
  // The lease is a rerun up the memory ladder. A row written before this field existed
  // reads false.
  bool retry = 5;
  uint64 key_hash = 6;
}

// A result the scheduler accepted.
message ResultRecord {
  LeaseId lease = 1;
  uint64 operation = 2;
  Outcome outcome = 3;
}

// The scheduler gives up on a queued operation.
message RefusalRecord {
  uint64 operation = 1;
  string reason = 2;
}

// How an attempt ended: completed with its ActionResult's digest, or failed.
message Outcome {
  oneof outcome {
    Digest completed = 1;
    Failure failed = 2;
  }
}

// Why an attempt failed.
enum Failure {
  FAILURE_UNSPECIFIED = 0;
  FAILURE_TIMEOUT = 1;
  FAILURE_INFRA = 2;
  FAILURE_INVALID = 3;
  FAILURE_OUT_OF_MEMORY = 4;
  FAILURE_NODE_MEMORY_PRESSURE = 5;
  FAILURE_MISSING_INPUT = 6;
  // The farm lost the run: the daemon restarted while the action ran.
  FAILURE_LOST_DAEMON_RESTARTED = 7;
  // The farm lost the run: the node fenced it.
  FAILURE_LOST_FENCED = 8;
}
