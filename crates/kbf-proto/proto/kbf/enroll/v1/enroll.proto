// kbf.enroll.v1: how a node joins the farm and keeps its certificate
// (docs/design/install-and-enrollment.md, sections 4.3, 5.3 and 5.8).
//
// `Enroll` is served by a frontend on a listener of its own that authenticates the server
// only: the caller proves itself with a token secret (`Enroll`) or with the key the
// registry holds for it (`Renew`), never with a client certificate. `ColdStore` is served
// on the worker listener, behind its role table (storage only).
//
// A request the frontend refuses answers with a gRPC status whose code and message come
// from the closed set of refusal reasons in `kbf_types::RefusalReason` (code per reason,
// message exactly its `message()`); nothing here repeats that set.
//
// Times are unix seconds. A certificate is DER; a CSR is PKCS#10 DER of at most 2 KiB and
// carries only a public key and its proof of possession (the frontend reads nothing else
// from it, section 5.5).
//
// Extending: add fields and enum values, never reuse a number. `CredentialMode` is closed:
// its zero value is UNSPECIFIED and a reader refuses it and any value it does not know.
syntax = "proto3";

package kbf.enroll.v1;

service Enroll {
  // Spend a token to register a node and get its certificates. Idempotent for the same
  // request: a retry after a lost answer returns the stored certificates and spends no
  // second use.
  rpc Enroll(EnrollRequest) returns (EnrollResponse);
  // Get fresh certificates for an enrolled node, proved by the key the registry holds.
  rpc Renew(RenewRequest) returns (RenewResponse);
}

// Served on the worker listener (mutual TLS), storage role only: the cold store the
// farm's operator registered with the frontend, with its keys. A frontend that has a
// registration says so in the `objstore_generation` of its `Membership` answers
// (kbf.map.v1); the node calls `GetStoreConfig` when that number differs from the one it
// applied and reports the outcome in its next `Membership.Heartbeat`. A node holds the
// answer in memory only. The keys are never part of `NodeConfig`.
//
// This replaces `GetKeys`, which no frontend ever served: one atomic answer carries the
// store's identity and its keys, so a node never pairs one generation's endpoint with
// another's secret.
service ColdStore {
  // The registered cold store, or nothing when the caller already holds `generation`.
  // PERMISSION_DENIED: the caller is not a storage node, is denied, or (when the
  // frontend keeps an enrollment registry) is not an active node in it, checked at every
  // call. UNAVAILABLE: the frontend cannot give a consistent answer now (the state store
  // failed, the keys are not readable); retry.
  rpc GetStoreConfig(GetStoreConfigRequest) returns (GetStoreConfigResponse);
}

message RoleCsr {
  // "storage" or "daemon"; the frontend role is never granted by a token.
  string role = 1;
  // PKCS#10, ECDSA P-256, at most 2 KiB. One key per role.
  bytes csr_der = 2;
}

message EnrollRequest {
  // The token's lookup id (12 characters of lower-case base32); not secret.
  string token_id = 1;
  // The 32 secret bytes of the token (the token string carries them as base64url).
  bytes token_secret = 2;
  string node_id = 3;
  // Storage role only: "host:port".
  string advertise = 4;
  string zone = 5;
  // One per requested role, each with its own key; a role appears at most once.
  repeated RoleCsr csrs = 6;
  // Informational.
  NodeFacts facts = 7;
}

message NodeFacts {
  string os = 1;
  string arch = 2;
  // The running release's commit.
  string commit = 3;
  uint32 protocol = 4;
  string package_version = 5;
}

message IssuedCert {
  string role = 1;
  bytes leaf_der = 2;
  // Lower-case hex without leading zeros: the deny list's spelling of a serial.
  string serial = 3;
  int64 not_before = 4;
  int64 not_after = 5;
}

message EnrollResponse {
  repeated IssuedCert certs = 1;
  // Every CA certificate to trust, current first.
  bytes ca_bundle_pem = 2;
  NodeConfig config = 3;
  // For the node's clock-skew check.
  int64 server_time = 4;
  // When the node should first try to renew.
  int64 renew_after = 5;
}

message RenewRequest {
  string node_id = 1;
  // One per role the node holds, each signed by the key the registry holds for that role.
  repeated RoleCsr csrs = 2;
  // Also inside the CSR's signed attributes.
  int64 issued_at = 3;
  // The configuration generation the node holds.
  uint64 config_generation = 4;
}

message RenewResponse {
  repeated IssuedCert certs = 1;
  bytes ca_bundle_pem = 2;
  // Present only when its generation differs from the request's.
  NodeConfig config = 3;
  int64 server_time = 4;
  int64 renew_after = 5;
}

enum CredentialMode {
  CREDENTIAL_MODE_UNSPECIFIED = 0;
  // The storage node fetches the registered store and its keys with
  // `ColdStore.GetStoreConfig`.
  CREDENTIAL_MODE_KEYS = 1;
  // The node uses its own cloud identity; the frontend sends no key.
  CREDENTIAL_MODE_AMBIENT = 2;
}

// What a node pulls from its frontend; never a secret.
message NodeConfig {
  // Strictly increases at every change.
  uint64 generation = 1;
  // Granted roles, "storage" and "daemon"; they decide the node's mode.
  repeated string roles = 2;
  // The https URL a daemon dials (`--server`).
  string worker_endpoint = 3;
  // What `--cas` is for a daemon-only node.
  string cas_endpoint = 4;
  uint32 storage_port = 5;
  // `s3://bucket/prefix/?endpoint=...`; never a key. The frontend builds it from the
  // registered `cold` store (bucket, prefix, endpoint, region, `conditional-put`,
  // `min-put-rate`) and sends it to a node with the storage role; empty when no store is
  // registered. It stays beside the registration
  // (`ColdStore.GetStoreConfig`) because it is the node's own `--cold-store` identity, which
  // a registration for another store does not replace (the node reports it and keeps
  // running); the registration is the only source of keys.
  string cold_store = 6;
  uint32 min_protocol = 7;
  // Seconds between looks at the certificate files (30).
  uint32 tls_reload_interval_s = 8;
  // Optional: a changed frontend URL (design section 4.2).
  string frontend_url = 9;
  CredentialMode credential_mode = 10;
}

message GetStoreConfigRequest {
  // The registration generation the node applied (0: none). The answer is a bare
  // generation when it equals the frontend's; any other number, a lower one too (a
  // restored state store goes back), is answered in full.
  uint64 have_generation = 1;
}

message GetStoreConfigResponse {
  // The registration generation this answer is a snapshot of; the same number the
  // frontend's `Membership` answers carry. 0: nothing is registered.
  uint64 generation = 1;
  // Absent when the request's `have_generation` equals `generation`, and when nothing is
  // registered.
  StoreConfig config = 2;
}

// One registered cold store: a connection (endpoint and key pair) bound to the role
// "cold" with a bucket and prefix. Read from one snapshot of the frontend's state.
// The Rust type prints its secret as `Secret(..)` in `Debug` and overwrites it when dropped.
message StoreConfig {
  // The connection's name.
  string connection = 1;
  // The bound role; "cold" is the only one.
  string role = 2;
  // `http://host:port` of the S3-compatible endpoint.
  string endpoint = 3;
  string region = 4;
  string bucket = 5;
  string prefix = 6;
  bool conditional_put = 7;
  // Bytes per second below which a put is too slow; 0: no floor.
  uint64 min_put_rate = 8;
  string access_key_id = 9;
  // SECRET. Only this message carries it.
  string secret_access_key = 10;
  // Names the secret file the frontend read it from; changes when the secret does.
  uint64 secret_version = 11;
}
