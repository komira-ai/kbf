[package]
name = "kbf-guest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The agent inside a macOS VM guest (docs/design/macos-vms.md section 6, step 4). No
# async runtime and no network crate: it speaks one framed protocol over one byte
# stream and runs one command.
[[bin]]
name = "kbf-guest"
path = "src/main.rs"

# The program the tests run as the command (kbf-testkit's act verbs). It has its own
# name because Cargo sets `CARGO_BIN_EXE_<name>` only for the bins of the package
# under test, and two packages with a bin of the same name collide in `target/`.
# kbf-testkit is a dependency of this bin only; the `kbf-guest` binary does not link it.
[[bin]]
name = "kbf-guest-act"
path = "src/bin/kbf-guest-act.rs"
test = false

[dependencies]
clap.workspace = true
hex.workspace = true
kbf-testkit.workspace = true
libc.workspace = true
subtle.workspace = true
thiserror.workspace = true

[lints]
workspace = true
