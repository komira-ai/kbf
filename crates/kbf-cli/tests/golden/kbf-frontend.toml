# kbf frontend: every setting, one table per group; a key is a flag's long name.
# Generated from the flag definitions (tests/golden). A flag on the command line
# overrides its key. A secret is the path of the file that holds it.

[daemon]
# Worker threads of the async runtime, which run every task between its waits. Default: every CPU the process may use
# async-threads = "N"
# The most threads the runtime's blocking pool runs at once, for calls that wait on a disk or a process (a thread is made when a call needs one and ends when idle). Default: 512 (tokio's)
# blocking-threads = "N"
# Threads for CPU-bound work, such as hashing, which never waits and so is held to the CPUs. Default: every CPU the process may use
# cpu-threads = "N"

[enroll-service]
# Keep the CA key as a file in this process (development and tests only; production uses --ca-signer and refuses to start without it).
ca-dev-file-signer = false
# The CA directory (ca.key mode 0600, ca.pem). With --ca-dev-file-signer an empty directory gets a new CA and a directory holding one is loaded, never overwritten; with --ca-signer it must hold ca.pem, which the signer made.
# ca-dir = "DIR"
# The socket of the kbf-signer process that holds the CA key (production). This process holds no CA key.
# ca-signer = "SOCKET"
# Does nothing: this build enforces the deny rows a node revocation writes, so --enroll-listen needs no acceptance. Still accepted so existing units start; it will be removed in a later release.
enroll-allow-unenforced-deny = false
# What --cas is for a worker-only node, told to every node. Empty: none.
# enroll-cas-endpoint = "URL"
# How long the certificates the CA issues live (3600 to 2592000); a node renews at half. The signer's own --lifetime-secs must be at least this.
enroll-cert-lifetime-secs = 604800
# Serve kbf.enroll.v1 (Enroll and Renew) on this address, over TLS with the frontend's own certificate from the CA. Off unless given. It needs --state-store, --ca-dir, --frontend-name, and --ca-signer (or, for development, --ca-dev-file-signer).
# enroll-listen = "ADDR"
# Calls the listener works on at once, from all sources; the next is refused `rate limited`.
enroll-max-in-flight = 64
# Calls one TCP peer address may make at once (behind the bundled kbf-proxy, the whole listener).
enroll-rate-burst = 30
# Enroll and Renew calls per minute from one TCP peer address, once its burst is spent. Behind the bundled kbf-proxy every peer is loopback, so this is one limit for the listener and the proxy limits per client address. The count is in memory and starts again at a restart.
enroll-rate-per-minute = 60
# The port a storage node serves on, told to every node.
# enroll-storage-port = "PORT"
# The https URL a worker dials (--server), told to every node. Empty: none.
# enroll-worker-endpoint = "URL"
# A name this frontend serves, a DNS name or an IP address; repeat it for each. The enroll listener's certificate carries these names, and no node may advertise one or a host under one.
# frontend-name = []

[executor]
# Where the frontend runs the actions it is asked to execute: `js-agent`, the only value, runs each Execute as a job of the job scheduler's job service, in the kbf image (`--executor-kbf-image`, built from `--executor-base-image`), whose task tool runs the action inside it; it needs the job service's flags (`--executor-job-url`, `--executor-job-token-file`, and `--executor-job-ca-file` for https), `--executor-frontend-id`, the release's base tree bundles (`--executor-base-tree`), the packs (`--pack-store-endpoint`) and the put directories of the runs (`--task-secret-file`, `--task-out-root`). Left out, no executor is built and no job service is contacted, whatever the other `--executor-*` flags say
# executor = "KIND"
# Removed with the executor's presigned path. Any value is refused at start
# (not in --help)
# executor-allow-open-network = "VALUE"
# Removed with the executor's presigned path. Any value is refused at start
# (not in --help)
# executor-allow-plain-http-grant = "VALUE"
# Removed with the executor's presigned path. Any value is refused at start
# (not in --help)
# executor-allow-plain-http-put = "VALUE"
# The CPU architecture of the Linux hosts. Every job of a Linux action asks for a host of `os=linux`, this `arch` and containers (the Macs' are `arm64`). Used only with `--executor js-agent`
executor-arch = "x86_64"
# The base environment the Command of an action sees, pinned by digest as `<repository>@sha256:<64 hex digits>` (a leading `docker://` is optional). It is the one image an action's `container-image` platform property may name: an action that names another is refused as invalid, one that names none gets this. A tag is refused. Needed with `--executor js-agent`
# executor-base-image = "IMAGE"
# The frontend's cache of the release's kbf base tree: a directory the frontend may write (the user the frontend runs as). The release's `SHA256SUMS` and its `kbf-base-tree-<commit>-linux-<arch>.tree.tar` bundle of `--executor-arch` are kept in `<DIR>/<commit>/`; when `<DIR>` holds neither that nor the same two files loose (copied by hand, as an earlier release asked), the frontend fetches them from the release (`--executor-base-tree-url`), checks the bundle against the release's `SHA256SUMS` and only then puts them in the cache, keeping the newest older releases for a rollback (`--executor-base-tree-keep`). It then writes the objects of the kbf base tree that the pack store lacks to `cas/l/`, create-only, so the pack store credentials must be allowed to write there, and records the tree as `job-tree/<digest>` in `--state-store` if there is one. A bundle that cannot be had, is not listed or not the listed bytes, or a write that fails, fails the start, naming this flag. Needed with `--executor js-agent`; without it nothing is read, fetched or written
# executor-base-tree = "DIR"
# How many releases besides the running one stay in the `--executor-base-tree` cache after a fetch, for a rollback of the frontend: the newest fetched. 0 keeps none. Used only with `--executor js-agent`
executor-base-tree-keep = 1
# How long the fetch of the base tree files waits, in seconds, for a connection, for the head of an answer and between two chunks of a body (a stall, not the whole download). Used only with `--executor js-agent`
executor-base-tree-timeout-secs = 60
# Where the release's base tree files are looked up when `--executor-base-tree` lacks them: a list of releases in the shape of GitHub's `GET /repos/<owner>/<repo>/releases` (an array, each release with `assets` of `name` and `browser_download_url`), read a page at a time (`?per_page=100&page=N`) until a release lists the bundle and the `SHA256SUMS`. https, or http on loopback. Empty fetches nothing: the files must then be in `--executor-base-tree` already. Used only with `--executor js-agent`
executor-base-tree-url = "https://api.github.com/repos/komira-ai/kbf/releases"
# How long one call to the job service may take before it counts as unanswered, in seconds. Used only with `--executor js-agent`
executor-call-timeout-secs = 5
# The timeout, in seconds, of an action that names none: at most `--executor-max-run-secs`. Used only with `--executor js-agent`
executor-default-timeout-secs = 3000
# The most bytes of a failed job's standard error the frontend writes to its log, at WARN: the end of the stream. 0 writes none. The whole output (up to 8 KiB with standard output) goes with the result either way. Used only with `--executor js-agent`
executor-failed-stderr-log-bytes = 512
# The name every frontend of the farm gives: the value of the `kbf-frontend` label of every job, hashed into the job ids. 1 to 63 of letters, digits, `-`, `_` and `.`. It is the same for every frontend of one farm, not unique to each. Used only with `--executor js-agent`
# executor-frontend-id = "ID"
# Retired: no longer read, every Execute is a job of the job service
# (not in --help)
# executor-host-cpus = "CORES"
# Retired: no longer read, every Execute is a job of the job service
# (not in --help)
# executor-host-memory-gib = "GIB"
# Retired: no longer read, every Execute is a job of the job service
# (not in --help)
# executor-host-slots = "RUNS"
# Retired: no longer read, every Execute is a job of the job service
# (not in --help)
# executor-hosts = "WORKERS"
# What a Linux put-directory job's root is read from. `manifests`, the default: the action tree's manifests, the job's layer `<mp>/trees/<digest>`. `provider`: one tree list of the tree, the job's layer tierstore's mount provider, which fetches the tree's files while the job's sandbox is made. `provider` needs `--task-out-mode put-dir`. A Mac job's root is always `manifests`. Used only with `--executor js-agent`
executor-input-tree = "manifests"
# Removed with the executor's presigned path. Any value is refused at start
# (not in --help)
# executor-insecure-argv-secrets = "VALUE"
# The CA certificate (PEM) the job service's certificate chains to: the only trust anchor, no system roots are consulted. Needed for an `https` job service and refused for an `http` one. Used only with `--executor js-agent`
# executor-job-ca-file = "PATH"
# A file with the bearer token of the job service, readable by its owner alone (mode 0600 or 0400). The secret is never a flag: a command line is world-readable. Used only with `--executor js-agent`
# executor-job-token-file = "PATH"
# The job service, as `https://host[:port]`, or `http://` to a loopback host. Used only with `--executor js-agent`
# executor-job-url = "URL"
# The kbf image, pinned by digest like `--executor-base-image` and built from it, that every job is launched from. It keeps the task tool as its `ENTRYPOINT`, so the job's arguments are the tool's flags and the action runs inside this image. Must be another image than the base. Needed with `--executor js-agent`
# executor-kbf-image = "IMAGE"
# How long the liveness row of this process lives in the state store after its last renewal, on the store's clock, in seconds. Once it has expired, another frontend of the store takes up this process's unfinished operations. Read only with `--state-store`. Used only with `--executor js-agent`
executor-live-secs = 20
# Removed with the executor's presigned path. Any value is refused at start
# (not in --help)
# executor-locate = "VALUE"
# Retired: no longer read, every Execute is a job of the job service
# (not in --help)
# executor-mac-hosts = "WORKERS"
# The least major macOS every Mac of the job service runs. An action's `os_version` is the least it takes (`26` means 26 or newer), and one that asks for a newer macOS than this is refused, naming both: the job service cannot be asked for a version. Used only with `--executor-mac-task-bundle`
executor-mac-os-version = 26
# The release's macOS `kbf-task` bundle, by its manifest digest (the one entry of the `index.json` of `kbf-task-bundle-<commit>-darwin-arm64.tar.gz`): the image of a Mac job, whose entrypoint `kbf-task` runs. It enables the Macs: without it no action whose platform asks for macOS is run, and `--executor-mac-os-version` and `--executor-mac-task-out-root` are refused. Used only with `--executor js-agent`
# executor-mac-task-bundle = "NAME@sha256:HEX"
# The tier store's put directory on the Macs, if it is not `--task-out-root`: a Mac job mounts its put directory under it and its action tree from the `trees` directory beside it. Used only with `--executor-mac-task-bundle`, refused without it
# executor-mac-task-out-root = "PATH"
# The longest action timeout the executor runs, in seconds; an action that asks for more is refused. Used only with `--executor js-agent`
executor-max-run-secs = 3000
# Removed with the executor's presigned path. Any value is refused at start
# (not in --help)
# executor-network = "VALUE"
# Retired: no longer read, every Execute is a job of the job service
# (not in --help)
# executor-ownership = "MODE"
# How often each operation's job is read back from the job service, and a submit whose answer was lost is sent again, in milliseconds: 100 to 10000. Used only with `--executor js-agent`
executor-poll-ms = 250
# Retired: no longer read, every Execute is a job of the job service
# (not in --help)
# executor-prepare-concurrency = "COUNT"
# How long the inputs of one run (its action, its input tree published into the store, its keys) may take to prepare, in seconds; a run whose preparation takes longer ends as an infrastructure failure. Used only with `--executor js-agent`
executor-prepare-limit-secs = 300
# What a job's wall limit adds to the action's timeout, in seconds: the fetch of the inputs and the upload of the pack. An action that fetches or uploads for longer than this ends at the wall limit and is answered to the caller as a timeout. Used only with `--executor js-agent`
executor-run-margin-secs = 300
# Removed with the executor's presigned path. Any value is refused at start
# (not in --help)
# executor-secret-delivery = "VALUE"
# Removed with the executor's presigned path. Any value is refused at start
# (not in --help)
# executor-work-dir = "VALUE"

[handover]
# Retired: no longer read, the handover was removed. Accepted and ignored for one release
# (not in --help)
# admin-listen = "ADDR"
# Retired: no longer read, the handover was removed. Accepted and ignored for one release
# (not in --help)
await-takeover = false
# Retired: no longer read, the handover was removed. Accepted and ignored for one release
# (not in --help)
# envoy-check-interval-ms = "MILLISECONDS"
# Retired: no longer read, the handover was removed. Accepted and ignored for one release
# (not in --help)
# envoy-check-timeout-ms = "MILLISECONDS"
# Retired: no longer read, the handover was removed. Accepted and ignored for one release
# (not in --help)
# envoy-unhealthy-threshold = "N"
# Retired: no longer read, the handover was removed. Accepted and ignored for one release
# (not in --help)
# handover-follow-interval-ms = "MILLISECONDS"
# Retired: no longer read, the handover was removed. Accepted and ignored for one release
# (not in --help)
# handover-peer-name = "DNS_NAME"
# Retired: no longer read, the handover was removed. Accepted and ignored for one release
# (not in --help)
# handover-quiesce-secs = "SECONDS"
# Retired: no longer read, the handover was removed. Accepted and ignored for one release
# (not in --help)
# handover-socket = "PATH"
# Retired: no longer read, the handover was removed. Accepted and ignored for one release
# (not in --help)
# handover-watchdog-secs = "SECONDS"
# Retired: no longer read, the handover was removed. Accepted and ignored for one release
# (not in --help)
# instance = "a|b"

[history]
# A file with the key pair of an `s3://` `--history-objects`, JSON `{"access_key_id": "...", "secret_access_key": "..."}` in the form of `--pack-store-credentials-file`: a regular file, not a link, that this user owns, mode 0600 or 0400. When given, the environment's `AWS_ACCESS_KEY_ID` and `AWS_SECRET_ACCESS_KEY` are not read. The secret is never a flag. Needs `--history-objects`, and an `s3://` one
# history-credentials-file = "PATH"
# Where history's index rows live in the state store: `ui/`, or `<prefix>ui/` for a prefix that ends in `/`, so that one state store can hold several farms' history apart. Left out, it is `ui/`. Needs `--history-objects`
# history-index-root = "ROOT"
# Where build history is kept: an object store, `s3://bucket/prefix?endpoint=http://host:port` (the key pair is the one in `--history-credentials-file`, else the `AWS_ACCESS_KEY_ID` and `AWS_SECRET_ACCESS_KEY` of the environment) or `file:///absolute/path` (a directory several kbf processes may share, such as the old and the new frontend of a rolling update, each writing under its own writer id; not the cold store's directory, which one process owns). The attempts and cache hits of each invocation a client named are recorded under `<prefix>history/` after their results are sent, never before and never delaying one; the index rows go to `--state-store`, which this flag needs. A full queue, a slow object store or a slow state store drops records and counts them (`kbf_history_dropped_total` on `/metrics`), and never fails or delays a call. The writer reads and writes only keys under `history/`. Left out, nothing is recorded
# history-objects = "URI"
# The memory, in bytes, the invocation records may take together (`docs/design/invocations.md`, section 3.5). At the bound, records of a minted id go first, then idle ones, least recently seen first; with only open builds left, the largest stops taking rows. Records are kept in memory only and lost on restart. Their heap was measured at up to 1.08 times this at 200 kB and above, and 1.12 at 50 kB (section 3.5)
invocation-memory = 268435456

[job-read]
# A file with the farm secret that read grants are signed with, at least 32 bytes (surrounding whitespace is dropped), readable by its owner alone (mode 0600 or 0400). The frontends of a farm and whatever issues the grants must read the same secret. The secret is never a flag: a command line is world-readable
# job-grant-secret-file = "PATH"
# Serves the inputs of an action to the task that runs it, over HTTPS (or, with `--job-plain-http`, plain HTTP) at this address: `GET /<hex>/<size>` and `POST /batch` (many small blobs in one request) with `Authorization: Bearer <read grant>`, and nothing else (any other path is 404 and any other method 405). A read grant is the token a run is given; until it expires it reads the Action it was issued for, its Command and its input tree, and no other blob. The TLS is the server's alone and no client certificate is asked for. The task dials an IP address, so give the address the jobs dial, and a `--job-tls-cert` that names it as an IP subjectAltName. Needs `--job-tls-cert` and `--job-tls-key` or `--job-plain-http`, and `--job-grant-secret-file`. Left out, no such listener is opened
# job-listen = "ADDR"
# The most bytes of one blob the listener serves, at least 1: a blob of more is refused 413 `too_large` before anything is read. A blob of more than 67108864 bytes is streamed from the store through SHA-256 and never held whole; one whose bytes are not its digest's ends its response early, and is counted. Needs `--job-listen`
job-max-blob-bytes = 536870912
# Serves `--job-listen` in plain HTTP, with no TLS, in place of `--job-tls-cert` and `--job-tls-key` (given with either it is refused): the same routes and the same grants, each request still needs a valid read grant, but the grant and the blobs cross the network unencrypted. For a farm on its own network. Needs `--job-listen` and `--job-grant-secret-file`
job-plain-http = false
# The bytes of blob reads this listener has open at once, at least 1: a read takes its blob's size (a streamed blob a bounded window of it, and the scope walk's reads their own sizes) and a request over the budget waits for room, it never fails; a blob larger than the whole budget is read alone. Needs `--job-listen`
job-read-budget-bytes = 1073741824
# How long, in seconds, a response that holds read budget may go with no chunk taken by its client before it is dropped, its budget given back and its response ended, at least 1: a client that does not read does not hold the budget for ever, and one that reads is not cut off however long its response takes. Needs `--job-listen`
job-read-idle-secs = 60
# The blob reads this listener has open at once, at least 1: a streamed blob holds its place until its response ends, and a request over the bound waits for one to end. Needs `--job-listen`
job-reads-in-flight = 32
# Removed: tierstore v0.3.29 removed the store read grants this configured. Any value is refused at start
# (not in --help)
# job-store-bucket = "VALUE"
# Removed: tierstore v0.3.29 removed the store read grants this configured. Any value is refused at start
# (not in --help)
# job-store-grant-key-file = "VALUE"
# Removed: tierstore v0.3.29 removed the store read grants this configured. Any value is refused at start
# (not in --help)
# job-store-url = "VALUE"
# The certificate chain (PEM) of `--job-listen`, issued by the farm CA that the jobs trust. It must carry an IP subjectAltName for each address a job dials the frontend at: the start is refused if it has none, or if `--job-listen` is on one address and the certificate does not name it, since a client that dials an IP address accepts only a certificate that names it. Read again every `--tls-reload-interval-secs`, as the other listeners' are; the names are checked at start only
# job-tls-cert = "PATH"
# The private key (PEM) of `--job-tls-cert`
# job-tls-key = "PATH"

[listener]
# The operator API listener (HTTP/JSON under `/v1`). Off unless given. Reads are open to whoever reaches it: bind it where only operators do
# api-listen = "API_LISTEN"
# When set, how long, in seconds, after a drain (a stop signal or `POST /v1/frontend/drain`) has refused new executions it reports the ones still open: a WARN with their count, and `deadline_passed` in `GET /v1/frontend/drain`. It never ends a stream or stops the drain: absent, the default, and set alike, the drain waits for the open executions for as long as they run, and the process stays up serving them. Only a second stop signal, or `--shutdown-timeout-secs` on a stop signal (default none), forces a stop and ends the streams that are left UNAVAILABLE. No upper bound; at least 1.
# drain-deadline = "SECONDS"
# How long, in seconds, a drain (a stop signal or `POST /v1/frontend/drain`) keeps serving everything after `/readyz` has begun to answer 503, so that the load balancer's health check sees it before any call is refused: at least its check interval times its unhealthy threshold, and the time its routes take to change. Then new Execute calls are refused UNAVAILABLE and every listener is sent GOAWAY. 0 goes on at once. The container's stop timeout must exceed this and the longest action to be waited for.
drain-lb-wait = 10
# How often, in seconds, the REAPI and worker listeners send an HTTP/2 PING on a quiet connection. 0 sends none (and `--http2-keepalive-timeout-secs` is unused)
http2-keepalive-interval-secs = 30
# How long, in seconds, a PING may go unanswered before the connection is closed
http2-keepalive-timeout-secs = 20
# The REAPI listener. Without `--reapi-tls-cert` and `--reapi-tls-key` it serves plain text, on any address; off loopback the start line carries a warning
listen = "127.0.0.1:8980"
# The most HTTP/2 streams one connection to the REAPI listener may have open. buck2 keeps one Execute stream open per outstanding action, idle until the action finishes, so this bounds how large a backlog one buck2 invocation can show the farm. The connection's flow-control window is this many streams' windows; above about 2000 streams each stream's window is smaller than 1 MiB so that the product stays under HTTP/2's largest window. At least 1, at most 32767
reapi-max-streams = 10000
# Retired: no longer read, the release poller was removed. Accepted and ignored for one release
# release-poll-every-secs = "SECONDS"
# Retired: no longer read, the release poller was removed. Accepted and ignored for one release
# release-poll-refs = []
# Retired: no longer read, the release poller was removed. Accepted and ignored for one release
# release-poll-repo = "OWNER/NAME"
# Retired: no longer read, the release store was removed; a directory left there is not touched. Accepted and ignored for one release
# releases-dir = "DIR"
# The operator's hard stop, in seconds, for a stop (SIGINT or SIGTERM). A stop refuses new Execute calls (UNAVAILABLE, which Buck2 retries) and sends GOAWAY, and every open Execute and WaitExecution stream stays open until its action is done, however long that takes. The default, 0, is no deadline: the stop waits indefinitely, and a second signal is the other way to end it at once. Buck2 never recovers a stream that breaks mid-action, so set one only to force a stop: when it runs out, the open streams end UNAVAILABLE (a client still uploading is cut off). `--drain-deadline` on a frontend over a state store only reports
shutdown-timeout-secs = 0
# How often, in seconds, a TLS listener looks at its certificate, key and client CA files (the `--*-tls-cert`, `--*-tls-key` and `--*-client-ca` flags). A change is applied to the next TLS handshake, with no restart and without ending a connection already open: renew a certificate by replacing the files. Files that do not make a working configuration (unreadable, not PEM, a key that is not the certificate's, an expired certificate, a renewal caught between its two writes) are logged and counted in `kbf_tls_reloads_total{outcome="rejected"}`, and the previous files keep serving; the next look finds them whole and applies them. The files must be good at start
tls-reload-interval-secs = 30
# The worker listener: storage nodes' `Membership` calls and a host updater's node calls. Without mutual TLS (`--worker-tls-cert`, `--worker-tls-key`, `--worker-client-ca`) it serves plain text, on any address; off loopback the start line carries a warning. `kbf frontend` binds it only when it is given (a frontend with no storage nodes serves none); every other mode binds 127.0.0.1:8981 when it is not
# worker-listen = "WORKER_LISTEN"
# The most HTTP/2 streams one connection to the worker listener may have open: a storage node's short unary calls. At least 1, at most 32767
worker-max-streams = 200

[log]
# The directory of the durable log file, `kbf-server.log` and its rotated `kbf-server.log.1`, `.2`, ... (created if missing): every event stderr gets, in the same format, kept across restarts. Left out, it is `<hot store directory>/log` when the hot store is a directory; with neither, there is no file and the server logs to stderr alone (the start logs which). A directory or file that cannot be written never stops the server ([`crate::log_file`])
# log-dir = "DIR"
# How many log files are kept, the current one included; rotation drops the oldest. The log never exceeds `--log-max-bytes` times this, plus one line
log-files = 8
# The most bytes one log file holds before it is rotated; a line longer than this goes alone to a fresh file. With `--log-files` it bounds the log's size on disk
log-max-bytes = 67108864

[memory]
# Retired: no longer read, kbf schedules nothing. Accepted and ignored for one release
# learned-sizes = "MODE"
# Retired: no longer read, kbf schedules nothing. Accepted and ignored for one release
# memory-ladder-gib = "GIB"
# Retired: no longer read, kbf schedules nothing. Accepted and ignored for one release
no-memory-climb = false

[packs]
# The length, in bytes, at which a pack of client uploads is closed: the blobs of one batch or upload that do not fit are written as the next pack. Used only with `--pack-store-endpoint`
pack-bytes = 33554432
# The most bytes of blobs `--pack-cache-dir` holds
# pack-cache-bytes = "BYTES"
# A directory this process owns where the blobs read from packs are kept, one file each, checked by digest on every read; the least recently used are removed to stay within `--pack-cache-bytes`. Left out, nothing is kept
# pack-cache-dir = "DIR"
# Retired: no longer read, a worker's committed pack is no longer taken. Accepted and ignored for one release
# pack-commit-sample = "BLOBS"
# The most bytes of client uploads into packs this frontend holds in flight at once, at least 67108864 (the largest blob that is packed, so that no upload is refused for its size) and at most 4294967295. Each upload takes its blob's size as soon as its resource name has arrived, before it reads on, and gives it back when it ends; one that finds the rest taken waits its turn, so a burst of uploads is slowed down, not failed. The bound counts blob bytes, not the memory of the process: a batch upload is decoded before it waits, so the bytes it holds meanwhile are not counted, and reads are not counted. Used only with `--pack-store-endpoint`
pack-inflight-bytes = 1073741824
# The bucket of `--pack-store-endpoint` that holds the packs, under the keys `cas/f/<--pack-writer>/<start>/<sequence>`
# pack-store-bucket = "BUCKET"
# A file with the key pair for `--pack-store-endpoint`, as JSON `{"access_key_id": "...", "secret_access_key": "..."}`, readable by its owner alone (mode 0600 or 0400). The secret is never a flag: a command line is world-readable
# pack-store-credentials-file = "PATH"
# Keeps the blobs clients upload in packs (many blobs in one object) in this S3-compatible object store, as `http://host:port`: a pack is written with a create-only request and recorded in the pack index before the upload is acknowledged, and a read asks the index first and fetches only the blob's bytes from its pack. Give it more than once (in kbf.toml, an array) for one store reached through several endpoints, such as the tierstores of the farm's nodes in front of one bucket: each request goes to the next endpoint in turn, and one that could not connect is sent to the next, at most three endpoints for one request (a request that may have reached a store is not sent to another endpoint); an endpoint given twice is refused. A blob the index lacks is read from the storage nodes as before, and a blob over 64 MiB and any compressed blob still go to them. At start the frontend checks that the store refuses to replace an object and does not serve if it does not. Needs `--pack-index`, `--pack-store-bucket` and `--pack-store-credentials-file`. Left out, no pack store is built or contacted and blobs go where they always did
# pack-store-endpoint = []
# The region the requests to `--pack-store-endpoint` are signed for
pack-store-region = "us-east-1"
# The most writes this frontend has at the pack store at once, from 1 to 4096, shared by every writer: the packs of client uploads, the large blobs past them, and the blobs and manifests of action trees. A write past it waits at the frontend for one to end, so a burst queues here and not at the store. A pack the store answers 503 SlowDown (it is taking as many uploads as it can) is written again after jittered waits that double from about 0.5 s to 8 s, holding its slot, for as long as the store answers it; any other 503, to any call of the store, is waited out the same way for at most 60 s. The client sees the time it takes, and a call whose grpc-timeout passes first is ended DEADLINE_EXCEEDED. A streamed upload of a client blob over 64 MiB cannot be sent twice, so a 503 fails it. Used only with `--pack-store-endpoint`
pack-store-writes = 64
# How long, in seconds, a ByteStream upload into packs may go without a byte of its body arriving before it is ended DEADLINE_EXCEEDED and gives back its bytes, so that a client that stops sending cannot hold room for ever. The time before its resource name has arrived is not counted. An upload that keeps sending, however slowly, is never cut and keeps its bytes until it ends, so `--pack-inflight-bytes` is the only bound on that. At least 1, at most 86400. Used only with `--pack-store-endpoint`
pack-upload-idle-timeout = 30
# The name of this frontend in the keys of its packs and in the pack index's record of who wrote each: give each frontend of a farm one of its own. Used only with `--pack-store-endpoint`
pack-writer = "frontend"

[scheduler]
# Retired: no longer read, kbf schedules nothing. Accepted and ignored for one release
# default-platform = "OS/ARCH"
# Retired: no longer read, kbf schedules nothing. Accepted and ignored for one release
exclusive-actions = false
# How long, in seconds, a finished operation is kept after its callers are answered. Within it, WaitExecution on the operation's name streams its result (a client whose Execute stream broke gets a result the action cache does not keep, such as a failure); after it, the name is NOT_FOUND, unless the state store still holds the result (at least ten minutes). Every operation finished within it is held in memory
finished-retention-secs = 600
# Retired: no longer read, the worker session was removed. Accepted and ignored for one release
# heartbeat-interval-ms = "MILLISECONDS"
# Opens the pack index at start: the tables in the Postgres state store that say which pack holds each blob and where. A frontend given `--pack-store-endpoint` reads and writes them; without it nothing does, and the flag only checks that the store can hold them. Needs `--state-store` as a `postgres://` URL whose schema has the pack tables (`kbf-installer setup` makes them); a `sqlite://` store is refused. Left out, no pack table is touched
pack-index = false
# Retired: no longer read, kbf schedules nothing. Accepted and ignored for one release
# placement-load = "MODE"
# Retired: no longer read, kbf schedules nothing. Accepted and ignored for one release
# placement-predictions = "MODE"
# How often, in seconds, every open Execute and WaitExecution stream is sent its operation again (same name, not done, current stage), so a load balancer's idle timeout never cuts a long action. 0 sends none
progress-interval-secs = 30
# Retired: no longer read, kbf schedules nothing. Accepted and ignored for one release
# qos-allowed = "LEVELS"
# How often, in milliseconds, a frontend asks each of the dependencies behind `GET /readyz` (the storage node, the state store, the storage map) again, in the background. `GET /readyz` and the REAPI listener's `grpc.health.v1` service answer from the last answers at once and wait for no probe; a probe that has not answered within `--readyz-store-timeout-ms` counts as failed
readyz-probe-interval-ms = 1000
# How long, in milliseconds, `GET /readyz` on the operator API and the REAPI listener's `grpc.health.v1` service wait for the object store to answer their read-only probe before they answer not ready
readyz-store-timeout-ms = 2000
# Retired: no longer read, kbf schedules nothing. Accepted and ignored for one release
# scheduler-core = "CORE"
# Where the storage members and the unfinished operations are kept, so that another frontend, or this one after a restart, answers and takes them up: `postgres:///kbf?host=/run/postgresql`, the database `kbf` on a local Unix socket, reached as this process's own user (peer authentication; a URL with a password is refused, as the command line is world-readable). The server must flush commits before it acknowledges them (`synchronous_commit` on) or the start is refused; the tables are created if missing. Or `sqlite:///absolute/path`, a file on a local disk that this process owns (created, with its directory, if missing: 0600, and 0700 for a directory it makes; a second frontend on it refuses to start); SQLite is removed in the next release, so a start on it logs a warning (see the upgrade notes). `kbf frontend` refuses to start without it; left out of `kbf-server`, the operations are in memory and a restart loses them
# state-store = "URI"
# How long, in seconds, the start waits for a Postgres `--state-store` that is not up yet (connection refused or reset, a Unix socket that does not exist yet, a connect that times out, or the server answering that it is starting up), trying again after 250 ms and then after twice as long each time, up to 10 s. The window is the time spent waiting between attempts; the time inside an attempt (a connect that times out) is not counted, so the whole wait can be longer. A store that refuses (a URL that does not parse, a login, a missing database, a schema this build does not accept) is not waited for: the frontend exits 2 at once. If the window is used up with the store still not up, the frontend exits 1, not 2, so that a unit which restarts on failure and prevents a restart on exit 2 starts it again. 0 does not wait, and exits 2 as it did before this flag. At most 3600.
state-store-wait-secs = 300
# Retired: no longer read, kbf schedules nothing. Accepted and ignored for one release
# unservable-wait-secs = "SECONDS"
# Retired: no longer read, kbf schedules nothing. Accepted and ignored for one release
# usage-profiles = "MODE"
# Retired: no longer read, the worker session was removed. Accepted and ignored for one release
# vm-host-floor-cpus = "CPUS"
# Retired: no longer read, the worker session was removed. Accepted and ignored for one release
# vm-host-floor-mem-gib = "GIB"
# Retired: no longer read, kbf schedules nothing. Accepted and ignored for one release
whole-node-allow-last-capable = false
# Retired: no longer read, kbf schedules nothing. Accepted and ignored for one release
# whole-node-drain-after-secs = "SECONDS"
# Retired: no longer read, kbf schedules nothing. Accepted and ignored for one release
# whole-node-drain-deadline-secs = "SECONDS"
# Retired: no longer read, kbf schedules nothing. Accepted and ignored for one release
# whole-node-keep-for-ordinary = "WORKERS"
# Retired: no longer read, kbf schedules nothing. Accepted and ignored for one release
# whole-node-max = "WORKERS"
# Retired: no longer read, kbf schedules nothing. Accepted and ignored for one release
# whole-node-max-draining = "WORKERS"
# Retired: no longer read, kbf schedules nothing. Accepted and ignored for one release
# whole-node-max-reserve-attempts = "COUNT"
# Retired: no longer read, kbf schedules nothing. Accepted and ignored for one release
# whole-node-reserve-backoff-secs = "SECONDS"

[storage-client]
# The storage node the frontend proxies blobs to, as `http://host:port` or `https://host:port` with the three flags below. Left out, the frontend has no storage node: it needs `--executor js-agent`, `--pack-index` and `--pack-store-endpoint` (and its companions); client uploads are kept in packs (and, over the pack bound, as `cas/l/` objects) in that object store, the action cache is the `action_result` table of the Postgres state store, and `/readyz` asks the state store and the job service and nothing else. Needs the installer's action-cache migration
# storage = "URL"
# The CA the storage node's certificate chains to; the node must present a certificate for the host in the --storage URL. Needs --storage.
# storage-ca = "PATH"
# The frontend's certificate toward the storage node (PEM); it must name the role `frontend` (a URI subjectAltName urn:kbf:role:frontend). Needs --storage.
# storage-client-cert = "PATH"
# The private key of --storage-client-cert (PEM). Needs --storage.
# storage-client-key = "PATH"

[storage-node]
# Promote a storage node that joined a farm holding data from joining to active by its own heartbeat once it is filled: every member has flushed what it staged before the join, the joiner has indexed every object in the cold store under the frontend's tail epoch, its placement fingerprint matches, no member is down, and the settle time has passed. Off by default: an operator promotes a joiner (`POST /v1/members/{id}`, state active), which stays the override. Frontends first, then nodes, then this flag.
auto-promote = false
# Let --auto-promote promote a joiner although a member was down during its fill. A member that is down and inside its dwell still holds the first phase back. Off by default: a down member may hold the only copy of a blob. Used only with --auto-promote.
handoff-allow-degraded = false
# How long, in seconds, all the conditions of --auto-promote must keep holding at the joiner's beats before it is promoted. Used only with --auto-promote.
handoff-settle-secs = 30
# How long, in seconds, a down storage member stays in the map before it leaves and its blobs move to other owners
member-dwell-secs = 300
# How long, in seconds, a storage node's membership row lives without a heartbeat before the state store expires it and the member goes down in the storage map. Nodes are asked to heartbeat three times as often
member-ttl-secs = 15

[stores]
# Turns on the object-store registration routes of the operator API (/v1/object-stores, docs/api.md) and names the directory where the secret key of each registered connection is kept, one file of mode 0600 each, in a directory made 0700. The directory must be readable by every frontend child that serves at once and left out of any backup of the host. The registration itself (endpoints, buckets, the audit log) is kept in the state store. Without it those routes answer 404.
# object-store-secrets-dir = "DIR"

[task-runs]
# The most bytes of blobs, by their digests' sizes, the input tree of a run may have (each distinct blob once): a run whose tree has more is refused. Used only with `--task-secret-file`
task-closure-max-bytes = 34359738368
# The most distinct digests (directories and files) the input tree of a run may have: a run whose tree has more is refused, never run on a part of its inputs. Used only with `--task-secret-file`
task-closure-max-digests = 500000
# The most bytes of Directories `--task-directory-cache-dir` holds. Needs `--task-directory-cache-dir`. Used only with `--task-secret-file`
# task-directory-cache-bytes = "BYTES"
# A directory this process owns where the input Directories the closure walk decodes are kept on disk, one file each by digest, checked by SHA-256 on every read, so that a restart or a Directory pushed out of memory is read from the disk and not from the store. At most `--task-directory-cache-bytes` of them are kept, the least recently used removed first. One process per directory: nothing else may write there. Needs `--task-directory-cache-bytes`. Left out, the Directories are kept in memory only (256 MiB). Used only with `--task-secret-file`
# task-directory-cache-dir = "DIR"
# Log and count the keys the janitor would delete, and delete none. Used only with `--task-janitor-key-file`
task-janitor-dry-run = false
# How old a key must be, in seconds, before the janitor may delete it, by the minute its name says it was minted in. At least 21600 (the 18000 seconds at which an ingest refuses a key, and an hour more as a margin for hosts with different clocks and for an old leader still ingesting) and at most 604800. Used only with `--task-janitor-key-file`
task-janitor-grace-secs = 21600
# How often, in seconds, the janitor starts a sweep of `cas/b/`, at least 1 and at most 86400. Used only with `--task-janitor-key-file`
task-janitor-interval-secs = 900
# Turns on the janitor of `cas/b/`: it deletes the task packs and large objects nothing recorded (a refused run, an unused key, a large object already copied into the CAS) once they are older than `--task-janitor-grace-secs`, are not under verification and are not in the pack index. The file is the tier store's GC key, `{"access_key_id": "...", "secret_access_key": "...", "prefix": "cas/b/"}` (the prefix must be exactly `cas/b/`), owned by this user and readable by it alone (mode 0600 or 0400); it is used against `--pack-store-endpoint`'s store, which this needs. The janitor never lists or deletes under `cas/l/`, `cas/f/` or `cas/d/`. Runs on the leader only. Needs `--task-secret-file` and `--pack-store-endpoint`. Left out, nothing is deleted
# task-janitor-key-file = "PATH"
# How long, in milliseconds, the janitor waits after each page before it lists the next, at most 60000: with `--task-janitor-page-size`, the most keys a second it lists and deletes. Used only with `--task-janitor-key-file`
task-janitor-page-pause-ms = 1000
# The keys of `cas/b/` the janitor lists at a time, 1 to 1000, and so the keys it checks against the pack index in one question. Used only with `--task-janitor-key-file`
task-janitor-page-size = 500
# Removed with `--task-out-mode presigned`. Any value is refused at start
# (not in --help)
# task-large-credentials-file = "VALUE"
# Removed with `--task-out-mode presigned`. Any value is refused at start
# (not in --help)
# task-large-max-bytes = "VALUE"
# The most create-only writes of action-tree manifests to the tier store (`cas/l/<sha256>`) this frontend has open at once, across every run it prepares; a write past it waits at the frontend for one to end. A burst of runs then queues here and not at the store, whose every write would slow as more arrive. Each such write also takes one of the slots of `--pack-store-writes`, which every write to the pack store shares. Used only with `--task-secret-file` and `--task-out-mode put-dir`
task-manifest-writes = 32
# Removed with `--task-out-mode presigned`. Any value is refused at start
# (not in --help)
# task-max-large = "VALUE"
# The most records one object of a run may index. A larger index is refused as too large before it is read, so this bounds what the frontend reads to trust an object (52 bytes a record)
task-max-object-entries = 1048576
# The most bytes of an object's manifest, and the base of the most its tail (manifest, file index and central directory) may be: the base plus `--task-object-bytes-per-entry` for each of `--task-max-object-entries`. A larger one is refused as too large before it is read
task-max-object-manifest-bytes = 4194304
# Removed with `--task-out-mode presigned`. Any value is refused at start
# (not in --help)
# task-max-packs = "VALUE"
# The bytes of an object's tail each record may account for, its central directory entry (about 130 bytes) and its line of the file index, which names a path. See `--task-max-object-manifest-bytes`
task-object-bytes-per-entry = 1024
# What the task writes. `one-pass`, the only value and the default: one object per action, written while the outputs are read, its manifest and index at the end (docs/design/one-pass-task-object.md). The flag is still accepted so that a configuration that names it starts; the `packs` value of the releases before is gone, and this frontend still reads the packs those wrote. Every task image must be this release or later
task-out-format = "one-pass"
# Where a task's outputs go. `put-dir`, the only mode and the default: the task commits them as files into a put directory under `--task-out-root`, mounted at /out, which the host's tier store uploads; the inputs are the action tree under the trees directory beside it, the job's root, and the job has no network. `presigned` was removed: it is refused, with the flags to drop. Used only with `--task-secret-file` and `--executor js-agent`
task-out-mode = "put-dir"
# The tier store's put directory on every host (`<mp>/put`, an absolute path), which the host's agent lists as a read-write mount root; each run's directory is `<mp>/put/cas/b/<lease>/<nonce>`, and its action tree `<mp>/trees/<digest>`
# task-out-root = "PATH"
# Removed with `--task-out-mode presigned`. Any value is refused at start
# (not in --help)
# task-put-bucket = "VALUE"
# Removed with `--task-out-mode presigned`. Any value is refused at start
# (not in --help)
# task-put-credentials-file = "VALUE"
# Removed with `--task-out-mode presigned`. Any value is refused at start
# (not in --help)
# task-put-endpoint = "VALUE"
# Removed with `--task-out-mode presigned`. Any value is refused at start
# (not in --help)
# task-put-region = "VALUE"
# The most seconds the waits add up to before a create-only write of an action tree to the tier store (`cas/l/<sha256>`) gives up on a 503 ("retry later", which the store answers while it registers: 10 to 40 s), so the lease fails only after this long. A write whose connection turns out to be dead is made once more at once, whatever this says. 0 never waits for a 503. A 503 `SlowDown` (the store taking as many uploads as it can) is back-pressure and is waited out past this, until the run's preparation limit. Used only with `--task-secret-file` and `--task-out-mode put-dir`
task-put-retry-secs = 60
# Removed with `--task-out-mode presigned`. Any value is refused at start
# (not in --help)
# task-read-url = "VALUE"
# Removed with `--task-out-mode presigned`. Any value is refused at start
# (not in --help)
# task-run-wall-secs = "VALUE"
# Turns on the preparation of the runs of a host executor: for each run the frontend makes the put directory the task commits its object into, and the input closure its action tree is written from. The file holds one secret of at least 32 bytes (surrounding white space is dropped), owned by this user and readable by it alone (mode 0600 or 0400): the mint of the put directories is made from it, and it is the secret the job-facing listener verifies grants with. The secret is never a flag: a command line is world-readable. Needs `--task-out-root`. Left out, no run is prepared
# task-secret-file = "PATH"
# The time past a run's wall, in seconds, that the keys of its put directory stay good: the time a task takes to start and to commit its object. The wall and the slack together must not pass 14400, the longest a key may be good for, or the frontend does not start. Used only with `--task-secret-file`
task-url-slack-secs = 600

[tls]
# A file holding the token operator API writes (a frontend drain, a member's state) must present as `Authorization: Bearer <token>`. It must be owned by the server's user with mode 0600 or 0400, or the server refuses to start; run the server as a user other than the worker's, whose builds could read it. Without it, writes are refused
# api-token-file = "API_TOKEN_FILE"
# A file holding the per-boot secret of the TLS-terminating proxy in front of this server (`docs/design/frontend-proxy.md`, section 3): exactly 32 bytes, owned by the server's user with mode 0600 or 0400, read at start. The proxy presents them as 64 lower-case hex digits in `x-kbf-proxy-auth`. With it, the REAPI, worker and operator listeners take calls from loopback only, and believe `x-kbf-node-id` and `x-kbf-role` only from a call that presents the secret; every other `x-kbf-*` header is dropped. The worker listener then takes the proxy's identity in place of a client certificate (it needs no TLS flags), and the operator API's writes must come through the proxy as well as carry the token (a local `curl` write is refused). The storage listener is not covered: it keeps its own mutual TLS. Without it, behavior is as before
# proxy-auth-file = "PATH"
# A JSON file with the REAPI listener's authentication policy and authorizers (`docs/reapi-auth.md`), read once at start; a file that is not a valid policy stops the server. Without it every REAPI call is accepted and allowed. The worker listener does not read it; on the operator API only the build pages and the blob route do, and they are off unless it names their authorizers
# reapi-auth-policy = "REAPI_AUTH_POLICY"
# PEM certificate (chain) of the REAPI listener. With `--reapi-tls-key` it serves TLS with this server certificate only; clients present no certificate. It is meant for a certificate from the farm's own internal CA, trusted by the front's proxy (its hop to this server) and by clients that dial this server directly; TLS for the farm's client-facing name still ends at the front. `--reapi-auth-policy` applies over TLS as over plain text
# reapi-tls-cert = "REAPI_TLS_CERT"
# PEM private key of the REAPI listener; it must match `--reapi-tls-cert`, or the server refuses to start
# reapi-tls-key = "REAPI_TLS_KEY"
# PEM CA that client certificates must chain to. Each must also name the role the method it calls takes: the storage role (`urn:kbf:role:storage`) for `kbf.map.v1.Membership` and the cold store's `GetStoreConfig`, with DNS or IP names that cover the host of the instance id and of the address it registers; a frontend certificate may call nothing here
# worker-client-ca = "WORKER_CLIENT_CA"
# The worker listener's deny list: certificate serials, public keys and node ids it refuses (format in the `identity` module docs). Read at start, then again at every check (a storage node's `Register` and `Heartbeat`), so an edit takes effect without a restart. A `node` entry also refuses a storage certificate with that DNS name. A list that cannot be read after start refuses all of those calls. Needs mutual TLS, or `--proxy-auth-file` (then only `node` entries can name a caller: the proxy forwards a node id, not a certificate, so a `serial` or `spki-sha256` entry never matches)
# worker-deny-list = "WORKER_DENY_LIST"
# PEM certificate of the worker listener. With `--worker-tls-key` and `--worker-client-ca` it serves mutual TLS; without all three, plain text
# worker-tls-cert = "WORKER_TLS_CERT"
# PEM private key of the worker listener
# worker-tls-key = "WORKER_TLS_KEY"
