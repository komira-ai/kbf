# kbf frontend: every setting, one table per group; a key is a flag's long name.
# Generated from the flag definitions (tests/golden). A flag on the command line
# overrides its key. A secret is the path of the file that holds it.

[daemon]
# Worker threads of the async runtime, which run every task between its waits. Default: every CPU the process may use on the server; `max(2, reserve/4)`, at most the physical cores, on the daemon
# async-threads = "N"
# The most threads the runtime's blocking pool runs at once, for calls that wait on a disk or a process (a thread is made when a call needs one and ends when idle). Default: 512 (tokio's) for the server, 64 for the daemon
# blocking-threads = "N"
# Threads for CPU-bound work, such as hashing, which never waits and so is held to the CPUs. Default: every CPU the process may use on the server; `max(2, reserve/2)`, at most the physical cores, on the daemon
# cpu-threads = "N"

[enroll-service]
# Keep the CA key as a file in this process (development and tests only; production uses --ca-signer and refuses to start without it).
ca-dev-file-signer = false
# The CA directory (ca.key mode 0600, ca.pem). With --ca-dev-file-signer an empty directory gets a new CA and a directory holding one is loaded, never overwritten; with --ca-signer it must hold ca.pem, which the signer made.
# ca-dir = "DIR"
# The socket of the kbf-signer process that holds the CA key (production). This process holds no CA key.
# ca-signer = "SOCKET"
# Does nothing: this build enforces the deny rows a node revocation writes, so --enroll-listen needs no acceptance. Still accepted so existing units start; it will be removed in a later release.
enroll-allow-unenforced-deny = false
# What --cas is for a daemon-only node, told to every node. Empty: none.
# enroll-cas-endpoint = "URL"
# How long the certificates the CA issues live (3600 to 2592000); a node renews at half. The signer's own --lifetime-secs must be at least this.
enroll-cert-lifetime-secs = 604800
# Serve kbf.enroll.v1 (Enroll and Renew) on this address, over TLS with the frontend's own certificate from the CA. Off unless given. It needs --state-store, --ca-dir, --frontend-name, and --ca-signer (or, for development, --ca-dev-file-signer).
# enroll-listen = "ADDR"
# Calls the listener works on at once, from all sources; the next is refused `rate limited`.
enroll-max-in-flight = 64
# Calls one TCP peer address may make at once (behind the bundled kbf-proxy, the whole listener).
enroll-rate-burst = 30
# Enroll and Renew calls per minute from one TCP peer address, once its burst is spent. Behind the bundled kbf-proxy every peer is loopback, so this is one limit for the listener and the proxy limits per client address. The count is in memory and starts again at a restart.
enroll-rate-per-minute = 60
# The port a storage node serves on, told to every node.
# enroll-storage-port = "PORT"
# The https URL a daemon dials (--server), told to every node. Empty: none.
# enroll-worker-endpoint = "URL"
# A name this frontend serves, a DNS name or an IP address; repeat it for each. The enroll listener's certificate carries these names, and no node may advertise one or a host under one.
# frontend-name = []

[executor]
# Where the farm runs the actions it places. `kbf-daemon`, the default, is the daemon of each node, over the worker listener: no executor is built and no lease server is contacted, whatever the other `--executor-*` flags say. `js-agent` runs them on hosts leased from the job scheduler's lease server, in the kbf image (`--executor-kbf-image`, built from `--executor-base-image`), whose task tool runs the action inside it; it needs the lease server's flags (`--executor-lease-url`, `--executor-lease-token-file`, and `--executor-lease-ca-file` for https), the pool's (`--executor-class`, `--executor-hosts`, `--executor-host-cpus`, `--executor-host-memory-gib`), `--executor-frontend-id`, the packs (`--pack-store-endpoint`) and the secret delivery (`--executor-secret-delivery`, with `--executor-insecure-argv-secrets` for its default `argv`). The executor runs on exactly one frontend: a second frontend that holds hosts on the same lease server stops. A restart of the frontend fails the builds in flight. Switching back to `kbf-daemon` releases the leases when the frontend is stopped, not when it is killed: a killed frontend's leases stay held until their ttl ends (`--executor-lease-ttl-secs`), unless a later `js-agent` start releases them. `--executor-insecure-argv-secrets` is ignored with `kbf-daemon`
executor = "kbf-daemon"
# Lets the task read its inputs through a read grant served over `http://`: an `http://` `--task-read-url` is accepted, and the task tool is given `--allow-plain-http-grant`. The read token then crosses the job network in clear, so this is for a farm on its own network. Off by default, and an `http://` read url is refused without it. Used only with `--executor js-agent`
executor-allow-plain-http-grant = false
# Lets the task write its pack to an `http://` url, until the store serves TLS. The reads stay https unless `--executor-allow-plain-http-grant` says otherwise. Used only with `--executor js-agent`
executor-allow-plain-http-put = false
# The CPU architecture of the hosts. Every lease asks for a host of `os=linux` and this `arch`, and the hosts report them to the farm. Used only with `--executor js-agent`
executor-arch = "x86_64"
# The base environment the Command of an action sees, pinned by digest as `<repository>@sha256:<64 hex digits>` (a leading `docker://` is optional). It is the one image an action's `container-image` platform property may name: an action that names another is refused as invalid, one that names none gets this. A tag is refused. Needed with `--executor js-agent`
# executor-base-image = "IMAGE"
# How long one call to the lease server may take before it counts as unanswered, in seconds. Under the fence time. Used only with `--executor js-agent`
executor-call-timeout-secs = 5
# The lease server's class every lease asks for (the pool of hosts the executor draws from). Used only with `--executor js-agent`
# executor-class = "CLASS"
# The timeout, in seconds, of an action that names none: at most `--executor-max-run-secs`. Used only with `--executor js-agent`
executor-default-timeout-secs = 3000
# The name of this frontend on the lease server: the value of the `kbf-frontend` label on its leases, by which a restarted frontend finds them and releases the ones it no longer needs. 1 to 63 of letters, digits, `-`, `_` and `.`. It must be different for each frontend (not copied with the config). Used only with `--executor js-agent`
# executor-frontend-id = "ID"
# The CPU cores a host's lease holds: the pool's shape. At least 1. Used only with `--executor js-agent`
# executor-host-cpus = "CORES"
# The memory, in GiB, a host's lease holds: the pool's shape. Each run is capped at 1.5 times its booking plus 512 MiB, and the bookings of a host add up to what is left after that. Used only with `--executor js-agent`
# executor-host-memory-gib = "GIB"
# The most runs a host takes at once, reported to the farm as the host's action slots. Used only with `--executor js-agent`
executor-host-slots = 8
# How many hosts to hold, a lease each. A host is leased whole for the shape below and released before its lease ends. Used only with `--executor js-agent`
# executor-hosts = "HOSTS"
# Says the secrets of a task (the presigned write url, the read token) may travel as arguments of the run, where the action can read them from `/proc` and the engine's inspect shows them. It is what the default `--executor-secret-delivery argv` needs, and `--executor-secret-delivery files` refuses it. Off by default
executor-insecure-argv-secrets = false
# The kbf image, pinned by digest like `--executor-base-image` and built from it, that every run is launched from. It keeps the task tool as its `ENTRYPOINT`, so the run's arguments are the tool's flags and the action runs inside this image. Must be another image than the base. Needed with `--executor js-agent`
# executor-kbf-image = "IMAGE"
# The CA certificate (PEM) the lease server's certificate chains to: the only trust anchor, no system roots are consulted. Needed for an `https` lease server and refused for an `http` one. Used only with `--executor js-agent`
# executor-lease-ca-file = "PATH"
# A file with the bearer token of the lease server, readable by its owner alone (mode 0600 or 0400). The secret is never a flag: a command line is world-readable. Used only with `--executor js-agent`
# executor-lease-token-file = "PATH"
# How long a lease lasts without a renewal, in seconds, asked at each renewal. It must cover the longest run and two heartbeats, and the lease server grants at most its own `--max-ttl`. Used only with `--executor js-agent`
executor-lease-ttl-secs = 3600
# The lease server, as `https://host[:port]`, or `http://` to a loopback host. Used only with `--executor js-agent`
# executor-lease-url = "URL"
# Has the task tool ask the read listener where each input is kept (`GET /locate`) and read it straight from that store, with the read grants the answer carries, and from the listener any input whose direct read fails; every byte is still checked against its digest. Off by default: the task reads every input through the listener. With no grants in the answer it reads from the listener as without the flag. An `http://` store needs `--executor-allow-plain-http-grant`. Used only with `--executor js-agent`, and refused with `--executor kbf-daemon`
executor-locate = false
# The longest action timeout the executor runs, in seconds; an action that asks for more is refused. Used only with `--executor js-agent`
executor-max-run-secs = 3000
# The scratch disk a run books for what it writes, in bytes: its outputs, the pack and the private home, tmp and cache. A run books this, the bytes of its inputs and a fixed 1 GiB margin against the host's scratch, and the lease server refuses a run the host's disk cannot hold. Used only with `--executor js-agent`
executor-output-disk-bytes = 8589934592
# What a run's wall time adds to the action's timeout, in seconds: the fetch of the inputs and the upload of the pack. An action that fetches or uploads for longer than this ends at the wall time and is answered to the caller as a timeout. Used only with `--executor js-agent`
executor-run-margin-secs = 300
# How the secrets of a task (the presigned write url, the read token) reach it. `argv`, the default, passes them as arguments of the run and needs `--executor-insecure-argv-secrets`. `files` passes each as a file of the run, which the lease server mounts read-only at `/run/js-files`: no argument holds a secret, `--executor-insecure-argv-secrets` is refused with it, and only hosts that report `run-files` are leased; a pool of none holds no host and no run is sent. `files` is refused with `--executor kbf-daemon`, which builds no command line
executor-secret-delivery = "argv"
# Where the task tool works in the container, if not in its own default: the kbf image must have a writable directory there. Used only with `--executor js-agent`
# executor-work-dir = "DIR"

[handover]
# Retired: no longer read, the handover was removed. Accepted and ignored for one release
# (not in --help)
# admin-listen = "ADDR"
# Retired: no longer read, the handover was removed. Accepted and ignored for one release
# (not in --help)
await-takeover = false
# Retired: no longer read, the handover was removed. Accepted and ignored for one release
# (not in --help)
# envoy-check-interval-ms = "MILLISECONDS"
# Retired: no longer read, the handover was removed. Accepted and ignored for one release
# (not in --help)
# envoy-check-timeout-ms = "MILLISECONDS"
# Retired: no longer read, the handover was removed. Accepted and ignored for one release
# (not in --help)
# envoy-unhealthy-threshold = "N"
# Retired: no longer read, the handover was removed. Accepted and ignored for one release
# (not in --help)
# handover-follow-interval-ms = "MILLISECONDS"
# Retired: no longer read, the handover was removed. Accepted and ignored for one release
# (not in --help)
# handover-peer-name = "DNS_NAME"
# Retired: no longer read, the handover was removed. Accepted and ignored for one release
# (not in --help)
# handover-quiesce-secs = "SECONDS"
# Retired: no longer read, the handover was removed. Accepted and ignored for one release
# (not in --help)
# handover-socket = "PATH"
# Retired: no longer read, the handover was removed. Accepted and ignored for one release
# (not in --help)
# handover-watchdog-secs = "SECONDS"
# Retired: no longer read, the handover was removed. Accepted and ignored for one release
# (not in --help)
# instance = "a|b"

[history]
# Where history's index rows live in the state store: `ui/`, or `<prefix>ui/` for a prefix that ends in `/`, so that one state store can hold several farms' history apart. Left out, it is `ui/`. Needs `--history-objects`
# history-index-root = "ROOT"
# Where build history is kept: an object store, `s3://bucket/prefix?endpoint=http://host:port` (the key pair is the `AWS_ACCESS_KEY_ID` and `AWS_SECRET_ACCESS_KEY` of the environment) or `file:///absolute/path` (a directory this process owns, not the cold store's). The attempts and cache hits of each invocation a client named are recorded under `<prefix>history/` after their results are sent, never before and never delaying one; the index rows go to `--state-store`, which this flag needs. A full queue, a slow object store or a slow state store drops records and counts them (`kbf_history_dropped_total` on `/metrics`), and never fails or delays a call. The writer reads and writes only keys under `history/`. Left out, nothing is recorded
# history-objects = "URI"
# The memory, in bytes, the invocation records may take together (`docs/design/invocations.md`, section 3.5). At the bound, records of a minted id go first, then idle ones, least recently seen first; with only open builds left, the largest stops taking rows. Records are kept in memory only and lost on restart. Their heap was measured at up to 1.08 times this at 200 kB and above, and 1.12 at 50 kB (section 3.5)
invocation-memory = 268435456

[job-read]
# A file with the farm secret that read grants are signed with, at least 32 bytes (surrounding whitespace is dropped), readable by its owner alone (mode 0600 or 0400). The frontends of a farm and whatever issues the grants must read the same secret. The secret is never a flag: a command line is world-readable
# job-grant-secret-file = "PATH"
# Serves the inputs of an action to the task that runs it, over HTTPS (or, with `--job-plain-http`, plain HTTP) at this address: `GET /<hex>/<size>` and `POST /batch` (many small blobs in one request) with `Authorization: Bearer <read grant>`, and nothing else (any other path is 404 and any other method 405). A read grant is the token a run is given; until it expires it reads the Action it was issued for, its Command and its input tree, and no other blob. The TLS is the server's alone and no client certificate is asked for. The task dials an IP address, so give the address the jobs dial, and a `--job-tls-cert` that names it as an IP subjectAltName. Needs `--job-tls-cert` and `--job-tls-key` or `--job-plain-http`, and `--job-grant-secret-file`. Left out, no such listener is opened
# job-listen = "ADDR"
# The most bytes of one blob the listener serves, at least 1: a blob of more is refused 413 `too_large` before anything is read. A blob of more than 67108864 bytes is streamed from the store through SHA-256 and never held whole; one whose bytes are not its digest's ends its response early, and is counted. Needs `--job-listen`
job-max-blob-bytes = 536870912
# Serves `--job-listen` in plain HTTP, with no TLS, in place of `--job-tls-cert` and `--job-tls-key` (given with either it is refused): the same routes and the same grants, each request still needs a valid read grant, but the grant and the blobs cross the network unencrypted. For a farm on its own network; the executor's `--task-read-url` must then be `http://` with `--executor-allow-plain-http-grant`, and the other way round. Needs `--job-listen` and `--job-grant-secret-file`
job-plain-http = false
# The bytes of blob reads this listener has open at once, at least 1: a read takes its blob's size (a streamed blob a bounded window of it, and the scope walk's reads their own sizes) and a request over the budget waits for room, it never fails; a blob larger than the whole budget is read alone. Needs `--job-listen`
job-read-budget-bytes = 1073741824
# How long, in seconds, a response that holds read budget may go with no chunk taken by its client before it is dropped, its budget given back and its response ended, at least 1: a client that does not read does not hold the budget for ever, and one that reads is not cut off however long its response takes. Needs `--job-listen`
job-read-idle-secs = 60
# The blob reads this listener has open at once, at least 1: a streamed blob holds its place until its response ends, and a request over the bound waits for one to end. Needs `--job-listen`
job-reads-in-flight = 32
# The bucket of the tier store that read grants are made for, the store's `--bucket`. Needs `--job-store-grant-key-file`
# job-store-bucket = "BUCKET"
# A file with the grant key of the tier store, `{"access_key_id": "...", "secret_access_key": "..."}` (or the id on the first line and the secret on the second), owned by this user and readable by it alone (mode 0600 or 0400): the key the store's `--grant-key-file` holds. With it, `GET /locate` signs read grants for the packs and large objects its table names, each good for the Action's job and at most ten minutes, and the task reads them from the store directly with `--locate`; the store must know the same key. Without it, `GET /locate` carries no grant and the task reads every blob from this listener. The secret is never a flag. Needs `--job-store-url`, `--job-store-bucket` and `--job-listen`
# job-store-grant-key-file = "PATH"
# The base URL of the tier store that a task is told to read from with a grant, `http://host:port` or `https://host:port` with no path (the task dials it from its worker, so give an address the workers reach). Needs `--job-store-grant-key-file`
# job-store-url = "URL"
# The certificate chain (PEM) of `--job-listen`, issued by the farm CA that the jobs trust. It must carry an IP subjectAltName for each address a job dials the frontend at: the start is refused if it has none, or if `--job-listen` is on one address and the certificate does not name it, since a client that dials an IP address accepts only a certificate that names it. Read again every `--tls-reload-interval-secs`, as the other listeners' are; the names are checked at start only
# job-tls-cert = "PATH"
# The private key (PEM) of `--job-tls-cert`
# job-tls-key = "PATH"

[listener]
# The operator API listener (HTTP/JSON under `/v1`). Off unless given. Reads are open to whoever reaches it: bind it where only operators do
# api-listen = "API_LISTEN"
# When set, how long, in seconds, after a drain (a stop signal or `POST /v1/frontend/drain`) has refused new executions it reports the ones still open: a WARN with their count, and `deadline_passed` in `GET /v1/frontend/drain`. It never ends a stream or stops the drain: absent, the default, and set alike, the drain waits for the open executions for as long as they run, and the process stays up serving them. Only a second stop signal, or `--shutdown-timeout-secs` on a stop signal (default none), forces a stop and ends the streams that are left UNAVAILABLE. The one stream that does not wait is that of an operation that was never started, that no worker on this frontend can run and that no other frontend can take: it ends UNAVAILABLE as the drain begins (Buck2 retries only the opening of a call), and the operation stays queued for the other frontends. No upper bound; at least 1.
# drain-deadline = "SECONDS"
# How long, in seconds, a drain (a stop signal or `POST /v1/frontend/drain`) keeps serving everything after `/readyz` has begun to answer 503, so that the load balancer's health check sees it before any call is refused: at least its check interval times its unhealthy threshold, and the time its routes take to change. Then new Execute calls are refused UNAVAILABLE and every listener is sent GOAWAY. 0 goes on at once. The container's stop timeout must exceed this and the longest action to be waited for.
drain-lb-wait = 10
# How often, in seconds, the REAPI and worker listeners send an HTTP/2 PING on a quiet connection. 0 sends none (and `--http2-keepalive-timeout-secs` is unused)
http2-keepalive-interval-secs = 30
# How long, in seconds, a PING may go unanswered before the connection is closed
http2-keepalive-timeout-secs = 20
# The REAPI listener. Without `--reapi-tls-cert` and `--reapi-tls-key` it serves plain text, on any address; off loopback the start line carries a warning
listen = "127.0.0.1:8980"
# The most HTTP/2 streams one connection to the REAPI listener may have open. buck2 keeps one Execute stream open per outstanding action, idle until the action finishes, so this bounds how large a backlog one buck2 invocation can show the farm. The connection's flow-control window is this many streams' windows; above about 2000 streams each stream's window is smaller than 1 MiB so that the product stays under HTTP/2's largest window. At least 1, at most 32767
reapi-max-streams = 10000
# Retired: no longer read, the release poller was removed. Accepted and ignored for one release
# release-poll-every-secs = "SECONDS"
# Retired: no longer read, the release poller was removed. Accepted and ignored for one release
# release-poll-refs = []
# Retired: no longer read, the release poller was removed. Accepted and ignored for one release
# release-poll-repo = "OWNER/NAME"
# Retired: no longer read, the release store was removed; a directory left there is not touched. Accepted and ignored for one release
# releases-dir = "DIR"
# The operator's hard stop, in seconds, for a stop (SIGINT or SIGTERM). A stop refuses new Execute calls (UNAVAILABLE, which Buck2 retries) and sends GOAWAY, and every open Execute and WaitExecution stream stays open until its action is done, however long that takes; the exception is a stream whose operation was never started and that no worker on this frontend can run (say every capable worker is cordoned) and no other frontend can take, which ends UNAVAILABLE as the drain begins (Buck2 retries only the opening of a call). The operation stays queued. The default, 0, is no deadline: the stop waits indefinitely, and a second signal is the other way to end it at once. Buck2 never recovers a stream that breaks mid-action, so set one only to force a stop: when it runs out, the open streams end UNAVAILABLE (a client still uploading is cut off). `--drain-deadline` on a frontend over a state store only reports
shutdown-timeout-secs = 0
# How often, in seconds, a TLS listener looks at its certificate, key and client CA files (the `--*-tls-cert`, `--*-tls-key` and `--*-client-ca` flags). A change is applied to the next TLS handshake, with no restart and without ending a connection already open: renew a certificate by replacing the files. Files that do not make a working configuration (unreadable, not PEM, a key that is not the certificate's, an expired certificate, a renewal caught between its two writes) are logged and counted in `kbf_tls_reloads_total{outcome="rejected"}`, and the previous files keep serving; the next look finds them whole and applies them. The files must be good at start
tls-reload-interval-secs = 30
# The `kbf.worker.v1` listener. Without mutual TLS (`--worker-tls-cert`, `--worker-tls-key`, `--worker-client-ca`) it serves plain text, on any address; off loopback the start line carries a warning
worker-listen = "127.0.0.1:8981"
# The most HTTP/2 streams one connection to the worker listener may have open: a daemon's persistent session stream and its short transfer streams. At least 1, at most 32767
worker-max-streams = 200

[log]
# The directory of the durable log file, `kbf-server.log` and its rotated `kbf-server.log.1`, `.2`, ... (created if missing): every event stderr gets, in the same format, kept across restarts. Left out, it is `<hot store directory>/log` when the hot store is a directory; with neither, there is no file and the server logs to stderr alone (the start logs which). A directory or file that cannot be written never stops the server ([`crate::log_file`])
# log-dir = "DIR"
# How many log files are kept, the current one included; rotation drops the oldest. The log never exceeds `--log-max-bytes` times this, plus one line
log-files = 8
# The most bytes one log file holds before it is rotated; a line longer than this goes alone to a fresh file. With `--log-files` it bounds the log's size on disk
log-max-bytes = 67108864

[memory]
# What the farm does with `kbf-estimator`, which predicts an action's memory from what its earlier runs used. `off` calls it never. `shadow` shows it every attempt that finishes and logs, for every new operation, a `size estimate:` line with what it would book, and counts how the attempts fall against its estimates (`kbf_estimator_shadow_total`); it books exactly what `off` books. `on` is `shadow` plus one change to a booking: a kill at an action's own memory limit leaves a floor under the action's key (instance, platform class, instrument and shape), which every later digest of the key, queued or new, books at least, strictly below the memory of the largest node that could run it. The floor falls only by the estimator's decay: it halves once the key has run 256 times and 7 days have passed without an own-limit kill or a sample above half of it, and a floor that falls to the first rung or below is dropped; a kill raises it again. Only an action whose memory the client did not name, on a platform that pins the OS, is keyed. The size summaries and the keys are kept in the state store, in rows of their own that a release without this flag never reads; `off` neither reads nor deletes the summaries, and ignores the keys. The memory a floor raised a queued operation to is not stored: a restart, or a rollback to `off`, books such an operation at its submitted memory until it ends
learned-sizes = "off"
# The memory rungs of an action, in GiB, ascending and each at least 1. The first is what an action that names no size (`kbf-book-mem-gib`) books. An action that passes its own memory limit runs again on the next rung above what it booked, and after the last on a whole host: the memory of the largest node that could run it, so that no other lease fits there. A rung not below that node's memory is skipped for the whole host. An action that does finish keeps its rung: later runs of it start there
memory-ladder-gib = [4, 16, 32]
# Keeps an action's memory booking where it started. An action that passes its own memory limit is not run again on the next rung of `--memory-ladder-gib`: the kill finishes it, FAILED_PRECONDITION with reason `ACTION_OUT_OF_MEMORY`, as a kill at the largest node does, and its attempt is recorded with `memory_kill` `own_limit`. A booking is therefore the first rung, or the GiB the action names in `kbf-book-mem-gib`. No floor is raised, so with `--learned-sizes on` an own-limit kill leaves none either. A kill the node made under memory pressure is not the action's: it runs again with the same booking, as it does without this flag. Needs `--scheduler-core legacy`; a server given it with `js` refuses to start (exit status 2)
no-memory-climb = false

[packs]
# The length, in bytes, at which a pack of client uploads is closed: the blobs of one batch or upload that do not fit are written as the next pack. Used only with `--pack-store-endpoint`
pack-bytes = 33554432
# The most bytes of blobs `--pack-cache-dir` holds
# pack-cache-bytes = "BYTES"
# A directory this process owns where the blobs read from packs are kept, one file each, checked by digest on every read; the least recently used are removed to stay within `--pack-cache-bytes`. Left out, nothing is kept
# pack-cache-dir = "DIR"
# How many blobs of each pack a daemon commits this frontend reads back from the pack store and checks against their digests before it records the pack, spread over the pack from a start that its name picks (the same commit is always checked at the same blobs). A pack with fewer blobs is checked whole, and 16384, the most blobs a pack holds, checks every blob. 0 checks no blob and trusts the daemon: a blob that is not its digest is then caught only when it is first read. The last byte of the pack is read in any case, so a pack that is not stored is always refused. Used only with `--pack-store-endpoint`
pack-commit-sample = 2
# The most bytes of client uploads into packs this frontend holds in flight at once, at least 67108864 (the largest blob that is packed, so that no upload is refused for its size) and at most 4294967295. Each upload takes its blob's size as soon as its resource name has arrived, before it reads on, and gives it back when it ends; one that finds the rest taken waits its turn, so a burst of uploads is slowed down, not failed. The bound counts blob bytes, not the memory of the process: a batch upload is decoded before it waits, so the bytes it holds meanwhile are not counted, and reads are not counted. Used only with `--pack-store-endpoint`
pack-inflight-bytes = 1073741824
# The bucket of `--pack-store-endpoint` that holds the packs, under the keys `cas/f/<--pack-writer>/<start>/<sequence>`
# pack-store-bucket = "BUCKET"
# A file with the key pair for `--pack-store-endpoint`, as JSON `{"access_key_id": "...", "secret_access_key": "..."}`, readable by its owner alone (mode 0600 or 0400). The secret is never a flag: a command line is world-readable
# pack-store-credentials-file = "PATH"
# Keeps the blobs clients upload in packs (many blobs in one object) in this S3-compatible object store, as `http://host:port`: a pack is written with a create-only request and recorded in the pack index before the upload is acknowledged, and a read asks the index first and fetches only the blob's bytes from its pack. A blob the index lacks is read from the storage nodes as before, and a blob over 64 MiB and any compressed blob still go to them. At start the frontend checks that the store refuses to replace an object and does not serve if it does not. Needs `--pack-index`, `--pack-store-bucket` and `--pack-store-credentials-file`. Daemons read blobs from the storage nodes only, so a farm must not enable this before they can read a blob that is only in a pack. Left out, no pack store is built or contacted and blobs go where they always did
# pack-store-endpoint = "URL"
# The region the requests to `--pack-store-endpoint` are signed for
pack-store-region = "us-east-1"
# How long, in seconds, a ByteStream upload into packs may go without a byte of its body arriving before it is ended DEADLINE_EXCEEDED and gives back its bytes, so that a client that stops sending cannot hold room for ever. The time before its resource name has arrived is not counted. An upload that keeps sending, however slowly, is never cut and keeps its bytes until it ends, so `--pack-inflight-bytes` is the only bound on that. At least 1, at most 86400. Used only with `--pack-store-endpoint`
pack-upload-idle-timeout = 30
# The name of this frontend in the keys of its packs and in the pack index's record of who wrote each: give each frontend of a farm one of its own. Used only with `--pack-store-endpoint`
pack-writer = "frontend"

[scheduler]
# The OS and architecture, as `<os>/<arch>` (`linux` or `macos`; `x86_64` or `arm64`), of an action whose platform names no OS, no architecture and no ISA level, so that it is not given to whichever node sorts first, a Mac among them. Not applied to an action that asks for `xcode` or an iOS device, which only a Mac reports. `none` applies no default: such an action runs on any node that fits. Placement only: the action's digest and cache key do not change
default-platform = "linux/x86_64"
# Every `action` lease books the whole worker it lands on: all of its CPUs and all of its memory, whichever worker that is, so that exactly one action runs per worker and a second waits for it. The action digest is the client's and does not change (the per-action `kbf-book-cpus` and `kbf-book-mem-gib` properties would split the action cache); this is a setting of the server. `kbf-book-cpus` and `kbf-book-mem-gib` are still checked, but no longer change what is booked. `kbf-lease=whole_machine` and `vm` leases are as they were. An action killed for passing its own memory limit has no larger booking to climb to, so `--memory-ladder-gib` has no further rung to give it: it finishes out-of-memory, as an action that already books the largest node does, and its memory floor is not raised. A worker books by what it reported at registration. The setting is not kept in the state store, so a server restart ends it for the operations the store holds: one that was queued is read back as an ordinary action, and one that was running is recovered holding only the booking the front computed for it, not the worker, so ordinary actions can be placed beside it and, if it is lost or requeued, it runs again as an ordinary action. A run that needs one action per worker must not restart the server. Off by default
exclusive-actions = false
# How long, in seconds, a finished operation is kept after its callers are answered. Within it, WaitExecution on the operation's name streams its result (a client whose Execute stream broke gets a result the action cache does not keep, such as a failure); after it, the name is NOT_FOUND. Every operation finished within it is held in memory
finished-retention-secs = 60
# The heartbeat interval daemons are asked for, in milliseconds, at most half the window in which a daemon may act on a `Start` (each `Start` names the newest heartbeat the server took, so a longer interval would leave it too little)
heartbeat-interval-ms = 5000
# Opens the pack index at start: the tables in the Postgres state store that say which pack holds each blob and where. A frontend given `--pack-store-endpoint` reads and writes them; without it nothing does, and the flag only checks that the store can hold them. Needs `--state-store` as a `postgres://` URL whose schema has the pack tables (`kbf-installer setup` makes them); a `sqlite://` store is refused. Left out, no pack table is touched
pack-index = false
# Whether placement reads the load the nodes report. `off`, the default, books by the CPUs a lease asks for, as the server always has, and reads no load. `on` admits and ranks nodes by the load they report and the load a lease is predicted to add; a node that reports none is charged by prediction alone, and a node that has never sent a reading the server accepted is charged at least 1000 m for each lease (the node's whole CPU capacity, if that is less), so a prediction under one core changes nothing for such a node. It is read under either `--scheduler-core`. With `js`, `on` is the scheduler's placement by load as a whole, with settings the server fixes (`placement_load.rs`; none is a flag): besides the reading it applies the guard that keeps the flat memory charged to a node within its memory, and scores nodes by balance. It also sets a learned time profile charged per minute and an expected-life charge that ends a new lease at its key's expected life plus two minutes; both are idle, since the farm gives the scheduler no learned profile and no curve source. The memory guard counts only leases that carry a memory (a retry up the memory ladder, a VM) unless `--placement-predictions on` gives leases one
placement-load = "off"
# Whether the farm gives its scheduler the estimator's prediction of what a new operation costs, from the rows `--learned-sizes` keeps, so that placement charges the learned cores and memory instead of the cores the request asked for and no memory. `off`, the default, computes none. `shadow` computes the prediction at submit, gives the scheduler nothing, and compares it with the run when it ends: the cores the run used on average, its peak memory and its life in whole minutes, each counted as under (the run used more than predicted), fit (at most the prediction and at least half of it) or over (less than half of it) in `kbf_prediction_vs_run_total`; the operations given a prediction are counted in `kbf_prediction_made_total` and those given none, by why, in `kbf_prediction_unset_total`. Placement is exactly what `off` does. `on` gives the scheduler the prediction as the cost of the operation's lease, at submit (on the legacy core also again for an operation read back from the state store at a start), which charges the learned memory as well as the cores: a lease is admitted to a node only while the memory charged to the node's leases stays within the node's memory. An operation the estimator has no usable row for, or is not asked about (not an action, one that asks for a GPU, no OS pinned, no subject), gets none and is charged as it is with `off`. `shadow` and `on` need `--learned-sizes shadow` or `on`; `on` needs `--placement-load on`; a prediction only changes what the lease is charged: the memory limit and the cores it is booked and run with stay the request's and the ladder's. A server given a combination that breaks one of these refuses to start
placement-predictions = "off"
# How often, in seconds, every open Execute and WaitExecution stream is sent its operation again (same name, not done, current stage), so a load balancer's idle timeout never cuts a long action. 0 sends none
progress-interval-secs = 30
# The QoS levels a call may ask for with the `x-kbf-qos` request header, as a comma list of `ci`, `batch` and `interactive` (`ci` is always allowed: it is what a call with no header, or a header naming a level not on the list, gets, and that call is never refused). The level orders the queue, most urgent first: a `batch` action waits behind every queued `ci` action. It is not part of the action digest, so it does not split the cache. A client that sends no header stays at `ci`
qos-allowed = "ci,batch"
# How long, in milliseconds, `GET /readyz` on the operator API and the REAPI listener's `grpc.health.v1` service wait for the object store to answer their read-only probe before they answer not ready
readyz-store-timeout-ms = 2000
# Which core drives the farm's scheduling. `legacy`, the default, is the driver the server has always had. `js` runs the farm on the js scheduler core: it learns sizes in `shadow` at most (`--learned-sizes on` with it is refused at start, exit status 2), and it answers an operation by its `operations/<id>` name only. Either core reads the rows the other wrote to the state store, so a restart with the other value takes them up. The core a server runs is logged at start and exported as `kbf_scheduler_core{core}`, 1 for it and 0 for the other
scheduler-core = "legacy"
# Where the scheduler keeps its state, written before each change is acknowledged and replayed at start: `postgres:///kbf?host=/run/postgresql`, the database `kbf` on a local Unix socket, reached as this process's own user (peer authentication; a URL with a password is refused, as the command line is world-readable). The server must flush commits before it acknowledges them (`synchronous_commit` on) or the start is refused; the tables are created if missing. Or `sqlite:///absolute/path`, a file on a local disk that this process owns (created, with its directory, if missing: 0600, and 0700 for a directory it makes; a second frontend on it refuses to start); SQLite is removed in the next release, so a start on it logs a warning (see the upgrade notes). A start keeps the epoch the store holds, so daemons that reconnect keep the runs of the leases they hold; an operator raises it with `kbf cluster epoch-bump`, after a restore from a backup. `kbf frontend` refuses to start without it; left out of `kbf-server`, the scheduler's state is in memory and a restart loses it
# state-store = "URI"
# How long, in seconds, the start waits for a Postgres `--state-store` that is not up yet (connection refused or reset, a Unix socket that does not exist yet, a connect that times out, or the server answering that it is starting up), trying again after 250 ms and then after twice as long each time, up to 10 s. The window is the time spent waiting between attempts; the time inside an attempt (a connect that times out) is not counted, so the whole wait can be longer. A store that refuses (a URL that does not parse, a login, a missing database, a schema this build does not accept) is not waited for: the frontend exits 2 at once. If the window is used up with the store still not up, the frontend exits 1, not 2, so that a unit which restarts on failure and prevents a restart on exit 2 starts it again. 0 does not wait, and exits 2 as it did before this flag. At most 3600.
state-store-wait-secs = 300
# How long, in seconds, queued work waits while no connected daemon can run it (none satisfies its platform, or none that does is large enough) before it is refused FAILED_PRECONDITION. The wait restarts whenever one can
unservable-wait-secs = 300
# The cores a node that reports VM slots (`vm.slots`) keeps for the host itself: subtracted from the CPUs placement may book on it, so that guests cannot take the host's own share. A node that reports none books the whole machine
vm-host-floor-cpus = 2
# The memory, in GiB, a node that reports VM slots (`vm.slots`) keeps for the host itself, subtracted as `--vm-host-floor-cpus` subtracts cores
vm-host-floor-mem-gib = 8
# Lets a reservation start on the last worker an older ordinary request that waits could run on. Off, the request waits for another worker, so a whole-machine request never takes the only worker such a request has
whole-node-allow-last-capable = false
# How long, in seconds, a whole-machine request waits before it reserves a worker; until then it takes only a worker with no lease. 0, the default, reserves at once
whole-node-drain-after-secs = 0
# How long, in seconds, a reservation may drain its worker before it is given up (nothing running is stopped): the worker is barred to the request for `--whole-node-reserve-backoff-secs` and another is reserved. Left out, the request's longest wall time, the `timeout` of its action; an action that names none has no wall time, and without this flag its reservation is never given up
# whole-node-drain-deadline-secs = "SECONDS"
# The fewest workers that carry neither a reservation nor a whole-machine lease, so ordinary work always has them. 0 lets whole-machine requests take every worker
whole-node-keep-for-ordinary = 1
# Turns on the whole-node drain and caps for whole-machine requests (`kbf-lease` `whole_machine`), and names the most workers that may be whole at once: held by a whole-machine lease or reserved for a queued request (a request that fits nowhere reserves the worker that will empty soonest, and nothing newer is placed there). The ceiling is also at most the workers that serve whole-machine leases less `--whole-node-keep-for-ordinary`, and falls as workers leave. Left out, the scheduler books whole-machine requests as it always has, and the other `--whole-node-*` flags are refused. A request's reservation is given up at its action's timeout, and a client may send none: without `--whole-node-drain-deadline-secs` the reservation of such a request is never given up (it ends when its worker is empty), so set that flag when clients may send no timeout
# whole-node-max = "WORKERS"
# The most workers reserved for a queued whole-machine request that still run other leases at once: the idle capacity a drain may cost. Default 1
whole-node-max-draining = 1
# The reservations a request gives up before its next one has the request's longest wall time as its deadline, and so ends in a grant. Default 2
whole-node-max-reserve-attempts = 2
# How long, in seconds, a worker stays barred to a request after the request gave its reservation up. Default 300
whole-node-reserve-backoff-secs = 300

[storage-client]
# Proxy mode (`docs/design/architecture-v2.md`, section 7): the URL of a storage node (`kbf storage`), such as `http://127.0.0.1:8990`. The REAPI listener then answers a client's CAS, ByteStream and action-cache calls from that node, passing ByteStream through without holding a blob. The local stores are still opened: Execution and the worker listener use them (`kbf frontend` is this mode without them: Execution reads the node too). Plain text (`http://`) only here; `kbf frontend` takes the flags of the mutual TLS to the node. Without it, the server answers those calls itself
# storage = "URL"
# The CA the storage node's certificate chains to; the node must present a certificate for the host in the --storage URL.
# storage-ca = "PATH"
# The frontend's certificate toward the storage node (PEM); it must name the role `frontend` (a URI subjectAltName urn:kbf:role:frontend).
# storage-client-cert = "PATH"
# The private key of --storage-client-cert (PEM).
# storage-client-key = "PATH"

[storage-node]
# Promote a storage node that joined a farm holding data from joining to active by its own heartbeat once it is filled: every member has flushed what it staged before the join, the joiner has indexed every object in the cold store under the frontend's tail epoch, its placement fingerprint matches, no member is down, and the settle time has passed. Off by default: an operator promotes a joiner (`POST /v1/members/{id}`, state active), which stays the override. Frontends first, then nodes, then this flag.
auto-promote = false
# Let --auto-promote promote a joiner although a member was down during its fill. A member that is down and inside its dwell still holds the first phase back. Off by default: a down member may hold the only copy of a blob. Used only with --auto-promote.
handoff-allow-degraded = false
# How long, in seconds, all the conditions of --auto-promote must keep holding at the joiner's beats before it is promoted. Used only with --auto-promote.
handoff-settle-secs = 30
# How long, in seconds, a down storage member stays in the map before it leaves and its blobs move to other owners
member-dwell-secs = 300
# How long, in seconds, a storage node's membership row lives without a heartbeat before the state store expires it and the member goes down in the storage map. Nodes are asked to heartbeat three times as often
member-ttl-secs = 15

[stores]
# Turns on the object-store registration routes of the operator API (/v1/object-stores, docs/api.md) and names the directory where the secret key of each registered connection is kept, one file of mode 0600 each, in a directory made 0700. The directory must be readable by every frontend child that serves at once and left out of any backup of the host. The registration itself (endpoints, buckets, the audit log) is kept in the state store. Without it those routes answer 404.
# object-store-secrets-dir = "DIR"

[task-runs]
# The most bytes of blobs, by their digests' sizes, the input tree of a run may have (each distinct blob once): a run whose tree has more is refused. Used only with `--task-secret-file`
task-closure-max-bytes = 34359738368
# The most distinct digests (directories and files) the input tree of a run may have: a run whose tree has more is refused, never run on a part of its inputs. Used only with `--task-secret-file`
task-closure-max-digests = 500000
# Log and count the keys the janitor would delete, and delete none. Used only with `--task-janitor-key-file`
task-janitor-dry-run = false
# How old a key must be, in seconds, before the janitor may delete it, by the minute its name says it was minted in. At least 21600 (the 18000 seconds at which an ingest refuses a key, and an hour more as a margin for hosts with different clocks and for an old leader still ingesting) and at most 604800. Used only with `--task-janitor-key-file`
task-janitor-grace-secs = 21600
# How often, in seconds, the janitor starts a sweep of `cas/b/`, at least 1 and at most 86400. Used only with `--task-janitor-key-file`
task-janitor-interval-secs = 900
# Turns on the janitor of `cas/b/`: it deletes the task packs and large objects nothing recorded (a refused run, an unused key, a large object already copied into the CAS) once they are older than `--task-janitor-grace-secs`, are not under verification and are not in the pack index. The file is the tier store's GC key, `{"access_key_id": "...", "secret_access_key": "...", "prefix": "cas/b/"}` (the prefix must be exactly `cas/b/`), owned by this user and readable by it alone (mode 0600 or 0400); it is used against `--pack-store-endpoint`'s store, which this needs. The janitor never lists or deletes under `cas/l/`, `cas/f/` or `cas/d/`. Runs on the leader only. Needs `--task-secret-file` and `--pack-store-endpoint`. Left out, nothing is deleted
# task-janitor-key-file = "PATH"
# How long, in milliseconds, the janitor waits after each page before it lists the next, at most 60000: with `--task-janitor-page-size`, the most keys a second it lists and deletes. Used only with `--task-janitor-key-file`
task-janitor-page-pause-ms = 1000
# The keys of `cas/b/` the janitor lists at a time, 1 to 1000, and so the keys it checks against the pack index in one question. Used only with `--task-janitor-key-file`
task-janitor-page-size = 500
# A file with the presign-only key that signs a task's writes of large objects, of the same form and with the same owner and mode rules as `--task-put-credentials-file`: a key of the tier store whose prefix allows objects up to `--task-large-max-bytes`, with a ceiling of at least 14400 seconds. Left out, no run gets a large-object key and an output over 64 MiB fails its task
# task-large-credentials-file = "PATH"
# The most bytes of one large object, above 67108864 (64 MiB, the most a pack record holds): the cap a task and the ingest of its run hold an object to. Used only with `--task-large-credentials-file`
task-large-max-bytes = 536870912
# The large-object keys each run gets, 0 to 8 (`cas/b/<lease>/<nonce>-L<i>`): an output blob over 64 MiB is written whole to one of them. A ceiling, as for `--task-max-packs`. Without `--task-large-credentials-file` no run gets one, whatever this says. Used only with `--task-secret-file`
task-max-large = 8
# The pack keys each run gets, 1 to 8 (`cas/b/<lease>/<nonce>-<k>`): a ceiling, not a prediction, since the sizes of a run's outputs are not known before it runs; a key a task does not write is never used. Used only with `--task-secret-file`
task-max-packs = 8
# The bucket of `--task-put-endpoint` a task's pack is written to, under the key `cas/b/<lease>/<nonce>-0`
# task-put-bucket = "BUCKET"
# A file with the presign-only key of the tier store, as JSON `{"access_key_id": "...", "secret_access_key": "..."}`, owned by this user and readable by it alone (mode 0600 or 0400). The key signs a `PUT` of one object under its prefix and does nothing else; its ceiling (`max_expires_secs` of the store's `--presign-key-file`) must be at least 14400, and the store's `--presign-max-expires` too
# task-put-credentials-file = "PATH"
# The tier store's proxy, as `http://host:port` or `https://host:port`: the host a task's presigned write is signed for, and where it sends the pack. Used only with `--task-secret-file`
# task-put-endpoint = "URL"
# The region the presigned writes to `--task-put-endpoint` are signed for
task-put-region = "us-east-1"
# The base URL a task reads its inputs from: the job-facing read listener, as `https://host:port` with no path (a grant's token is a bearer secret and crosses only a TLS connection; `http://` is refused at start). A blob is `GET <url>/<hash>/<size>`
# task-read-url = "URL"
# The run wall limit a run is prepared for, in seconds, at least 1 and at most 14400: a task's presigned write and read grant are good for this plus `--task-url-slack-secs`. Used only with `--task-secret-file`
task-run-wall-secs = 7200
# Turns on the preparation of the runs of a host executor: for each run the frontend makes the keys the task may write, a presigned write of each to the tier store, and a read grant for the task's inputs. The file holds one secret of at least 32 bytes (surrounding white space is dropped), owned by this user and readable by it alone (mode 0600 or 0400): the pack-key mint and the read-grant key are made from it, and it is the secret the job-facing listener verifies grants with. The secret is never a flag: a command line is world-readable. Needs `--task-put-endpoint`, `--task-put-bucket`, `--task-put-credentials-file` and `--task-read-url`. Left out, no run is prepared
# task-secret-file = "PATH"
# The time past the run wall, in seconds, that a task's presigned write and read grant stay good: the time a task takes to start and to put its pack, which includes the retries of a put the store refuses with 503: about 165 seconds from the first attempt to the last by default (up to 60 s of the task's own waits, and up to 15 s at the store before each refusal). The wall and the slack together must not pass 14400, the ceiling of a presigned write, or the frontend does not start. Used only with `--task-secret-file`
task-url-slack-secs = 600

[tls]
# A file holding the token operator API writes (cordon, drain, uncordon) must present as `Authorization: Bearer <token>`. It must be owned by the server's user with mode 0600 or 0400, or the server refuses to start; run the server as a user other than the daemon's, whose builds could read it. Without it, writes are refused
# api-token-file = "API_TOKEN_FILE"
# A file holding the per-boot secret of the TLS-terminating proxy in front of this server (`docs/design/frontend-proxy.md`, section 3): exactly 32 bytes, owned by the server's user with mode 0600 or 0400, read at start. The proxy presents them as 64 lower-case hex digits in `x-kbf-proxy-auth`. With it, the REAPI, worker and operator listeners take calls from loopback only, and believe `x-kbf-node-id` and `x-kbf-role` only from a call that presents the secret; every other `x-kbf-*` header is dropped. The worker listener then takes the proxy's identity in place of a client certificate (it needs no TLS flags), and the operator API's writes must come through the proxy as well as carry the token (a local `curl` write is refused). The storage listener is not covered: it keeps its own mutual TLS. Without it, behavior is as before
# proxy-auth-file = "PATH"
# A JSON file with the REAPI listener's authentication policy and authorizers (`docs/reapi-auth.md`), read once at start; a file that is not a valid policy stops the server. Without it every REAPI call is accepted and allowed. The worker listener does not read it; on the operator API only the build pages and the blob route do, and they are off unless it names their authorizers
# reapi-auth-policy = "REAPI_AUTH_POLICY"
# PEM certificate (chain) of the REAPI listener. With `--reapi-tls-key` it serves TLS with this server certificate only; clients present no certificate. It is meant for a certificate from the farm's own internal CA, trusted by the front's proxy (its hop to this server) and by clients that dial this server directly; TLS for the farm's client-facing name still ends at the front. `--reapi-auth-policy` applies over TLS as over plain text
# reapi-tls-cert = "REAPI_TLS_CERT"
# PEM private key of the REAPI listener; it must match `--reapi-tls-cert`, or the server refuses to start
# reapi-tls-key = "REAPI_TLS_KEY"
# PEM CA that client certificates must chain to. Each must also name the role the method it calls takes: the daemon role (`urn:kbf:role:daemon`) for the worker session and blob calls, the storage role (`urn:kbf:role:storage`) for `kbf.map.v1.Membership`, with DNS or IP names that cover the host of the instance id and of the address it registers; a frontend certificate may call nothing here
# worker-client-ca = "WORKER_CLIENT_CA"
# The worker listener's deny list: certificate serials, public keys and node ids it refuses (format in the `identity` module docs). Read at start, then again at every check (a daemon's `Hello`, `Heartbeat`, `Result`, `NodeStatus` and blob calls, a storage node's `Register` and `Heartbeat`), so an edit takes effect without a restart. A `node` entry also refuses a storage certificate with that DNS name. A list that cannot be read after start refuses all of those calls. Needs mutual TLS, or `--proxy-auth-file` (then only `node` entries can name a caller: the proxy forwards a node id, not a certificate, so a `serial` or `spki-sha256` entry never matches)
# worker-deny-list = "WORKER_DENY_LIST"
# PEM certificate of the worker listener. With `--worker-tls-key` and `--worker-client-ca` it serves mutual TLS; without all three, plain text
# worker-tls-cert = "WORKER_TLS_CERT"
# PEM private key of the worker listener
# worker-tls-key = "WORKER_TLS_KEY"
