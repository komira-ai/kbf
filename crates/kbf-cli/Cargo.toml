[package]
name = "kbf-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The one binary: `kbf <mode>` over the libraries of kbf-node and kbf-storage-and-daemon
# (docs/design/cluster.md, sections 1 and 5.1). Like kbf-storage-and-daemon it links both the
# server and the node library (the version stamp is kbf-server's), so it is listed in
# `JOINERS` in crates/kbf-integration-test/tests/layering.rs.
[features]
# kbf-server's test-only feature of the same name (`SchedulerCore::under_test()` names the js
# core), reachable from `-p kbf-cli --features farm-core-js`. It does not change what the `kbf`
# binary can run: both scheduler cores are in every build (`--scheduler-core`). No default
# feature set turns it on.
farm-core-js = ["kbf-server/farm-core-js"]

[[bin]]
name = "kbf"
path = "src/main.rs"

# The container driver's stand-in `crun`, which runs each action as a plain process,
# for tests/all_in_one.rs, tests/storage_and_daemon.rs and tests/rehearsal_in_a_box.rs:
# the program the driver's own tests run, built here because a test can run only its own
# package's binaries, under a name of its own so a workspace build does not write two
# binaries to one path. Not shipped.
[[bin]]
name = "kbf-cli-fake-crun"
path = "../kbf-driver-container/tests/bin/fake_crun.rs"
test = false

# A program that exits at once, in place of `kbf`, for tests/beta_b0.rs (a farm that cannot
# start). Not shipped.
[[bin]]
name = "kbf-cli-fake-exits"
path = "tests/bin/fake_exits.rs"
test = false

[dependencies]
clap.workspace = true
kbf-storage-and-daemon.workspace = true
kbf-node.workspace = true
kbf-server.workspace = true
# The startup self-checks (src/preflight): the role a certificate names, and a
# certificate's chain, extended key usage and names, read as the farm's issuer made them.
kbf-peer.workspace = true
rustls.workspace = true
x509-parser.workspace = true
# The start of the storage, daemon and storage-and-daemon modes enrolls the host: the
# node's side of enrollment, and the types and wire it speaks (src/enroll.rs, src/node.rs).
kbf-enroll.workspace = true
kbf-proto.workspace = true
kbf-types.workspace = true
thiserror.workspace = true
# The settings file of every mode (src/config.rs).
toml.workspace = true
# The renewal loop beside the running mode (src/node.rs).
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time"] }
tracing.workspace = true
# The stand-in `crun`'s (kbf-cli-fake-crun); the effective uid and the host name that
# a start that enrolls reads.
rustix = { workspace = true, features = ["process", "system"] }
# The Postgres state schema version, which `kbf --version --json` reports.
# `schema::embedded` and `latest`: the migrations a release runs (the state store's and the pack index's).
kbf-pack-index = { workspace = true, features = ["postgres"] }
kbf-state = { workspace = true, features = ["postgres"] }
# `kbf setup` (src/setup.rs): the first configuration of a host from the packages. Without the
# library's `proxy` feature, so this binary links no kbf-proxy: an installer.toml with a
# `[proxy]` table is `kbf-installer setup`'s to keep (tests/layering.rs in kbf-integration-test
# checks the tree).
kbf-setup.workspace = true
# `kbf update-hook <step>` (src/lib.rs): the hook the generic updater runs for the kbf service,
# today's update of a host split at the five steps of the hook contract.
kbf-updater.workspace = true
# The identity `kbf --version --json` prints (src/version.rs), and the bodies of
# `kbf cluster` (src/cluster.rs).
serde_json.workspace = true
# The request bodies of `kbf cluster object-store` (src/cluster/object_store.rs), and the
# secret key read for one, which is zeroed when dropped.
serde.workspace = true
zeroize.workspace = true

[dev-dependencies]
# The REAPI conformance suite, run against a `kbf storage` process (tests/storage_process.rs):
# the daemon's transfer engine over real gRPC, and the storage client.
bytes.workspace = true
kbf-cas-conformance.workspace = true
kbf-storage.workspace = true
kbf-transfer.workspace = true
# The protocol the daemon half speaks, which `kbf --version --json` reports as the
# server's (src/tests.rs pins them equal).
kbf-daemon.workspace = true
# tests/installer_reads_version.rs: the installer parses what this binary prints.
kbf-installer.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tonic.workspace = true
# The Postgres process test reads the frontend's tables back (tests/frontend_process.rs), in a
# database of its own that `test-database` makes and drops.
kbf-state = { workspace = true, features = ["test-database"] }
postgres.workspace = true
# `kbf storage-and-daemon` running an action (tests/storage_and_daemon.rs): the act steps
# it runs through this test binary, the REAPI messages (the node's certificates are made
# with rcgen, below); the image store layout the stand-in `crun` runs over is
# kbf-driver-container's, under the Linux-only section at the end. `postgres`: the databases
# of tests/boot_check_postgres.rs are made through the guard of the shared catalogs.
kbf-testkit = { workspace = true, features = ["postgres"] }
prost.workspace = true
# The certificate checks (`kbf_ca::verify_cert`) of tests/deploy_units.rs.
kbf-ca.workspace = true
# tests/setup.rs runs `kbf setup` over a recording host (`FakeExec`) instead of a real one.
kbf-host = { workspace = true, features = ["testkit"] }
# The packaged units (`packaging/linux/units`) parsed with kbf's own parser
# (tests/deploy_units.rs, tests/package_units.rs).
kbf-unitfile.workspace = true
# Certificates made as the farm's issuer makes them, checked by `kbf_ca::verify_cert` and
# read back with the storage node's own role check (tests/deploy_units.rs), and the node's
# certificates (tests/storage_and_daemon.rs).
rcgen = { workspace = true, features = ["x509-parser"] }
# The in-process frontend of kbf-enroll's tests (tests/node.rs includes it): its
# certificate authority (the role check of its worker listener is kbf-peer's, above).
sha2.workspace = true
time.workspace = true
x509-parser = { workspace = true, features = ["verify"] }
# The fake front `kbf daemon` says Hello to on macOS (tests/macos_daemon.rs, which
# includes kbf-node's tests/front/mod.rs): its async streams and the CAS it serves.
futures.workspace = true
kbf-front.workspace = true

# The container driver builds on Linux only, and so does the one test that reads its
# image store layout; the macOS tests of this package (tests/macos_daemon.rs) build without it.
[target.'cfg(target_os = "linux")'.dev-dependencies]
kbf-driver-container.workspace = true
# The farm of real `kbf` processes the rehearsal (tests/rehearsal_in_a_box.rs) drives, and
# the stand-in `podman`'s store (tests/support, through kbf-storage-and-daemon's node.rs).
kbf-harness.workspace = true

[lints]
workspace = true
