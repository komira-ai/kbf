[package]
name = "kbf-pack"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
bytes.workspace = true
# The reads of one call that are in flight at once (`buffer_unordered`).
futures.workspace = true
# The names of the read cache's files: the hash of a blob in hex.
hex.workspace = true
# `ObjectStore`: the create-only write and the ranged read of a pack object.
kbf-objstore.workspace = true
# The segment layout of a pack: the footer builder and the record checksum.
kbf-segments.workspace = true
# `PackIndex`: where the write rule records a pack and where the reader finds a blob.
kbf-pack-index.workspace = true
# The task pack types, re-exported by this crate.
kbf-task-pack.workspace = true
# `Digest`, the key of a segment's index.
kbf-types.workspace = true
# The report of an adoption (`adopt`), which is also its checkpoint, is kept as JSON, and so is
# the manifest of a task pack (`TaskManifest`).
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# `rt`, to run the blocking index and cache calls off the async worker threads; `time`, to
# space out the segments an adoption handles.
tokio = { workspace = true, features = ["rt", "time"] }
# A write that failed and a cache that could not keep a blob are logged, not returned.
tracing.workspace = true

[dev-dependencies]
# The in-memory index the tests record packs in, and its clock.
kbf-pack-index = { workspace = true, features = ["test-support"] }
kbf-state.workspace = true
# `TestDir`, the cache directories of the tests.
kbf-testkit.workspace = true
# `test-util`: the clock of the test that paces an adoption stands still until it is waited on.
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }

[lints]
workspace = true
