[package]
name = "kbf-testkit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# `kbf-act`, the program the samples' `shout` action runs (`cargo build -p kbf-testkit
# --bins`): a thin main over `js_testkit::act`, kept so the binary keeps its name and path.
[[bin]]
name = "kbf-act"
path = "src/bin/kbf-act.rs"
test = false

[features]
# `database`: a Postgres database a test owns (the feature of `js-testkit` of that name).
postgres = ["js-testkit/postgres"]

[dependencies]
# The code lives in the jobscheduler repository, at the revision the workspace pins.
js-testkit.workspace = true

[lints]
workspace = true
