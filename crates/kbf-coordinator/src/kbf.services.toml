# kbf's own definition: the service every coordinator manages. A services file whose first
# entry is named `kbf` replaces it (see services.rs); without one this is what runs.
#
# All four roles, limits from the desired state; a frontend is never the last one up and
# waits for every other role. The `min_up` keys a desired state of kbf must name (storage and
# frontend) belong to the service and are not set here.
#
# The storage role is in the pool `storage`. Another service whose storage role names the
# same pool (tierstore, once its entry does) shares one count of storage hosts holding a
# slot with kbf, and each service's new order compares that count with its own limit. With
# no other member the pool decides exactly as no pool.

[[service]]
name = "kbf"

[service.roles.frontend]
never_last = true
after = ["storage", "daemon", "mac-daemon"]

[service.roles.storage]
pool = "storage"

[service.roles.daemon]

[service.roles.mac-daemon]
