[package]
name = "kbf-storage-and-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The storage node and a worker daemon in one process, the daemon's blobs moving through
# calls into the storage half (`LocalDataPlane`). A library: the `kbf` binary runs it as
# `kbf storage-and-daemon` (crates/kbf-cli). The `kbf all-in-one` code inside is refused
# by the binary and goes away with the mode. The one crate, with
# kbf-cli, that links both the server and the node library
# (crates/kbf-integration-test/tests/layering.rs).

[dependencies]
bytes.workspace = true
clap.workspace = true
futures.workspace = true
kbf-front.workspace = true
kbf-node.workspace = true
kbf-proto.workspace = true
kbf-segments.workspace = true
kbf-server.workspace = true
# The node's one cache (`kbf_storage::local_cache`) and the streamed read's types.
kbf-storage.workspace = true
kbf-threads.workspace = true
kbf-transfer.workspace = true
kbf-types.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "rt-multi-thread", "sync"] }
tonic.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# The checks every data plane must pass (tests/conformance.rs).
kbf-cas-conformance.workspace = true
# A SIGTERM sent to the test process (src/run.rs).
libc.workspace = true
# The CPU pool the output walk hashes on (tests/one_read.rs).
kbf-daemon.workspace = true
# The driver's output walk (tests/memory.rs, tests/one_read.rs).
kbf-driver-container.workspace = true
# The stand-in `podman`'s image store, cgroup tree and id files (tests/support/node.rs re-exports them).
kbf-harness.workspace = true
# The storage boundary the plane is checked through (tests/storage_seam.rs); where a blob is, to damage one (src/plane_tests.rs).
kbf-meta.workspace = true
# The store a blob is in, to damage one (src/plane_tests.rs).
kbf-objstore.workspace = true
# The tree removal a hardened process must still manage (tests/hardened_removal.rs).
kbf-outputs.workspace = true
prost.workspace = true
rcgen.workspace = true
# inotify, which counts the opens of each output file (tests/one_read.rs).
rustix = { workspace = true, features = ["fs"] }
# Paused time for the stop signals' fan-out (src/all_in_one_tests.rs).
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "test-util", "time"] }
# The scratch directories every test owns and removes (TestDir).
kbf-testkit.workspace = true

[lints]
workspace = true
