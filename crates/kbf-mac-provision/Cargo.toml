[package]
name = "kbf-mac-provision"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Checks a Mac node's host settings and worker profile against a profile file
# (docs/design/mac-node-provisioning.md, sections 2, 3 and 5); README.md lists every
# item. It builds everywhere, so every item is tested against a fake Mac on every CI
# runner; it reads a real Mac only on macOS, where tests/as_root.rs runs it as root.
[[bin]]
name = "kbf-mac-provision"
path = "src/main.rs"

[dependencies]
clap.workspace = true
hex.workspace = true
rustix = { workspace = true, features = ["fs", "process"] }
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
# The loader of `kbf.toml` the daemon itself runs (tests/node_config.rs): the file this
# tool renders is parsed by it, on Linux, into the flags it must stand for.
kbf-cli = { path = "../kbf-cli" }
# The installer's layout (tests/node_config.rs): the update directory this tool gives the
# daemon is the directory the installer keeps its state and order spool in.
kbf-host.workspace = true
kbf-installer.workspace = true
kbf-update.workspace = true

[lints]
workspace = true
