[package]
name = "tierstore-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# A measurement tool for tierstore, an S3 client of its front and of the two stores behind it.
# It depends on no tierstore code (it talks to the binary over HTTP, as any client does) and on
# `kbf-objstore` only for the SigV4 client; crates/kbf-integration-test/tests/layering.rs does not
# constrain it.

[dependencies]
bytes.workspace = true
clap.workspace = true
# The fault proxy's `Date` and `Last-Modified` rewrite (`skew=SECS`): HTTP-date text to a time and
# back. Already in the tree through hyper.
httpdate.workspace = true
# The fault proxy (`proxy`): an HTTP/1.1 server for the clients, an HTTP/1.1 client for the store,
# frames passed on one at a time.
hyper = { workspace = true, features = ["client", "http1", "server"] }
hyper-util = { workspace = true, features = ["tokio"] }
# The S3 client (`s3`): SigV4, multipart, ranged reads, listings.
kbf-objstore.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }

[dev-dependencies]
# `FakeS3`, a loopback S3 service, for the tests of the client wrapper.
kbf-objstore = { workspace = true, features = ["testkit"] }
# Scratch directories of the tests.
kbf-testkit.workspace = true
# Raw sockets for the proxy tests: requests as text, upstreams that answer by hand.
tokio = { workspace = true, features = ["io-util", "test-util"] }

[lints]
workspace = true
