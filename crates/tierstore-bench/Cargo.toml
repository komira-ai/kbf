[package]
name = "tierstore-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# A measurement tool for tierstore, an S3 client of its front and of the two stores behind it.
# It depends on no tierstore code (it talks to the binary over HTTP, as any client does) and on
# `kbf-objstore` only for the SigV4 client; crates/kbf-integration-test/tests/layering.rs does not
# constrain it.

[dependencies]
bytes.workspace = true
clap.workspace = true
# The S3 client (`s3`): SigV4, multipart, ranged reads, listings.
kbf-objstore.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
# Streams of a body for a multipart part (`BodyStream`), and `join_all` of the cells.
futures.workspace = true
# The signed streaming GET (`cells::streamget`): the time to the first byte of a read, which the
# S3 client of kbf-objstore does not give (it returns a body whole).
hex.workspace = true
hmac.workspace = true
reqwest.workspace = true
# The digests of the synthetic tree (`cells::tree`) and of the signing key.
sha2.workspace = true

[dev-dependencies]
# `FakeS3`, a loopback S3 service, for the tests of the client wrapper.
kbf-objstore = { workspace = true, features = ["testkit"] }
# Scratch directories of the tests.
kbf-testkit.workspace = true
# A paused clock for the throttle and the open-loop pacing tests.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
