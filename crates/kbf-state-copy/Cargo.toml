[package]
name = "kbf-state-copy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The cutover tool that moves a frontend's SQLite state file into Postgres. It is its own
# binary, never part of `kbf`: the SQLite reader it carries must not ship in the farm's
# binary. It reads the file through rusqlite alone, so the SQLite backend of kbf-state can
# be deleted without touching this crate, and writes through its own SQL because the
# Postgres store assigns a new revision to every write and a copy has to keep the old ones.
[dependencies]
clap.workspace = true
hex.workspace = true
# The URL check, the schema version and the names of the tables of the Postgres store.
kbf-state = { workspace = true, features = ["postgres"] }
postgres.workspace = true
rusqlite.workspace = true
sha2.workspace = true
thiserror.workspace = true
# The frontend's kbf.toml, read to find the one state-store key and to check that the
# rewritten file says what the original did, bar that key.
toml.workspace = true

[dev-dependencies]
# A scratch directory per test, removed on drop, and (`postgres`) the guard of the shared
# catalogs that the tests' databases are made and dropped through (kbf_testkit::database).
kbf-testkit = { workspace = true, features = ["postgres"] }

[lints]
workspace = true
