[package]
name = "kbf-all-in-one-test"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# T009's black-box suite of the all-in-one farm, tests only: see README.md. No library target
# and no binary of its own; the farm's processes are found beside the test binary (`kbf_harness::stand_in`).
# Everything is a dev-dependency, so nothing here is linked into a shipped binary.

[dev-dependencies]
# The farm of real `kbf` processes, started from the units `kbf-deploy` renders, and the
# REAPI client of its frontend (`kbf_harness::reapi`).
kbf-harness.workspace = true
# The act steps the stand-in `crun` runs through this test binary, and a scratch directory.
kbf-testkit.workspace = true
kbf-transfer.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
