[package]
name = "kbf-update"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The node's end of a pull-based update: it learns the release the frontend wants over
# the session the daemon holds, remembers the offer, writes the frontend's orders as small
# records into the order spool and reports what the root installer says. No release bytes
# pass through it, and it decides nothing about trust: the installer fetches the release
# and verifies its build attestation before anything is installed.
[dependencies]
kbf-proto.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "sync", "test-util", "time"] }

[lints]
workspace = true
