[package]
name = "kbf-driver-container"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The tests' stand-in `podman` (tests/support/fake.rs links it).
# Not shipped: the release jobs build only kbf-node's and kbf-server's binaries.
[[bin]]
name = "kbf-fake-podman"
path = "tests/bin/fake_podman.rs"
test = false

[dependencies]
base64.workspace = true
clap.workspace = true
futures.workspace = true
hex.workspace = true
kbf-daemon.workspace = true
kbf-proto.workspace = true
kbf-types.workspace = true
prost.workspace = true
prost-types.workspace = true
rustix = { workspace = true, features = ["fs", "process"] }
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }
tracing.workspace = true

[dev-dependencies]
# sched_getaffinity, which the real-Podman capacity test compares with.
rustix = { workspace = true, features = ["thread"] }
tracing-subscriber.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }

[lints]
workspace = true
