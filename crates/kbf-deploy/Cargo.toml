[package]
name = "kbf-deploy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The deploy tool: its kits as subcommands. A kit that changes a host does it through
# kbf-host's plan of steps, printed by default and carried out with `--apply`. Today one
# kit exists, `linux` (render-units, check-units), which writes only into the directory
# it is given.

[dependencies]
clap.workspace = true
kbf-host.workspace = true
kbf-types.workspace = true
thiserror.workspace = true

[dev-dependencies]
kbf-host = { workspace = true, features = ["testkit"] }

[lints]
workspace = true
