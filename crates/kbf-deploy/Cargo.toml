[package]
name = "kbf-deploy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The deploy tool: its kits as subcommands. A kit that changes a host does it through
# kbf-host's plan of steps, printed by default and carried out with `--apply`. Four
# kits: `minio` (buckets and their key, a NodePort for the S3 port), `linux`
# (render-units, check-units, and as root install-units, image-pull and swap), `mdm`
# (fetch the pinned upstream archives, install the MDM services as root, verify them)
# and `envoy` (render, check a render, and apply it to a cluster through kubectl). rustls (ring), httparse and
# rustls-native-certs make the HTTPS client of `mdm fetch` and `mdm verify`; sha2
# checks the archives against their pins and hashes the rendered Envoy config into the
# pod template; zip, tar and flate2 unpack the archives; x509-parser reads the
# certificates `mdm verify` checks.

[[bin]]
name = "kbf-deploy"
path = "src/main.rs"

[dependencies]
clap.workspace = true
flate2.workspace = true
hex.workspace = true
httparse.workspace = true
kbf-host.workspace = true
kbf-types.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
thiserror.workspace = true
x509-parser.workspace = true
zip.workspace = true

[dev-dependencies]
kbf-host = { workspace = true, features = ["testkit"] }
# The certificates of the HTTPS servers the `mdm` tests run.
rcgen.workspace = true
rustix = { workspace = true, features = ["process"] }

[lints]
workspace = true
