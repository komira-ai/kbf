[package]
name = "kbf-deploy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The deploy tool: its kits as subcommands. A kit that changes a host does it through
# kbf-host's plan of steps, printed by default and carried out with `--apply`. Three kits:
# `minio` (buckets and their key, a NodePort for the S3 port), `linux` (render-units,
# check-units, and as root install-units, image-pull and swap) and `envoy` (render).
# sha2 hashes the rendered Envoy config into the pod template.

[[bin]]
name = "kbf-deploy"
path = "src/main.rs"

[dependencies]
clap.workspace = true
kbf-host.workspace = true
kbf-types.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
kbf-host = { workspace = true, features = ["testkit"] }
rustix = { workspace = true, features = ["process"] }

[lints]
workspace = true
