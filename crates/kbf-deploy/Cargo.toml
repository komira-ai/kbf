[package]
name = "kbf-deploy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The deploy tool: a plan of steps, printed by default and carried out with `--apply`,
# through an `Exec` that is the host or a recording fake, and the kits built on it as
# subcommands: `minio` (buckets and their key, a NodePort for the S3 port) and `linux`
# (render-units, check-units).

[[bin]]
name = "kbf-deploy"
path = "src/main.rs"

[dependencies]
clap.workspace = true
kbf-types.workspace = true
rustix = { workspace = true, features = ["process"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[lints]
workspace = true
