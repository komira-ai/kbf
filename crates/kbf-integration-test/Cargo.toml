[package]
name = "kbf-integration-test"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# `kbf-cell`, the M1, M2 and cross-version integration harnesses: the tests themselves
# (`kbf-cell m1`, `kbf-cell m2`, `kbf-cell cross-version`), test certificates, the test-only
# daemon (the daemon library with its local runtime) and the build-summary check; see the
# library docs.
[[bin]]
name = "kbf-cell"
path = "src/bin/kbf-cell.rs"

# `kbf-m2-act`, the program every action of the M2 sample project runs (`m2/`): the
# M2 image has no shell. Its verbs are kbf-testkit's (the standard library, rustix and
# two plain libc calls), so CI can still link it statically.
[[bin]]
name = "kbf-m2-act"
path = "src/bin/kbf-m2-act.rs"

[dependencies]
clap.workspace = true
# `kbf-cell cross-version`'s probe stream (a Hello of its own, as a fake daemon sends it).
futures.workspace = true
kbf-unitfile.workspace = true
kbf-daemon.workspace = true
# The tests under `tests/` that call into the installer library: `package_trust` (settings,
# layout, archive), `package_installer_verbs` (cli, layout, setup plan), `observe_ports`
# (observe) and `proxy_aio_soak` (the proxy swap).
kbf-installer.workspace = true
kbf-objstore.workspace = true
# The worker protocol's messages and client, for the same probe.
kbf-proto.workspace = true
kbf-testkit.workspace = true
kbf-transfer.workspace = true
rcgen.workspace = true
# `kbf-cell m1`'s calls to the operator API.
reqwest.workspace = true
# SIGINT for the processes `kbf-cell m1` started.
rustix = { workspace = true, features = ["process"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }
tonic.workspace = true
tracing-subscriber.workspace = true
# `kbf-cell m2` sets the runner up with `cargo xtask crun-tests`'s own function.
xtask.workspace = true

[dev-dependencies]
# `tests/object_store_e2e`: the operator routes on a real listener.
axum = { workspace = true, features = ["http1", "tokio"] }
bytes.workspace = true
# The proxy soak (tests/proxy_soak.rs) is an h2 client of the proxy library, and runs this
# crate's test binary as the real `kbf` through a link of that name; `tests/proxy_identity.rs`
# puts a real kbf-proxy in front of the real kbf-server gate.
h2.workspace = true
hex.workspace = true
http.workspace = true
# `tests/planned_restart.rs`: the farm of real `kbf` processes it drives and the REAPI
# client of its frontend (`kbf_harness::reapi`).
kbf-harness.workspace = true
# `tests/ui_through_proxy.rs`: the real server's policy, and the scheduler's timings its
# listeners are given.
kbf-auth.workspace = true
kbf-cli.workspace = true
kbf-front.workspace = true
# `tests/package_trust.rs`: the installer's settings parser reads the `installer.conf`
# that `cargo xtask pkg-trust` writes, from a fake host.
kbf-host = { workspace = true, features = ["testkit"] }
# `tests/object_store_e2e`: the registration's journey from an operator PUT to a storage
# node's heartbeat; the S3 service the nodes and the frontend's probe talk to is the fake.
kbf-map.workspace = true
kbf-objstore = { workspace = true, features = ["testkit"] }
# `tests/remote_ci_through_proxy.rs`: the fake issuer and keys a CI job's OIDC token is minted from.
kbf-oidc = { workspace = true, features = ["testkit"] }
kbf-state = { workspace = true, features = ["test-support"] }
kbf-storage.workspace = true
kbf-types.workspace = true
kbf-proxy.workspace = true
kbf-sched.workspace = true
kbf-server.workspace = true
kbf-threads.workspace = true
# SIGPIPE ignored by the fake `kbf-server` of tests/cross_version.rs, which runs before
# the Rust runtime has (a write to a socket the peer closed would end the process).
libc.workspace = true
proc-macro2.workspace = true
prost.workspace = true
rustls.workspace = true
saphyr-parser.workspace = true
sha2.workspace = true
syn.workspace = true
# The listeners, byte streams, channels and timers of the proxy, deploy and object-store tests.
tokio = { workspace = true, features = ["io-util", "net", "sync", "time"] }
tokio-rustls.workspace = true
tonic = { workspace = true, features = ["tls-ring"] }

[lints]
workspace = true
