[package]
name = "kbf-integration-test"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# `kbf-js-stand-in`, the `crun`, `ip`, `nft` and `nsenter` that
# `tests/executor_real_service_integration.rs` gives the pinned js-agent: a thin main over
# `js_stand_in`.
[[bin]]
name = "kbf-js-stand-in"
path = "src/bin/kbf-js-stand-in.rs"

[dependencies]
clap.workspace = true
# `tests/proxy_soak.rs`: the soak's concurrent streams.
futures.workspace = true
kbf-unitfile.workspace = true
# The tests under `tests/` that call into the installer library: `package_trust` (settings,
# layout, archive) and `package_installer_verbs` (cli, layout, setup plan).
kbf-installer.workspace = true
kbf-objstore.workspace = true
# The REAPI and map messages of the proxy and executor tests.
kbf-proto.workspace = true
kbf-testkit.workspace = true
kbf-transfer.workspace = true
rcgen.workspace = true
reqwest.workspace = true
# The signals of `js_stand_in` and the js-agent the executor test starts.
rustix = { workspace = true, features = ["process"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }
tonic.workspace = true
tracing-subscriber.workspace = true
# The release tooling's library the lints and the real-service tests read
# (`xtask::budget`, `xtask::entitlements`, `xtask::fetch`, `xtask::js_pin`).
xtask.workspace = true

[dev-dependencies]
# `tests/object_store_e2e`: the operator routes on a real listener.
axum = { workspace = true, features = ["http1", "tokio"] }
bytes.workspace = true
# The proxy soak (tests/proxy_soak.rs) is an h2 client of the proxy library, and runs this
# crate's test binary as the real `kbf` through a link of that name; `tests/proxy_identity.rs`
# puts a real kbf-proxy in front of the real kbf-server gate.
h2.workspace = true
hex.workspace = true
http.workspace = true
# `tests/mixed_version.rs`: the farm of real `kbf` processes it drives and the REAPI
# client of its frontend (`kbf_harness::reapi`).
kbf-harness.workspace = true
# `tests/ui_through_proxy.rs`: the real server's policy, and the scheduler's timings its
# listeners are given.
kbf-auth.workspace = true
kbf-cli.workspace = true
kbf-front.workspace = true
# `tests/package_trust.rs`: the installer's settings parser reads the `installer.conf`
# that `cargo xtask pkg-trust` writes, from a fake host.
kbf-host = { workspace = true, features = ["testkit"] }
# `tests/object_store_e2e`: the registration's journey from an operator PUT to a storage
# node's heartbeat; the S3 service the nodes and the frontend's probe talk to is the fake.
kbf-map.workspace = true
kbf-objstore = { workspace = true, features = ["testkit"] }
# `tests/proxy_pool.rs`: two real frontends on a Postgres database of the test's own, which
# `test-database` makes and drops.
kbf-state = { workspace = true, features = ["test-support", "test-database"] }
kbf-storage.workspace = true
kbf-types.workspace = true
# `tests/mdm_layering.rs` reads the root layers.toml.
toml.workspace = true
kbf-proxy.workspace = true
kbf-sched.workspace = true
kbf-server.workspace = true
kbf-threads.workspace = true
# `tests/js_real_service.rs`: kbf-job-client against the pinned js-lease-server and against
# its fake, the messages' descriptor set for the field sets, and test archives of the
# release's shape.
flate2.workspace = true
js-proto.workspace = true
kbf-job-client = { workspace = true, features = ["fake"] }
# `tests/cutover_real_service_integration.rs`: `kbf-deploy job-service apply`, run as the
# binary runs it, against the pinned js-lease-server and js-agent.
kbf-deploy.workspace = true
prost-types.workspace = true
tar.workspace = true
proc-macro2.workspace = true
prost.workspace = true
# `tests/agents_md`: CLAUDE.md read as CommonMark, so an import inside code is not counted.
pulldown-cmark.workspace = true
rustls.workspace = true
saphyr-parser.workspace = true
sha2.workspace = true
syn.workspace = true
# The listeners, byte streams, channels and timers of the proxy, deploy and object-store tests.
tokio = { workspace = true, features = ["io-util", "net", "sync", "time"] }
tokio-rustls.workspace = true
tonic = { workspace = true, features = ["tls-ring"] }

[lints]
workspace = true
