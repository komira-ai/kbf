[package]
name = "kbf-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The one way kbf changes a host: a plan of steps, printed or applied through an `Exec`
# that is the host or a recording fake. kbf-deploy's kits and kbf-installer's host verbs
# both go through it. libc is for the switch to another user before a tool starts
# (setgroups, setgid, setuid).

[features]
# `testkit`: the recording `FakeExec` and scratch directories, for other crates' tests.
testkit = []

[dependencies]
libc.workspace = true
rustix = { workspace = true, features = ["process"] }
thiserror.workspace = true

[lints]
workspace = true

[package.metadata.buildrules]
# The farm lane's `//:ci` (docs/farm.md) checks the format of, builds and lints this package but
# does not run its tests: its library tests hold an `#[ignore]`d test, and buildrules' test gate
# refuses a test target with an ignored test. They run in ci.yml alone.

[package.metadata.buildrules.actions]
ci = ["fmt", "lint"]
