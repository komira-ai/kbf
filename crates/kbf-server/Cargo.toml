[package]
name = "kbf-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# `Farm::for_test`: a farm built from a chosen scheduler core, term and wall clock, so a
# scripted session of it can be written down and compared. Test-only: a production build
# carries none of it. This crate's own tests enable it through the dev-dependency on itself.
testkit = []

[dependencies]
axum = { workspace = true, features = ["http1", "tokio"] }
bytes.workspace = true
clap.workspace = true
form_urlencoded.workspace = true
hex.workspace = true
futures.workspace = true
http-body.workspace = true
http-body-util.workspace = true
# The job-facing read listener serves HTTP/1.1 over its own TLS connections (src/frontend/job_read.rs).
hyper = { workspace = true, features = ["http1", "server"] }
hyper-util = { workspace = true, features = ["service", "tokio"] }
# The messages of the job service the host executor submits jobs to (src/executor).
js-proto.workspace = true
kbf-auth.workspace = true
kbf-ca.workspace = true
kbf-front.workspace = true
kbf-history.workspace = true
kbf-invocation.workspace = true
# The host executor's client of the job service (src/executor).
kbf-job-client.workspace = true
kbf-log.workspace = true
kbf-map.workspace = true
kbf-mapsync.workspace = true
kbf-caps.workspace = true
kbf-estimator.workspace = true
kbf-enroll-registry.workspace = true
kbf-meta.workspace = true
kbf-objstore.workspace = true
# The pack keys, the read cache and the errors of the frontend's packs (frontend/pack_flags.rs).
kbf-pack.workspace = true
# `PostgresPackIndex`, which `--pack-index` opens (state_store.rs), and `PackIndex` itself.
kbf-pack-index = { workspace = true, features = ["postgres"] }
# The certificate's names, serial and key hash a deny entry is compared with (identity.rs,
# members_rpc.rs): the one reader the storage service uses too.
kbf-peer.workspace = true
kbf-proto.workspace = true
kbf-raft.workspace = true
kbf-route.workspace = true
kbf-sched.workspace = true
kbf-signer.workspace = true
kbf-state = { workspace = true, features = ["postgres"] }
kbf-storage.workspace = true
kbf-store.workspace = true
kbf-threads.workspace = true
kbf-tier.workspace = true
kbf-tls.workspace = true
kbf-types.workspace = true
# The pages mounted under /ui (src/ui_mount.rs).
kbf-ui.workspace = true
# The `--usage-profiles` mode (src/usage_profiles.rs).
kbf-usage.workspace = true
percent-encoding.workspace = true
prost.workspace = true
prost-types.workspace = true
# The random nonce of a task's pack key (src/executor/task.rs).
ring.workspace = true
rustix = { workspace = true, features = ["fs", "net", "process"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tonic = { workspace = true, features = ["tls-ring"] }
tower-layer.workspace = true
# The in-process source of the pages calls a router as a service (src/ui_mount.rs; also
# tests/object_store_api.rs, which calls one with a chosen peer address).
tower-service.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# The wipe of a secret file's bytes after they are read or written (object_store/secrets.rs).
zeroize.workspace = true

[dev-dependencies]
# `Farm::for_test`, for the scripted session in tests/farm_core_trace.
kbf-server = { workspace = true, features = ["testkit"] }
# The node's client of `kbf.enroll.v1`, run against the real enroll listener (tests/enroll_node.rs).
kbf-enroll.workspace = true
# The host's updater, run against the same listener (tests/enroll_updater.rs).
kbf-updater.workspace = true
# An S3 service on loopback that refuses any other key pair (tests/cold_apply.rs).
kbf-objstore = { workspace = true, features = ["testkit"] }
# Loopback ports nothing can take (kbf_testkit::port), and the test Postgres server's URL
# (`database::server_url`).
kbf-testkit = { workspace = true, features = ["postgres"] }
# A connector that fails its first lookups, under a lazy channel (tests/storage_register.rs),
# and the TLS reload tests' connector that dials once per attempt (tests/tls_reload.rs).
hyper-util = { workspace = true, features = ["tokio"] }
# A test certificate's public-key hash and names, read independently of kbf-peer.
x509-parser.workspace = true
kbf-segments.workspace = true
# The deterministic simulation kernel's seeded random stream (src/machine.rs, tests/invocations_paging.rs).
kbf-sim.workspace = true
# An in-process job service on loopback (src/executor, tests/executor).
kbf-job-client = { workspace = true, features = ["fake"] }
# The in-memory state store (src/start.rs, src/frontend, src/farm/durable and tests/), and a
# Postgres database of its own for a test (tests/state_store_postgres.rs).
kbf-pack-index = { workspace = true, features = ["test-database", "test-support"] }
kbf-state = { workspace = true, features = ["test-database", "test-support"] }
# The release's bundles, written for the tests that start a frontend over them
# (src/frontend/base_tree_tests.rs).
kbf-tree-bundle.workspace = true
# fcntl and kill for the test that holds the server at its start line (tests/binary.rs).
libc.workspace = true
# The client the Postgres flag tests read the catalog and the sessions with
# (tests/state_store_postgres.rs).
postgres.workspace = true
prost.workspace = true
rcgen.workspace = true
# The client of the job-facing read listener's tests: TLS over the farm CA, dialling an IP address
# (src/frontend/job_read/tests.rs).
rustls.workspace = true
tokio = { workspace = true, features = ["io-util", "test-util"] }
tokio-rustls.workspace = true
# The codec of a raw call to each method of the worker listener's role table
# (tests/worker_roles.rs).
tonic-prost.workspace = true
# rebuild_interest_cache for the tests that install a global subscriber while others run.
tracing-core.workspace = true

[lints]
workspace = true
