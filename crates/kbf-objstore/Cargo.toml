[package]
name = "kbf-objstore"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# `testkit`: `s3::fake`, an S3 service on loopback that keeps multipart uploads, for
# other crates' tests (and this one's, through the dev-dependency on itself).
testkit = ["objstore-s3/testkit"]

[dependencies]
bytes.workspace = true
# The stream of footers (`footers`).
futures.workspace = true
hex.workspace = true
# The segment footer format, read back by `footers`.
kbf-segments.workspace = true
# `Digest`, the key of a segment's index.
kbf-types.workspace = true
# The free-space floor and the filesystem numbers (`disk`), shared with the daemon.
kbf-threads.workspace = true
# The trait, the key types and the S3 client, which this crate re-exports.
objstore-s3.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "time"] }

[dev-dependencies]
# Loopback ports nothing can take (kbf_testkit::port).
kbf-testkit.workspace = true
clap.workspace = true
kbf-objstore = { workspace = true, features = ["testkit"] }
tokio = { workspace = true, features = ["macros", "net", "io-util", "rt-multi-thread", "test-util"] }

[lints]
workspace = true
