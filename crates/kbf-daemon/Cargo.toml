[package]
name = "kbf-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# A process that starts a keeper after its own binary was renamed over, for
# tests/keeper.rs. Not shipped: the release jobs package kbf-node's kbf-daemon alone.
[[bin]]
name = "kbf-keeper-swap"
path = "tests/bin/keeper_swap.rs"
test = false

[dependencies]
# The bytes of a blob read from a pack (`packed`).
bytes.workspace = true
clap.workspace = true
# The input cache's index snapshot (`cache::index`).
crc32fast.workspace = true
futures.workspace = true
hex.workspace = true
# The per-minute binner of each lease's usage (`lease_minutes`); std only.
js-agent-usage.workspace = true
kbf-caps.workspace = true
kbf-map.workspace = true
kbf-mapsync.workspace = true
# `ObjectStore`, which the pack reader is generic over (`packed`).
kbf-objstore.workspace = true
# The packing client's reader: blobs by digest from the packs of an object store (`packed`).
kbf-pack.workspace = true
kbf-proto.workspace = true
kbf-route.workspace = true
# `PackIndex`, which `RemoteIndex` is for the pack reader, and `BlobDigest` (`packed`).
kbf-pack-index.workspace = true
kbf-state.workspace = true
# The node's one cache (`kbf_storage::local_cache`), which the input cache shares with
# local storage on a node that runs both.
kbf-storage.workspace = true
# The Cas trait, and the transfer engine the binary's runtimes use.
kbf-transfer.workspace = true
kbf-types.workspace = true
libc.workspace = true
prost.workspace = true
prost-types.workspace = true
# Killing the keeper's own process group, and its name in the process table (Linux);
# the input cache's file operations (`fs`: flock, renameat2, linkat, statvfs).
rustix = { workspace = true, features = ["fs", "process", "thread"] }
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tonic = { workspace = true, features = ["tls-ring"] }
tracing.workspace = true

[dev-dependencies]
kbf-auth.workspace = true
# The checks every data plane passes, run against the packed plane (tests/packed_conformance.rs).
kbf-cas-conformance.workspace = true
kbf-front.workspace = true
kbf-meta.workspace = true
kbf-segments.workspace = true
kbf-server.workspace = true
# The in-memory pack index the pack-read tests record packs in.
kbf-pack-index = { workspace = true, features = ["test-support"] }
kbf-state = { workspace = true, features = ["test-support"] }
kbf-store.workspace = true
# The program the tests' actions run, kbf-testkit's act verbs, through the test binary.
kbf-testkit.workspace = true
rcgen.workspace = true
tokio = { workspace = true, features = ["net", "test-util"] }
# rebuild_interest_cache for the tests that capture logs while others run.
tracing-core.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
