[package]
name = "kbf-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# A process that starts a keeper after its own binary was renamed over, for
# tests/keeper.rs. Not shipped: the release jobs package kbf-node's kbf-daemon alone.
[[bin]]
name = "kbf-keeper-swap"
path = "tests/bin/keeper_swap.rs"
test = false

[dependencies]
clap.workspace = true
futures.workspace = true
hex.workspace = true
kbf-caps.workspace = true
kbf-proto.workspace = true
kbf-types.workspace = true
libc.workspace = true
prost.workspace = true
prost-types.workspace = true
# Killing the keeper's own process group, and its name in the process table (Linux).
rustix = { workspace = true, features = ["process", "thread"] }
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tonic = { workspace = true, features = ["tls-ring"] }
tracing.workspace = true

[dev-dependencies]
kbf-front.workspace = true
kbf-objstore.workspace = true
kbf-server.workspace = true
rcgen.workspace = true
tokio = { workspace = true, features = ["net"] }
tracing-subscriber.workspace = true

[lints]
workspace = true
