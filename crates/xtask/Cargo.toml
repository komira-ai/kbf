[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
# `cargo xtask` runs this bin, not the test fake.
default-run = "xtask"

# `xtask-fake`, the program this crate's tests run in place of `cargo` and of a built
# `kbf-server` (see its docs). Never run by CI itself.
[[bin]]
name = "xtask-fake"
path = "src/bin/xtask-fake.rs"
test = false

# `kbf-installer-stub`, a TEST-ONLY stand-in for the kbf-installer binary: what the
# package build and install test package until the real binary lands.
[[bin]]
name = "kbf-installer-stub"
path = "src/bin/kbf-installer-stub.rs"
test = false

[dependencies]
# The statement a provenance bundle's DSSE envelope carries (`bundles`): its subject is
# compared with the tarball's digest. Already in the tree through other crates.
base64.workspace = true
clap.workspace = true
flate2.workspace = true
hex.workspace = true
# The result document a release's gamma verdict is, and the one definition of a set hash.
kbf-gate.workspace = true
lzma-rs.workspace = true
ruzstd.workspace = true
# The runner user's uid and gid, and `uname -m`, for `crun-tests`.
rustix = { workspace = true, features = ["process", "system"] }
serde_json.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
sha2.workspace = true
tar.workspace = true
thiserror.workspace = true
ureq.workspace = true
# The zip archive of a pinned tool (`fetch --extract zip`).
zip.workspace = true

[dev-dependencies]
# A scratch directory a test owns and removes (the unit tests).
kbf-testkit.workspace = true
rcgen.workspace = true
# The caller's umask, for the install.sh test.
rustix = { workspace = true, features = ["fs", "process", "system"] }

[lints]
workspace = true
