[package]
name = "tierstore"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# A generic hot/cold object store over S3-compatible backends. It knows nothing of kbf and has
# no kbf crate among its normal dependencies, so it can move to a repository of its own
# (crates/kbf-integration-test/tests/layering.rs keeps it that way). The tests of the `server`
# feature use `kbf-objstore` and `kbf-testkit` as dev-dependencies, which stay behind when it
# moves.

[features]
# `server`: the S3 API front of the proxy (the `server` module) and the `tierstore` binary that
# runs it. Off by default, so the library carries no HTTP stack; the crate's own tests turn it on
# through the dev-dependency on itself, so the workspace runs build and test it.
server = [
    "dep:base64",
    "dep:clap",
    "dep:crc32c",
    "dep:crc32fast",
    "dep:hmac",
    "dep:http-body-util",
    "dep:hyper",
    "dep:hyper-util",
    "dep:md-5",
    "dep:percent-encoding",
    "dep:ring",
    "dep:roxmltree",
    "tokio/macros",
    "tokio/net",
    "tokio/rt-multi-thread",
    "tokio/signal",
]

[[bin]]
name = "tierstore"
path = "src/main.rs"
required-features = ["server"]

[dependencies]
# The backend trait is used as `dyn Backend`, so its async methods are boxed.
async-trait.workspace = true
# The checksums a client sends in the headers of a request are base64 (`server`).
base64 = { workspace = true, optional = true }
bytes.workspace = true
# The flags of the `tierstore` binary (`server`).
clap = { workspace = true, optional = true }
# The CRC-32C and the CRC-32 a client may send as the checksum of a body (`server`).
crc32c = { workspace = true, optional = true }
crc32fast = { workspace = true, optional = true }
# The reconciler's bounded number of parallel copies, and the streams of the parts of an upload.
futures.workspace = true
# The content tag of the in-memory backend: the hex of the body's SHA-256.
hex.workspace = true
# The SigV4 check of a request's signature (`server`).
hmac = { workspace = true, optional = true }
# The request bodies the S3 front reads and the answers it sends (`server`).
http-body-util = { workspace = true, optional = true }
# The HTTP/1.1 server under the S3 front (`server`).
hyper = { workspace = true, features = ["http1", "server"], optional = true }
hyper-util = { workspace = true, features = ["tokio"], optional = true }
# The MD5 a client may send as the `Content-MD5` of a body (`server`).
md-5 = { workspace = true, optional = true }
# The decoding of a request's path and query, and the encoding SigV4 signs (`server`).
percent-encoding = { workspace = true, optional = true }
# The SHA-1 a client may send as the `x-amz-checksum-sha1` of a body (`server`).
ring = { workspace = true, optional = true }
# The body of a CompleteMultipartUpload request (`server`).
roxmltree = { workspace = true, optional = true }
# The journal objects, the checkpoints and the usage object are JSON.
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
# `fs` and `io-util` for the directory backend, `rt` to journal a copy-back in the background,
# `sync` for the batches of the journal, `time` for the linger, the back-pressure and the
# injected delays.
tokio = { workspace = true, features = ["fs", "io-util", "rt", "sync", "time"] }

[dev-dependencies]
# Signs the requests the tests of the S3 front send by hand, apart from the code that checks them.
hmac.workspace = true
# The S3 client kbf itself uses, which the tests of the S3 front drive it with.
kbf-objstore.workspace = true
# Scratch directories and key files of the tests of the binary.
kbf-testkit.workspace = true
# Sends the requests the S3 client does not: unsigned ones and ones signed by hand.
reqwest.workspace = true
# SIGTERM to the binary.
rustix = { workspace = true, features = ["process"] }
# Turns the `server` feature on for this crate's own tests, and for the clippy and coverage
# runs over the workspace that build them.
tierstore = { workspace = true, features = ["server"] }
tokio = { workspace = true, features = ["io-util", "macros", "test-util"] }

[lints]
workspace = true
