[package]
name = "kbf-sim"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The code lives in the jobscheduler repository, at the revision the workspace pins.
js-sim.workspace = true

[dev-dependencies]
# The tests drive nodes written against `kbf_types`, whose scheduler vocabulary is the one
# `js-sim` takes.
kbf-types.workspace = true

[lints]
workspace = true

[package.metadata.buildrules]
# The farm lane's `//:ci` (docs/farm.md) checks the format of, builds and lints this package but
# does not run its tests: its determinism and toy_counter targets hold `#[ignore]`d tests, and
# buildrules' test gate refuses a test target with an ignored test. They run in ci.yml alone.

[package.metadata.buildrules.actions]
ci = ["fmt", "lint"]
