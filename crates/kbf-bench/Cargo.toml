[package]
name = "kbf-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
clap.workspace = true
futures.workspace = true
hex.workspace = true
# The daemon's TLS loader, so a run connects as a daemon does.
kbf-daemon.workspace = true
kbf-proto.workspace = true
# The daemon's transfer engine (FindMissing, ByteStream Write and Read), so a run
# sends and reads blobs exactly as a daemon does.
kbf-transfer.workspace = true
prost.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
tonic = { workspace = true, features = ["tls-ring"] }

[dev-dependencies]
kbf-front.workspace = true
kbf-server.workspace = true
rcgen.workspace = true

[lints]
workspace = true
