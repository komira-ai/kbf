[package]
name = "kbf-installer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The host side of a kbf release: where a host keeps its releases and its deploy state,
# the verbs that install, stage, roll back and remove them, and the offline check that
# decides a release may be staged (docs/design/pull-updates.md). `kbf-deploy host ...`
# (the manual path) and the root helper that applies updates are both callers, so there
# is one state file and one layout on a host. Changes a host only through kbf-host's plan
# of steps. sha2 and hex check what was copied; tar and flate2 unpack a component's
# tarball; rustix opens the order spool's files without following a link (openat, openat2);
# libc drops to the unprivileged user between fork and exec of a program that reads
# untrusted bytes. The `helper` module and the `kbf-installer` binary (verbs `run` and
# `boot-check`) are the root half of the pull-based updates: they read the order spool the
# unprivileged `kbf` writes, stage and swap releases through this crate, restart the one
# configured service and write the world-readable status.json the node reads. There is no
# socket and no network, and a staged binary is never run as root. The one exception is
# the `proxy` verb (the `kbf-proxy` runtime: the frontend host's public port), which runs as the
# unprivileged service user and shares nothing with the root half (tests/layering.rs in kbf-integration-test).

# The child the pipe tests start: a program that does what a list of operations says (send these
# bytes, flood, stall, report its limits). Built only with `test-sandbox`, so never in a release.
[[bin]]
name = "kbf-fetch-stub"
path = "tests/stub/fetch_stub.rs"
required-features = ["test-sandbox"]

[features]
# `testkit`: the scratch host and state helpers other crates' tests of the `host` verbs use.
testkit = ["kbf-host/testkit"]
# `test-sandbox`: the global `--root DIR` flag, which puts a host's paths under a scratch directory.
# Absent from release builds (contract S15); the crate's own tests turn it on.
test-sandbox = []

[dependencies]
bytes.workspace = true
clap.workspace = true
flate2.workspace = true
futures.workspace = true
hex.workspace = true
kbf-host.workspace = true
kbf-proxy.workspace = true
kbf-proto.workspace = true
# The `setup` verb and the host's layout, `installer.toml` and state database it works on
# (re-exported here under their old paths). `proxy`: the proxy's side of `setup` (the `[proxy]`
# table it keeps, and the proxy's flags it takes only to refuse), which `kbf setup` in the `kbf`
# binary does not have.
kbf-retain.workspace = true
kbf-setup = { workspace = true, features = ["proxy"] }
# `postgres`: the schema's migrations and the client that applies them (`database` module).
# `schema::embedded` and `latest`: the migrations a release runs (the state store's and the pack index's).
kbf-pack-index = { workspace = true, features = ["postgres"] }
kbf-state = { workspace = true, features = ["postgres"] }
# `ReleasePlatform`: the platform names and the components a host of each needs, which is what
# a described release is held to (the server's own table, so there is one).
kbf-types.workspace = true
kbf-update.workspace = true
libc.workspace = true
rustix = { workspace = true, features = ["event", "fs", "net", "process"] }
# `deploy` speaks HTTP/1.1 over TLS to the frontend's public port (the proxy): the client
# connection is rustls over a std socket, on the ring provider tonic's `tls-ring` already
# builds, trusting the system's roots (rustls-native-certs, as tonic's `tls-native-roots`
# reads them) and the farm's CA file.
rustls.workspace = true
rustls-native-certs.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
thiserror.workspace = true
# The proxy verb's signal handlers run on kbf-proxy's runtime.
tokio = { workspace = true, features = ["net", "rt", "signal", "sync", "time"] }
tonic = { workspace = true, features = ["tls-native-roots", "tls-ring"] }
toml.workspace = true
tracing.workspace = true
ureq.workspace = true

[dev-dependencies]
bytes.workspace = true
# The proxy verb's process tests are h2 clients of the real binary.
h2.workspace = true
http.workspace = true
kbf-host = { workspace = true, features = ["testkit"] }
kbf-installer = { workspace = true, features = ["testkit", "test-sandbox"] }
# A Postgres database of its own for each test that needs a server (`database` tests).
kbf-state = { workspace = true, features = ["test-database"] }
# The proxy verb's process tests start the binary under a guard that reaps it
# (kbf_testkit::reaped); a child held between fork and exec (kbf_testkit::forked).
kbf-testkit = { workspace = true, features = ["postgres"] }
kbf-update.workspace = true
# The proxy verb serves TLS: its process test makes a CA and a server certificate, and is a
# TLS client of the real binary.
rcgen.workspace = true
rustls.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "rt-multi-thread", "time"] }
tokio-rustls.workspace = true

[lints]
workspace = true
