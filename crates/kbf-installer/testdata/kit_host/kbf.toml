# Written by kbf_av2_mac.sh from av2_mac.conf (edit that, not this file; an install puts it back).
# One table per flag group, one key per flag long name (kbf-cli, config.rs).
mode = "daemon"

[identity]
server = "https://frontend.example.invalid:8981"
cas = "https://frontend.example.invalid:8981"
ca-cert = "/usr/local/kbf/etc/ca.pem"
cert = "/usr/local/kbf/etc/v2/daemon-mac-a.pem"
key = "/usr/local/kbf/etc/v2/daemon-mac-a.key"
node-id = "mac-a"

[daemon]
driver = ["native"]
data-dir = "/usr/local/kbf/work/daemon/data"
