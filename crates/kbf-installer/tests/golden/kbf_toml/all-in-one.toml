# Written by `kbf-installer setup`. The mode's other settings are added below the
# keys it writes; run setup again to change these.
mode = "all-in-one"

[listener]
listen = "0.0.0.0:8980"
worker-listen = "0.0.0.0:8981"
api-listen = "127.0.0.1:8982"

[tls]
api-token-file = "/etc/kbf/api-token"
reapi-tls-cert = "/etc/kbf/reapi.pem"
reapi-tls-key = "/etc/kbf/reapi.key"
worker-tls-cert = "/etc/kbf/worker.pem"
worker-tls-key = "/etc/kbf/worker.key"
worker-client-ca = "/etc/kbf/ca.pem"

[stores]
cold-store = "file:///var/lib/kbf/cold"
meta-dir = "/var/lib/kbf-meta"

[identity]
server = "https://farm.example:8981"
ca-cert = "/etc/kbf/ca.pem"
cert = "/etc/kbf/node.pem"
key = "/etc/kbf/node.key"
node-id = "farm-1"

[daemon]
driver = "container"

[scheduler]
state-store = "postgres:///kbf?host=/run/postgresql"
