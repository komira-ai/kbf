# Written by `kbf-installer setup`; run setup again to change these keys. Another setting
# goes into the table it belongs to (add the key there, never a second table of the same name).
mode = "storage-and-daemon"

[listener]
storage-listen = "127.0.0.1:8990"

[stores]
cold-store = "file:///var/lib/kbf/cold"
meta-dir = "/var/lib/kbf-meta"

[identity]
server = "https://farm.example:8981"
ca-cert = "/etc/kbf/ca.pem"
cert = "/etc/kbf/node.pem"
key = "/etc/kbf/node.key"
node-id = "farm-1"

[daemon]
driver = "container"
