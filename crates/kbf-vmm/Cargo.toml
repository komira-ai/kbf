[package]
name = "kbf-vmm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The VM helper for macOS VM leases (docs/design/macos-vm-guests.md). Today it holds the
# feasibility probes (`probe`, `probe-bench`) and the base-image builder (`image base`);
# it is also the one binary the entitlement allow list gives an entitlement
# (tools/ci/darwin-entitlements.txt, section 7 of that document), checked in
# tests/signing.rs. Every Virtualization.framework call lives in `src/vz/`, macOS only.
[[bin]]
name = "kbf-vmm"
path = "src/main.rs"

[dependencies]
clap.workspace = true
hex.workspace = true
kbf-guest.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2.workspace = true
dispatch2.workspace = true
objc2.workspace = true
plist.workspace = true
objc2-foundation = { workspace = true, features = ["NSString", "NSURL", "NSError", "NSArray", "NSData", "NSDictionary", "NSFileHandle", "NSValue", "NSObject", "NSEnumerator", "NSRunLoop", "NSDate", "NSFileManager", "NSProcessInfo"] }
objc2-virtualization.workspace = true

[dev-dependencies]
kbf-testkit.workspace = true
serde_json.workspace = true
xtask.workspace = true

[lints]
workspace = true
