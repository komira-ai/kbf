[package]
name = "kbf-package-hook"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The update hook of the native kbf package (`kbf package-hook <step>`): the program the host's
# package manager (hostkeeper's apt installer) runs, as root, around an update of the `kbf` package.
# It speaks the hook contract of `update-hook` (the five steps, the exit codes, the last JSON
# line, the `--params` file) and drives one systemd unit: it checks the staged binary, drains the
# unit by stopping it (kbf drains on SIGTERM and the unit waits for it), starts the new binary,
# observes it, and puts the old one back on a rollback. The manifest constants the release
# tooling writes into the desired state are defined here, once. Depends on the contract crate only.
[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
update-hook.workspace = true

[dev-dependencies]
kbf-testkit.workspace = true

# The hook over a fake host kept in a directory, the program the conformance harness runs
# (tests/conformance.rs). Not shipped. Its code is the library's (`fake`), tested and measured
# with it; the binary only forwards to it.
[[bin]]
name = "kbf-package-hook-fake"
path = "src/bin/kbf-package-hook-fake.rs"

[lints]
workspace = true
