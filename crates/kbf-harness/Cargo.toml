[package]
name = "kbf-harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The rehearsal harness as a library (docs/design/kbf-cicd.md, section 4.2): the
# farm of real `kbf` processes (a frontend and storage nodes) started as the packaged units start
# `kbf`, from a generated `kbf.toml`, its supervisor, certificates and the client channel of
# its frontend. It spawns the binaries it is given by path: a library cannot
# use `CARGO_BIN_EXE_*`, which only the package that owns a binary may, so its callers
# (kbf-cli's rehearsal test, kbf-integration-test's mixed-version test) pass `kbf` in. It
# links no kbf-server code.

# The watcher of the farm's scratch-order test (tests/scratch_order.rs): polls for a marker file
# and records that it saw it gone. A test tool of this package, not of anything shipped.
[[bin]]
name = "kbf-harness-watcher"
path = "tests/bin/watcher.rs"
test = false

[dependencies]
kbf-ca.workspace = true
kbf-unitfile.workspace = true
kbf-testkit.workspace = true
rcgen = { workspace = true, features = ["x509-parser"] }
rustix = { workspace = true, features = ["fs", "process"] }
serde_json.workspace = true
thiserror.workspace = true
# The farm's `kbf.toml` of a unit.
toml.workspace = true
# The REAPI client channel of `reapi` (the channel under the farm CA).
tonic = { workspace = true, features = ["tls-ring"] }

[dev-dependencies]
futures.workspace = true
kbf-proto.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net"] }

[lints]
workspace = true
