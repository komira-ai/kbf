[package]
name = "kbf-transfer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
bytes.workspace = true
futures.workspace = true
hex.workspace = true
kbf-proto.workspace = true
kbf-route.workspace = true
kbf-segments.workspace = true
kbf-storage.workspace = true
kbf-types.workspace = true
rustix = { workspace = true, features = ["fs"] }
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "rt", "sync", "time"] }
tonic.workspace = true
tracing.workspace = true

[dev-dependencies]
kbf-front.workspace = true
kbf-objstore.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread"] }
tracing-subscriber.workspace = true

[lints]
workspace = true

[package.metadata.buildrules]
# The farm lane's `//:ci` (docs/farm.md) checks the format of, builds and lints this package but
# does not run its tests: it holds tests the pull-request profile leaves out as slow
# (.config/nextest.toml, `[profile.pr]`), and `:test` runs a whole test target, which cannot leave
# one test out. They run in ci.yml alone.

[package.metadata.buildrules.actions]
ci = ["fmt", "lint"]
