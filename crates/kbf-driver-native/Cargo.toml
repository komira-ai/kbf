[package]
name = "kbf-driver-native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
futures.workspace = true
kbf-daemon.workspace = true
kbf-mac-session.workspace = true
kbf-outputs.workspace = true
kbf-proto.workspace = true
kbf-seatbelt.workspace = true
kbf-types.workspace = true
libc.workspace = true
# `hdiutil info -plist`, read by the clean and the assertion of a lease-user pool slot
# (src/slots/assertion.rs).
plist.workspace = true
prost.workspace = true
prost-types.workspace = true
rustix = { workspace = true, features = ["fs", "process"] }
# `simctl list devices -j`, read to find a lease's simulators (src/simulator.rs).
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "macros", "process", "rt", "sync", "time"] }
tracing.workspace = true

[dev-dependencies]
# What the tests run as actions and as fake Xcode tools: kbf-testkit's act verbs and
# its fake xcrun, xcodebuild and sandbox-exec, through links to the test binary.
kbf-testkit.workspace = true
tracing-subscriber.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }

# Metal, for the test that runs a compute kernel as a pool user under the slot profile
# (tests/slot_gpu.rs).
[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2.workspace = true
objc2-foundation = { workspace = true, features = ["NSError", "NSString"] }
objc2-metal = { workspace = true, features = [
    "block2",
    "MTLBuffer",
    "MTLCommandBuffer",
    "MTLCommandEncoder",
    "MTLCommandQueue",
    "MTLComputeCommandEncoder",
    "MTLComputePipeline",
    "MTLDevice",
    "MTLLibrary",
    "MTLResource",
    "MTLTypes",
] }

[lints]
workspace = true
