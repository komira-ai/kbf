[package]
name = "kbf-updater"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The optional package that rolls a new kbf version over the hosts of a farm, one host at a
# time, behind a local socket. This crate is the core: the API model, the host
# inventory, the roll state machine over ports (safe-to-stop, install, health, clock) and
# the durable roll record. On top of it: the API on a unix socket (`server`), the safe-to-stop
# adapter (an HTTP client of the frontend's loopback operator API) and the binary's wiring
# (`daemon`). Synchronous on purpose, threads and blocking sockets, no async runtime: HTTP is
# read with httparse, which the workspace already uses for its loopback calls.
#
# The agent mode (`agent`, docs/design/updates.md) is the other way round: an updater on every
# host that dials the coordinator over mutual TLS (rustls, the ring provider the workspace
# already builds, over a std socket), reads its own certificate for who it is (kbf-peer), and
# drives its host's A/B through `kbf-host-install`'s local socket. Its certificate is made once
# by `kbf-updater enroll` (a one-time token, `kbf-enroll`) and renewed by the agent.
[dependencies]
kbf-enroll.workspace = true
kbf-peer.workspace = true
kbf-proto.workspace = true
kbf-types.workspace = true
httparse.workspace = true
libc.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# The hook contract (`kbf update-hook`, `agent::hook`): the steps, the exit codes and the last line.
update-hook.workspace = true
# `kbf-updater enroll` and the renewal call `kbf-enroll`, which is async; each runs a
# current-thread runtime of its own, on a thread of its own. Nothing else here is async.
tokio = { workspace = true, features = ["net", "rt", "time"] }

[dev-dependencies]
base64.workspace = true
kbf-ca.workspace = true
rcgen.workspace = true
# The contract test feeds the real answer types of the forced command to the ssh installer.
kbf-host-install = { path = "../kbf-host-install" }
# The releases a helper lists in its query, cut as the helper cuts them (local_tests.rs).
kbf-retain.workspace = true
kbf-testkit.workspace = true

# `kbf update-hook` over a fake host kept in a directory, the program the conformance harness
# runs (tests/hook_conformance.rs). Not shipped: the release jobs package kbf-updater alone.
# Its code is the library's (`agent::hook::fake`), tested and measured with it; the binary only
# forwards to it (a file under a `tests` directory, or a binary with `test = false`, would be
# left out of the coverage).
[[bin]]
name = "kbf-updater-hook-fake"
path = "src/bin/kbf-updater-hook-fake.rs"

[lints]
workspace = true
