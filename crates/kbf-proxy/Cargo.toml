[package]
name = "kbf-proxy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The frontend host's front door (docs/design/frontend-proxy.md, docs/design/kbf-proxy-api.md):
# one TLS terminator that routes each HTTP/2 stream to the active child frontend over loopback.
# This skeleton holds the decisions that are plain values (routes, auth, identity headers,
# the per-slot permit, the hold gate, the replay buffer, the config); the I/O (accept loop,
# hyper, upstream pools) arrives in U4b-1 to U4b-3 with the dependencies it needs.
[dependencies]
hex.workspace = true
http.workspace = true
kbf-peer.workspace = true
serde.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
# `sync` only: the hold gate's doorbell is a `watch` channel, written from a guard's drop.
tokio = { workspace = true, features = ["sync"] }
toml.workspace = true

[dev-dependencies]
rcgen.workspace = true
serde_json.workspace = true

[lints]
workspace = true
