[package]
name = "kbf-proxy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The frontend host's front door (docs/design/frontend-proxy.md, docs/design/kbf-proxy-api.md):
# one TLS terminator that routes each HTTP/2 stream to the active child frontend over loopback.
# The downstream side is hyper's HTTP/2 server (plaintext until U4b-2 adds TLS); the upstream
# pool is built on h2's own client, because the child's advertised stream limit is on h2's
# types and not on hyper's.
[dependencies]
bytes.workspace = true
futures.workspace = true
h2.workspace = true
hex.workspace = true
http.workspace = true
http-body.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["http2", "server"] }
hyper-util = { workspace = true, features = ["http2", "server-graceful", "tokio"] }
kbf-peer.workspace = true
serde.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "rt-multi-thread", "sync", "time"] }
toml.workspace = true

[dev-dependencies]
rcgen.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "test-util"] }

# The model checker, under its own cfg (see the workspace lints and cargo xtask proxy-loom).
[target.'cfg(kbf_loom)'.dependencies]
loom.workspace = true

[lints]
workspace = true
