# The jobscheduler release kbf's real-service tests run against: the release, the commit and
# workflow it was built by, and for each archive a test fetches, its SHA-256 and the entry of its
# build attestation in the public transparency log (Rekor).
#
# `cargo xtask fetch-pinned-js --pin kbf-js-version.toml --program <program> --target <target>
# --gh <gh> --dir <dir>` (crates/xtask/src/js_pin.rs) reads this file, downloads
# `<program>-<version>-<target>.tar.gz` of the release, refuses it unless its SHA-256 is the one
# below, runs `gh attestation verify` on it (signed by `signer_workflow` in `repository`, built
# from `commit` on `source_ref`, on a GitHub-hosted runner) and refuses it unless one of the
# attestations that verify is the logged entry below, and only then unpacks `<program>` into
# `<dir>`. The tests (crates/kbf-integration-test/tests/js_real_service.rs,
# executor_real_service_integration.rs and cutover_real_service_integration.rs, through
# tests/js_real_support) hash the archive in `<dir>` against this file again before they start
# the program. Any mismatch, and a program or target with no row here, is a refusal. A pull
# request that moves the pin keeps them green.
#
# To move the pin to another release: set `version` and `commit` (the release's tag and the commit
# it names), hash each archive yourself (`sha256sum`, not only the release's SHA256SUMS), and take
# each `attestation_log_index` from `gh attestation verify <archive> --repo komira-ai/jobscheduler
# --format json` (`attestation.bundle.verificationMaterial.tlogEntries[].logIndex`).

[release]
repository = "komira-ai/jobscheduler"
version = "0.1.218"
commit = "0c104a1d3ecae641ed28bf9b46b0394daddc12a5"
signer_workflow = "komira-ai/jobscheduler/.github/workflows/artifacts.yml"
source_ref = "refs/heads/main"

# The job service the tests drive.
[[archive]]
program = "js-lease-server"
target = "x86_64-unknown-linux-musl"
sha256 = "3a3ee336d96cc3384f0692518f2f24a0cdf353249f9081a8ebf0f383ce24188c"
attestation_log_index = 3782503064

# The host agent, which the cases that run a job need
# (crates/kbf-integration-test/tests/executor_real_service_integration.rs).
[[archive]]
program = "js-agent"
target = "x86_64-unknown-linux-musl"
sha256 = "46fa7b9462f9e4b0d41f25e739bc7e33bd8bb2e7258f70cf9a05e8c00e20b482"
attestation_log_index = 3782503064
