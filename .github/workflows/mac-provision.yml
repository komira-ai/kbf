# Temporary (reverted in the next commit): the as_root tests of kbf-mac-provision on macos-26.
name: mac-provision

on:
  pull_request:
    paths:
      - crates/kbf-mac-provision/**
      - .github/workflows/mac-provision.yml
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - crates/kbf-mac-provision/**

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  as-root:
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: sw_vers
      - run: ssh -V
      - run: cargo xtask sudo-test -p kbf-mac-provision --test as_root -- --test-threads=1 --nocapture
