# Temporary probe (reverted in the next commit): what sshd -T prints on the macos-26 image.
name: mac-provision

on:
  pull_request:
    paths:
      - crates/kbf-mac-provision/**
      - .github/workflows/mac-provision.yml
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - crates/kbf-mac-provision/**

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - run: sw_vers
      - run: ssh -V
      - run: ls -la /etc/ssh /etc/ssh/sshd_config.d /usr/sbin/sshd /usr/libexec/sshd-session /usr/libexec/sshd-auth
        continue-on-error: true
      - run: cat /etc/ssh/sshd_config
      - run: sudo cat /etc/ssh/sshd_config.d/*
        continue-on-error: true
      - run: file /usr/sbin/sshd
      - run: sudo /usr/sbin/sshd -T > out.txt 2> err.txt; echo "exit $?"; wc -c out.txt err.txt; head -c 4000 out.txt; echo ---; cat err.txt
      - run: sudo env -i LC_ALL=C /usr/sbin/sshd -T > out2.txt 2> err2.txt; echo "exit $?"; wc -c out2.txt err2.txt; grep -iE "passwordauth|kbdinter|permitroot" out2.txt; echo ---; cat err2.txt
      - run: sudo env -i LC_ALL=C /usr/sbin/sshd -T -C user=root,host=localhost,addr=127.0.0.1 > out3.txt 2> err3.txt; echo "exit $?"; wc -c out3.txt err3.txt; grep -iE "passwordauth|kbdinter|permitroot" out3.txt; echo ---; cat err3.txt
      - run: sudo env -i LC_ALL=C /usr/sbin/sshd -d -T > out4.txt 2> err4.txt; echo "exit $?"; wc -c out4.txt; head -c 3000 err4.txt
      - run: sudo launchctl print system/com.openssh.sshd
        continue-on-error: true
