# CI for pull requests, the merge queue and main. GitHub-hosted runners only; the repository lints in
# crates/kbf-it/tests/repo_lints.rs hold every workflow to that, to commit-SHA pinned
# actions from the set the repository's Actions policy allows (actions/* and
# tailscale/github-action), and to a top-level `permissions: {}`.
#
# The Cargo cache (registry, git checkouts and target) is keyed on the runner, the job,
# Cargo.lock and rust-toolchain.toml. Every job restores it; only a push to main saves
# it, and only when the exact key missed, so a pull request never writes the cache.
name: ci

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Incremental artifacts only bloat a cached target directory (rust-cache set this too).
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  lints:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge commit and its first parent, the base branch (budget-diff).
          fetch-depth: 2
      - run: rustup toolchain install
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      # The interpreter budget only shrinks: a pull request may not add a row to it
      # (crates/xtask/src/budget.rs). A pull request is checked out as the merge commit,
      # so HEAD^1 is the base branch it merges into.
      - if: github.event_name == 'pull_request'
        run: cargo xtask budget-diff --base HEAD^1
      - run: cargo test -p kbf-it --locked --test repo_lints
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # Licences, advisories, bans and sources, as deny.toml configures them. cargo-deny is
  # the release binary, checked against its SHA-256 before use.
  deny:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DENY_VERSION: 0.20.2
      DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - name: Install cargo-deny (pinned version and checksum)
        run: cargo xtask fetch --url "https://github.com/EmbarkStudios/cargo-deny/releases/download/$DENY_VERSION/cargo-deny-$DENY_VERSION-x86_64-unknown-linux-musl.tar.gz" --sha256 "$DENY_SHA256" --out "$HOME/.cargo/bin/cargo-deny" --extract tar.gz --member "cargo-deny-$DENY_VERSION-x86_64-unknown-linux-musl/cargo-deny"
      - run: cargo deny --version
      # The arguments cargo-deny-action passed by default.
      - run: cargo deny --log-level warn --manifest-path ./Cargo.toml --all-features check

  test-x86:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # The Envoy release the envoy kit's image runs (templates/envoy/config.example),
    # for Envoy's own validation of the kit's render. The sha256 is the release's
    # checksums.txt.asc entry.
    env:
      ENVOY_VERSION: 1.39.3
      ENVOY_SHA256: f61653fb5f7645129d3092a82f21ce3e6f70d0a75fe2e861b0e7417790f2c200
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      - run: cargo test --workspace --locked
      # kbf-guest started as root through sudo must refuse (crates/kbf-guest/tests/as_root.rs).
      - run: cargo xtask sudo-test -p kbf-guest --test as_root
      # kbf-server's --version names this commit, and the CI-only override stamps two
      # other commits from the same checkout (crates/kbf-server/build.rs,
      # crates/xtask/src/build_commit.rs).
      - run: cargo xtask build-commit stamps "$GITHUB_SHA"
      - name: Fetch Envoy (pinned release, checked by SHA-256)
        run: cargo xtask fetch --url "https://github.com/envoyproxy/envoy/releases/download/v$ENVOY_VERSION/envoy-$ENVOY_VERSION-linux-x86_64" --sha256 "$ENVOY_SHA256" --out "$RUNNER_TEMP/tools/envoy"
      # Envoy accepts the envoy kit's render and refuses a control with an unknown
      # field (crates/kbf-deploy/tests/envoy_validate.rs).
      - name: Envoy validates the envoy kit's render
        run: cargo test -p kbf-deploy --test envoy_validate --locked -- --ignored
        env:
          KBF_TEST_ENVOY: ${{ runner.temp }}/tools/envoy
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # The ObjectStore conformance suite against real S3 stores in service containers, each
  # pinned by digest: MinIO (the bridge store) and RustFS (its replacement). Each store
  # runs the suite twice: a plain bucket, and a bucket with Object Lock. The key pair is
  # a throwaway for these containers, which live only for this job.
  objstore-s3:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      minio:
        # Chainguard's build of upstream MinIO: minio/minio is gone from Docker Hub and
        # quay.io/minio/minio no longer serves anonymous pulls. Pinned to the digest of
        # its `latest` image index.
        image: cgr.dev/chainguard/minio@sha256:e7ca559d9f7c0b5f24f5f669bb92f40f3ca88d56273b808bf3a7c116c17d2ffa
        command: server /data
        env:
          MINIO_ROOT_USER: kbf-ci-access
          MINIO_ROOT_PASSWORD: kbf-ci-throwaway
        ports:
          - 9000:9000
      rustfs:
        # rustfs/rustfs:1.0.1, image index digest.
        image: rustfs/rustfs@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
        env:
          RUSTFS_ACCESS_KEY: kbf-ci-access
          RUSTFS_SECRET_KEY: kbf-ci-throwaway
        ports:
          - 9100:9000
    env:
      AWS_ACCESS_KEY_ID: kbf-ci-access
      AWS_SECRET_ACCESS_KEY: kbf-ci-throwaway
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      - run: cargo build -p kbf-objstore --example s3_conformance --locked
      - name: MinIO, plain bucket
        run: cargo run -p kbf-objstore --example s3_conformance --locked -- --endpoint http://127.0.0.1:9000 --bucket kbf-conformance --create-bucket --conditional-put --wait-ready 60
      - name: MinIO, Object Lock bucket
        run: cargo run -p kbf-objstore --example s3_conformance --locked -- --endpoint http://127.0.0.1:9000 --bucket kbf-conformance-lock --create-bucket --conditional-put --object-lock
      - name: RustFS, plain bucket
        if: ${{ !cancelled() }}
        run: cargo run -p kbf-objstore --example s3_conformance --locked -- --endpoint http://127.0.0.1:9100 --bucket kbf-conformance --create-bucket --conditional-put --wait-ready 60
      - name: RustFS, Object Lock bucket
        if: ${{ !cancelled() }}
        run: cargo run -p kbf-objstore --example s3_conformance --locked -- --endpoint http://127.0.0.1:9100 --bucket kbf-conformance-lock --create-bucket --conditional-put --object-lock
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # Line and branch coverage per crate, and the ratchet in `coverage-baseline`
  # (crates/kbf-coverage). Branch coverage (`--branch`, rustc's
  # `-Zcoverage-options=branch`) is unstable, so this job alone builds with a pinned
  # nightly; every other job stays on the toolchain in rust-toolchain.toml. The nightly
  # may warn where stable does not, so `-D warnings` is off here (clippy enforces it).
  # cargo-llvm-cov is the release binary, checked against its SHA-256 before use.
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RUSTFLAGS: ""
      COVERAGE_TOOLCHAIN: nightly-2026-10-01
      LLVM_COV_VERSION: 0.9.1
      LLVM_COV_SHA256: b3f68e625481fed9b16444174f3fa5ebcdbde4a1878803a35eabe2dcefcdc41a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$COVERAGE_TOOLCHAIN" --profile minimal --component llvm-tools-preview
      # xtask builds with the coverage nightly, the one toolchain this job installs.
      - name: Install cargo-llvm-cov (pinned version and checksum)
        run: cargo "+$COVERAGE_TOOLCHAIN" xtask fetch --url "https://github.com/taiki-e/cargo-llvm-cov/releases/download/v$LLVM_COV_VERSION/cargo-llvm-cov-x86_64-unknown-linux-gnu.tar.gz" --sha256 "$LLVM_COV_SHA256" --out "$HOME/.cargo/bin/cargo-llvm-cov" --extract tar.gz --member cargo-llvm-cov
      - run: cargo "+$COVERAGE_TOOLCHAIN" llvm-cov --version
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      # `-skip-functions` leaves the per-function records (FN, FNDA) out of the lcov
      # export. With branch coverage on, llvm-cov's lcov exporter segfaults while
      # writing them for kbf-front's async service methods (LLVM 23.1 in this nightly;
      # it looks like LLVM issue 220574). Lines and branches, all the ratchet reads, are
      # unaffected: their totals match llvm-cov's own text report.
      - run: mkdir -p target/coverage
      - name: Run the workspace tests under coverage
        env:
          LLVM_COV_FLAGS: -skip-functions
        run: cargo "+$COVERAGE_TOOLCHAIN" llvm-cov --workspace --locked --branch --lcov --output-path target/coverage/lcov.info
      - name: Per-crate table and ratchet
        run: cargo "+$COVERAGE_TOOLCHAIN" run -p kbf-coverage --locked -- --lcov target/coverage/lcov.info --root "$GITHUB_WORKSPACE" --baseline coverage-baseline --write-baseline target/coverage/coverage-baseline.measured --summary-file "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: |
            target/coverage/lcov.info
            target/coverage/coverage-baseline.measured
          if-no-files-found: error
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # A second job rather than a matrix: the workflow lint requires a literal hosted label
  # in runs-on, so the runner a job lands on is readable from this file alone.
  test-arm:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      - run: cargo test --workspace --locked
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # The native driver on a real Mac (Apple silicon). The process-tree kill, memory
  # kill, output, cleanup and network tests run against libproc and sandbox-exec
  # here (the Linux jobs run the same tests against /proc, where the network is not
  # enforced); the daemon binary is built and started with each driver, which
  # detects the node through sysctl.
  native-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      - run: sw_vers
      - run: uname -m
      - run: sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize
      - run: cargo build -p kbf-node --bin kbf-daemon --locked
      - run: cargo test -p kbf-outputs -p kbf-driver-native -p kbf-node -p kbf-testkit --locked
      # A lease's own simulator, made, booted and deleted for real under the actions'
      # sandbox; one a killed daemon left deleted at the next start; and xcodebuild
      # finding a device of the default set but not one of another set
      # (crates/kbf-driver-native/tests/lease/simulator.rs).
      - run: cargo test -p kbf-driver-native --test lease --locked -- --ignored --nocapture simulator::real
      # The daemon's unit tests, which read its suspend-counting clock on macOS
      # (CLOCK_MONOTONIC_RAW), the fence across a suspend (issue #78), and a keeper
      # started after the binary was renamed over, which macOS finds by its path.
      - run: cargo test -p kbf-daemon --lib --test suspend --test keeper --locked
      # The root helper for per-lease users: its unit tests, then the helper itself run
      # as root (passwordless sudo) with real users, launchd, libproc, the sweep, the
      # leak scan and the caller check by code signature, signed as `cargo xtask
      # sign-darwin` signs it (crates/kbf-mac-session/tests/as_root.rs;
      # docs/design/fleet-updates-security.md S4.2, S4.3, S10).
      - run: cargo test -p kbf-mac-session --locked
      - run: cargo xtask sudo-test -p kbf-mac-session --test as_root -- --test-threads=1 --nocapture
      # The native driver's lease-user pool as root, with throwaway users from uid 690:
      # actions as pool users through `launchctl asuser`, the kill by uid, the keeper's,
      # parallel leases (crates/kbf-driver-native/tests/slots.rs); then the clean of a
      # slot between two leases, its deadline, the user made again and the quarantine
      # (tests/slot_clean.rs). One test at a time: they make users at free uids.
      - run: cargo xtask sudo-test -p kbf-driver-native --test slots -- --test-threads=1 --nocapture
      - run: cargo xtask sudo-test -p kbf-driver-native --test slot_clean -- --test-threads=1 --nocapture
      # The per-binary entitlement allow list (tools/ci/darwin-entitlements.txt): the
      # kbf-vmm stub signed by `cargo xtask sign-darwin` with the virtualization
      # entitlement, kbf-daemon with none, both accepted by `darwin-asset`, and every
      # wrong signature refused (crates/kbf-vmm/tests/signing.rs;
      # docs/design/macos-vm-guests.md section 7).
      - run: cargo test -p kbf-vmm --test signing --locked -- --ignored
      # The guest agent's tests, then the agent under launchd: Aqua from a LaunchAgent
      # in this runner's GUI session, System from a LaunchDaemon (the control), and
      # its refusal to run as root (crates/kbf-guest/tests/as_root.rs).
      - run: cargo test -p kbf-guest --locked
      - run: cargo xtask sudo-test -p kbf-guest --test as_root
      # kbf-mac-provision on this VM, as root, running the daemon built above: what a
      # hosted VM can prove (the script's header lists what it applies, asserts and
      # only reads). Last, because it changes this runner's settings.
      - run: sudo sh tools/mac-provision/test/hosted-macos.sh target/debug/kbf-daemon
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # kbf-mac-provision (tools/mac-provision) against a fake Mac: shellcheck, the test
  # suite under dash, its line and branch coverage (100%, from bash's trace), and the
  # planted mutants, each of which must turn its tests red. native-macos runs the same
  # script on a real macOS VM.
  mac-provision:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: shellcheck --version
      - run: shellcheck -S warning -s sh tools/mac-provision/kbf-mac-provision tools/mac-provision/test/fakecmd tools/mac-provision/test/*.sh
      - run: sh tools/mac-provision/test/run.sh
      - run: sh tools/mac-provision/test/coverage.sh
      - run: sh tools/mac-provision/test/mutants.sh

  # The container driver against real rootless Podman, each test binary inside a
  # Delegate=yes system unit (crates/xtask/src/podman_tests.rs; the T4 spike found both
  # arches carry it). The same tests show as ignored, with their reason, in the plain
  # test jobs above.
  podman-x86:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      - run: cargo xtask podman-tests
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # The M2 test: pinned buck2 builds the sample project in crates/kbf-it/m2 remote-only
  # through kbf-server to kbf-daemon --driver container, every action in a rootless
  # Podman container of distroless base-debian12 pinned by its amd64 manifest digest
  # (crates/kbf-it/m2/run.sh says what is checked). x86_64 only: the image digest is
  # the amd64 one.
  m2-container:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      BUCK2_VERSION: 2026-10-01
      BUCK2_SHA256: 828aba01bf80e8ba50ed27d89be86efe0246b3807c3d040e1ea7b4810a55fb78
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      - run: cargo build -p kbf-server -p kbf-node -p kbf-it --bin kbf-server --bin kbf-daemon --bin kbf-cell --locked
      # The image's glibc is Debian 12's, older than the runner's, so the helper every
      # action runs is linked statically (run.sh refuses a dynamic one).
      - run: cargo rustc -p kbf-it --bin kbf-m2-act --locked -- -C target-feature=+crt-static
      - name: Fetch buck2 (pinned version, checked by SHA-256)
        run: cargo xtask fetch --url "https://github.com/facebook/buck2/releases/download/$BUCK2_VERSION/buck2-x86_64-unknown-linux-gnu.zst" --sha256 "$BUCK2_SHA256" --out "$RUNNER_TEMP/tools/buck2" --extract zst
      - run: bash tools/ci/m2-container.sh "$RUNNER_TEMP/tools/buck2" "$RUNNER_TEMP/m2"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: m2-container-logs
          path: ${{ runner.temp }}/m2/logs
          if-no-files-found: warn
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  podman-arm:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      - run: cargo xtask podman-tests
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
