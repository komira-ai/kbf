# The pull-request gate: two jobs, `lint` and `test`. GitHub-hosted runners only; the repository
# lints in crates/kbf-integration-test/tests/repo_lints.rs hold every workflow to that, to commit-SHA pinned
# actions from the set the repository's Actions policy allows (actions/* and
# tailscale/github-action), and to a top-level `permissions: {}`.
#
# A pull request runs only this. The rest of the suite (the slow tests, the Arm run, the
# jobs that need a service, root, crun or a Mac, the packages and the beta smoke) runs on a
# push to main, in beta.yml. This workflow runs on those pushes too, so
# the merged result meets the same gate and the Cargo cache below is saved.
#
# The Cargo cache (registry, git checkouts and target) is keyed on the runner, the job,
# Cargo.lock and rust-toolchain.toml. Every job restores it; only a push saves it, and only
# when the exact key missed, so a pull request never writes the cache.
name: ci

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Incremental artifacts only bloat a cached target directory (rust-cache set this too).
  CARGO_INCREMENTAL: 0

jobs:
  # Format, clippy, the repository lints and cargo-deny, one after another on one Cargo
  # cache. Each step runs after a failed one, so a run reports every failure at once.
  # cargo-deny is the release binary, checked against its SHA-256 before use: licences,
  # advisories, bans and sources, as deny.toml configures them.
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DENY_VERSION: 0.20.2
      DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge commit and its first parent, the base branch (budget-diff).
          fetch-depth: 2
      - run: rustup toolchain install
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      - run: cargo fmt --all --check
      - name: Install cargo-deny (pinned version and checksum)
        if: ${{ !cancelled() }}
        run: cargo xtask fetch --url "https://github.com/EmbarkStudios/cargo-deny/releases/download/$DENY_VERSION/cargo-deny-$DENY_VERSION-x86_64-unknown-linux-musl.tar.gz" --sha256 "$DENY_SHA256" --out "$HOME/.cargo/bin/cargo-deny" --extract tar.gz --member "cargo-deny-$DENY_VERSION-x86_64-unknown-linux-musl/cargo-deny"
      - run: cargo deny --version
        if: ${{ !cancelled() }}
      # The arguments cargo-deny-action passed by default.
      - run: cargo deny --log-level warn --manifest-path ./Cargo.toml --all-features check
        if: ${{ !cancelled() }}
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
        if: ${{ !cancelled() }}
      # The interpreter budget only shrinks: a pull request may not add a row to it
      # (crates/xtask/src/budget.rs). A pull request is checked out as the merge commit,
      # so HEAD^1 is the base branch it merges into.
      - if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: cargo xtask budget-diff --base HEAD^1
      # The release workflow's on-main check, asked of GitHub both ways: this pull
      # request's base commit is on main and its merge commit is not, so a check that
      # accepts every commit, or none, fails here (crates/xtask/src/release.rs).
      - if: ${{ !cancelled() && github.event_name == 'pull_request' && github.base_ref == 'main' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: cargo xtask release main-control --repo "$GITHUB_REPOSITORY" --on-main "$BASE_SHA" --off-main "$GITHUB_SHA"
      - run: cargo test -p kbf-integration-test --locked --test repo_lints
        if: ${{ !cancelled() }}
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ github.event_name == 'push' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # The fast tests and their coverage: the `pr` profile of .config/nextest.toml (every test
  # but the slow ones, which beta.yml runs) under cargo-llvm-cov, then the gate in
  # `coverage-floors` (crates/kbf-coverage): every crate must reach 99.00% of lines and
  # 99.00% of branches, or the floor its line in that file lists for it (the crates under
  # 99% today, each with an open issue). A floor may only rise: the last step fails a pull
  # request whose file lowers one. The gate is measured on the fast set plus the Postgres
  # tests (a throwaway server, below): no S3, crun, root or Mac test is in it.
  # Branch coverage (`--branch`, rustc's `-Zcoverage-options=branch`) is unstable, so this
  # job alone builds with a pinned nightly; every other job stays on the toolchain in
  # rust-toolchain.toml. The nightly may warn where stable does not, so `-D warnings` is off
  # here (clippy, in the lint job, enforces it). cargo-llvm-cov is the release binary,
  # checked against its SHA-256 before use.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # The same throwaway server as beta.yml's state-postgres job, so the Postgres tests count.
    services:
      postgres:
        image: postgres@sha256:2a0d0fe14825b0939f78a8cad5cd4e6aa68bf94d0e5dd96e24b6d23af4315545
        env:
          POSTGRES_PASSWORD: kbf-ci-throwaway
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      KBF_TEST_POSTGRES_URL: postgres://postgres:kbf-ci-throwaway@127.0.0.1:5432/postgres
      RUSTFLAGS: ""
      COVERAGE_TOOLCHAIN: nightly-2026-10-01
      LLVM_COV_VERSION: 0.9.1
      LLVM_COV_SHA256: b3f68e625481fed9b16444174f3fa5ebcdbde4a1878803a35eabe2dcefcdc41a
      # `cargo llvm-cov nextest` runs the tests with cargo-nextest, one process per test.
      NEXTEST_VERSION: 0.9.146
      NEXTEST_SHA256: 682c21b777c333e96fd532e114d3a5a894e0729ab88d94c0a9f20f8419695428
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge commit and its first parent, the base branch (no-lowering --base-ref).
          fetch-depth: 2
      # The restored target/, the instrumented workspace build and its profiles outgrew a
      # hosted runner's free disk (runs died with "No space left on device", or the runner
      # was lost mid-test). Remove toolchains the image preinstalls that this job never
      # uses; the Postgres service container's image is not touched.
      - name: Free disk before (report)
        run: df -h /
      - name: Remove preinstalled toolchains this job does not use
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
      - name: Free disk after (report)
        run: df -h /
      - run: rustup toolchain install "$COVERAGE_TOOLCHAIN" --profile minimal --component llvm-tools-preview
      # xtask builds with the coverage nightly, the one toolchain this job installs.
      - name: Install cargo-llvm-cov (pinned version and checksum)
        run: cargo "+$COVERAGE_TOOLCHAIN" xtask fetch --url "https://github.com/taiki-e/cargo-llvm-cov/releases/download/v$LLVM_COV_VERSION/cargo-llvm-cov-x86_64-unknown-linux-gnu.tar.gz" --sha256 "$LLVM_COV_SHA256" --out "$HOME/.cargo/bin/cargo-llvm-cov" --extract tar.gz --member cargo-llvm-cov
      - run: cargo "+$COVERAGE_TOOLCHAIN" llvm-cov --version
      - name: Install cargo-nextest (pinned version and checksum)
        run: cargo "+$COVERAGE_TOOLCHAIN" xtask fetch --url "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-$NEXTEST_VERSION/cargo-nextest-$NEXTEST_VERSION-x86_64-unknown-linux-gnu.tar.gz" --sha256 "$NEXTEST_SHA256" --out "$HOME/.cargo/bin/cargo-nextest" --extract tar.gz --member cargo-nextest
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      # The cache holds target/, and a push run left the WORKSPACE's instrumented test binaries
      # and coverage profiles in target/llvm-cov-target. `llvm-cov report` reads every
      # instrumented binary and profile there, so a run that restored them merged a binary built
      # from older sources (its old lines, now blank or doc lines, reported as missed) or failed
      # ('profile file is not compatible'). `llvm-cov clean --workspace` removes the workspace's
      # own artifacts and profiles and keeps the dependencies' builds, which are what the cache
      # is for.
      - name: Drop the workspace's coverage artifacts the cache restored
        run: cargo "+$COVERAGE_TOOLCHAIN" llvm-cov clean --workspace
      # nextest runs a process per test, so a test's line coverage must not rest on another
      # test of the process: a `tracing` macro evaluates its fields only when a subscriber is
      # registered, so a test that runs one installs its own (`tracing::subscriber::set_default`
      # or `with_default`). Equal numbers to `cargo test` depend on it.
      # `-skip-functions` leaves the per-function records (FN, FNDA) out of the lcov
      # export. With branch coverage on, llvm-cov's lcov exporter segfaults while
      # writing them for kbf-front's async service methods (LLVM 23.1 in this nightly;
      # it looks like LLVM issue 220574). Lines and branches, all the gate reads, are
      # unaffected: their totals match llvm-cov's own text report.
      - run: mkdir -p target/coverage
      - name: Run the fast tests under coverage
        env:
          LLVM_COV_FLAGS: -skip-functions
        run: cargo "+$COVERAGE_TOOLCHAIN" llvm-cov nextest --workspace --locked --branch --no-report --no-fail-fast --profile pr
      # The tests that need the server, as beta.yml's state-postgres job runs them (they are
      # `#[ignore]`d, so the run above skips them); their counters join the run's in the
      # report below. The kbf-state step builds with its `postgres` feature; the steps after
      # it select tests of the workspace build by filter, not by `-p ... --test`: a build of
      # one package leaves out the dev-dependency features of the others, so it would build
      # kbf-installer again without `test-sandbox` and put a copy of its code in the report
      # that no test runs. They run the `#[ignore]`d tests only (`--run-ignored only`): the
      # others ran above, and some (the installer's database:: ones) write files in a scratch
      # directory another test of the full run creates.
      - name: Run the Postgres tests of kbf-state under coverage
        env:
          LLVM_COV_FLAGS: -skip-functions
        run: cargo "+$COVERAGE_TOOLCHAIN" llvm-cov --locked --branch --no-report -p kbf-state --features postgres -- --include-ignored
      - name: Run the installer's Postgres tests under coverage
        env:
          LLVM_COV_FLAGS: -skip-functions
        run: cargo "+$COVERAGE_TOOLCHAIN" llvm-cov nextest --workspace --locked --branch --no-report --no-fail-fast --run-ignored only -E 'package(kbf-installer) & (test(database::) or test(setup_creates_the_schema))'
      - name: Run the server's Postgres tests under coverage
        env:
          LLVM_COV_FLAGS: -skip-functions
        run: cargo "+$COVERAGE_TOOLCHAIN" llvm-cov nextest --workspace --locked --branch --no-report --no-fail-fast --run-ignored only -E 'package(kbf-server) & binary(state_store_postgres)'
      - name: Run the server's restart tests over Postgres under coverage
        env:
          LLVM_COV_FLAGS: -skip-functions
        run: cargo "+$COVERAGE_TOOLCHAIN" llvm-cov nextest --workspace --locked --branch --no-report --no-fail-fast --run-ignored only -E 'package(kbf-server) & binary(state_store) & test(over_postgres)'
      - name: Run the two-children swap over Postgres under coverage
        env:
          LLVM_COV_FLAGS: -skip-functions
        run: cargo "+$COVERAGE_TOOLCHAIN" llvm-cov nextest --workspace --locked --branch --no-report --no-fail-fast --run-ignored only -E 'package(kbf-server) & binary(frontend) & test(two_children::fifty_builds_across_a_takeover_over_postgres)'
      - name: Run the frontend process test over Postgres under coverage
        env:
          LLVM_COV_FLAGS: -skip-functions
        run: cargo "+$COVERAGE_TOOLCHAIN" llvm-cov nextest --workspace --locked --branch --no-report --no-fail-fast --run-ignored only -E 'package(kbf-cli) & binary(frontend_process) & test(postgres_state_store)'
      - name: Report
        env:
          LLVM_COV_FLAGS: -skip-functions
        run: cargo "+$COVERAGE_TOOLCHAIN" llvm-cov report --branch --lcov --output-path target/coverage/lcov.info
      # Fails when a crate is under its threshold; floors that could rise are printed in
      # the log and the job summary (`kbf-coverage raise` lifts them) and do not fail.
      - name: Per-crate table and 99% gate
        run: cargo "+$COVERAGE_TOOLCHAIN" run -p kbf-coverage --locked -- --lcov target/coverage/lcov.info --root "$GITHUB_WORKSPACE" --floors coverage-floors --summary-file "$GITHUB_STEP_SUMMARY"
      # The base's floors file, checked out beside this one; a base without one (the change
      # that adds the file) has nothing to compare, and the step says so.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          sparse-checkout: coverage-floors
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Floors are not lower than the base's
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: cargo "+$COVERAGE_TOOLCHAIN" run -p kbf-coverage --locked -- no-lowering --allow-missing-base --base-ref HEAD^1 --base base/coverage-floors --floors coverage-floors
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: target/coverage/lcov.info
          if-no-files-found: error
      # and the cache it saves holds none of this run's workspace coverage artifacts either
      - if: ${{ github.event_name == 'push' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        run: cargo "+$COVERAGE_TOOLCHAIN" llvm-cov clean --workspace
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ github.event_name == 'push' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
