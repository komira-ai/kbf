# Gamma: our own build farm, deployed from a release that was cut.
#
# The `release` workflow cuts a release on a push to main (gates, plan, verify, tag, publish).
# When that run completes, this file follows it. A `workflow_run` runs the default branch's
# copy of this file with this repository's token and the environment's credentials, so it checks
# out no ref of the run and gives a script nothing of the run's text: the commit and the run
# arrive through `env:`, and `cargo xtask` checks them.
#
# `offer` has read scopes, no credentials and no environment. `cargo xtask gamma evidence`
# asks GitHub whether that run was a push to main whose publish job succeeded; a push that cut
# nothing (docs only) leaves the run green and this file with nothing to do. Then `cargo xtask
# release stage-offer` downloads the release, verifies every attestation before it runs
# anything of it, makes the offer for gamma (the fixed waiver of beta, never for prod) and
# writes `offer.json` and the release's files into one tar, which is uploaded for three days.
#
# `deploy` is the one job that reaches the farm: the Tailscale identity of its tag may ssh to
# the one gamma host as the one deploy account, which sudo lets run the one command of
# `cargo xtask gamma sudoers-line` and nothing else. `cargo xtask gamma deploy` refuses unless
# the commit is the highest release tag, sends the tar on standard input and keeps the
# installer's summary out of the log and the artifact: the table and the uploaded file are the
# redacted one. The tar is bytes, not trust: the host verifies the attestations itself.
#
# `check` follows a deploy that succeeded and builds komira's main against the farm just
# updated, with the farm's normal caching: it passes only on BUILD SUCCEEDED with `local: 0`,
# and the job summary shows buck2's Commands line and the verdict. The repository variable
# GAMMA_CHECK_TARGETS names the targets; the farm's buckconfig is a secret of the environment.
#
# Inert until configured: with any of the repository variables GAMMA_HOST, GAMMA_USER and
# TS_TAG unset, `deploy` is skipped, which is a green run, and `check` with it. Deleting one is
# the stop switch.
# The OAuth client is the only credential, a secret of the `gamma` environment, which allows
# deployments from main only, and it reaches one step, after `cargo xtask` is built. No
# host or user is written in this file (they are repository variables, and public once a step
# has them). Re-running the jobs replaces the uploaded files. The workflow lint
# (crates/kbf-integration-test/tests/workflows/workflow_run.rs) holds this file to all of that.
name: gamma

on:
  workflow_run:
    workflows: [release]
    types: [completed]
    branches: [main]

permissions: {}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

defaults:
  run:
    shell: bash

jobs:
  offer:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      attestations: read
      contents: read
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
      RUN_ID: ${{ github.event.workflow_run.id }}
    outputs:
      staged: ${{ steps.stage.outputs.staged }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      # Built before any step holds the token, so no build script runs beside it.
      - run: cargo build -p xtask --locked
      - name: The release run was a push to main whose publish job succeeded
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask gamma evidence --repo "$GITHUB_REPOSITORY" --sha "$SHA" --run-id "$RUN_ID" --output "$GITHUB_OUTPUT"
      - name: Verify the release, make the offer for gamma and stage the tar
        id: stage
        if: ${{ steps.evidence.outputs.released == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask release stage-offer --repo "$GITHUB_REPOSITORY" --sha "$SHA" --out "$RUNNER_TEMP/offer" --output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ steps.stage.outputs.staged == 'true' }}
        with:
          name: gamma-offer
          path: ${{ runner.temp }}/offer
          retention-days: 3
          if-no-files-found: error
          overwrite: true

  deploy:
    needs: [offer]
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository && needs.offer.outputs.staged == 'true' && vars.GAMMA_HOST != '' && vars.GAMMA_USER != '' && vars.TS_TAG != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    # One deploy at a time. The group is the job's, not the workflow's: GitHub cancels a
    # pending run when a newer one queues, and a run whose `deploy` is skipped (a push that cut
    # nothing) must not cancel a pending release. A newer deploy queues behind a running one,
    # which is never cancelled mid-roll; a queued deploy of a commit that is no longer the
    # highest release is refused before anything reaches the farm. GitHub keeps one pending
    # deploy per group, so a newer release replaces an older pending one, which Rule S would
    # have refused anyway.
    concurrency:
      group: gamma
      cancel-in-progress: false
    environment: gamma
    permissions:
      contents: read
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      # Built before the step that holds the OAuth client, so no build script runs beside it.
      - run: cargo build -p xtask --locked
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gamma-offer
          path: ${{ runner.temp }}/offer
      - uses: tailscale/github-action@a392da0a182bba0e9613b6243ebd69529b1878aa # v4.1.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: ${{ vars.TS_TAG }}
          use-cache: true
      # GitHub prints a variable in the log of a step whose environment has it, and this
      # repository's logs are public: the host and the user are public names (use a short
      # tailnet name, never an address), and only this step has them. `gamma deploy` masks them
      # in what it prints after, and shows nothing of what `tailscale ssh` writes to stderr.
      - name: Deploy on the gamma host
        env:
          GH_TOKEN: ${{ github.token }}
          GAMMA_HOST: ${{ vars.GAMMA_HOST }}
          GAMMA_USER: ${{ vars.GAMMA_USER }}
        run: cargo xtask gamma deploy --repo "$GITHUB_REPOSITORY" --sha "$SHA" --host "$GAMMA_HOST" --user "$GAMMA_USER" --bundle "$RUNNER_TEMP/offer/bundle.tar" --raw "$RUNNER_TEMP/raw.json" --summary summary.json
      - name: Table of the nodes by platform and state
        if: ${{ always() }}
        run: cargo xtask gamma summary --file summary.json --output "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: gamma-summary
          path: summary.json
          if-no-files-found: warn
          retention-days: 30
          overwrite: true

  # After a deploy that succeeded, build komira's main against the farm that was just updated,
  # with the farm's normal caching, and pass only on BUILD SUCCEEDED with `local: 0` in buck2's
  # Commands line (nothing ran on this runner). The job is skipped, which is green, whenever
  # `deploy` is: the stop switch is the same. It joins the tailnet as `deploy` does and queues in
  # the same group, so it never runs during a roll; a newer release replaces a check that is
  # still pending, and that release has its own.
  #
  # komira's text runs in one step only, inside `cargo xtask gamma check-build`, after the
  # build of `cargo xtask`: no other step of this job runs a script of the checkout. That step
  # holds the farm's buckconfig, a secret of the `gamma` environment and not a variable
  # because it names the farm and the logs are public. `check-build` prints the Commands line
  # and the verdict and nothing else of what buck2 wrote, and refuses any flag in the targets.
  check:
    needs: [offer, deploy]
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository && needs.offer.outputs.staged == 'true' && vars.GAMMA_HOST != '' && vars.GAMMA_USER != '' && vars.TS_TAG != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    concurrency:
      group: gamma
      cancel-in-progress: false
    environment: gamma
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      # Built before komira's text is in the workspace.
      - run: cargo build -p xtask --locked
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: komira-ai/komira
          ref: main
          path: komira-main
          persist-credentials: false
      - uses: tailscale/github-action@a392da0a182bba0e9613b6243ebd69529b1878aa # v4.1.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: ${{ vars.TS_TAG }}
          use-cache: true
      - name: Build komira main on the farm
        env:
          TARGETS: ${{ vars.GAMMA_CHECK_TARGETS }}
          GAMMA_FARM_BUCKCONFIG: ${{ secrets.GAMMA_FARM_BUCKCONFIG }}
        run: cargo xtask gamma check-build --komira-dir komira-main --targets "$TARGETS" --buckconfig-file "$RUNNER_TEMP/farm.buckconfig" --log "$RUNNER_TEMP/check-build.log" --summary "$GITHUB_STEP_SUMMARY"
