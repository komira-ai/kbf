# The real-`crun` container driver tests (beta.yml's crun-x86 job: `cargo xtask crun-tests`)
# on a branch, before it merges. beta.yml runs only after a push to main. A push to a branch
# named `crun-try/<name>` runs them here, or run this workflow by hand on a branch
# (`gh workflow run crun-branch.yml --ref <branch>`). A pull request does not run it: a
# pull request runs the fast gate of ci.yml only.
name: crun-branch

on:
  push:
    branches: ["crun-try/**"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: crun-branch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  crun-x86:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - name: diag
        run: |
          grep -m1 -i version /proc/version; uname -r; cat /etc/image* 2>/dev/null | head -3; echo ImageVersion=$ImageVersion
          sysctl kernel.apparmor_restrict_unprivileged_userns kernel.unprivileged_userns_clone user.max_user_namespaces || true
          cat /sys/module/apparmor/parameters/enabled; sudo aa-status 2>&1 | head -30
          ls -ld /home/runner /home/runner/work /home/runner/work/kbf/kbf; findmnt -T "$PWD" ; id; ls -l /usr/bin/crun /etc/apparmor.d | head -40; grep runner /etc/subuid /etc/subgid
          ls /sys/kernel/security/apparmor/features 2>&1 | head
      - run: rustup toolchain install
      - run: cargo build -p xtask --locked
      - run: cargo test -p kbf-integration-test --test executor_real_service_integration --locked --no-run
      - name: fetch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cargo xtask fetch-pinned-js --pin kbf-js-version.toml --program js-agent --target x86_64-unknown-linux-musl --gh "$(command -v gh)" --dir target/tmp/js
          cargo xtask fetch-pinned-js --pin kbf-js-version.toml --program js-lease-server --target x86_64-unknown-linux-musl --gh "$(command -v gh)" --dir target/tmp/js
      - name: test
        run: |
          grep " /run " /proc/mounts; sudo mount -o remount,exec /run; grep " /run " /proc/mounts
          cargo xtask sudo-test -p kbf-integration-test --test executor_real_service_integration -- --test-threads=1 --nocapture > t.log 2>&1 || true
          grep -E "test result|start-failed" t.log | sort | uniq -c | cut -c1-250
          sudo dmesg | grep -E 'apparmor="(DENIED|ALLOWED|AUDIT)"' | cut -c1-400 | tail -30
          sudo journalctl -k --no-pager | grep -c DENIED || true
          mount | grep -E " (/|/home|/run|/tmp) "; findmnt -o TARGET,OPTIONS -T target/tmp
          sudo aa-status | head -8; ls -l target/tmp | head
          ls -l /sys/kernel/security/apparmor/features/domain 2>&1 | head -5
          /usr/bin/crun --version | head -1
