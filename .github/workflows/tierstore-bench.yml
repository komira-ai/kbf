# The tierstore-bench binary for Linux x86_64, built from a commit, as a workflow artifact to
# download and run on a benchmark host (`gh run download`, then check the SHA-256 sums in the
# job summary against the SHA256SUMS file inside).
#
# It runs by hand (`ref` names the branch, tag or commit to build; empty builds the ref the
# workflow was dispatched on) and on a pull request that changes this file, so the pull
# request proves the workflow builds. Nothing is attested here, as in vmm-probe.yml: the
# artifact is a build of the commit, not a signed release asset.
name: tierstore-bench

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit to build (empty means the ref this workflow is dispatched on)"
        required: false
        default: ""
        type: string
  pull_request:
    paths:
      - .github/workflows/tierstore-bench.yml

permissions: {}

concurrency:
  group: tierstore-bench-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

defaults:
  run:
    shell: bash

jobs:
  linux-x86_64:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - run: rustup toolchain install
      - run: cargo build --locked --release -p tierstore-bench
      - name: The binary starts
        run: target/release/tierstore-bench --help
      - name: Tar the binary (a tar keeps the executable bit) and sum both files
        run: |
          sha="$(git rev-parse HEAD)"
          name="tierstore-bench-$sha-linux-x86_64"
          mkdir -p "dist/$name"
          tar -C target/release -czf "dist/$name/$name.tar.gz" tierstore-bench
          cp target/release/tierstore-bench "dist/$name/tierstore-bench"
          cd "dist/$name"
          sha256sum tierstore-bench "$name.tar.gz" | tee SHA256SUMS
          {
            echo "### $name"
            echo '```'
            cat SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "ARTIFACT=$name" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ARTIFACT }}
          path: dist/${{ env.ARTIFACT }}/
          retention-days: 30
          if-no-files-found: error
