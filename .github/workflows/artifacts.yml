# The binaries nodes and servers run, the deploy tool, and the host tools that put them on
# a host, built once per commit (docs/artifacts.md): kbf (all five modes, `kbf --version
# --json` says what it is), kbf-daemon, kbf-server, kbf-deploy, kbf-host-install, kbf-updater,
# kbf-signer and kbf-task (a static musl build, which runs in
# any Linux image) for linux-x86_64 and linux-arm64,
# and kbf, kbf-deploy, kbf-installer, kbf-host-install, kbf-updater and kbf-mac-provision for darwin-arm64 (each
# signed ad hoc with the hardened runtime; a Mac runs `kbf daemon`), and the signed darwin-arm64 kbf-task as
# `kbf-task-bundle-<commit>-darwin-arm64.tar.gz`, a jobscheduler bundle in an OCI image layout (docs/artifacts.md). Each comes as a
# tarball with a CycloneDX SBOM; one SHA256SUMS covers a commit's files. The kbf of each
# platform also comes with `kbf-<commit>-<platform>.version.json`, the exact bytes its
# `--version --json` printed on the runner that built it (only a runner of the platform can
# run its binary). The Linux jobs also ship the frontend, the update coordinator and the task runner
# as OCI images, `kbf-frontend-image-<commit>-<platform>.oci.tar`,
# `kbf-coordinator-image-<commit>-<platform>.oci.tar` and
# `kbf-task-image-<commit>-<platform>.oci.tar` (docs/artifacts.md).
#
# A pull request runs none of it unless it carries the label `needs-artifacts` (add the
# label to get the files; every build and sums job carries the same condition, so an unlabelled
# pull request's run is skipped without queueing a runner). The merge queue is unchanged.
#
# On a pull request or in the merge queue this is a build check: everything is built,
# signed, packaged and summed, and nothing is attested. On a push to main the pipeline
# (pipeline.yml) calls this workflow twice (`workflow_call`), with the input `stage`:
#   - `build` (job `artifacts`, beside ci): the build and sums jobs run, so the builds start with ci
#     instead of after it; nothing is attested and the call holds no
#     signing scope;
#   - `sign` (job `artifacts-sign`, which needs ci and the build call): only the attest jobs and
#     the verify jobs run. They sign build provenance for every file and an SBOM attestation for
#     every tarball, per platform group (Linux does not wait for the macOS runners), and then
#     check them, for the branch that was pushed, as the planned deployment job is to. They read
#     the files and the SHA256SUMS the build call uploaded to the same run, by name. A commit that
#     fails ci is therefore built but never signed.
# The attest jobs are in THIS file for one reason: the signer identity of an attestation is the
# workflow file that ran the signing step, and the installers verify exactly
# `.github/workflows/artifacts.yml` (crates/kbf-installer/src/attest.rs, crates/kbf-host-install).
# Without `stage` (pull request, merge queue) the build and sums jobs run as above and the attest
# and verify jobs never do. In a called workflow `github.event_name` and `github.ref` are the
# caller's, so a call from the pipeline reads as the push it is. Only attest may hold `id-token:
# write` and `attestations: write`, and only under its exact `if:` (the workflow lint,
# crates/kbf-integration-test/tests/workflows, requires both; crates/kbf-integration-test/tests/release_artifacts
# pins the set of files built and attested; tests/pipeline_workflow requires every other job to
# exclude the sign stage). The pipeline grants the scopes to its sign call alone; the jobs here
# still ask for only their own.
#
# The files are kept as workflow artifacts for 90 days, GitHub's limit. The next stages of the
# pipeline read them from the same run (smoke installs and tests the kbf of the linux-x86_64
# tarball), and the release (release.yml, started by the pipeline's success) attaches these
# exact files for a commit on main, checked again against these attestations as
# refs/heads/main's, and never rebuilds. The
# deployment job and the node's SHA-256 check are planned, not built
# (docs/design/mac-node-provisioning.md sections 4.1 and 4.2).
name: artifacts

on:
  pull_request:
    # `labeled`: adding `needs-artifacts` to an open pull request starts the build.
    types: [opened, synchronize, reopened, labeled]
  merge_group:
  workflow_call:
    inputs:
      stage:
        description: "'build' or 'sign' from the pipeline, empty otherwise"
        type: string
        required: false
        default: ''
      sums_linux_sha256:
        description: "sha256 of the Linux SHA256SUMS the build call uploaded; the sign call's attest job refuses other sums"
        type: string
        required: false
        default: ''
      sums_darwin_arm64_sha256:
        description: "sha256 of the macOS SHA256SUMS the build call uploaded; the sign call's attest job refuses other sums"
        type: string
        required: false
        default: ''
    outputs:
      sums_linux_sha256:
        description: "sha256 of the Linux SHA256SUMS this call's sums-linux job uploaded"
        value: ${{ jobs.sums-linux.outputs.sha256 }}
      sums_darwin_arm64_sha256:
        description: "sha256 of the macOS SHA256SUMS this call's sums-darwin-arm64 job uploaded"
        value: ${{ jobs.sums-darwin-arm64.outputs.sha256 }}

permissions: {}

# A merge-queue run shares the one group `artifacts-merge-queue` and a RUNNING build is never
# cancelled (GitHub keeps one pending run per group). A pull request's label build is a build
# check, not the release pipeline: it has its own group per pull request, and a newer run of the
# same pull request replaces its older one. Called from the pipeline, the group is the run's
# own: what cancels a superseded push is the pipeline's group (pipeline.yml), so this one never
# holds up a newer push. The pipeline's two calls (build, sign) share that one group and
# `cancel-in-progress` is false, so neither cancels the other; the sign call waits for the build
# call anyway (it needs it), so the group never holds it up.
concurrency:
  group: artifacts-${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || github.event_name == 'merge_group' && 'merge-queue' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # cargo-cyclonedx makes the SBOMs. Its release binaries, checked against their SHA-256
  # before use (the values the project publishes with them, recomputed when pinned).
  CYCLONEDX_VERSION: 0.5.9
  CYCLONEDX_SHA256_AARCH64_DARWIN: 4c53dfa21e70b65bf7f8d2592aadde3bcb02c1a40b6ec63b877e5ca65a29e180
  CYCLONEDX_SHA256_X86_64_LINUX: fb8dbee9f182173e062a64a387b21a0badc6fab8b2abf9294973f012972bf6d8
  CYCLONEDX_SHA256_AARCH64_LINUX: 7bf131ca5389b07a4f10c182bcf8a5ad339d64408b6f0d8f6834a0bd6120a06a
  # The kbf package of each Linux job (a deb) and the kbf-installer package of the macOS one (the .pkg): nfpm builds the deb, and
  # the trust directory of each holds a pinned gh. Both are release archives checked against their SHA-256 before use (the
  # values the projects publish with them, recomputed when pinned; the archive's, not the program's).
  GH_VERSION: 2.102.0
  GH_SHA256_X86_64_LINUX: bb766f710eef8ede859c18578c72c327597cd4c8a85b06001b1f3843c6019386
  GH_SHA256_AARCH64_LINUX: 7862c86c72f43df3a2d93ddde6f473285b4e2af61b494849846827e513ef6484
  # The macOS arm64 zip of the same release, for the .pkg's trust directory.
  GH_SHA256_AARCH64_DARWIN: da922c20d1792e5b2cbf375593d7a658acf034c12c84e007e71c76ef959c337e
  # The release the upgrade test starts from: the kbf-installer and kbf debs it published, checked against their
  # SHA-256 before use. A host that has them takes the kbf deb of this commit (`pkg-upgrade-test`).
  UPGRADE_FROM_TAG: v0.0.7
  UPGRADE_FROM_COMMIT: cb6f107dd94c531770132f53238df6e9e3bdc68d
  UPGRADE_FROM_INSTALLER_SHA256_X86_64: b73da7c62cc9b16914fbcd871f45a73856b46acf17eea71dd2125e92be4a9c05
  UPGRADE_FROM_KBF_SHA256_X86_64: 6a3039fec639ab95f73c005680e6c4b5831c8b5cf8d54dc80fddde42e0a04af7
  UPGRADE_FROM_INSTALLER_SHA256_AARCH64: dc5787bf940c9083a600d8361b6acadf0bdee5b62d098f8819c43584682c85fa
  UPGRADE_FROM_KBF_SHA256_AARCH64: c62edc02939509bab48ac13d3231e270ead71a39d7d70ceba905ba9a8e12563b
  # js-bundle packs the darwin kbf-task bundle (the darwin job). A release of the jobscheduler repository: its tag, the
  # SHA-256 of the macOS archive (from that release's SHA256SUMS, recomputed when pinned; the archive's, not the program's)
  # and the commit its release workflow built it at, which `gh attestation verify` holds the archive to.
  JS_BUNDLE_VERSION: 0.1.79
  JS_BUNDLE_SHA256_AARCH64_DARWIN: dd21b0beee4d3f2d11a5f0e4f31ec2128a6fd85891f60405a283e1bf640ee50b
  JS_BUNDLE_SOURCE_DIGEST: 1f304ae75dbef20c9b01231b666b1e91e1f21743
  NFPM_VERSION: 2.48.0
  NFPM_SHA256_X86_64_LINUX: 6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750
  NFPM_SHA256_AARCH64_LINUX: a9a75213763783b7669719e505474c748c5ad7dc66591a195619deb50f85c2f4
  # syft reads the task image and writes its CycloneDX SBOM (the base's packages too: the SBOM of the kbf-task tarball
  # describes the binary alone). A release archive checked against its SHA-256 before use (the digests the project
  # publishes in syft_<version>_checksums.txt, recomputed when pinned; the archive's, not the program's).
  SYFT_VERSION: 1.55.0
  SYFT_SHA256_X86_64_LINUX: bb65249542db5fedeeb4d3f9b018b75e7264dbfbbb10486f044581a92f90490d
  SYFT_SHA256_AARCH64_LINUX: 929bd163db2d7cd2255d3bcb8967208079813d7b46b0c952f7b794d8e2c7d304

defaults:
  run:
    shell: bash

jobs:
  darwin-arm64:
    # A pull request builds it only with the label `needs-artifacts`, like every job here:
    # nothing is attested from a pull request and the macOS runners are the scarce ones.
    if: ${{ (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'needs-artifacts')) && inputs.stage != 'sign' }}
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      TARGET: aarch64-apple-darwin
      # The oldest macOS the binaries support: a property of the build, not of the runner.
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      # The branch the package trusts, and is attested for; see linux-x86_64.
      PKG_SOURCE_REF: ${{ github.event_name == 'pull_request' && format('refs/heads/{0}', github.base_ref) || github.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history: the build counts the commits behind it for `seq`, and a
          # shallow clone counts none (0, "unknown").
          fetch-depth: 0
      - run: rustup toolchain install
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
          # On a push (to main: the build the attest job signs)
          # nothing is restored: the attested binary is built from a clean target/,
          # never on a cached one. The lookup still tells the save step below whether
          # this key exists.
          lookup-only: ${{ github.event_name == 'push' }}
      - name: Install cargo-cyclonedx (pinned version and checksum)
        run: cargo xtask fetch --url "https://github.com/CycloneDX/cyclonedx-rust-cargo/releases/download/cargo-cyclonedx-$CYCLONEDX_VERSION/cargo-cyclonedx-$TARGET.tar.xz" --sha256 "$CYCLONEDX_SHA256_AARCH64_DARWIN" --out "$HOME/.cargo/bin/cargo-cyclonedx" --extract tar.xz --member "cargo-cyclonedx-$TARGET/cargo-cyclonedx"
      - run: sw_vers
      - run: uname -m
      - run: xcodebuild -version
      - run: cargo cyclonedx --version
      # `kbf` is built by itself: built in one command with the installer, cargo builds the setup
      # library once for both, with the installer's `proxy` feature, and `kbf` would link the proxy
      # (crates/kbf-integration-test/tests/layering.rs checks the tree of `-p kbf-cli` alone).
      - run: cargo build --locked --release --target "$TARGET" -p kbf-cli --bin kbf
      - name: Build the host-side binaries, stamping kbf-updater with its commit
        # `kbf-updater --version` prints this commit (crates/kbf-updater/src/lib.rs).
        run: KBF_BUILD_COMMIT="${GITHUB_SHA::12}" cargo build --locked --release --target "$TARGET" -p kbf-deploy -p kbf-installer -p kbf-host-install -p kbf-updater -p kbf-mac-provision --bin kbf-deploy --bin kbf-installer --bin kbf-host-install --bin kbf-updater --bin kbf-mac-provision
      - name: kbf-updater --version names the package version and this commit
        run: |
          want="kbf-updater $(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1) (${GITHUB_SHA::12})"
          got="$("target/$TARGET/release/kbf-updater" --version)"
          echo "$got"
          test "$got" = "$want"
      - name: Sign kbf ad hoc with the hardened runtime, and check it
        run: cargo xtask sign-darwin "target/$TARGET/release/kbf" --minos "$MACOSX_DEPLOYMENT_TARGET" --summary "$GITHUB_STEP_SUMMARY"
      - name: Sign kbf-deploy ad hoc with the hardened runtime, and check it
        run: cargo xtask sign-darwin "target/$TARGET/release/kbf-deploy" --minos "$MACOSX_DEPLOYMENT_TARGET" --summary "$GITHUB_STEP_SUMMARY"
      - name: Sign kbf-installer ad hoc with the hardened runtime, and check it
        run: cargo xtask sign-darwin "target/$TARGET/release/kbf-installer" --minos "$MACOSX_DEPLOYMENT_TARGET" --summary "$GITHUB_STEP_SUMMARY"
      - name: Sign kbf-host-install ad hoc with the hardened runtime, and check it
        run: cargo xtask sign-darwin "target/$TARGET/release/kbf-host-install" --minos "$MACOSX_DEPLOYMENT_TARGET" --summary "$GITHUB_STEP_SUMMARY"
      - name: Sign kbf-updater ad hoc with the hardened runtime, and check it
        run: cargo xtask sign-darwin "target/$TARGET/release/kbf-updater" --minos "$MACOSX_DEPLOYMENT_TARGET" --summary "$GITHUB_STEP_SUMMARY"
      - name: Sign kbf-mac-provision ad hoc with the hardened runtime, and check it
        run: cargo xtask sign-darwin "target/$TARGET/release/kbf-mac-provision" --minos "$MACOSX_DEPLOYMENT_TARGET" --summary "$GITHUB_STEP_SUMMARY"
      - name: The signed kbf names the commit and a release build
        run: cargo xtask build-commit check --json "target/$TARGET/release/kbf" "$GITHUB_SHA"
      - name: The signed kbf-installer names the commit and a release build
        run: cargo xtask build-commit check --json "target/$TARGET/release/kbf-installer" "$GITHUB_SHA"
      # What the signed kbf says it is, kept as an asset: only this runner can run the darwin kbf.
      - name: Record what the signed kbf --version --json says
        run: cargo xtask release version-facts --binary "target/$TARGET/release/kbf" --commit "$GITHUB_SHA" --platform darwin-arm64 --out dist
      - name: SBOM
        run: cargo cyclonedx --format json --spec-version 1.5 --describe binaries --target "$TARGET"
      - name: The SBOM step left Cargo.lock unchanged
        run: git diff --exit-code -- Cargo.lock
      - name: Package kbf
        run: cargo xtask package --binary "target/$TARGET/release/kbf" --sbom crates/kbf-cli/kbf_bin.cdx.json --platform darwin-arm64 --commit "$GITHUB_SHA" --out dist
      - name: Package kbf-deploy
        run: cargo xtask package --binary "target/$TARGET/release/kbf-deploy" --sbom crates/kbf-deploy/kbf-deploy_bin.cdx.json --platform darwin-arm64 --commit "$GITHUB_SHA" --out dist
      - name: Package kbf-installer
        run: cargo xtask package --binary "target/$TARGET/release/kbf-installer" --sbom crates/kbf-installer/kbf-installer_bin.cdx.json --platform darwin-arm64 --commit "$GITHUB_SHA" --out dist
      - name: Package kbf-host-install
        run: cargo xtask package --binary "target/$TARGET/release/kbf-host-install" --sbom crates/kbf-host-install/kbf-host-install_bin.cdx.json --platform darwin-arm64 --commit "$GITHUB_SHA" --out dist
      - name: Package kbf-updater
        run: cargo xtask package --binary "target/$TARGET/release/kbf-updater" --sbom crates/kbf-updater/kbf-updater_bin.cdx.json --platform darwin-arm64 --commit "$GITHUB_SHA" --out dist
      - name: Package kbf-mac-provision
        run: cargo xtask package --binary "target/$TARGET/release/kbf-mac-provision" --sbom crates/kbf-mac-provision/kbf-mac-provision_bin.cdx.json --platform darwin-arm64 --commit "$GITHUB_SHA" --out dist
      - name: Check the packaged kbf's signature, and run it
        run: cargo xtask darwin-asset "dist/kbf-$GITHUB_SHA-darwin-arm64.tar.gz" kbf
      - name: Check the packaged kbf-deploy's signature, and run it
        run: cargo xtask darwin-asset "dist/kbf-deploy-$GITHUB_SHA-darwin-arm64.tar.gz" kbf-deploy
      - name: Check the packaged kbf-installer's signature, and run it
        run: cargo xtask darwin-asset "dist/kbf-installer-$GITHUB_SHA-darwin-arm64.tar.gz" kbf-installer
      - name: Check the packaged kbf-host-install's signature, and run it
        run: cargo xtask darwin-asset "dist/kbf-host-install-$GITHUB_SHA-darwin-arm64.tar.gz" kbf-host-install
      - name: Check the packaged kbf-updater's signature, and run it
        run: cargo xtask darwin-asset "dist/kbf-updater-$GITHUB_SHA-darwin-arm64.tar.gz" kbf-updater
      - name: Check the packaged kbf-mac-provision's signature, and run it
        run: cargo xtask darwin-asset "dist/kbf-mac-provision-$GITHUB_SHA-darwin-arm64.tar.gz" kbf-mac-provision
      - name: The packaged kbf names the commit and a release build
        run: cargo xtask build-commit check-asset "dist/kbf-$GITHUB_SHA-darwin-arm64.tar.gz" "$GITHUB_SHA"
      - name: The packaged kbf-installer names the commit and a release build
        run: cargo xtask build-commit check-asset "dist/kbf-installer-$GITHUB_SHA-darwin-arm64.tar.gz" "$GITHUB_SHA"
      # The kbf-installer package (packaging/macos/README.md): the signed binary of this job, the
      # real LaunchDaemon property list, and a trust directory of the pinned gh, the Sigstore trusted
      # root and an installer.conf that trusts the branch this commit is attested on
      # (`PKG_SOURCE_REF`: the pushed branch on a push), at the paths the installer's macOS layout
      # reads. A Mac has what it needs to verify a release offline from this one file. Installer
      # installs it as root on this runner and every file, owner and mode is checked, and that no job
      # started; `pkg-macos-asset` then refuses it unless it holds the binary of the tarball checked
      # above and trusts that branch, and lists it in SHA256SUMS. The package is not signed (no
      # Developer ID): Gatekeeper does not open it by double click, and `installer -pkg` or MDM does.
      - name: Fetch the pinned gh, for the package's trust directory
        run: cargo xtask fetch --url "https://github.com/cli/cli/releases/download/v$GH_VERSION/gh_${GH_VERSION}_macOS_arm64.zip" --sha256 "$GH_SHA256_AARCH64_DARWIN" --out "$RUNNER_TEMP/tools/gh" --extract zip --member "gh_${GH_VERSION}_macOS_arm64/bin/gh"
      - name: Fetch the Sigstore trusted root with the pinned gh
        env:
          GH_TOKEN: ${{ github.token }}
        run: $RUNNER_TEMP/tools/gh attestation trusted-root > "$RUNNER_TEMP/trusted_root.jsonl"
      # A restored cache holds target/ as a whole (a path list cannot leave out a directory
      # inside one it names), so it may hold a previous run's package files; pkg-trust and
      # pkg-config refuse to overwrite a file.
      - name: Remove the package files a restored target/ may hold
        run: rm -rf target/pkg target/pkg-trust
      - name: Write the package's trust directory
        run: cargo xtask pkg-trust --gh "$RUNNER_TEMP/tools/gh" --trusted-root "$RUNNER_TEMP/trusted_root.jsonl" --source-ref "$PKG_SOURCE_REF" --out target/pkg-trust
      - name: Build the kbf-installer package
        run: cargo xtask pkg build --binary "target/$TARGET/release/kbf-installer" --launchd-plist packaging/macos/com.komira.kbf-installer.plist --trust target/pkg-trust/gh --trust target/pkg-trust/installer.conf --trust target/pkg-trust/trusted_root.jsonl --version-of "target/$TARGET/release/kbf-installer" --out target/pkg/out
      - name: Install the package as root, and check what it placed and that nothing started
        run: cargo xtask pkg-macos-install-test --package target/pkg/out --probe "/usr/local/kbf-installer/trust/gh --version::gh version $GH_VERSION" --probe "/usr/local/kbf-installer/bin/kbf-installer --version --json::${GITHUB_SHA:0:12}"
      - name: The package is the attested binary and trusts this branch, and is an asset
        run: cargo xtask pkg-macos-asset --package target/pkg/out --commit "$GITHUB_SHA" --binary-tarball "dist/kbf-installer-$GITHUB_SHA-darwin-arm64.tar.gz" --expect-ref "$PKG_SOURCE_REF" --gh "$RUNNER_TEMP/tools/gh" --out dist
      # The signed darwin kbf-task as its own asset, a jobscheduler bundle (docs/artifacts.md, "The macOS
      # kbf-task bundle"): built WITH the macOS confine (the Command runs under sandbox-exec; the test-only
      # feature that lets a Command keep the network where no confine exists is never named), signed like the
      # other Mac tools, packed by the pinned js-bundle into an OCI image layout, and packaged as a tarball of
      # that layout. It is a bundle only: a bare kbf-task tarball for darwin is not an asset
      # (crates/kbf-integration-test/tests/no_darwin_task.rs).
      - name: Build kbf-task for darwin, with the macOS confine
        run: cargo build --locked --release --target "$TARGET" -p kbf-task --bin kbf-task
      - name: Sign kbf-task ad hoc with the hardened runtime, and check it
        run: cargo xtask sign-darwin "target/$TARGET/release/kbf-task" --minos "$MACOSX_DEPLOYMENT_TARGET" --summary "$GITHUB_STEP_SUMMARY"
      - name: The signed kbf-task names the commit
        run: cargo xtask build-commit check "target/$TARGET/release/kbf-task" "$GITHUB_SHA"
      # The packer is a release of the jobscheduler repository, pinned by tag and by the archive's SHA-256 (JS_BUNDLE_*).
      # One command: the download must have the pinned digest and `gh attestation verify` must accept that same file
      # (this repository, the release workflow, main, the pinned commit) before the program is taken out of it.
      - name: Fetch js-bundle with the pinned digest and a verified attestation, then take the program out of that file
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask fetch-attested-tool --url "https://github.com/komira-ai/jobscheduler/releases/download/v$JS_BUNDLE_VERSION/js-bundle-$JS_BUNDLE_VERSION-$TARGET.tar.gz" --sha256 "$JS_BUNDLE_SHA256_AARCH64_DARWIN" --archive "$RUNNER_TEMP/js-bundle-release/js-bundle-$JS_BUNDLE_VERSION-$TARGET.tar.gz" --member "js-bundle-$JS_BUNDLE_VERSION-$TARGET/js-bundle" --out "$RUNNER_TEMP/tools/js-bundle" --gh "$RUNNER_TEMP/tools/gh" --repo komira-ai/jobscheduler --signer-workflow komira-ai/jobscheduler/.github/workflows/release.yml --source-ref refs/heads/main --source-digest "$JS_BUNDLE_SOURCE_DIGEST"
      - name: The one tree of the bundle is the signed kbf-task
        run: cargo xtask stage-task-tree --binary "target/$TARGET/release/kbf-task" --out "$RUNNER_TEMP/task-tree"
      - name: Pack the signed kbf-task into a bundle in an OCI layout
        run: $RUNNER_TEMP/tools/js-bundle pack --out "$RUNNER_TEMP/task-bundle" --name kbf-task --bundle-version "$GITHUB_SHA" --os-version "$MACOSX_DEPLOYMENT_TARGET" --tree "task=$RUNNER_TEMP/task-tree" --license task=Apache-2.0 --source-url task=https://github.com/komira-ai/kbf --annotation org.opencontainers.image.source=https://github.com/komira-ai/kbf --annotation "org.opencontainers.image.revision=$GITHUB_SHA" --entrypoint 'kbf-task=${tree:task}/kbf-task' --network on --read system-certs --read resolver-config
