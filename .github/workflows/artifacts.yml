          # this key exists.
          lookup-only: ${{ github.event_name == 'push' }}
      - name: Install cargo-cyclonedx (pinned version and checksum)
        run: cargo xtask fetch --url "https://github.com/CycloneDX/cyclonedx-rust-cargo/releases/download/cargo-cyclonedx-$CYCLONEDX_VERSION/cargo-cyclonedx-$TARGET.tar.xz" --sha256 "$CYCLONEDX_SHA256_AARCH64_LINUX" --out "$HOME/.cargo/bin/cargo-cyclonedx" --extract tar.xz --member "cargo-cyclonedx-$TARGET/cargo-cyclonedx"
      - run: cargo cyclonedx --version
      # `kbf` is built without the installer (see the darwin job): its `kbf setup` links no proxy.
      - run: cargo build --locked --release --target "$TARGET" -p kbf-node -p kbf-server -p kbf-cli --bins
      - name: Build the host-side binaries, stamping kbf-updater with its commit
        # `kbf-updater --version` prints this commit (crates/kbf-updater/src/lib.rs).
        run: KBF_BUILD_COMMIT="${GITHUB_SHA::12}" cargo build --locked --release --target "$TARGET" -p kbf-deploy -p kbf-host-install -p kbf-updater -p kbf-coordinator -p kbf-signer --bins
      # The linux-arm64 job cross-compiles, so its kbf-updater cannot run here; the x86_64 and darwin
      # jobs check the same stamped build step.
      - name: Build kbf-task for the static target
        env:
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: cargo build --locked --release --target "$STATIC_TARGET" -p kbf-task --bin kbf-task
      - run: cargo xtask build-commit check "target/$TARGET/release/kbf-server" "$GITHUB_SHA"
      - name: kbf-coordinator names the commit
        run: cargo xtask build-commit check "target/$TARGET/release/kbf-coordinator" "$GITHUB_SHA"
      - name: kbf-task names the commit
        run: cargo xtask build-commit check "target/$STATIC_TARGET/release/kbf-task" "$GITHUB_SHA"
      - name: kbf-task is statically linked
        run: cargo xtask static-elf "target/$STATIC_TARGET/release/kbf-task"
      - name: kbf names the commit and a release build
        run: cargo xtask build-commit check --json "target/$TARGET/release/kbf" "$GITHUB_SHA"
      # What kbf says it is, kept as an asset (see linux-x86_64).
      - name: Record what kbf --version --json says
        run: cargo xtask release version-facts --binary "target/$TARGET/release/kbf" --commit "$GITHUB_SHA" --platform linux-arm64 --out dist
      - name: SBOM
        run: cargo cyclonedx --format json --spec-version 1.5 --describe binaries --target "$TARGET"
      - name: The SBOM step left Cargo.lock unchanged
        run: git diff --exit-code -- Cargo.lock
      - name: Package kbf-daemon
        run: cargo xtask package --binary "target/$TARGET/release/kbf-daemon" --sbom crates/kbf-node/kbf-daemon_bin.cdx.json --platform linux-arm64 --commit "$GITHUB_SHA" --out dist
      - name: Package kbf-server
        run: cargo xtask package --binary "target/$TARGET/release/kbf-server" --sbom crates/kbf-server/kbf-server_bin.cdx.json --platform linux-arm64 --commit "$GITHUB_SHA" --out dist
      - name: Package kbf-deploy
        run: cargo xtask package --binary "target/$TARGET/release/kbf-deploy" --sbom crates/kbf-deploy/kbf-deploy_bin.cdx.json --platform linux-arm64 --commit "$GITHUB_SHA" --out dist
      - name: Package kbf
        run: cargo xtask package --binary "target/$TARGET/release/kbf" --sbom crates/kbf-cli/kbf_bin.cdx.json --platform linux-arm64 --commit "$GITHUB_SHA" --out dist
      - name: Package kbf-host-install
        run: cargo xtask package --binary "target/$TARGET/release/kbf-host-install" --sbom crates/kbf-host-install/kbf-host-install_bin.cdx.json --platform linux-arm64 --commit "$GITHUB_SHA" --out dist
      - name: Package kbf-updater
        run: cargo xtask package --binary "target/$TARGET/release/kbf-updater" --sbom crates/kbf-updater/kbf-updater_bin.cdx.json --platform linux-arm64 --commit "$GITHUB_SHA" --out dist
      - name: Package kbf-signer
        run: cargo xtask package --binary "target/$TARGET/release/kbf-signer" --sbom crates/kbf-signer/kbf-signer_bin.cdx.json --platform linux-arm64 --commit "$GITHUB_SHA" --out dist
      # The SBOM of kbf-task is made for the target it is built for. This runs after the others are
      # packaged because it writes every crate's SBOM again, for that target.
      - name: SBOM of kbf-task for the static target
        run: cargo cyclonedx --format json --spec-version 1.5 --describe binaries --target "$STATIC_TARGET"
      - name: The static SBOM step left Cargo.lock unchanged
        run: git diff --exit-code -- Cargo.lock
      - name: Package kbf-task
        run: cargo xtask package --binary "target/$STATIC_TARGET/release/kbf-task" --sbom crates/kbf-task/kbf-task_bin.cdx.json --platform linux-arm64 --commit "$GITHUB_SHA" --out dist
      - name: The packaged kbf names the commit and a release build
        run: cargo xtask build-commit check-asset "dist/kbf-$GITHUB_SHA-linux-arm64.tar.gz" "$GITHUB_SHA"
      # The kbf package (packaging/linux/README.md): this job's `kbf` at /usr/bin/kbf, the real units
      # of the modes and kbf.slice, the sysusers and tmpfiles files, and a trust directory of the
      # pinned gh, the Sigstore trusted root and an installer.conf that trusts the branch this
      # commit is attested on (`PKG_SOURCE_REF`: the pushed branch on a push). nfpm builds it twice
      # and the bytes must match; a fresh Ubuntu container installs, runs and removes it, and takes
      # it over a host that has the previous release's kbf-installer and kbf (`pkg-upgrade-test`);
      # `pkg-kbf-asset` then refuses it unless its kbf is the one of the kbf tarball checked above
      # and the trust directory is for that branch, and lists it in SHA256SUMS.
      - name: Fetch the pinned gh, for the package's trust directory
        run: cargo xtask fetch --url "https://github.com/cli/cli/releases/download/v$GH_VERSION/gh_${GH_VERSION}_linux_arm64.tar.gz" --sha256 "$GH_SHA256_AARCH64_LINUX" --out "$RUNNER_TEMP/tools/gh" --extract tar.gz --member "gh_${GH_VERSION}_linux_arm64/bin/gh"
      - name: Fetch nfpm (pinned version, checked by SHA-256)
        run: cargo xtask fetch --url "https://github.com/goreleaser/nfpm/releases/download/v$NFPM_VERSION/nfpm_${NFPM_VERSION}_Linux_arm64.tar.gz" --sha256 "$NFPM_SHA256_AARCH64_LINUX" --out "$RUNNER_TEMP/tools/nfpm" --extract tar.gz --member nfpm
      - name: Fetch the Sigstore trusted root with the pinned gh
        env:
          GH_TOKEN: ${{ github.token }}
        run: $RUNNER_TEMP/tools/gh attestation trusted-root > "$RUNNER_TEMP/trusted_root.jsonl"
      # A restored cache holds target/ as a whole (a path list cannot leave out a directory
      # inside one it names), so it may hold a previous run's package files; pkg-trust and
      # pkg-config refuse to overwrite a file.
      - name: Remove the package files a restored target/ may hold
        run: rm -rf target/pkg target/pkg-trust
      - name: Write the package's trust directory
        run: cargo xtask pkg-trust --gh "$RUNNER_TEMP/tools/gh" --trusted-root "$RUNNER_TEMP/trusted_root.jsonl" --source-ref "$PKG_SOURCE_REF" --out target/pkg-trust
      - name: Write the nfpm configuration
        run: cargo xtask pkg-config --kbf "target/$TARGET/release/kbf" --units packaging/linux/units --trust target/pkg-trust --sysusers packaging/linux/sysusers.d/kbf-installer.conf --tmpfiles packaging/linux/tmpfiles.d/kbf-installer.conf --needrestart packaging/linux/needrestart/kbf.conf --platform linux-arm64 --version-of "target/$TARGET/release/kbf" --out target/pkg
      - name: Build the deb and the rpm of kbf, each twice
        run: cargo xtask pkg-build --nfpm "$RUNNER_TEMP/tools/nfpm" --config target/pkg/nfpm.yaml --out target/pkg/out
      - name: Install, run, remove and purge the deb in a fresh Ubuntu container
        run: cargo xtask pkg-install-test --name kbf --package target/pkg/out --format deb --listing target/pkg/listing.txt --image-dir packaging/linux/test/ubuntu --probe "/usr/share/kbf/trust/gh --version::gh version $GH_VERSION" --probe "kbf --version --json::${GITHUB_SHA:0:12}"
      - name: Fetch the debs of the release before, for the upgrade test
        run: cargo xtask fetch --url "https://github.com/komira-ai/kbf/releases/download/$UPGRADE_FROM_TAG/kbf-installer-$UPGRADE_FROM_COMMIT-linux-arm64.deb" --sha256 "$UPGRADE_FROM_INSTALLER_SHA256_AARCH64" --out "$RUNNER_TEMP/upgrade/kbf-installer-old.deb"
      - name: Fetch the kbf deb of the release before
        run: cargo xtask fetch --url "https://github.com/komira-ai/kbf/releases/download/$UPGRADE_FROM_TAG/kbf-$UPGRADE_FROM_COMMIT-linux-arm64.deb" --sha256 "$UPGRADE_FROM_KBF_SHA256_AARCH64" --out "$RUNNER_TEMP/upgrade/kbf-old.deb"
      - name: A host with the previous kbf-installer and kbf takes this kbf deb, in a fresh Ubuntu container
        run: cargo xtask pkg-upgrade-test --old-installer "$RUNNER_TEMP/upgrade/kbf-installer-old.deb" --old-kbf "$RUNNER_TEMP/upgrade/kbf-old.deb" --package target/pkg/out --listing target/pkg/listing.txt --image-dir packaging/linux/test/ubuntu
      - name: The kbf deb is the attested kbf with the units of the modes and a trust directory for this branch, and is an asset
        run: cargo xtask pkg-kbf-asset --package target/pkg/out --platform linux-arm64 --commit "$GITHUB_SHA" --kbf-tarball "dist/kbf-$GITHUB_SHA-linux-arm64.tar.gz" --expect-ref "$PKG_SOURCE_REF" --gh "$RUNNER_TEMP/tools/gh" --out dist
      # The frontend image (packaging/container/frontend/Dockerfile): the attested kbf, unpacked from
      # the tarball above and not rebuilt, on a pinned base. It is built twice from the commit's time
      # (SOURCE_DATE_EPOCH, no provenance or SBOM attachments of buildx's own) and the two
      # tarballs must be the same bytes; `pkg-image-asset` then refuses it unless its kbf is the
      # tarball's, it runs `kbf --mode=frontend` as a user that is not root and it is for this platform.
      - name: The commit's time, for the frontend image
        run: cargo xtask source-date-epoch --commit "$GITHUB_SHA" --output "$GITHUB_ENV"
      - name: The frontend image directories
        run: mkdir -p target/image target/image-out
      - name: The frontend image context holds the attested kbf
        run: tar -xzf "dist/kbf-$GITHUB_SHA-linux-arm64.tar.gz" -C target/image kbf
      - name: A BuildKit builder, pinned by digest
        run: docker buildx create --name kbf-image --driver docker-container --driver-opt image=moby/buildkit:v0.23.2@sha256:ddd1ca44b21eda906e81ab14a3d467fa6c39cd73b9a39df1196210edcb8db59e --use
      - name: Build the frontend image, build 1 of 2
        run: docker buildx build --builder kbf-image --no-cache --platform linux/arm64 --provenance=false --sbom=false --build-arg SOURCE_DATE_EPOCH --tag "kbf-frontend:$GITHUB_SHA" --file packaging/container/frontend/Dockerfile --output "type=docker,oci-mediatypes=true,dest=target/image-out/1.oci.tar,rewrite-timestamp=true" target/image
      - name: Build the frontend image, build 2 of 2
        run: docker buildx build --builder kbf-image --no-cache --platform linux/arm64 --provenance=false --sbom=false --build-arg SOURCE_DATE_EPOCH --tag "kbf-frontend:$GITHUB_SHA" --file packaging/container/frontend/Dockerfile --output "type=docker,oci-mediatypes=true,dest=target/image-out/2.oci.tar,rewrite-timestamp=true" target/image
      - name: The two builds of the frontend image are the same bytes
        run: cmp target/image-out/1.oci.tar target/image-out/2.oci.tar
      - name: The frontend image is the attested kbf, and is an asset
        run: cargo xtask pkg-image-asset --service frontend --image target/image-out/1.oci.tar --platform linux-arm64 --commit "$GITHUB_SHA" --kbf-tarball "dist/kbf-$GITHUB_SHA-linux-arm64.tar.gz" --out dist
      # `docker image load` reads the file the release ships, as a host does.
      - name: Load the frontend image with docker
        run: docker image load --input "dist/kbf-frontend-image-$GITHUB_SHA-linux-arm64.oci.tar"
      # The coordinator image (packaging/container/kbf-coordinator/Dockerfile) is made the same
      # way from the `kbf-coordinator` built above, which `build-commit check` has shown names the
      # commit. It has no tarball of its own, so the image is held to that file.
      - name: The coordinator image directories
        run: mkdir -p target/coordinator-image target/coordinator-image-out
      - name: The coordinator image context holds the built kbf-coordinator
        run: cp "target/$TARGET/release/kbf-coordinator" target/coordinator-image/kbf-coordinator
      - name: Build the coordinator image, build 1 of 2
        run: docker buildx build --builder kbf-image --no-cache --platform linux/arm64 --provenance=false --sbom=false --build-arg SOURCE_DATE_EPOCH --tag "kbf-coordinator:$GITHUB_SHA" --file packaging/container/kbf-coordinator/Dockerfile --output "type=docker,oci-mediatypes=true,dest=target/coordinator-image-out/1.oci.tar,rewrite-timestamp=true" target/coordinator-image
      - name: Build the coordinator image, build 2 of 2
        run: docker buildx build --builder kbf-image --no-cache --platform linux/arm64 --provenance=false --sbom=false --build-arg SOURCE_DATE_EPOCH --tag "kbf-coordinator:$GITHUB_SHA" --file packaging/container/kbf-coordinator/Dockerfile --output "type=docker,oci-mediatypes=true,dest=target/coordinator-image-out/2.oci.tar,rewrite-timestamp=true" target/coordinator-image
      - name: The two builds of the coordinator image are the same bytes
        run: cmp target/coordinator-image-out/1.oci.tar target/coordinator-image-out/2.oci.tar
      - name: The coordinator image is the built kbf-coordinator, and is an asset
        run: cargo xtask pkg-image-asset --service coordinator --image target/coordinator-image-out/1.oci.tar --platform linux-arm64 --commit "$GITHUB_SHA" --binary "target/$TARGET/release/kbf-coordinator" --out dist
      # The task image (packaging/container/kbf-task/Dockerfile) is made the same
      # way from the `kbf-task` built above, which `build-commit check` has shown names the
      # commit. It has no tarball of its own, so the image is held to that file.
      - name: The task image directories
        run: mkdir -p target/task-image target/task-image-out
      - name: The task image context holds the built kbf-task
        run: cp "target/$STATIC_TARGET/release/kbf-task" target/task-image/kbf-task
      - name: Build the task image, build 1 of 2
        run: docker buildx build --builder kbf-image --no-cache --platform linux/arm64 --provenance=false --sbom=false --build-arg SOURCE_DATE_EPOCH --tag "kbf-task:$GITHUB_SHA" --file packaging/container/kbf-task/Dockerfile --output "type=docker,oci-mediatypes=true,dest=target/task-image-out/1.oci.tar,rewrite-timestamp=true" target/task-image
      - name: Build the task image, build 2 of 2
        run: docker buildx build --builder kbf-image --no-cache --platform linux/arm64 --provenance=false --sbom=false --build-arg SOURCE_DATE_EPOCH --tag "kbf-task:$GITHUB_SHA" --file packaging/container/kbf-task/Dockerfile --output "type=docker,oci-mediatypes=true,dest=target/task-image-out/2.oci.tar,rewrite-timestamp=true" target/task-image
      - name: The two builds of the task image are the same bytes
        run: cmp target/task-image-out/1.oci.tar target/task-image-out/2.oci.tar
      - name: The task image is the built kbf-task, and is an asset
        run: cargo xtask pkg-image-asset --service task --image target/task-image-out/1.oci.tar --platform linux-arm64 --commit "$GITHUB_SHA" --binary "target/$STATIC_TARGET/release/kbf-task" --out dist
      # The task image's CycloneDX SBOM, read from the image the release ships (its layers: the Ubuntu base's
      # packages and the kbf-task), with the pinned syft. `pkg-image-sbom` gives it the serial number and the time
      # of the image and the commit, so the same image has the same SBOM bytes, refuses a document that is not this
      # image's or lists no deb package, and lists it in SHA256SUMS.linux-arm64 beside the image. The attest job
      # signs an SBOM attestation whose subject is the image tarball.
      - name: Fetch syft (pinned version, checked by SHA-256)
        run: cargo xtask fetch --url "https://github.com/anchore/syft/releases/download/v$SYFT_VERSION/syft_${SYFT_VERSION}_linux_arm64.tar.gz" --sha256 "$SYFT_SHA256_AARCH64_LINUX" --out "$RUNNER_TEMP/tools/syft" --extract tar.gz --member syft
      - name: The task image's SBOM lists its packages and is an asset
        run: cargo xtask pkg-image-sbom --service task --image "dist/kbf-task-image-$GITHUB_SHA-linux-arm64.oci.tar" --platform linux-arm64 --commit "$GITHUB_SHA" --syft "$RUNNER_TEMP/tools/syft" --source-date-epoch "$SOURCE_DATE_EPOCH"
      # `docker image load` reads the file the release ships, as a host does.
      - name: Load the coordinator image with docker
        run: docker image load --input "dist/kbf-coordinator-image-$GITHUB_SHA-linux-arm64.oci.tar"
      # `docker image load` reads the file the release ships, as a host does.
      - name: Load the task image with docker
        run: docker image load --input "dist/kbf-task-image-$GITHUB_SHA-linux-arm64.oci.tar"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: assets-linux-arm64
          path: dist/
          retention-days: 90
          if-no-files-found: error
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # Attestation is per platform group, so the Linux files are attested and verifiable as
  # soon as the Linux jobs finish, however long the macOS runner queue is: Linux is
  # sums-linux -> attest-linux -> verify-linux, macOS is sums-darwin-arm64 ->
  # attest-darwin-arm64 -> verify-darwin-arm64. Each group has its own SHA256SUMS (artifact
  # sha256sums-linux, sha256sums-darwin-arm64) over just its files; the subjects of every
  # file's attestations are the same as in the one SHA256SUMS.

  # SHA256SUMS over the Linux files (both architectures), as `sums` is over all.
  sums-linux:
    needs: [linux-x86_64, linux-arm64]
    if: ${{ (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'needs-artifacts')) && inputs.stage != 'sign' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    # The SHA-256 of the SHA256SUMS this job uploads, for the sign call to hold the attest job to.
    outputs:
      sha256: ${{ steps.assemble.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: assets-linux-*
          path: dist
          merge-multiple: true
      - run: rustup toolchain install
      - name: Assemble SHA256SUMS
        id: assemble
        run: cargo xtask sums assemble dist --summary "$GITHUB_STEP_SUMMARY" --digest-output "$GITHUB_OUTPUT"
      - run: cargo xtask verify-assets sums dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sha256sums-linux
          path: dist/SHA256SUMS
          retention-days: 90
          if-no-files-found: error

  # SHA256SUMS over the macOS files.
  sums-darwin-arm64:
    needs: [darwin-arm64]
    if: ${{ (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'needs-artifacts')) && inputs.stage != 'sign' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    # The SHA-256 of the SHA256SUMS this job uploads, for the sign call to hold the attest job to.
    outputs:
      sha256: ${{ steps.assemble.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: assets-darwin-arm64
          path: dist
          merge-multiple: true
      - run: rustup toolchain install
      - name: Assemble SHA256SUMS
        id: assemble
        run: cargo xtask sums assemble dist --summary "$GITHUB_STEP_SUMMARY" --digest-output "$GITHUB_OUTPUT"
      - run: cargo xtask verify-assets sums dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sha256sums-darwin-arm64
          path: dist/SHA256SUMS
          retention-days: 90
          if-no-files-found: error

  # One SHA256SUMS over every platform's files (the commit's whole set, the file a release
  # carries), checked against the files and a flipped copy. Runs on every event, a pull request
  # without the label excepted, once every platform is built. Nothing waits for it: attestation is per platform, below.
  sums:
    needs: [darwin-arm64, linux-x86_64, linux-arm64]
    if: ${{ (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'needs-artifacts')) && inputs.stage != 'sign' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: assets-*
          path: dist
          merge-multiple: true
      - run: rustup toolchain install
      - name: Assemble SHA256SUMS
        run: cargo xtask sums assemble dist --summary "$GITHUB_STEP_SUMMARY"
      - run: cargo xtask verify-assets sums dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sha256sums
          path: dist/SHA256SUMS
          retention-days: 90
          if-no-files-found: error

  # Push to main only: build provenance for every Linux file, an SBOM
  # attestation for every Linux tarball, and a provenance attestation (and its bundle) of each
  # tarball alone. This job signs and does nothing else: while it holds `id-token: write` no
  # repository code runs, and nothing is built, only the pinned actions below, two `sha256sum --check` commands
  # that run first (bash-specific: the workflow pins its shell), and a `cp` that names each bundle. The Linux sums job checked these files against its SHA256SUMS; the Linux
  # verify job checks what it signs.
  attest-linux:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && inputs.stage == 'sign' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: assets-linux-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sha256sums-linux
          path: dist
      # Before anything is signed: the sums are the ones the build call's sums job published
      # (its digest, passed in by the pipeline), and every file the sums LIST is the one they
      # name (this does not prove `dist` holds nothing else: the sums job refuses an unlisted
      # file, and the steps below name their files). The build call's files sit in the run's
      # artifact store until now, where a job that runs repository code could have replaced
      # them. Two `sha256sum` commands under the workflow's pinned bash (`defaults.run.shell`;
      # the here-string is bash) and no repository code: this job holds `id-token: write`. It
      # has no `env`, `defaults` or `shell:` (the workflow lint requires it), so they cannot be
      # made to pass without checking.
      - name: Refuse sums other than the build's
        env:
          SUMS_SHA256: ${{ inputs.sums_linux_sha256 }}
        run: /usr/bin/sha256sum --check --strict <<< "$SUMS_SHA256  dist/SHA256SUMS"
