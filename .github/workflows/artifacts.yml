      - name: Load the frontend image with docker
        run: docker image load --input "dist/kbf-frontend-image-$GITHUB_SHA-linux-x86_64.oci.tar"
      # The coordinator image (packaging/container/kbf-coordinator/Dockerfile) is made the same
      # way from the `kbf-coordinator` built above, which `build-commit check` has shown names the
      # commit. It has no tarball of its own, so the image is held to that file.
      - name: The coordinator image directories
        run: mkdir -p target/coordinator-image target/coordinator-image-out
      - name: The coordinator image context holds the built kbf-coordinator
        run: cp "target/$TARGET/release/kbf-coordinator" target/coordinator-image/kbf-coordinator
      - name: Build the coordinator image, build 1 of 2
        run: docker buildx build --builder kbf-image --no-cache --platform linux/amd64 --provenance=false --sbom=false --build-arg SOURCE_DATE_EPOCH --tag "kbf-coordinator:$GITHUB_SHA" --file packaging/container/kbf-coordinator/Dockerfile --output "type=docker,oci-mediatypes=true,dest=target/coordinator-image-out/1.oci.tar,rewrite-timestamp=true" target/coordinator-image
      - name: Build the coordinator image, build 2 of 2
        run: docker buildx build --builder kbf-image --no-cache --platform linux/amd64 --provenance=false --sbom=false --build-arg SOURCE_DATE_EPOCH --tag "kbf-coordinator:$GITHUB_SHA" --file packaging/container/kbf-coordinator/Dockerfile --output "type=docker,oci-mediatypes=true,dest=target/coordinator-image-out/2.oci.tar,rewrite-timestamp=true" target/coordinator-image
      - name: The two builds of the coordinator image are the same bytes
        run: cmp target/coordinator-image-out/1.oci.tar target/coordinator-image-out/2.oci.tar
      - name: The coordinator image is the built kbf-coordinator, and is an asset
        run: cargo xtask pkg-image-asset --service coordinator --image target/coordinator-image-out/1.oci.tar --platform linux-x86_64 --commit "$GITHUB_SHA" --binary "target/$TARGET/release/kbf-coordinator" --out dist
      # The task image (packaging/container/kbf-task/Dockerfile) is made the same
      # way from the `kbf-task` built above, which `build-commit check` has shown names the
      # commit. It has no tarball of its own, so the image is held to that file.
      - name: The task image directories
        run: mkdir -p target/task-image target/task-image-out
      - name: The task image context holds the built kbf-task
        run: cp "target/$STATIC_TARGET/release/kbf-task" target/task-image/kbf-task
      - name: Build the task image, build 1 of 2
        run: docker buildx build --builder kbf-image --no-cache --platform linux/amd64 --provenance=false --sbom=false --build-arg SOURCE_DATE_EPOCH --tag "kbf-task:$GITHUB_SHA" --file packaging/container/kbf-task/Dockerfile --output "type=docker,oci-mediatypes=true,dest=target/task-image-out/1.oci.tar,rewrite-timestamp=true" target/task-image
      - name: Build the task image, build 2 of 2
        run: docker buildx build --builder kbf-image --no-cache --platform linux/amd64 --provenance=false --sbom=false --build-arg SOURCE_DATE_EPOCH --tag "kbf-task:$GITHUB_SHA" --file packaging/container/kbf-task/Dockerfile --output "type=docker,oci-mediatypes=true,dest=target/task-image-out/2.oci.tar,rewrite-timestamp=true" target/task-image
      - name: The two builds of the task image are the same bytes
        run: cmp target/task-image-out/1.oci.tar target/task-image-out/2.oci.tar
      - name: The task image is the built kbf-task, and is an asset
        run: cargo xtask pkg-image-asset --service task --image target/task-image-out/1.oci.tar --platform linux-x86_64 --commit "$GITHUB_SHA" --binary "target/$STATIC_TARGET/release/kbf-task" --out dist
      # The task image's CycloneDX SBOM, read from the image the release ships (its layers: the Ubuntu base's
      # packages and the kbf-task), with the pinned syft. `pkg-image-sbom` gives it the serial number and the time
      # of the image and the commit, so the same image has the same SBOM bytes, refuses a document that is not this
      # image's or lists no deb package, and lists it in SHA256SUMS.linux-x86_64 beside the image. The attest job
      # signs an SBOM attestation whose subject is the image tarball.
      - name: Fetch syft (pinned version, checked by SHA-256)
        run: cargo xtask fetch --url "https://github.com/anchore/syft/releases/download/v$SYFT_VERSION/syft_${SYFT_VERSION}_linux_amd64.tar.gz" --sha256 "$SYFT_SHA256_X86_64_LINUX" --out "$RUNNER_TEMP/tools/syft" --extract tar.gz --member syft
      - name: The task image's SBOM lists its packages and is an asset
        run: cargo xtask pkg-image-sbom --service task --image "dist/kbf-task-image-$GITHUB_SHA-linux-x86_64.oci.tar" --platform linux-x86_64 --commit "$GITHUB_SHA" --syft "$RUNNER_TEMP/tools/syft" --source-date-epoch "$SOURCE_DATE_EPOCH"
      # `docker image load` reads the file the release ships, as a host does.
      - name: Load the coordinator image with docker
        run: docker image load --input "dist/kbf-coordinator-image-$GITHUB_SHA-linux-x86_64.oci.tar"
      # `docker image load` reads the file the release ships, as a host does.
      - name: Load the task image with docker
        run: docker image load --input "dist/kbf-task-image-$GITHUB_SHA-linux-x86_64.oci.tar"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: assets-linux-x86_64
          path: dist/
          retention-days: 90
          if-no-files-found: error
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

