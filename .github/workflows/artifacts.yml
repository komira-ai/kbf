      - name: The SBOM step left Cargo.lock unchanged
        run: git diff --exit-code -- Cargo.lock
      - name: Package kbf-daemon
        run: cargo xtask package --binary "target/$TARGET/release/kbf-daemon" --sbom crates/kbf-node/kbf-daemon_bin.cdx.json --platform linux-x86_64 --commit "$GITHUB_SHA" --out dist
      - name: Package kbf-server
        run: cargo xtask package --binary "target/$TARGET/release/kbf-server" --sbom crates/kbf-server/kbf-server_bin.cdx.json --platform linux-x86_64 --commit "$GITHUB_SHA" --out dist
      - name: Package kbf-deploy
        run: cargo xtask package --binary "target/$TARGET/release/kbf-deploy" --sbom crates/kbf-deploy/kbf-deploy_bin.cdx.json --platform linux-x86_64 --commit "$GITHUB_SHA" --out dist
      - name: Package kbf
        run: cargo xtask package --binary "target/$TARGET/release/kbf" --sbom crates/kbf-cli/kbf_bin.cdx.json --platform linux-x86_64 --commit "$GITHUB_SHA" --out dist
      - name: Package kbf-host-install
        run: cargo xtask package --binary "target/$TARGET/release/kbf-host-install" --sbom crates/kbf-host-install/kbf-host-install_bin.cdx.json --platform linux-x86_64 --commit "$GITHUB_SHA" --out dist
      - name: Package kbf-updater
        run: cargo xtask package --binary "target/$TARGET/release/kbf-updater" --sbom crates/kbf-updater/kbf-updater_bin.cdx.json --platform linux-x86_64 --commit "$GITHUB_SHA" --out dist
      - name: Package kbf-signer
        run: cargo xtask package --binary "target/$TARGET/release/kbf-signer" --sbom crates/kbf-signer/kbf-signer_bin.cdx.json --platform linux-x86_64 --commit "$GITHUB_SHA" --out dist
      # The SBOM of kbf-task is made for the target it is built for. This runs after the others are
      # packaged because it writes every crate's SBOM again, for that target.
      - name: SBOM of kbf-task for the static target
        run: cargo cyclonedx --format json --spec-version 1.5 --describe binaries --target "$STATIC_TARGET"
      - name: The static SBOM step left Cargo.lock unchanged
        run: git diff --exit-code -- Cargo.lock
      - name: Package kbf-task
        run: cargo xtask package --binary "target/$STATIC_TARGET/release/kbf-task" --sbom crates/kbf-task/kbf-task_bin.cdx.json --platform linux-x86_64 --commit "$GITHUB_SHA" --out dist
