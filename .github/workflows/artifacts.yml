  # Push to main only: build provenance for every macOS file, an SBOM
  # attestation for every macOS tarball, and a provenance attestation (and its bundle) of each
  # tarball alone. This job signs and does nothing else: while it holds `id-token: write` no
  # repository code runs, and nothing is built, only the pinned actions below, two `sha256sum --check` commands
  # that run first (bash-specific: the workflow pins its shell), and a `cp` that names each bundle. The macOS sums job checked these files against its SHA256SUMS; the macOS
  # verify job checks what it signs.
  attest-darwin-arm64:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && inputs.stage == 'sign' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: assets-darwin-arm64
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sha256sums-darwin-arm64
          path: dist
      # Before anything is signed: the sums are the ones the build call's sums job published
      # (its digest, passed in by the pipeline), and every file the sums LIST is the one they
      # name (this does not prove `dist` holds nothing else: the sums job refuses an unlisted
      # file, and the steps below name their files). The build call's files sit in the run's
      # artifact store until now, where a job that runs repository code could have replaced
      # them. Two `sha256sum` commands under the workflow's pinned bash (`defaults.run.shell`;
      # the here-string is bash) and no repository code: this job holds `id-token: write`. It
      # has no `env`, `defaults` or `shell:` (the workflow lint requires it), so they cannot be
      # made to pass without checking.
      - name: Refuse sums other than the build's
        env:
          SUMS_SHA256: ${{ inputs.sums_darwin_arm64_sha256 }}
        run: /usr/bin/sha256sum --check --strict <<< "$SUMS_SHA256  dist/SHA256SUMS"
      - name: Refuse listed files that differ from the sums
        working-directory: dist
        run: /usr/bin/sha256sum --check --strict SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/kbf-${{ github.sha }}-darwin-arm64.tar.gz
          sbom-path: dist/kbf-${{ github.sha }}-darwin-arm64.cdx.json
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/kbf-deploy-${{ github.sha }}-darwin-arm64.tar.gz
          sbom-path: dist/kbf-deploy-${{ github.sha }}-darwin-arm64.cdx.json
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/kbf-installer-${{ github.sha }}-darwin-arm64.tar.gz
          sbom-path: dist/kbf-installer-${{ github.sha }}-darwin-arm64.cdx.json
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/kbf-host-install-${{ github.sha }}-darwin-arm64.tar.gz
          sbom-path: dist/kbf-host-install-${{ github.sha }}-darwin-arm64.cdx.json
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/kbf-updater-${{ github.sha }}-darwin-arm64.tar.gz
          sbom-path: dist/kbf-updater-${{ github.sha }}-darwin-arm64.cdx.json
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/kbf-mac-provision-${{ github.sha }}-darwin-arm64.tar.gz
          sbom-path: dist/kbf-mac-provision-${{ github.sha }}-darwin-arm64.cdx.json
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/kbf-task-bundle-${{ github.sha }}-darwin-arm64.tar.gz
          sbom-path: dist/kbf-task-bundle-${{ github.sha }}-darwin-arm64.cdx.json
      # Each tarball is also attested as its own subject; see attest-linux.
      - id: provenance-kbf-darwin-arm64
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/kbf-${{ github.sha }}-darwin-arm64.tar.gz
      - name: Name the bundle of kbf for darwin-arm64
        env:
          BUNDLE: ${{ steps.provenance-kbf-darwin-arm64.outputs.bundle-path }}
        run: cp "$BUNDLE" "dist/kbf-${GITHUB_SHA}-darwin-arm64.tar.gz.sigstore.json"
      - id: provenance-kbf-deploy-darwin-arm64
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/kbf-deploy-${{ github.sha }}-darwin-arm64.tar.gz
      - name: Name the bundle of kbf-deploy for darwin-arm64
        env:
          BUNDLE: ${{ steps.provenance-kbf-deploy-darwin-arm64.outputs.bundle-path }}
        run: cp "$BUNDLE" "dist/kbf-deploy-${GITHUB_SHA}-darwin-arm64.tar.gz.sigstore.json"
      - id: provenance-kbf-installer-darwin-arm64
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/kbf-installer-${{ github.sha }}-darwin-arm64.tar.gz
      - name: Name the bundle of kbf-installer for darwin-arm64
        env:
          BUNDLE: ${{ steps.provenance-kbf-installer-darwin-arm64.outputs.bundle-path }}
        run: cp "$BUNDLE" "dist/kbf-installer-${GITHUB_SHA}-darwin-arm64.tar.gz.sigstore.json"
      - id: provenance-kbf-host-install-darwin-arm64
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/kbf-host-install-${{ github.sha }}-darwin-arm64.tar.gz
      - name: Name the bundle of kbf-host-install for darwin-arm64
        env:
          BUNDLE: ${{ steps.provenance-kbf-host-install-darwin-arm64.outputs.bundle-path }}
        run: cp "$BUNDLE" "dist/kbf-host-install-${GITHUB_SHA}-darwin-arm64.tar.gz.sigstore.json"
      - id: provenance-kbf-updater-darwin-arm64
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/kbf-updater-${{ github.sha }}-darwin-arm64.tar.gz
      - name: Name the bundle of kbf-updater for darwin-arm64
        env:
          BUNDLE: ${{ steps.provenance-kbf-updater-darwin-arm64.outputs.bundle-path }}
        run: cp "$BUNDLE" "dist/kbf-updater-${GITHUB_SHA}-darwin-arm64.tar.gz.sigstore.json"
      - id: provenance-kbf-mac-provision-darwin-arm64
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/kbf-mac-provision-${{ github.sha }}-darwin-arm64.tar.gz
      - name: Name the bundle of kbf-mac-provision for darwin-arm64
        env:
          BUNDLE: ${{ steps.provenance-kbf-mac-provision-darwin-arm64.outputs.bundle-path }}
        run: cp "$BUNDLE" "dist/kbf-mac-provision-${GITHUB_SHA}-darwin-arm64.tar.gz.sigstore.json"
      - id: provenance-kbf-task-bundle-darwin-arm64
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/kbf-task-bundle-${{ github.sha }}-darwin-arm64.tar.gz
      - name: Name the bundle of kbf-task-bundle for darwin-arm64
        env:
          BUNDLE: ${{ steps.provenance-kbf-task-bundle-darwin-arm64.outputs.bundle-path }}
        run: cp "$BUNDLE" "dist/kbf-task-bundle-${GITHUB_SHA}-darwin-arm64.tar.gz.sigstore.json"
      - id: provenance-kbf-installer-pkg-darwin-arm64
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/kbf-installer-${{ github.sha }}-darwin-arm64.pkg
      - name: Name the bundle of the kbf-installer package for darwin-arm64
        env:
          BUNDLE: ${{ steps.provenance-kbf-installer-pkg-darwin-arm64.outputs.bundle-path }}
        run: cp "$BUNDLE" "dist/kbf-installer-${GITHUB_SHA}-darwin-arm64.pkg.sigstore.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundles-darwin-arm64
          path: dist/*.sigstore.json
          retention-days: 90
          if-no-files-found: error

  # Push to main only, after attest-linux: the checks the planned deployment
  # job is to make (cargo xtask verify-assets, crates/xtask/src/sums.rs), for the branch
  # that was pushed (`--source-ref "$GITHUB_REF"`), with read-only scopes, on the Linux files.
  # The files are assembled again into a SHA256SUMS that must be byte for byte the one the
  # sums job published and the attest job signed, then checked against it, then each verified.
  # Each tarball is also verified against its own bundle, offline and for the commit
  # (`--commit "$GITHUB_SHA"`), with the flags a host's installer uses.
  verify-linux:
    needs: [attest-linux]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && inputs.stage == 'sign' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: assets-linux-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sha256sums-linux
          path: published
      # The bundles go in beside the files; the sums do not list them (the attestation that
      # made them signed the files the sums list), and the check below holds them to one per tarball.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bundles-linux
          path: dist
      - name: Assemble SHA256SUMS, which must be the published one
        run: cargo xtask sums assemble dist --expect published/SHA256SUMS
      - name: Check the files against SHA256SUMS
        run: cargo xtask verify-assets sums dist
      - name: Fetch the Sigstore trusted root, for the offline check of the bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation trusted-root > "$RUNNER_TEMP/trusted_root.jsonl"
      - name: Verify as the planned deployment job is to
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask verify-assets attestations dist --repo "$GITHUB_REPOSITORY" --workflow-ref "$GITHUB_REPOSITORY/.github/workflows/artifacts.yml" --source-ref "$GITHUB_REF" --commit "$GITHUB_SHA" --trusted-root "$RUNNER_TEMP/trusted_root.jsonl"
      - name: The signed linux-x86_64 kbf package holds the attested kbf, the units of the modes and a trust directory for this branch
        run: cargo xtask pkg-kbf-asset --verify-only --package "dist/kbf-$GITHUB_SHA-linux-x86_64.deb" --platform linux-x86_64 --commit "$GITHUB_SHA" --kbf-tarball "dist/kbf-$GITHUB_SHA-linux-x86_64.tar.gz" --expect-ref "$GITHUB_REF"
      - name: The signed linux-x86_64 frontend image holds the attested kbf
        run: cargo xtask pkg-image-asset --verify-only --service frontend --image "dist/kbf-frontend-image-$GITHUB_SHA-linux-x86_64.oci.tar" --platform linux-x86_64 --commit "$GITHUB_SHA" --kbf-tarball "dist/kbf-$GITHUB_SHA-linux-x86_64.tar.gz"
      - name: The signed linux-x86_64 coordinator image runs the coordinator as a user that is not root
        run: cargo xtask pkg-image-asset --verify-only --service coordinator --image "dist/kbf-coordinator-image-$GITHUB_SHA-linux-x86_64.oci.tar" --platform linux-x86_64 --commit "$GITHUB_SHA"
      - name: The signed linux-x86_64 task image runs the task as a user that is not root
        run: cargo xtask pkg-image-asset --verify-only --service task --image "dist/kbf-task-image-$GITHUB_SHA-linux-x86_64.oci.tar" --platform linux-x86_64 --commit "$GITHUB_SHA"
      - name: The SBOM beside the signed linux-x86_64 task image is the SBOM of that image
        run: cargo xtask pkg-image-sbom --verify-only --service task --image "dist/kbf-task-image-$GITHUB_SHA-linux-x86_64.oci.tar" --platform linux-x86_64 --commit "$GITHUB_SHA"
      - name: The signed linux-arm64 kbf package holds the attested kbf, the units of the modes and a trust directory for this branch
        run: cargo xtask pkg-kbf-asset --verify-only --package "dist/kbf-$GITHUB_SHA-linux-arm64.deb" --platform linux-arm64 --commit "$GITHUB_SHA" --kbf-tarball "dist/kbf-$GITHUB_SHA-linux-arm64.tar.gz" --expect-ref "$GITHUB_REF"
      - name: The signed linux-arm64 frontend image holds the attested kbf
        run: cargo xtask pkg-image-asset --verify-only --service frontend --image "dist/kbf-frontend-image-$GITHUB_SHA-linux-arm64.oci.tar" --platform linux-arm64 --commit "$GITHUB_SHA" --kbf-tarball "dist/kbf-$GITHUB_SHA-linux-arm64.tar.gz"
      - name: The signed linux-arm64 coordinator image runs the coordinator as a user that is not root
        run: cargo xtask pkg-image-asset --verify-only --service coordinator --image "dist/kbf-coordinator-image-$GITHUB_SHA-linux-arm64.oci.tar" --platform linux-arm64 --commit "$GITHUB_SHA"
      - name: The signed linux-arm64 task image runs the task as a user that is not root
        run: cargo xtask pkg-image-asset --verify-only --service task --image "dist/kbf-task-image-$GITHUB_SHA-linux-arm64.oci.tar" --platform linux-arm64 --commit "$GITHUB_SHA"
      - name: The SBOM beside the signed linux-arm64 task image is the SBOM of that image
        run: cargo xtask pkg-image-sbom --verify-only --service task --image "dist/kbf-task-image-$GITHUB_SHA-linux-arm64.oci.tar" --platform linux-arm64 --commit "$GITHUB_SHA"

  # Push to main only, after attest-darwin-arm64: the checks the planned deployment
  # job is to make (cargo xtask verify-assets, crates/xtask/src/sums.rs), for the branch
  # that was pushed (`--source-ref "$GITHUB_REF"`), with read-only scopes, on the macOS files.
  # The files are assembled again into a SHA256SUMS that must be byte for byte the one the
  # sums job published and the attest job signed, then checked against it, then each verified.
  # Each tarball and the package is also verified against its own bundle; see verify-linux.
  verify-darwin-arm64:
    needs: [attest-darwin-arm64]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && inputs.stage == 'sign' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: assets-darwin-arm64
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sha256sums-darwin-arm64
          path: published
      # The bundles go in beside the files; see verify-linux.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bundles-darwin-arm64
          path: dist
      - name: Assemble SHA256SUMS, which must be the published one
        run: cargo xtask sums assemble dist --expect published/SHA256SUMS
      - name: Check the files against SHA256SUMS
        run: cargo xtask verify-assets sums dist
      - name: Fetch the Sigstore trusted root, for the offline check of the bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation trusted-root > "$RUNNER_TEMP/trusted_root.jsonl"
      - name: Verify as the planned deployment job is to
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask verify-assets attestations dist --repo "$GITHUB_REPOSITORY" --workflow-ref "$GITHUB_REPOSITORY/.github/workflows/artifacts.yml" --source-ref "$GITHUB_REF" --commit "$GITHUB_SHA" --trusted-root "$RUNNER_TEMP/trusted_root.jsonl"
      - name: The signed darwin-arm64 package holds the attested binary and trusts this branch
        run: cargo xtask pkg-macos-asset --verify-only --package "dist/kbf-installer-$GITHUB_SHA-darwin-arm64.pkg" --commit "$GITHUB_SHA" --binary-tarball "dist/kbf-installer-$GITHUB_SHA-darwin-arm64.tar.gz" --expect-ref "$GITHUB_REF"
