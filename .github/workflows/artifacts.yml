        run: cargo xtask build-commit check-asset "dist/kbf-$GITHUB_SHA-linux-x86_64.tar.gz" "$GITHUB_SHA"
      # The kbf package (packaging/linux/README.md): this job's `kbf` at /usr/bin/kbf, the real units
      # of the modes and kbf.slice, the sysusers and tmpfiles files, and a trust directory of the
      # pinned gh, the Sigstore trusted root and an installer.conf that trusts the branch this
      # commit is attested on (`PKG_SOURCE_REF`: the pushed branch on a push). nfpm builds it twice
      # and the bytes must match; a fresh Ubuntu container installs, runs and removes it, and takes
      # it over a host that has the previous release's kbf-installer and kbf (`pkg-upgrade-test`);
      # `pkg-kbf-asset` then refuses it unless its kbf is the one of the kbf tarball checked above
      # and the trust directory is for that branch, and lists it in SHA256SUMS.
      - name: Fetch the pinned gh, for the package's trust directory
        run: cargo xtask fetch --url "https://github.com/cli/cli/releases/download/v$GH_VERSION/gh_${GH_VERSION}_linux_amd64.tar.gz" --sha256 "$GH_SHA256_X86_64_LINUX" --out "$RUNNER_TEMP/tools/gh" --extract tar.gz --member "gh_${GH_VERSION}_linux_amd64/bin/gh"
      - name: Fetch nfpm (pinned version, checked by SHA-256)
        run: cargo xtask fetch --url "https://github.com/goreleaser/nfpm/releases/download/v$NFPM_VERSION/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" --sha256 "$NFPM_SHA256_X86_64_LINUX" --out "$RUNNER_TEMP/tools/nfpm" --extract tar.gz --member nfpm
      - name: Fetch the Sigstore trusted root with the pinned gh
        env:
          GH_TOKEN: ${{ github.token }}
        run: $RUNNER_TEMP/tools/gh attestation trusted-root > "$RUNNER_TEMP/trusted_root.jsonl"
      # A restored cache holds target/ as a whole (a path list cannot leave out a directory
      # inside one it names), so it may hold a previous run's package files; pkg-trust and
      # pkg-config refuse to overwrite a file.
      - name: Remove the package files a restored target/ may hold
        run: rm -rf target/pkg target/pkg-trust
      - name: Write the package's trust directory
        run: cargo xtask pkg-trust --gh "$RUNNER_TEMP/tools/gh" --trusted-root "$RUNNER_TEMP/trusted_root.jsonl" --source-ref "$PKG_SOURCE_REF" --out target/pkg-trust
      - name: Write the nfpm configuration
        run: cargo xtask pkg-config --kbf "target/$TARGET/release/kbf" --units packaging/linux/units --trust target/pkg-trust --sysusers packaging/linux/sysusers.d/kbf-installer.conf --tmpfiles packaging/linux/tmpfiles.d/kbf-installer.conf --needrestart packaging/linux/needrestart/kbf.conf --platform linux-x86_64 --version-of "target/$TARGET/release/kbf" --out target/pkg
      - name: Build the deb and the rpm of kbf, each twice
        run: cargo xtask pkg-build --nfpm "$RUNNER_TEMP/tools/nfpm" --config target/pkg/nfpm.yaml --out target/pkg/out
      - name: Install, run, remove and purge the deb in a fresh Ubuntu container
        run: cargo xtask pkg-install-test --name kbf --package target/pkg/out --format deb --listing target/pkg/listing.txt --image-dir packaging/linux/test/ubuntu --probe "/usr/share/kbf/trust/gh --version::gh version $GH_VERSION" --probe "kbf --version --json::${GITHUB_SHA:0:12}"
      - name: Fetch the debs of the release before, for the upgrade test
        run: cargo xtask fetch --url "https://github.com/komira-ai/kbf/releases/download/$UPGRADE_FROM_TAG/kbf-installer-$UPGRADE_FROM_COMMIT-linux-x86_64.deb" --sha256 "$UPGRADE_FROM_INSTALLER_SHA256_X86_64" --out "$RUNNER_TEMP/upgrade/kbf-installer-old.deb"
      - name: Fetch the kbf deb of the release before
        run: cargo xtask fetch --url "https://github.com/komira-ai/kbf/releases/download/$UPGRADE_FROM_TAG/kbf-$UPGRADE_FROM_COMMIT-linux-x86_64.deb" --sha256 "$UPGRADE_FROM_KBF_SHA256_X86_64" --out "$RUNNER_TEMP/upgrade/kbf-old.deb"
      - name: A host with the previous kbf-installer and kbf takes this kbf deb, in a fresh Ubuntu container
        run: cargo xtask pkg-upgrade-test --old-installer "$RUNNER_TEMP/upgrade/kbf-installer-old.deb" --old-kbf "$RUNNER_TEMP/upgrade/kbf-old.deb" --package target/pkg/out --listing target/pkg/listing.txt --image-dir packaging/linux/test/ubuntu
      - name: The kbf deb is the attested kbf with the units of the modes and a trust directory for this branch, and is an asset
        run: cargo xtask pkg-kbf-asset --package target/pkg/out --platform linux-x86_64 --commit "$GITHUB_SHA" --kbf-tarball "dist/kbf-$GITHUB_SHA-linux-x86_64.tar.gz" --expect-ref "$PKG_SOURCE_REF" --gh "$RUNNER_TEMP/tools/gh" --out dist
      # The frontend image (packaging/container/frontend/Dockerfile): the attested kbf, unpacked from
      # the tarball above and not rebuilt, on a pinned base. It is built twice from the commit's time
      # (SOURCE_DATE_EPOCH, no provenance or SBOM attachments of buildx's own) and the two
      # tarballs must be the same bytes; `pkg-image-asset` then refuses it unless its kbf is the
      # tarball's, it runs `kbf --mode=frontend` as a user that is not root and it is for this platform.
      - name: The commit's time, for the frontend image
        run: cargo xtask source-date-epoch --commit "$GITHUB_SHA" --output "$GITHUB_ENV"
