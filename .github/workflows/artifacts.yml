        run: cargo xtask package-task-bundle --layout "$RUNNER_TEMP/task-bundle" --sbom crates/kbf-task/kbf-task_bin.cdx.json --commit "$GITHUB_SHA" --out dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: assets-darwin-arm64
          path: dist/
          retention-days: 90
          if-no-files-found: error
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # glibc: the binaries need the glibc of the runner image they were built on (Ubuntu
  # 24.04) or newer.
  linux-x86_64:
    if: ${{ (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'needs-artifacts')) && inputs.stage != 'sign' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      TARGET: x86_64-unknown-linux-gnu
      # kbf-task is built for this target, which links no libc, so the one file runs in any Linux
      # image of the arch (it is mounted into the images of the actions it runs).
      STATIC_TARGET: x86_64-unknown-linux-musl
      # The branch the package trusts, and is attested for: on a push the pushed branch; a pull
      # request is never attested and builds the package for the branch it is aimed at.
      PKG_SOURCE_REF: ${{ github.event_name == 'pull_request' && format('refs/heads/{0}', github.base_ref) || github.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history: the build counts the commits behind it for `seq`, and a
          # shallow clone counts none (0, "unknown").
          fetch-depth: 0
      - run: rustup toolchain install
      - name: Add the static target kbf-task is built for
        run: rustup target add "$STATIC_TARGET"
      # ring (through rustls) compiles C for the static target: its build looks for a musl C
      # compiler, which the runner image does not have. `musl-tools` provides `musl-gcc`.
      - name: Refresh the package lists for the musl C compiler
        run: sudo apt-get update
      - name: Install the musl C compiler ring's build uses for the static target
        run: sudo apt-get install --yes --no-install-recommends musl-tools
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
          # On a push (to main: the build the attest job signs)
          # nothing is restored: the attested binary is built from a clean target/,
          # never on a cached one. The lookup still tells the save step below whether
          # this key exists.
          lookup-only: ${{ github.event_name == 'push' }}
      - name: Install cargo-cyclonedx (pinned version and checksum)
        run: cargo xtask fetch --url "https://github.com/CycloneDX/cyclonedx-rust-cargo/releases/download/cargo-cyclonedx-$CYCLONEDX_VERSION/cargo-cyclonedx-$TARGET.tar.xz" --sha256 "$CYCLONEDX_SHA256_X86_64_LINUX" --out "$HOME/.cargo/bin/cargo-cyclonedx" --extract tar.xz --member "cargo-cyclonedx-$TARGET/cargo-cyclonedx"
      - run: cargo cyclonedx --version
      # `kbf` is built without the installer (see the darwin job): its `kbf setup` links no proxy.
      - run: cargo build --locked --release --target "$TARGET" -p kbf-node -p kbf-server -p kbf-cli --bins
      - name: Build the host-side binaries, stamping kbf-updater with its commit
        # `kbf-updater --version` prints this commit (crates/kbf-updater/src/lib.rs).
