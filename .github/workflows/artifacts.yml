      - name: kbf-updater --version names the package version and this commit
        run: |
          want="kbf-updater $(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1) (${GITHUB_SHA::12})"
          got="$("target/$TARGET/release/kbf-updater" --version)"
