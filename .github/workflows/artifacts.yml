      - name: kbf-coordinator names the commit
        run: cargo xtask build-commit check "target/$TARGET/release/kbf-coordinator" "$GITHUB_SHA"
      - name: kbf-task names the commit
        run: cargo xtask build-commit check "target/$STATIC_TARGET/release/kbf-task" "$GITHUB_SHA"
      - name: kbf-task is statically linked
        run: cargo xtask static-elf "target/$STATIC_TARGET/release/kbf-task"
      - name: kbf names the commit and a release build
        run: cargo xtask build-commit check --json "target/$TARGET/release/kbf" "$GITHUB_SHA"
      # What kbf says it is, kept as an asset (the darwin kbf cannot be run here, so every platform's job does).
