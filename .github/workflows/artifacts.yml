        run: mkdir -p target/image target/image-out
      - name: The frontend image context holds the attested kbf
        run: tar -xzf "dist/kbf-$GITHUB_SHA-linux-x86_64.tar.gz" -C target/image kbf
      - name: A BuildKit builder, pinned by digest
        run: docker buildx create --name kbf-image --driver docker-container --driver-opt image=moby/buildkit:v0.23.2@sha256:ddd1ca44b21eda906e81ab14a3d467fa6c39cd73b9a39df1196210edcb8db59e --use
      - name: Build the frontend image, build 1 of 2
        run: docker buildx build --builder kbf-image --no-cache --platform linux/amd64 --provenance=false --sbom=false --build-arg SOURCE_DATE_EPOCH --tag "kbf-frontend:$GITHUB_SHA" --file packaging/container/frontend/Dockerfile --output "type=docker,oci-mediatypes=true,dest=target/image-out/1.oci.tar,rewrite-timestamp=true" target/image
      - name: Build the frontend image, build 2 of 2
        run: docker buildx build --builder kbf-image --no-cache --platform linux/amd64 --provenance=false --sbom=false --build-arg SOURCE_DATE_EPOCH --tag "kbf-frontend:$GITHUB_SHA" --file packaging/container/frontend/Dockerfile --output "type=docker,oci-mediatypes=true,dest=target/image-out/2.oci.tar,rewrite-timestamp=true" target/image
      - name: The two builds of the frontend image are the same bytes
        run: cmp target/image-out/1.oci.tar target/image-out/2.oci.tar
      - name: The frontend image is the attested kbf, and is an asset
        run: cargo xtask pkg-image-asset --service frontend --image target/image-out/1.oci.tar --platform linux-x86_64 --commit "$GITHUB_SHA" --kbf-tarball "dist/kbf-$GITHUB_SHA-linux-x86_64.tar.gz" --out dist
