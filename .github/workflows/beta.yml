# Everything the pull-request gate (ci.yml: lint, and test on the fast set) leaves out that tests
# the commit's source, run on a push to main as the job `beta` of suites.yml (`workflow_call`,
# with nothing to wait for) and never on a pull request: the whole nextest run with its slow
# tests, the Arm run, the jobs that need a service or a root or a Mac (Postgres, S3 stores, the
# mixed-version farm, the pinned jobscheduler release, macOS), and the Linux packages. The
# stage lint (crates/kbf-integration-test/tests/workflows/stages.rs) allows `workflow_call` only.
#
# This suite is not part of the pipeline (pipeline.yml) and so never gates the release: it takes
# about an hour, and a release that waited for it would be that hour late. suites.yml runs it
# beside the pipeline; when it is red, its `release-red` job keeps the RELEASE-RED issue
# (`cargo xtask release-red`). pipeline_workflow refuses a call of this file from pipeline.yml.
#
# Every job here builds what it runs, or fetches what it runs from a release (mixed-version,
# and js-real-service from the jobscheduler's), so none reads the artifacts of the run. The one
# job that tests the files the artifacts stage built, the smoke, is smoke.yml, called by the
# pipeline after artifacts. A new job that downloads the pipeline's artifacts belongs in
# smoke.yml; the pipeline lint (pipeline_workflow) refuses a `download-artifact` of the run's
# `assets-*` or `sha256sums` here. beta_succeeds holds this file and smoke.yml to a green run
# meaning every job passed.
#
# Same hosted-runner, pinning and permission rules as ci.yml
# (crates/kbf-integration-test/tests/repo_lints.rs). The Cargo cache is keyed on the
# runner, the job, Cargo.lock and rust-toolchain.toml; only a push to main saves it, and
# only when the exact key missed.
name: beta

on:
  workflow_call:

permissions: {}

# No concurrency group: the group of suites.yml is the run's.

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Incremental artifacts only bloat a cached target directory (as in ci.yml).
  CARGO_INCREMENTAL: 0

defaults:
  run:
    shell: bash

jobs:
  # The whole nextest run, the slow tests included (the default profile; a pull request runs
  # the `pr` profile of .config/nextest.toml), then the doc tests and the tests that need a
  # tool this job fetches. No coverage: the 99% gate is measured on the fast set, in ci.yml.
  test-x86:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    # The throwaway Postgres server of ci.yml's test job (same image and settings): the default
    # profile runs the tests that need one, each on a database or a schema of its own.
    services:
      postgres:
        image: postgres@sha256:2a0d0fe14825b0939f78a8cad5cd4e6aa68bf94d0e5dd96e24b6d23af4315545
        env:
          POSTGRES_PASSWORD: kbf-ci-throwaway
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      KBF_TEST_POSTGRES_URL: postgres://postgres:kbf-ci-throwaway@127.0.0.1:5432/postgres
      # The GitHub CLI release a host pins to check a release's build attestation offline
      # (crates/kbf-installer/tests/real_gh.rs); the sha256 is the release's checksums file.
      GH_VERSION: 2.102.0
      GH_SHA256: bb766f710eef8ede859c18578c72c327597cd4c8a85b06001b1f3843c6019386
      # cargo-nextest runs the workspace's test binaries side by side, one thread per core
      # (`cargo test` runs them one after another). The sha256 is the release's archive.
      NEXTEST_VERSION: 0.9.146
      NEXTEST_SHA256: 682c21b777c333e96fd532e114d3a5a894e0729ab88d94c0a9f20f8419695428
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      - name: Install cargo-nextest (pinned version and checksum)
        run: cargo xtask fetch --url "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-$NEXTEST_VERSION/cargo-nextest-$NEXTEST_VERSION-x86_64-unknown-linux-gnu.tar.gz" --sha256 "$NEXTEST_SHA256" --out "$HOME/.cargo/bin/cargo-nextest" --extract tar.gz --member cargo-nextest
      - run: cargo nextest run --workspace --locked --no-fail-fast
      # The timings of this run: the slow list of the `pr` profile is regenerated from them
      # (.config/nextest.toml).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: nextest-junit
          path: target/nextest/default/junit.xml
          retention-days: 30
          if-no-files-found: warn
      # nextest does not run doc tests.
      - run: cargo test --workspace --doc --locked
      # kbf-server's --version names this commit, and the CI-only override stamps two
      # other commits from the same checkout (crates/kbf-server/build.rs,
      # crates/xtask/src/build_commit.rs).
      - run: cargo xtask build-commit stamps "$GITHUB_SHA"
      # The pinned gh accepts a real build attestation offline and refuses a subject
      # changed by one byte (crates/kbf-installer/tests/real_gh.rs). The last test of the
      # run fails unless the four before it ran, so the step cannot pass on zero.
      - name: Fetch gh (pinned release, checked by SHA-256)
        run: cargo xtask fetch --url "https://github.com/cli/cli/releases/download/v$GH_VERSION/gh_${GH_VERSION}_linux_amd64.tar.gz" --sha256 "$GH_SHA256" --out "$RUNNER_TEMP/tools/gh" --extract tar.gz --member "gh_${GH_VERSION}_linux_amd64/bin/gh"
      - name: The pinned gh verifies a real attestation offline
        run: cargo test -p kbf-installer --test real_gh --locked -- --ignored --test-threads=1
        env:
          KBF_TEST_GH: ${{ runner.temp }}/tools/gh
      # The cache is saved before the measurement: the measurement builds a release profile of
      # the workspace's dependencies into `target`, which filled the runner's disk while the
      # cache was written (the job's tests had all passed).
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
      # A measurement: what an action-cache hit costs over a file store against the
      # memory store, by stored objects per hit (crates/kbf-front/tests/measure_hit.rs).
      # The numbers are in the log and gate nothing (runners are noisy: read the
      # ratios); the step fails only if a timed hit is a miss or needs other than the
      # stored objects it is labelled with.
      - name: Measure action-cache hits (file store against memory store)
        run: cargo test -p kbf-front --test measure_hit --release --locked -- --ignored --nocapture

  # A second job rather than a matrix: the workflow lint requires a literal hosted label
  # in runs-on, so the runner a job lands on is readable from this file alone.
  test-arm:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    # As test-x86, with its Postgres service; the sha256 is the release's aarch64 archive.
    services:
      postgres:
        image: postgres@sha256:2a0d0fe14825b0939f78a8cad5cd4e6aa68bf94d0e5dd96e24b6d23af4315545
        env:
          POSTGRES_PASSWORD: kbf-ci-throwaway
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      KBF_TEST_POSTGRES_URL: postgres://postgres:kbf-ci-throwaway@127.0.0.1:5432/postgres
      NEXTEST_VERSION: 0.9.146
      NEXTEST_SHA256: b2e33d7c72de7ade0ff7b3a948ac37516b24f8a836b7a8870c1f634a94be9de9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      - name: Install cargo-nextest (pinned version and checksum)
        run: cargo xtask fetch --url "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-$NEXTEST_VERSION/cargo-nextest-$NEXTEST_VERSION-aarch64-unknown-linux-gnu.tar.gz" --sha256 "$NEXTEST_SHA256" --out "$HOME/.cargo/bin/cargo-nextest" --extract tar.gz --member cargo-nextest
      - run: cargo nextest run --workspace --locked --no-fail-fast
      # nextest does not run doc tests.
      - run: cargo test --workspace --doc --locked
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # The state store's Postgres backend, seen from kbf, against a real server in a service
  # container pinned by digest (postgres 17.9). The store itself (the conformance suite C1 to
  # C8, the defects it must reject, the startup refusal of a server that does not flush
  # commits, the claim path and the write-rate measurement) lives in the jobscheduler
  # repository as js-state, and its Postgres suite runs in that repository's CI at the revision
  # this workspace pins. This job covers kbf's consumers over that backend: the pack index, the
  # installer's setup, the server (crates/kbf-server/tests/state_store_postgres.rs and the
  # `over_postgres` restart tests), the cli and the state copy. The workspace jobs (test-x86,
  # test-arm and ci.yml's test) run these tests too, each on a server of their own; this job is
  # kept because release/stages.yml lists it as a gate. The password is a throwaway for this
  # container, which lives only for this job.
  state-postgres:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres@sha256:2a0d0fe14825b0939f78a8cad5cd4e6aa68bf94d0e5dd96e24b6d23af4315545
        env:
          POSTGRES_PASSWORD: kbf-ci-throwaway
          # The frontend process test reaches the server with no password, as the flag
          # requires; the container lives only for this job.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      KBF_TEST_POSTGRES_URL: postgres://postgres:kbf-ci-throwaway@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      # The pack index over a real schema: its conformance suite, the migration identity and an
      # existing database the earlier runner left (crates/kbf-pack-index/tests).
      - run: cargo clippy -p kbf-pack-index --all-features --all-targets --locked -- -D warnings
      - run: cargo test -p kbf-pack-index --all-features --locked -- --include-ignored
      # The installer's `setup` and update step over a real schema (crates/kbf-setup/src/database_tests.rs).
      - run: 'cargo test -p kbf-setup --features proxy --locked --lib -- --include-ignored database:: setup_creates_the_schema'
      - run: 'cargo test -p kbf-installer --locked --lib --test binary -- --include-ignored database:: setup_creates_the_schema'
      # The server over Postgres: the flag opens it (tests/state_store_postgres.rs), and the
      # farm's restart tests run on a schema of their own (`over_postgres` in tests/state_store.rs).
      - run: cargo test -p kbf-server --locked --test state_store_postgres -- --include-ignored
      - run: cargo test -p kbf-server --locked --test state_store -- --include-ignored over_postgres
      # A frontend process started with a Postgres --state-store reaches /readyz.
      - run: cargo test -p kbf-cli --locked --test frontend_process -- --include-ignored postgres_state_store
      # The cutover tool copies a SQLite state file into an empty database made for each test
      # (crates/kbf-state-copy/tests/postgres_copy.rs).
      - run: cargo test -p kbf-state-copy --locked -- --include-ignored
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # The ObjectStore conformance suite against real S3 stores in service containers, each
  # pinned by digest: MinIO (the bridge store) and RustFS (its replacement). Each store
  # runs the suite twice: a plain bucket, and a bucket with Object Lock. The key pair is
  # a throwaway for these containers, which live only for this job.
  objstore-s3:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      minio:
        # Chainguard's build of upstream MinIO: minio/minio is gone from Docker Hub and
        # quay.io/minio/minio no longer serves anonymous pulls. Pinned to the digest of
        # its `latest` image index.
        image: cgr.dev/chainguard/minio@sha256:e7ca559d9f7c0b5f24f5f669bb92f40f3ca88d56273b808bf3a7c116c17d2ffa
        command: server /data
        env:
          MINIO_ROOT_USER: kbf-ci-access
          MINIO_ROOT_PASSWORD: kbf-ci-throwaway
        ports:
          - 9000:9000
      rustfs:
        # rustfs/rustfs:1.0.1, image index digest.
        image: rustfs/rustfs@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
        env:
          RUSTFS_ACCESS_KEY: kbf-ci-access
          RUSTFS_SECRET_KEY: kbf-ci-throwaway
        ports:
          - 9100:9000
    env:
      AWS_ACCESS_KEY_ID: kbf-ci-access
      AWS_SECRET_ACCESS_KEY: kbf-ci-throwaway
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      - run: cargo build -p kbf-objstore --example s3_conformance --locked
      - name: MinIO, plain bucket
        run: cargo run -p kbf-objstore --example s3_conformance --locked -- --endpoint http://127.0.0.1:9000 --bucket kbf-conformance --create-bucket --conditional-put --wait-ready 60
      - name: MinIO, Object Lock bucket
        run: cargo run -p kbf-objstore --example s3_conformance --locked -- --endpoint http://127.0.0.1:9000 --bucket kbf-conformance-lock --create-bucket --conditional-put --object-lock
      - name: RustFS, plain bucket
        if: ${{ !cancelled() }}
        run: cargo run -p kbf-objstore --example s3_conformance --locked -- --endpoint http://127.0.0.1:9100 --bucket kbf-conformance --create-bucket --conditional-put --wait-ready 60
      - name: RustFS, Object Lock bucket
        if: ${{ !cancelled() }}
        run: cargo run -p kbf-objstore --example s3_conformance --locked -- --endpoint http://127.0.0.1:9100 --bucket kbf-conformance-lock --create-bucket --conditional-put --object-lock
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # What still runs on a real Mac (Apple silicon) after the merge: the registration client's
  # connect, the task runner's macOS confine and the sandbox profile writer, and the pinned gh
  # against a real attestation. No kbf runs on a Mac: a macOS action runs as a js-agent job
  # (docs/design/actions-as-jobs.md section 14), so no kbf program is tested here.
  #
  # macos-26, named: macos-latest moves to the next major release when GitHub moves it, and
  # the macOS a job proves should change in a commit. The label still takes macOS 26 point
  # releases (26.6.2 to 26.7.2 changed sshd -T's output), which `sw_vers` below prints.
  native-macos:
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      # The darwin-arm64 build of the GitHub CLI a Mac pins (see test-x86).
      GH_VERSION: 2.102.0
      GH_SHA256: da922c20d1792e5b2cbf375593d7a658acf034c12c84e007e71c76ef959c337e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      - run: sw_vers
      - run: uname -m
      - run: sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize
      - run: cargo test -p kbf-outputs --locked
      # The registration client's connect on a Mac, where it is std's after a check of the deadline:
      # a full backlog is refused at once, a connect that succeeds leaves the rest only what is left,
      # and a missing or stale socket is a connect error (crates/update-register/src/tests.rs).
      - run: cargo test -p update-register --locked -- --exact tests::a_listener_whose_backlog_is_full_is_refused_at_once tests::the_deadline_left_after_the_connect_is_all_that_follows_gets tests::a_socket_left_by_a_listener_that_is_gone_is_refused tests::a_missing_socket_names_its_path tests::a_deadline_already_passed_does_not_connect
      - name: Fetch gh (pinned release, checked by SHA-256)
        run: cargo xtask fetch --url "https://github.com/cli/cli/releases/download/v$GH_VERSION/gh_${GH_VERSION}_macOS_arm64.zip" --sha256 "$GH_SHA256" --out "$RUNNER_TEMP/tools/gh" --extract zip --member "gh_${GH_VERSION}_macOS_arm64/bin/gh"
      - name: The pinned gh verifies a real attestation offline
        run: cargo test -p kbf-installer --test real_gh --locked -- --ignored --test-threads=1
        env:
          KBF_TEST_GH: ${{ runner.temp }}/tools/gh
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # The kbf deb and rpm (packaging/linux/README.md): nfpm (pinned, checked against its SHA-256)
  # builds each twice from the configuration `cargo xtask pkg-config` writes, with the
  # test-only kbf-installer-stub standing for the kbf binary and the real units;
  # `cargo xtask pkg-install-test` installs the deb into a fresh Ubuntu container and the rpm into
  # a fresh Fedora one, with systemd as PID 1, and checks them (crates/xtask/src/pkg_install.rs).
  packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      NFPM_VERSION: 2.48.0
      NFPM_SHA256: 6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      - run: cargo build -p xtask --bin kbf-installer-stub --locked
      - name: Fetch nfpm (pinned version, checked by SHA-256)
        run: cargo xtask fetch --url "https://github.com/goreleaser/nfpm/releases/download/v$NFPM_VERSION/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" --sha256 "$NFPM_SHA256" --out "$RUNNER_TEMP/tools/nfpm" --extract tar.gz --member nfpm
      - name: Write the nfpm configuration
        run: cargo xtask pkg-config --kbf target/debug/kbf-installer-stub --units packaging/linux/units --trust packaging/linux/testdata/trust --sysusers packaging/linux/sysusers.d/kbf-installer.conf --tmpfiles packaging/linux/tmpfiles.d/kbf-installer.conf --needrestart packaging/linux/needrestart/kbf.conf --host-agent packaging/host-agent/linux --platform linux-x86_64 --version 0.0.0+ci --out target/pkg
      - name: Build the deb and the rpm of kbf, each twice
        run: cargo xtask pkg-build --nfpm "$RUNNER_TEMP/tools/nfpm" --config target/pkg/nfpm.yaml --out target/pkg/out
      - name: Install, gate, remove and purge the deb in a fresh Ubuntu container
        run: cargo xtask pkg-install-test --name kbf --package target/pkg/out/kbf_0.0.0+ci_amd64.deb --format deb --listing target/pkg/listing.txt --image-dir packaging/linux/test/ubuntu --gate kbf-storage.service=/etc/kbf/kbf.toml --gate kbf-host-local.service=/usr/libexec/kbf/kbf-host-install --gate kbf-updater-agent.service=/usr/libexec/kbf/kbf-updater
      - name: Install, gate and remove the rpm in a fresh Fedora container
        run: cargo xtask pkg-install-test --name kbf --package target/pkg/out/kbf-0.0.0+ci-1.x86_64.rpm --format rpm --listing target/pkg/listing.txt --image-dir packaging/linux/test/fedora --gate kbf-storage.service=/etc/kbf/kbf.toml
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # The mixed-version farm (crates/kbf-integration-test/tests/mixed_version.rs;
  # docs/design/kbf-cicd.md, N/N-1 compatibility in CI): real kbf processes of the tip (N) and of
  # the release before this commit (N-1) in one farm, a frontend of one version over the storage
  # nodes of the other both ways, two storage nodes of different versions replicating to each
  # other, and (every format changes additively) each storage node of a farm of one version stopped and started again as the other on the files
  # it had, so that N-1 starts on the data N wrote and N on the data N-1 wrote
  # (`n_minus_1_restarts_on_data_n_wrote`, `n_restarts_on_data_n_minus_1_wrote`). N-1 is not built
  # here: `cargo xtask release fetch-previous` downloads the previous release's assets, verifies
  # them as a deployment does (SHA256SUMS, one bundle per tarball, provenance and SBOM
  # attestations, the bundles again offline against the Sigstore trusted root) and only then
  # unpacks its `kbf` into target/tmp/n-1, where the test looks for it. This is a push job and
  # not a pull-request job: it
  # needs the token's attestations scope and GitHub's release API, a pull request from a fork has
  # neither, and the farm takes minutes. A release is cut only from a commit whose beta run
  # succeeded (release.yml, `gates`), so a break in N/N-1 stops the release it would ship in.
  # While no release exists there is no N-1: `fetch-previous` says `previous-source=none`, each test
  # says SKIPPED and the job passes (a step condition to skip the test by is one the workflow lint
  # beta_succeeds refuses, and a job that is skipped counts as passed). Section 9 of the design
  # asks for a red beta when N-1 is unavailable; a red job here would block the release that
  # creates the first N-1. A release that exists but whose `kbf` is not where the test looks is
  # red: the test reads the lines `fetch-previous` wrote to target/n-1.source and fails on
  # `previous-source=release` with no file. Neither that file nor target/tmp/n-1 is cached: the
  # verb refuses a file already in --out and appends to --output, and N-1 changes with each
  # release. x86_64 only.
  mixed-version:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      # N: the tip's kbf, and xtask. Built
      # before any step holds a token, so no build script runs beside one; xtask on its own, as
      # `cargo xtask` resolves it. The test binary is built here too, so the cache saved next
      # holds every build of this job.
      - name: Build xtask
        run: cargo build -p xtask --locked
      - name: Build the tip (N)
        run: cargo build -p kbf-cli --bins --locked
      - name: Build the mixed-version test
        run: cargo test -p kbf-integration-test --test mixed_version --locked --no-run
      # Saved before N-1 is fetched into target/tmp/n-1: a cache holding it makes the fetch of the
      # next run refuse ("File exists"), and an exclude pattern under `target` does not keep it out.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
      - name: Fetch the Sigstore trusted root, for the offline check of the bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation trusted-root > "$RUNNER_TEMP/trusted_root.jsonl"
      - name: Fetch and verify the release before this commit (N-1) and unpack its kbf
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask release fetch-previous --repo "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" --platform linux-x86_64 --binary kbf --out target/tmp/n-1 --trusted-root "$RUNNER_TEMP/trusted_root.jsonl" --output target/n-1.source
      # One test at a time: each starts a farm of its own, and the output says what each did (or
      # that it was skipped). The two N/N-1 data-restart tests are among them, run by this same
      # command.
      - name: The farm of N and N-1
        run: cargo test -p kbf-integration-test --test mixed_version --locked -- --test-threads=1 --nocapture

  # kbf-job-client and kbf-server's host executor against the real job service: the
  # js-lease-server and js-agent of the jobscheduler release kbf-js-version.toml pins, started on
  # loopback ports the system picks.
  # - crates/kbf-integration-test/tests/js_real_service.rs: the four cases of the client that
  #   need the server (submit then read, cancel twice, a resubmit after a lost answer, and the
  #   fake's answers held field by field to the server's).
  # - crates/kbf-integration-test/tests/executor_real_service_integration.rs: the executor over
  #   the real farm, the server and an agent whose crun is a stand-in (success, a wall limit,
  #   cancel, a lost answer to a submit, a whole-machine action, a restarted frontend). The
  #   released agent runs jobs only as root, so `cargo xtask sudo-test` runs them as root (sudo
  #   names the runner's user as the job user); each starts its agent in a systemd scope of its
  #   own, one test at a time.
  # - crates/kbf-integration-test/tests/cutover_real_service_integration.rs: kbf-deploy's
  #   `job-service apply --apply`, the frontend's host scripted, its check and canary against the
  #   server and an agent as above (a canary that passes, one that exits 3, one that holds and
  #   is cancelled); as root, one test at a time, for the same reason.
  # `cargo xtask fetch-pinned-js` reads the pin and refuses an archive whose SHA-256 or build
  # attestation is not the pinned one (crates/xtask/src/js_pin.rs); the tests hash the archive
  # again and run only a program unpacked from those bytes, and fail (never skip) without it.
  # Here and not in the pull-request gate: a pull request runs build and unit tests only, and
  # these need a download from GitHub and its attestation API, and root. The harness's own parts
  # (the pin, the relay that loses an answer, the field sets, the stand-in programs) run in every
  # pull request's tests. Built before any step holds a token, and the cache is saved before the
  # fetch, as in mixed-version: the fetch refuses an archive already in --dir. x86_64 only (the
  # pin names the x86_64 archives).
  js-real-service:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      attestations: read
    env:
      # The GitHub CLI test-x86 pins, which checks the attestations.
      GH_VERSION: 2.102.0
      GH_SHA256: bb766f710eef8ede859c18578c72c327597cd4c8a85b06001b1f3843c6019386
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      - name: Build xtask
        run: cargo build -p xtask --locked
      - name: Build the real-service tests
        run: cargo test -p kbf-integration-test --test js_real_service --test executor_real_service_integration --test cutover_real_service_integration --locked --no-run
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
      - name: Fetch gh (pinned release, checked by SHA-256)
        run: cargo xtask fetch --url "https://github.com/cli/cli/releases/download/v$GH_VERSION/gh_${GH_VERSION}_linux_amd64.tar.gz" --sha256 "$GH_SHA256" --out "$RUNNER_TEMP/tools/gh" --extract tar.gz --member "gh_${GH_VERSION}_linux_amd64/bin/gh"
      - name: Fetch and verify the pinned js-lease-server
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask fetch-pinned-js --pin kbf-js-version.toml --program js-lease-server --target x86_64-unknown-linux-musl --gh "$RUNNER_TEMP/tools/gh" --dir target/tmp/js
      - name: Fetch and verify the pinned js-agent
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask fetch-pinned-js --pin kbf-js-version.toml --program js-agent --target x86_64-unknown-linux-musl --gh "$RUNNER_TEMP/tools/gh" --dir target/tmp/js
      - name: kbf-job-client against the pinned job service
        run: cargo test -p kbf-integration-test --test js_real_service --locked -- --ignored
      - name: The host executor against the pinned job service and agent (as root)
        run: cargo xtask sudo-test -p kbf-integration-test --test executor_real_service_integration -- --test-threads=1 --nocapture
      - name: kbf-deploy's job-service cutover and canary against the pinned job service and agent (as root)
        run: cargo xtask sudo-test -p kbf-integration-test --test cutover_real_service_integration -- --test-threads=1 --nocapture
