# Everything the pull-request gate (ci.yml: lint, and test on the fast set) leaves out, run
# on a push to main and never on a pull request: the whole nextest run
# with its slow tests, the Arm run, the jobs that need a service or a root or a Mac
# (Postgres, S3 stores, crun, the M1, M2, cross-version and mixed-version cells, macOS), the Linux
# packages, and the beta smoke below. The stage lint
# (crates/kbf-integration-test/tests/workflows/stages.rs) allows `push` only.
#
# The beta smoke is a whole farm of real kbf processes (a frontend, three storage nodes, two
# daemons; Buck2 dials the frontend's REAPI port) under real Buck2 builds, for five minutes,
# on a hosted runner (docs/design/kbf-cicd.md, sections 3 and 4; scenario B0,
# `farm_under_build_load`, crates/kbf-harness). It fails on one failed build, one failed
# action, one lost blob, a process that exits, or a hang, and it writes `beta-result.json`.
# It builds its own binaries and so is not an attested run: the result says
# `"attested": false`. The full run of the design, on the attested bytes of artifacts.yml
# with the update and kill scenarios, is later work; the job that attests its result is not
# here either, so this workflow holds no `id-token` or `attestations` permission.
#
# There is no Envoy in the farm (the no-Envoy ruling): B0 moves behind the kbf-installer's
# proxy in a later change.
#
# Same hosted-runner, pinning and permission rules as ci.yml
# (crates/kbf-integration-test/tests/repo_lints.rs). The pins of the smoke job's Buck2 and actions are
# copies of the other jobs' here (module `beta_pins`). The Cargo cache is keyed on the
# runner, the job, Cargo.lock and rust-toolchain.toml; only a push to main saves it, and
# only when the exact key missed.
name: beta

on:
  push:
    branches: [main]

permissions: {}

# One beta run at a time in the whole repository. GitHub
# keeps at most one running and one pending run per concurrency group: a run queued while
# another runs waits as pending, and a newer pending run replaces (cancels) the older
# pending one, so the newest push waits its turn and a run in progress is never cancelled
# (docs.github.com, "Control the concurrency of workflows and jobs": "any previously pending
# job or workflow in the concurrency group will be canceled"; a running one is cancelled only
# with `cancel-in-progress: true`). A pending run that is replaced is "not run", never
# "passed".
concurrency:
  group: beta
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Incremental artifacts only bloat a cached target directory (as in ci.yml).
  CARGO_INCREMENTAL: 0

defaults:
  run:
    shell: bash

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      BUCK2_VERSION: 2026-10-01
      BUCK2_SHA256: 828aba01bf80e8ba50ed27d89be86efe0246b3807c3d040e1ea7b4810a55fb78
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      # kbf (every role of the farm), kbf-beta (the scenario) and kbf-m2-act (the program
      # the sample project's actions run, as plain processes: no container runtime here).
      - run: cargo build -p kbf-cli -p kbf-harness -p kbf-integration-test --bins --locked
      - name: Fetch buck2 (pinned version, checked by SHA-256)
        run: cargo xtask fetch --url "https://github.com/facebook/buck2/releases/download/$BUCK2_VERSION/buck2-x86_64-unknown-linux-gnu.zst" --sha256 "$BUCK2_SHA256" --out "$RUNNER_TEMP/tools/buck2" --extract zst
      - run: $RUNNER_TEMP/tools/buck2 --version
      - name: B0, the farm under build load
        run: target/debug/kbf-beta b0 --bin-dir target/debug --buck2 "$RUNNER_TEMP/tools/buck2" --project crates/kbf-integration-test/beta/buck2 --work "$RUNNER_TEMP/beta" --duration-secs 300 --concurrency 4 --summary "$GITHUB_STEP_SUMMARY"
      # The process logs, the scraped series, every build's console output and event log,
      # and the result document, kept 90 days whether the run passed or not; a re-run of
      # the same commit keeps its own (the attempt is in the name).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: beta-b0-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/beta/logs
            ${{ runner.temp }}/beta/beta-result.json
          retention-days: 90
          if-no-files-found: warn
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # The whole nextest run, the slow tests included (the default profile; a pull request runs
  # the `pr` profile of .config/nextest.toml), then the doc tests and the tests that need a
  # tool this job fetches. No coverage: the 99% gate is measured on the fast set, in ci.yml.
  test-x86:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    # The Envoy release the real-Envoy tests run (CI only: kbf releases pin and fetch no Envoy;
    # Envoy is a prerequisite checked against crates/kbf-installer/src/envoy/version.rs) and
    # the installer's box render is held to, for Envoy's own validation of the box render
    # and the real-Envoy tests of the box. The sha256 is the release's checksums.txt.asc
    # entry.
    env:
      ENVOY_VERSION: 1.39.3
      ENVOY_SHA256: f61653fb5f7645129d3092a82f21ce3e6f70d0a75fe2e861b0e7417790f2c200
      # The GitHub CLI release a host pins to check a release's build attestation offline
      # (crates/kbf-installer/tests/real_gh.rs); the sha256 is the release's checksums file.
      GH_VERSION: 2.102.0
      GH_SHA256: bb766f710eef8ede859c18578c72c327597cd4c8a85b06001b1f3843c6019386
      # cargo-nextest runs the workspace's test binaries side by side, one thread per core
      # (`cargo test` runs them one after another). The sha256 is the release's archive.
      NEXTEST_VERSION: 0.9.146
      NEXTEST_SHA256: 682c21b777c333e96fd532e114d3a5a894e0729ab88d94c0a9f20f8419695428
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      - name: Install cargo-nextest (pinned version and checksum)
        run: cargo xtask fetch --url "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-$NEXTEST_VERSION/cargo-nextest-$NEXTEST_VERSION-x86_64-unknown-linux-gnu.tar.gz" --sha256 "$NEXTEST_SHA256" --out "$HOME/.cargo/bin/cargo-nextest" --extract tar.gz --member cargo-nextest
      - run: cargo nextest run --workspace --locked --no-fail-fast
      # The timings of this run: the slow list of the `pr` profile is regenerated from them
      # (.config/nextest.toml).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: nextest-junit
          path: target/nextest/default/junit.xml
          retention-days: 30
          if-no-files-found: warn
      # nextest does not run doc tests.
      - run: cargo test --workspace --doc --locked
      # kbf-guest started as root through sudo must refuse (crates/kbf-guest/tests/as_root.rs).
      - run: cargo xtask sudo-test -p kbf-guest --test as_root
      # kbf-server's --version names this commit, and the CI-only override stamps two
      # other commits from the same checkout (crates/kbf-server/build.rs,
      # crates/xtask/src/build_commit.rs).
      - run: cargo xtask build-commit stamps "$GITHUB_SHA"
      - name: Fetch Envoy (pinned release, checked by SHA-256)
        run: cargo xtask fetch --url "https://github.com/envoyproxy/envoy/releases/download/v$ENVOY_VERSION/envoy-$ENVOY_VERSION-linux-x86_64" --sha256 "$ENVOY_SHA256" --out "$RUNNER_TEMP/tools/envoy"
      # Envoy accepts the installer's box render and refuses a control with an unknown
      # field (crates/kbf-integration-test/tests/envoy_validate.rs).
      - name: Envoy validates the installer's box render
        run: cargo test -p kbf-integration-test --test envoy_validate --locked -- --ignored
        env:
          KBF_TEST_ENVOY: ${{ runner.temp }}/tools/envoy
      # The installer's box render run by the pinned Envoy in front of two stub instances:
      # long silent streams, an instance turning not ready, the ceiling of open streams and
      # a hot restart, each with a control that plants the defect and sees it
      # (crates/kbf-integration-test/tests/envoy_box). About half a minute.
      - name: Envoy runs the installer's box render (long streams, health, ceiling, hot restart)
        run: cargo test -p kbf-integration-test --test envoy_box --locked -- --ignored
        env:
          KBF_TEST_ENVOY: ${{ runner.temp }}/tools/envoy
      # The pinned gh accepts a real build attestation offline and refuses a subject
      # changed by one byte (crates/kbf-installer/tests/real_gh.rs). The last test of the
      # run fails unless the four before it ran, so the step cannot pass on zero.
      - name: Fetch gh (pinned release, checked by SHA-256)
        run: cargo xtask fetch --url "https://github.com/cli/cli/releases/download/v$GH_VERSION/gh_${GH_VERSION}_linux_amd64.tar.gz" --sha256 "$GH_SHA256" --out "$RUNNER_TEMP/tools/gh" --extract tar.gz --member "gh_${GH_VERSION}_linux_amd64/bin/gh"
      - name: The pinned gh verifies a real attestation offline
        run: cargo test -p kbf-installer --test real_gh --locked -- --ignored --test-threads=1
        env:
          KBF_TEST_GH: ${{ runner.temp }}/tools/gh
      # A measurement: what an action-cache hit costs over a file store against the
      # memory store, by stored objects per hit (crates/kbf-front/tests/measure_hit.rs).
      # The numbers are in the log and gate nothing (runners are noisy: read the
      # ratios); the step fails only if a timed hit is a miss or needs other than the
      # stored objects it is labelled with.
      - name: Measure action-cache hits (file store against memory store)
        run: cargo test -p kbf-front --test measure_hit --release --locked -- --ignored --nocapture
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # A second job rather than a matrix: the workflow lint requires a literal hosted label
  # in runs-on, so the runner a job lands on is readable from this file alone.
  test-arm:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    # As test-x86; the sha256 is the release's aarch64 archive.
    env:
      NEXTEST_VERSION: 0.9.146
      NEXTEST_SHA256: b2e33d7c72de7ade0ff7b3a948ac37516b24f8a836b7a8870c1f634a94be9de9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      - name: Install cargo-nextest (pinned version and checksum)
        run: cargo xtask fetch --url "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-$NEXTEST_VERSION/cargo-nextest-$NEXTEST_VERSION-aarch64-unknown-linux-gnu.tar.gz" --sha256 "$NEXTEST_SHA256" --out "$HOME/.cargo/bin/cargo-nextest" --extract tar.gz --member cargo-nextest
      - run: cargo nextest run --workspace --locked --no-fail-fast
      # nextest does not run doc tests.
      - run: cargo test --workspace --doc --locked
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # The state store's Postgres backend against a real server in a service container,
  # pinned by digest (postgres 17.9): the conformance suite C1 to C8, the defects it must
  # reject, the startup refusal of a server that does not flush commits, and the claim
  # path (crates/kbf-state/tests/postgres_conformance.rs), then the server over it
  # (crates/kbf-server/tests/state_store_postgres.rs and the `over_postgres` restart tests).
  # kbf-server enables the feature, so the workspace jobs build and lint it too; they run
  # none of the tests that need a server. The password is a throwaway for this container,
  # which lives only for this job.
  state-postgres:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres@sha256:2a0d0fe14825b0939f78a8cad5cd4e6aa68bf94d0e5dd96e24b6d23af4315545
        env:
          POSTGRES_PASSWORD: kbf-ci-throwaway
          # The frontend process test reaches the server with no password, as the flag
          # requires; the container lives only for this job.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      KBF_TEST_POSTGRES_URL: postgres://postgres:kbf-ci-throwaway@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      - run: cargo clippy -p kbf-state --features postgres --all-targets --locked -- -D warnings
      - run: cargo test -p kbf-state --features postgres --locked -- --include-ignored
      # The installer's `setup` and update step over a real schema (src/database_tests.rs).
      - run: 'cargo test -p kbf-installer --locked --lib --test binary -- --include-ignored database:: setup_creates_the_schema'
      # The server over Postgres: the flag opens it (tests/state_store_postgres.rs), and the
      # farm's restart tests run on a schema of their own (`over_postgres` in tests/state_store.rs).
      - run: cargo test -p kbf-server --locked --test state_store_postgres -- --include-ignored
      - run: cargo test -p kbf-server --locked --test state_store -- --include-ignored over_postgres
      # Two frontend children on one Postgres schema hand over 50 builds
      # (tests/frontend/managed/two_children.rs; its in-memory twin runs in every test run).
      - run: cargo test -p kbf-server --locked --test frontend -- --include-ignored two_children::fifty_builds_across_a_takeover_over_postgres
      # A frontend process started with a Postgres --state-store reaches /readyz.
      - run: cargo test -p kbf-cli --locked --test frontend_process -- --include-ignored postgres_state_store
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # The ObjectStore conformance suite against real S3 stores in service containers, each
  # pinned by digest: MinIO (the bridge store) and RustFS (its replacement). Each store
  # runs the suite twice: a plain bucket, and a bucket with Object Lock. The key pair is
  # a throwaway for these containers, which live only for this job.
  objstore-s3:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      minio:
        # Chainguard's build of upstream MinIO: minio/minio is gone from Docker Hub and
        # quay.io/minio/minio no longer serves anonymous pulls. Pinned to the digest of
        # its `latest` image index.
        image: cgr.dev/chainguard/minio@sha256:e7ca559d9f7c0b5f24f5f669bb92f40f3ca88d56273b808bf3a7c116c17d2ffa
        command: server /data
        env:
          MINIO_ROOT_USER: kbf-ci-access
          MINIO_ROOT_PASSWORD: kbf-ci-throwaway
        ports:
          - 9000:9000
      rustfs:
        # rustfs/rustfs:1.0.1, image index digest.
        image: rustfs/rustfs@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
        env:
          RUSTFS_ACCESS_KEY: kbf-ci-access
          RUSTFS_SECRET_KEY: kbf-ci-throwaway
        ports:
          - 9100:9000
    env:
      AWS_ACCESS_KEY_ID: kbf-ci-access
      AWS_SECRET_ACCESS_KEY: kbf-ci-throwaway
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      - run: cargo build -p kbf-objstore --example s3_conformance --locked
      - name: MinIO, plain bucket
        run: cargo run -p kbf-objstore --example s3_conformance --locked -- --endpoint http://127.0.0.1:9000 --bucket kbf-conformance --create-bucket --conditional-put --wait-ready 60
      - name: MinIO, Object Lock bucket
        run: cargo run -p kbf-objstore --example s3_conformance --locked -- --endpoint http://127.0.0.1:9000 --bucket kbf-conformance-lock --create-bucket --conditional-put --object-lock
      - name: RustFS, plain bucket
        if: ${{ !cancelled() }}
        run: cargo run -p kbf-objstore --example s3_conformance --locked -- --endpoint http://127.0.0.1:9100 --bucket kbf-conformance --create-bucket --conditional-put --wait-ready 60
      - name: RustFS, Object Lock bucket
        if: ${{ !cancelled() }}
        run: cargo run -p kbf-objstore --example s3_conformance --locked -- --endpoint http://127.0.0.1:9100 --bucket kbf-conformance-lock --create-bucket --conditional-put --object-lock
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # The container driver against real rootless `crun`, each test binary inside a
  # Delegate=yes system unit (crates/xtask/src/crun_tests.rs; the T4 spike found both
  # arches carry it). The same tests show as ignored, with their reason, in the plain
  # test jobs above.
  crun-x86:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      - run: cargo xtask crun-tests
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  crun-arm:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      - run: cargo xtask crun-tests
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # The M2 test: pinned buck2 builds the sample project in crates/kbf-integration-test/m2 remote-only
  # through kbf-server to kbf-daemon --driver container, every action in a rootless
  # `crun` container of distroless base-debian12 pinned by its amd64 manifest digest
  # (`kbf-cell m2`, crates/kbf-integration-test/src/m2.rs, says what is checked; it sets the runner
  # up as `cargo xtask crun-tests` does). x86_64 only: the image digest is the amd64
  # one.
  m2-container:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      BUCK2_VERSION: 2026-10-01
      BUCK2_SHA256: 828aba01bf80e8ba50ed27d89be86efe0246b3807c3d040e1ea7b4810a55fb78
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      - run: cargo build -p kbf-server -p kbf-node -p kbf-integration-test --bin kbf-server --bin kbf-daemon --bin kbf-cell --locked
      # The image's glibc is Debian 12's, older than the runner's, so the helper every
      # action runs is linked statically (kbf-cell m2 refuses a dynamic one).
      - run: cargo rustc -p kbf-integration-test --bin kbf-m2-act --locked -- -C target-feature=+crt-static
      - name: Fetch buck2 (pinned version, checked by SHA-256)
        run: cargo xtask fetch --url "https://github.com/facebook/buck2/releases/download/$BUCK2_VERSION/buck2-x86_64-unknown-linux-gnu.zst" --sha256 "$BUCK2_SHA256" --out "$RUNNER_TEMP/tools/buck2" --extract zst
      - run: target/debug/kbf-cell m2 --bin-dir target/debug --project crates/kbf-integration-test/m2/buck2 --work "$RUNNER_TEMP/m2" --buck2 "$RUNNER_TEMP/tools/buck2"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: m2-container-logs
          path: ${{ runner.temp }}/m2/logs
          if-no-files-found: warn
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # The native driver on a real Mac (Apple silicon). The process-tree kill, memory
  # kill, output, cleanup and network tests run against libproc and sandbox-exec
  # here (the Linux jobs run the same tests against /proc, where the network is not
  # enforced); the daemon binary is built and started with each driver, which
  # detects the node through sysctl.
  #
  # 75 minutes: a passing run took about 41 (run 39670620620) and the next, with the slot
  # clean's mutants added and slower test steps on the same runner type, passed every test
  # step up to the last and was cancelled at 45 (run 39688515489).
  native-macos:
    runs-on: macos-latest
    timeout-minutes: 75
    permissions:
      contents: read
    env:
      # The darwin-arm64 build of the GitHub CLI a Mac pins (see test-x86).
      GH_VERSION: 2.102.0
      GH_SHA256: da922c20d1792e5b2cbf375593d7a658acf034c12c84e007e71c76ef959c337e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      - run: sw_vers
      - run: uname -m
      - run: sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize
      - run: cargo build -p kbf-node --bin kbf-daemon --locked
      - run: cargo test -p kbf-outputs -p kbf-driver-native -p kbf-node -p kbf-testkit --locked
      # `kbf daemon --driver native` started with the words the Mac's launchd unit
      # writes, against a fake front, and the helpers it re-runs itself as (each action's
      # keeper, the lease-user pool's `as-user` step) through the `kbf` binary
      # (crates/kbf-cli/tests/macos_daemon.rs).
      - run: cargo test -p kbf-cli --test macos_daemon --locked
      # A lease's own simulator, made, booted and deleted for real under the actions'
      # sandbox; one a killed daemon left deleted at the next start; and xcodebuild
      # finding a device of the default set but not one of another set
      # (crates/kbf-driver-native/tests/lease/simulator.rs).
      - run: cargo test -p kbf-driver-native --test lease --locked -- --ignored --nocapture simulator::real
      # The daemon's unit tests, which read its suspend-counting clock on macOS
      # (CLOCK_MONOTONIC_RAW), the fence across a suspend (issue #78), and a keeper
      # started after the binary was renamed over, which macOS finds by its path.
      - run: cargo test -p kbf-daemon --lib --test suspend --test keeper --test cache_clone --test trees_clone --locked
      # The root helper for per-lease users: its unit tests, then the helper itself run
      # as root (passwordless sudo) with real users, launchd, libproc, the sweep, the
      # leak scan and the caller check by code signature, signed as `cargo xtask
      # sign-darwin` signs it (crates/kbf-mac-session/tests/as_root.rs;
      # docs/design/fleet-updates-security.md S4.2, S4.3, S10).
      - run: cargo test -p kbf-mac-session --locked
      # The host installer's layout, offline attestation check and stage, compiled and run
      # on the platform they name, and the pinned gh for darwin-arm64 against a real
      # attestation (crates/kbf-installer, docs/deploy/host-releases.md).
      - run: cargo test -p kbf-installer --locked
      - name: Fetch gh (pinned release, checked by SHA-256)
        run: cargo xtask fetch --url "https://github.com/cli/cli/releases/download/v$GH_VERSION/gh_${GH_VERSION}_macOS_arm64.zip" --sha256 "$GH_SHA256" --out "$RUNNER_TEMP/tools/gh" --extract zip --member "gh_${GH_VERSION}_macOS_arm64/bin/gh"
      - name: The pinned gh verifies a real attestation offline
        run: cargo test -p kbf-installer --test real_gh --locked -- --ignored --test-threads=1
        env:
          KBF_TEST_GH: ${{ runner.temp }}/tools/gh
      - run: cargo xtask sudo-test -p kbf-mac-session --test as_root -- --test-threads=1 --nocapture
      # The native driver's lease-user pool as root, with throwaway users from uid 690:
      # actions as pool users through `launchctl asuser`, the kill by uid, the keeper's,
      # parallel leases (crates/kbf-driver-native/tests/slots.rs); then the clean of a
      # slot between two leases, its deadline, the user made again and the quarantine
      # (tests/slot_clean.rs). One test at a time: they make users at free uids.
      - run: cargo xtask sudo-test -p kbf-driver-native --test slots -- --test-threads=1 --nocapture
      - run: cargo xtask sudo-test -p kbf-driver-native --test slot_clean -- --test-threads=1 --nocapture
      # What an action as a pool user reaches of another slot (files, loopback TCP, Unix
      # sockets, the process table), measured and printed, not asserted, with and without
      # the sandbox (crates/kbf-driver-native/tests/slot_reach.rs).
      - run: cargo xtask sudo-test -p kbf-driver-native --test slot_reach -- --test-threads=1 --nocapture
      # What this runner can do for the Mac legs of the isolation suites (T018, M0; a spike that
      # asserts nothing about isolation): two pool users made with dscl, the real `kbf daemon
      # --driver native --pool-users 2` as root behind a fake front, one action per question
      # (`launchctl asuser`, the `user/<uid>` domain, `security`, `pbcopy`, `defaults`, the lease
      # directory), each fact a `SPIKE` line in this log (crates/kbf-daemon-test/tests/mac_pool_spike).
      # The daemon is the `kbf` binary built beside the test.
      - run: cargo build -p kbf-cli --bin kbf --locked
      - run: cargo xtask sudo-test -p kbf-daemon-test --test mac_pool_spike -- --test-threads=1 --nocapture
      # The per-binary entitlement allow list (tools/ci/darwin-entitlements.txt): the
      # kbf-vmm stub signed by `cargo xtask sign-darwin` with the virtualization
      # entitlement, kbf with none, both accepted by `darwin-asset`, and every
      # wrong signature refused (crates/kbf-vmm/tests/signing.rs;
      # docs/design/macos-vm-guests.md section 7).
      - run: cargo test -p kbf-vmm --test signing --locked -- --ignored
      # The guest agent's tests, then the agent under launchd: Aqua from a LaunchAgent
      # in this runner's GUI session, System from a LaunchDaemon (the control), and
      # its refusal to run as root (crates/kbf-guest/tests/as_root.rs).
      - run: cargo test -p kbf-guest --locked
      - run: cargo xtask sudo-test -p kbf-guest --test as_root
      # kbf-mac-provision on this VM, as root: what a hosted VM can prove (the header of
      # crates/kbf-mac-provision/tests/as_root.rs lists what it applies, asserts and
      # only reads). Last, because it changes this runner's settings.
      - run: cargo xtask sudo-test -p kbf-mac-provision --test as_root -- --test-threads=1 --nocapture
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # kbf-installer on a Mac as a user gets it (contract docs/design/kbf-installer.md section
  # 7): the `.pkg` built by `cargo xtask pkg build` (a stub stands in for the binary until
  # kbf-installer builds), opened by pkgutil and lsbom, installed by Installer and checked
  # file by file and owner by owner (a root-owned /usr/local/kbf-installer tree, a 0700
  # /var/db/kbf-installer); its LaunchDaemon not loaded and not running without
  # /usr/local/etc/kbf/installer.toml, running with it; `check` refusing a user-owned prefix
  # (skipped, and said so, while the binary is the stub); the Homebrew cask installing the
  # package and its uninstall removing the package's files
  # (crates/xtask/tests/pkg_macos.rs).
  pkg-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # The oldest macOS the binaries support (the test signs with `--minos 14.0`).
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      - run: sw_vers
      - run: brew --version
      # The package as root through Installer, then the cask as this user.
      - run: cargo xtask sudo-test -p xtask --test pkg_macos -- installer
      - run: cargo test -p xtask --test pkg_macos --locked -- --ignored homebrew
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # The kbf-installer deb and rpm (packaging/linux/README.md): nfpm (pinned, checked
  # against its SHA-256) builds each twice from the configuration `cargo xtask pkg-config`
  # writes, with the test-only kbf-installer-stub and the fixtures under
  # packaging/linux/testdata until the real binary and the units land; `cargo xtask
  # pkg-install-test` installs the deb into a fresh Ubuntu container and the rpm into a
  # fresh Fedora one, with systemd as PID 1, and checks them (crates/xtask/src/pkg_install.rs).
  packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      NFPM_VERSION: 2.48.0
      NFPM_SHA256: 6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      - run: cargo build -p xtask --bin kbf-installer-stub --locked
      - name: Fetch nfpm (pinned version, checked by SHA-256)
        run: cargo xtask fetch --url "https://github.com/goreleaser/nfpm/releases/download/v$NFPM_VERSION/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" --sha256 "$NFPM_SHA256" --out "$RUNNER_TEMP/tools/nfpm" --extract tar.gz --member nfpm
      - name: Write the nfpm configuration
        run: cargo xtask pkg-config --binary target/debug/kbf-installer-stub --units packaging/linux/units --trust packaging/linux/testdata/trust --sysusers packaging/linux/sysusers.d/kbf-installer.conf --tmpfiles packaging/linux/tmpfiles.d/kbf-installer.conf --platform linux-x86_64 --version 0.0.0+ci --out target/pkg
      - name: Build the deb and the rpm, each twice
        run: cargo xtask pkg-build --nfpm "$RUNNER_TEMP/tools/nfpm" --config target/pkg/nfpm.yaml --out target/pkg/out
      - name: Install, gate, remove and purge the deb in a fresh Ubuntu container
        run: cargo xtask pkg-install-test --package target/pkg/out/kbf-installer_0.0.0+ci_amd64.deb --format deb --listing target/pkg/listing.txt --image-dir packaging/linux/test/ubuntu --gate kbf-daemon.service=/etc/kbf/kbf.toml --gate kbf-installer.service=/etc/kbf/installer.toml
      - name: Install, gate and remove the rpm in a fresh Fedora container
        run: cargo xtask pkg-install-test --package target/pkg/out/kbf-installer-0.0.0+ci-1.x86_64.rpm --format rpm --listing target/pkg/listing.txt --image-dir packaging/linux/test/fedora --gate kbf-daemon.service=/etc/kbf/kbf.toml --gate kbf-installer.service=/etc/kbf/installer.toml
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # The M1 exit test: MinIO (pinned by digest), one kbf-server and one daemon, and the
  # sample projects in crates/kbf-integration-test/m1 built remote-only with pinned Bazel and buck2, twice
  # each. The second build of each must be all remote cache hits. A last buck2 build holds a
  # lease in flight (an action that sleeps) while the node is drained through the operator
  # API (`kbf-cell m1`, crates/kbf-integration-test/src/m1.rs, says exactly what is checked).
  m1-cell:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      minio:
        # The digest the objstore-s3 job pins (Chainguard's build of MinIO).
        image: cgr.dev/chainguard/minio@sha256:e7ca559d9f7c0b5f24f5f669bb92f40f3ca88d56273b808bf3a7c116c17d2ffa
        command: server /data
        env:
          MINIO_ROOT_USER: kbf-ci-access
          MINIO_ROOT_PASSWORD: kbf-ci-throwaway
        ports:
          - 9000:9000
    env:
      # A throwaway key pair for the service container, which lives only for this job.
      AWS_ACCESS_KEY_ID: kbf-ci-access
      AWS_SECRET_ACCESS_KEY: kbf-ci-throwaway
      BAZEL_VERSION: 8.8.1
      BAZEL_SHA256: 5b5bab2095065817d3416ca9a0678bd39c10c9ede432dbe8187bfe74de285160
      BUCK2_VERSION: 2026-10-01
      BUCK2_SHA256: 828aba01bf80e8ba50ed27d89be86efe0246b3807c3d040e1ea7b4810a55fb78
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      # kbf-act (kbf-testkit) is the program the samples' `shout` action runs.
      - run: cargo build -p kbf-server -p kbf-integration-test -p kbf-testkit --bins --locked
      - name: Fetch Bazel (pinned version, checked by SHA-256)
        run: cargo xtask fetch --url "https://github.com/bazelbuild/bazel/releases/download/$BAZEL_VERSION/bazel-$BAZEL_VERSION-linux-x86_64" --sha256 "$BAZEL_SHA256" --out "$RUNNER_TEMP/tools/bazel"
      - name: Fetch buck2 (pinned version, checked by SHA-256)
        run: cargo xtask fetch --url "https://github.com/facebook/buck2/releases/download/$BUCK2_VERSION/buck2-x86_64-unknown-linux-gnu.zst" --sha256 "$BUCK2_SHA256" --out "$RUNNER_TEMP/tools/buck2" --extract zst
      - run: $RUNNER_TEMP/tools/bazel --version
      - run: $RUNNER_TEMP/tools/buck2 --version
      - name: Wait for MinIO, then run the store conformance suite on it
        run: cargo run -p kbf-objstore --example s3_conformance --locked -- --endpoint http://127.0.0.1:9000 --bucket kbf-m1-conformance --create-bucket --conditional-put --wait-ready 60
      - name: M1 cell, Bazel and buck2 twice each
        run: target/debug/kbf-cell m1 --bin-dir target/debug --projects crates/kbf-integration-test/m1 --work "$RUNNER_TEMP/m1" --s3-endpoint http://127.0.0.1:9000 --s3-bucket kbf-m1 --bazel "$RUNNER_TEMP/tools/bazel" --buck2 "$RUNNER_TEMP/tools/buck2"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: m1-cell-logs
          path: ${{ runner.temp }}/m1/logs
          if-no-files-found: warn

  # The cross-version cell (`kbf-cell cross-version`, crates/kbf-integration-test/src/cross_version.rs;
  # docs/design/frontend-proxy.md, section 9): a frontend and a daemon of two different builds over
  # the real worker protocol on loopback, both ways, with the installer of the newer build on the
  # hosts first. "Release N" is the commit OLD_COMMIT below, built from a second checkout in `old/`
  # (no release is published to fetch, and a build of a pinned commit needs no network beyond the
  # crates it already pulls); the tip is the "N+1" side. Move OLD_COMMIT to the commit of the newest
  # release when one is cut, and again whenever the protocol or the installer's numbers move: with
  # both sides declaring the same numbers the cell passes and says its order check was not exercised.
  # Not a pull-request job and not a required one: it costs a second cold build of the workspace
  # (a few minutes more than the other cells; the two target directories are cached), and the
  # pull-request gate keeps its two jobs. The cell's own logic runs in the pull request's `test`
  # job against fakes (crates/kbf-integration-test/tests/cross_version.rs). x86_64 only.
  cross-version:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      # Release N: a commit of this repository that has the worker handshake of
      # `negotiate` (a Hello newer than the server is welcomed at the server's newest).
      OLD_COMMIT: dfe8ceef77f9d63b9378cf2862de7e759624c0e9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.OLD_COMMIT }}
          path: old
      - run: rustup toolchain install
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            old/target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ env.OLD_COMMIT }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      - name: Build the tip (release N+1) and the cell
        run: cargo build -p kbf-server -p kbf-node -p kbf-cli -p kbf-integration-test --bin kbf-server --bin kbf-daemon --bin kbf --bin kbf-cell --locked
      # Release N has its own toolchain file and lock file: both steps run in its checkout.
      - name: Install the toolchain release N pins
        working-directory: old
        run: rustup toolchain install
      - name: Build release N from its commit
        working-directory: old
        run: cargo build -p kbf-server -p kbf-node -p kbf-cli --bin kbf-server --bin kbf-daemon --bin kbf --locked
      - name: N+1 frontend, N daemon, N+1 installer first
        run: target/debug/kbf-cell cross-version --server-dir target/debug --daemon-dir old/target/debug --installer-dir target/debug --work "$RUNNER_TEMP/cross-version/n1-server"
      - name: N frontend, N+1 daemon, N+1 installer first
        run: target/debug/kbf-cell cross-version --server-dir old/target/debug --daemon-dir target/debug --installer-dir target/debug --work "$RUNNER_TEMP/cross-version/n-server"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: cross-version-logs
          path: |
            ${{ runner.temp }}/cross-version/n1-server/logs
            ${{ runner.temp }}/cross-version/n-server/logs
          if-no-files-found: warn
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            old/target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # The mixed-version farm (crates/kbf-integration-test/tests/mixed_version.rs;
  # docs/design/kbf-cicd.md, N/N-1 compatibility in CI): real kbf processes of the tip (N) and of
  # the release before this commit (N-1) in one farm, a frontend of one version over the nodes and
  # the daemon of the other both ways, two storage nodes of different versions replicating to each
  # other, a loaded node restarted under the other version, and (every format changes additively)
  # each storage node of a farm of one version stopped and started again as the other on the files
  # it had, so that N-1 starts on the data N wrote and N on the data N-1 wrote
  # (`n_minus_1_restarts_on_data_n_wrote`, `n_restarts_on_data_n_minus_1_wrote`). N-1 is not built
  # here: `cargo xtask release fetch-previous` downloads the previous release's assets, verifies
  # them as a deployment does (SHA256SUMS, one bundle per tarball, provenance and SBOM
  # attestations, the bundles again offline against the Sigstore trusted root) and only then
  # unpacks its `kbf` into target/tmp/n-1, where the test looks for it. This is a push job and
  # not a pull-request job: it
  # needs the token's attestations scope and GitHub's release API, a pull request from a fork has
  # neither, and the farm takes minutes. A release is cut only from a commit whose beta run
  # succeeded (release.yml, `gates`), so a break in N/N-1 stops the release it would ship in.
  # While no release exists there is no N-1: `fetch-previous` says `previous-source=none`, each test
  # says SKIPPED and the job passes (a step condition to skip the test by is one the workflow lint
  # beta_succeeds refuses, and a job that is skipped counts as passed). Section 9 of the design
  # asks for a red beta when N-1 is unavailable; a red job here would block the release that
  # creates the first N-1. A release that exists but whose `kbf` is not where the test looks is
  # red: the test reads the lines `fetch-previous` wrote to target/n-1.source and fails on
  # `previous-source=release` with no file. Neither that file nor target/tmp/n-1 is cached: the
  # verb refuses a file already in --out and appends to --output, and N-1 changes with each
  # release. x86_64 only.
  mixed-version:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            !target/tmp/n-1
            !target/n-1.source
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      # N: the tip's kbf and the stand-in crun the farm's container driver runs, and xtask. Built
      # before any step holds a token, so no build script runs beside one; xtask on its own, as
      # `cargo xtask` resolves it.
      - name: Build xtask
        run: cargo build -p xtask --locked
      - name: Build the tip (N) and the stand-in crun
        run: cargo build -p kbf-cli --bins --locked
      - name: Fetch the Sigstore trusted root, for the offline check of the bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation trusted-root > "$RUNNER_TEMP/trusted_root.jsonl"
      - name: Fetch and verify the release before this commit (N-1) and unpack its kbf
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask release fetch-previous --repo "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" --platform linux-x86_64 --binary kbf --out target/tmp/n-1 --trusted-root "$RUNNER_TEMP/trusted_root.jsonl" --output target/n-1.source
      # One test at a time: each starts a farm of its own, and the output says what each did (or
      # that it was skipped). The two N/N-1 data-restart tests are among them, run by this same
      # command.
      - name: The farm of N and N-1
        run: cargo test -p kbf-integration-test --test mixed_version --locked -- --test-threads=1 --nocapture
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            !target/tmp/n-1
            !target/n-1.source
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
