          APT_DISTRIBUTION_ID: ${{ vars.APT_DISTRIBUTION_ID }}
          APT_HOSTNAME: ${{ vars.APT_HOSTNAME }}
        run: tool/xtask channels gate --label stable-apt-read --output "$GITHUB_OUTPUT" --require "TESTING_ENABLED=$TESTING_ENABLED" --setting "APT_PUBLISH_ROLE_ARN=$APT_PUBLISH_ROLE_ARN" --setting "APT_BUCKET=$APT_BUCKET" --setting "APT_DISTRIBUTION_ID=$APT_DISTRIBUTION_ID" --setting "APT_HOSTNAME=$APT_HOSTNAME"
      - name: Assume the apt publish role through OIDC
