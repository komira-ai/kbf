# A GitHub release of the exact files the artifacts stage of the pipeline (pipeline.yml) built
# and attested for one commit of main (docs/artifacts.md), cut by one run that owns the whole
# chain. Nothing is rebuilt: the files are the ones the pipeline run left for that commit,
# checked again here, so a held script can pin a release asset, which outlives the run's 90-day
# workflow artifacts.
#
# The run is started by one event and nothing else: the completion of a run of the pipeline
# (`workflow_run`), and only a pipeline run that succeeded, for a push to main of this
# repository. The pipeline is ci, the source tests of beta.yml and the artifact builds (side by side),
# the signing of those artifacts after ci, the smoke on the signed artifacts, and a closing job that
# needs all of them, so a release is
# cut only from a commit on which every job of every stage passed. No tag starts this
# workflow (a tag the release bot makes would start a second run, and a hand-pushed `v*` tag
# starts nothing, since only the release bot may create one), and there is no hand-started dry
# run: a failed release job is re-run from this run's page. The workflow lint
# (crates/kbf-integration-test/tests/release_workflow) pins the trigger, the condition every
# job carries, and the chain below.
#
# Why a second workflow. A pipeline run is cancelled whole when one of its jobs fails (its
# `watch` job, pipeline.yml), and a release is the one part that must never be stopped half way,
# so it is not a job of that run: this workflow has its own concurrency group that never
# cancels, and nothing but the success of a pipeline run starts it. A pipeline run cancelled at
# any point starts no release; a release run that has started is never cancelled by a push. `workflow_run` runs the copy of this file on main and holds this
# repository's token and the `release` environment, which is why the lint allows the trigger
# here and nowhere else, and why every job tests the run that started it: its conclusion, its
# event, its branch and its repository. A run started by `workflow_run` has the latest commit of
# main as `github.sha`; every job uses the commit the pipeline run built (COMMIT) instead.
#
# plan     reads VERSION and the tags: the next version, and whether the push is code (it
#          ships in a release), the site, or the pipeline itself (cargo xtask release plan).
#          A range of docs only (since the last release tag) makes no release and the run stays
#          green; a commit that changes the pipeline does not release itself, the next one that
#          does not releases both.
# verify   refuses a commit not on main, downloads the files of the pipeline run that started
#          this one, checks the files against SHA256SUMS and the commit's assets, and verifies
#          every attestation as a deployment does and every bundle offline as a host does,
#          then reads the version of the native package from its two .debs (the output
#          `package-version`). Read-only, and it runs before anything is tagged.
# tag      writes the Beta record (an audit record nothing gates on) and creates the annotated
#          tag, create-only, naming exactly this commit, with a token of the release bot,
#          the only identity the `v*` tag ruleset lets create one. The token is minted in
#          this job and the bump job and nowhere else.
# notes    everything that reads the tag: `release verify` (the tag names this commit, which is
#          on main; the hash of the set of files), the identity of this release and of the one
#          before it (a binary runs only after the attestations of its files are verified
#          again), and the notes. Read-only.
# publish  the one job that holds `contents: write`: the GitHub release with those files and
#          those notes. A re-run adds the files the release lacks and replaces none. The job
#          is named `publish`; the release lint pins the job list.
# bump     opens the pull request in the internal repository that moves its submodule to the
#          released commit, with a token of the release bot scoped to that repository.
# rehearse a host laid out by hand from the release before this one is updated to this one by
#          the real helper under the real systemd, as the farm's hosts were
#          (crates/kbf-host-install/tests/update_rehearsal.rs). gamma needs it. Read-only.
# rehearse-agent
#          the same host is updated through the whole control loop of kbf's update coordinator:
#          the real coordinator of this commit, `cargo xtask deploy-farm`, and the real agent and
#          frontend of the release before this one
#          (crates/kbf-host-install/tests/update_rehearsal_agent.rs). gamma needs it. Read-only.
# gamma    the gamma stage. The farm's Linux nodes are deployed by hostkeeper, which
#          hostkeeper-desired.yml tells after this workflow when the repository variable
#          KBF_SETS_DESIRED is `true`, so this job no longer sets kbf's update coordinator: its
#          first step after the checkout prints a notice that says so. Every later step runs only
#          when KBF_SETS_DESIRED is `true`: the build, the join of the farm's Tailscale network
#          (with TS_CLIENT_ID and FARM_ADDRESS set too, as an ephemeral node with the same run
#          token), and the proof, a Buck2 build of a small project, remote only, every action new
#          in this run (cargo xtask prove-farm). The one job here that holds `id-token: write`
#          besides the apt read and write jobs and `deploy`, and no write scope.
# deploy-tool
#          builds `xtask --release` in a job with no token and no secret and uploads it, for the
#          apt jobs below, which hold the cloud role or the signing key and never compile.
# testing-apt-read, testing-apt-index, testing-apt-write
#          the release's two native .debs into the apt repository's suite `testing`; the same
#          three with the suffixes -2 and -3 are the second and third attempt after a lost
#          race for the index.
# check-apt-amd64, check-apt-arm64
#          kbf installed from the suite `testing` in a clean Ubuntu container, on each
#          architecture, and held to what the package promises.
# stable-apt-read, stable-apt-index, stable-apt-write
#          the release promoted from `testing` into the suite `stable` once both install checks
#          passed (and -2, -3 as above). hostkeeper installs from `stable`.
# deploy-digest, deploy
#          only while the repository variables CP_DEPLOY_ENDPOINT and CP_DEPLOY_TAILSCALE_TAGS are
#          not empty, after `gamma`:
#          deploy the release's frontend image to its Docker Swarm service by calling the
#          reusable workflow deploy.yml of komira-ai/docker-swarm-updater (the job `deploy`
#          holds `id-token: write` for that alone, and no other scope). See the comment above
#          the two jobs.
#
# A run releases one commit; a run of an old commit tags and publishes nothing (the highest
# release tag must name this commit or an ancestor of it: `release tag` and `release publish`
# both refuse otherwise). Re-run the failed jobs only: a re-run of all jobs writes another
# Beta record, and a tag that exists must carry the record it was made with.
#
# `plan` measures from the highest release tag that is an ancestor of the commit, not from the
# push: the code of a push that was queued behind another or replaced while waiting is released
# with the next one, and a docs-only push after code still releases that code.
name: release

on:
  workflow_run:
    workflows: [pipeline]
    types: [completed]
    branches: [main]

permissions: {}

# One release at a time across the repository, none cancelled: a second one waits for the first
# (GitHub keeps one pending run per group, so a third replaces the second while it waits). Only a
# pipeline run that succeeded joins the group `release-main`. Any other (cancelled by a newer
# push, or red) starts this workflow too, to skip every job, and takes a group of its own: in
# the shared group it would replace the release waiting there.
concurrency:
  group: release-${{ github.event.workflow_run.conclusion == 'success' && 'main' || github.run_id }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # The commit the pipeline run built and the run itself (not `github.sha`, which for a
  # `workflow_run` is the latest commit of main).
  COMMIT: ${{ github.event.workflow_run.head_sha }}
  PIPELINE_RUN: ${{ github.event.workflow_run.id }}

defaults:
  run:
    shell: bash

jobs:
  plan:
    # The run that started this one succeeded, for a push to main of this repository: the only
    # event this workflow acts on (the condition every job below repeats or needs this job for).
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      code: ${{ steps.plan.outputs.code }}
      site: ${{ steps.plan.outputs.site }}
      pipeline: ${{ steps.plan.outputs.pipeline }}
    steps:
      # The whole history and every tag: the files changed since the highest release tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo build -p xtask --locked
      - name: The next version, and what the push is
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          # The stop switch: any value refuses every release until an admin clears it.
          FREEZE: ${{ vars.RELEASE_FREEZE }}
        run: cargo xtask release plan --repo "$GITHUB_REPOSITORY" --sha "$COMMIT" --freeze "$FREEZE" --output "$GITHUB_OUTPUT"

  verify:
    needs: [plan]
    # Not for a push that ships nothing, nor one that changes the pipeline.
    if: ${{ needs.plan.outputs.code == 'true' && needs.plan.outputs.pipeline != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      attestations: read
    outputs:
      package-version: ${{ steps.package.outputs.package-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - run: rustup toolchain install
      # Built before any step holds a token, so no build script runs beside one.
      - run: cargo build -p xtask --locked
      # Refuses a commit not on main, a pipeline run that is not the successful push run that
      # built it, and one that no longer holds every artifact a release needs. The files are
      # downloaded from that run, so the Beta record names the run that built them.
      - name: Refuse a commit not on main, or a build that lost an artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask release locate --repo "$GITHUB_REPOSITORY" --commit "$COMMIT" --run-id "$PIPELINE_RUN"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: assets-*
          path: dist
          merge-multiple: true
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sha256sums
          path: dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      # The provenance bundle of each tarball (`<tarball>.sigstore.json`), which the sums do
      # not list: the attestation that made it signed the files they list.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bundles-*
          path: dist
          merge-multiple: true
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      # The assets artifacts carry the SHA256SUMS.<platform> files the sums were made from;
      # assembling them must give the published SHA256SUMS, and removes them from dist (they
      # are not release assets).
      - name: Set the published SHA256SUMS aside
        run: mkdir published
      - run: mv dist/SHA256SUMS published/SHA256SUMS
      - name: Assemble SHA256SUMS, which must be the published one
        run: cargo xtask sums assemble dist --expect published/SHA256SUMS
      - name: Check the files against SHA256SUMS
        working-directory: dist
        run: sha256sum --check --strict SHA256SUMS
      - name: Every file is listed once, matches, and is an asset of this commit, with its bundle
        run: cargo xtask release check dist --commit "$COMMIT"
      - name: Fetch the Sigstore trusted root, for the offline check of the bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation trusted-root > "$RUNNER_TEMP/trusted_root.jsonl"
      - name: Verify every attestation as a deployment does, and every bundle as a host does
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask verify-assets attestations dist --repo "$GITHUB_REPOSITORY" --workflow-ref "$GITHUB_REPOSITORY/.github/workflows/artifacts.yml" --commit "$COMMIT" --trusted-root "$RUNNER_TEMP/trusted_root.jsonl"
      # The Debian version of the native package, read from the control files of the two native
      # .debs, which must agree: the version every apt job below is given.
      - name: The version of the native package, from the two .debs
        id: package
        run: cargo xtask channels apt version --debs dist --commit "$COMMIT" --output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: dist/
          retention-days: 7
          if-no-files-found: error

  tag:
    needs: [plan, verify]
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository && needs.plan.outputs.code == 'true' && needs.plan.outputs.pipeline != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The release bot's key is read only by jobs of this environment; a branch policy that
    # admits main alone is a setting (docs/artifacts.md, "Releases").
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - run: rustup toolchain install
      # Built before any step holds a token, so no build script runs beside one.
      - run: cargo build -p xtask --locked
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist
      # The Beta record is the tag's message, an audit record nothing gates on.
      - name: Write the Beta record
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: cargo xtask release verdict-write dist --commit "$COMMIT" --tag "$TAG" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --pipeline-run "$PIPELINE_RUN" --out verdict.json
      # The token of the release bot, for this repository alone and for contents only.
      - name: The release bot's token
        id: bot
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - name: Create the annotated tag at this commit (create-only)
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: cargo xtask release tag --repo "$GITHUB_REPOSITORY" --sha "$COMMIT" --tag "$TAG" --message-file verdict.json

  notes:
    needs: [plan, verify, tag]
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository && needs.plan.outputs.code == 'true' && needs.plan.outputs.pipeline != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      attestations: read
    env:
      TAG: ${{ needs.plan.outputs.tag }}
    outputs:
      set-hash: ${{ steps.verify-tag.outputs.set-hash }}
    steps:
      # The whole history, every branch and every tag: the annotated tag object (whose
      # message is the Beta record) and origin/main, which the tag check and the notes read.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo build -p xtask --locked
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist
      - name: Check the files against SHA256SUMS
        working-directory: dist
        run: sha256sum --check --strict SHA256SUMS
      - name: Every file is listed once, matches, and is an asset of this commit, with its bundle
        run: cargo xtask release check dist --commit "$COMMIT"
      - name: Fetch the Sigstore trusted root, for the offline check of the bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation trusted-root > "$RUNNER_TEMP/trusted_root.jsonl"
      - name: Verify every attestation as a deployment does, and every bundle as a host does
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask verify-assets attestations dist --repo "$GITHUB_REPOSITORY" --workflow-ref "$GITHUB_REPOSITORY/.github/workflows/artifacts.yml" --commit "$COMMIT" --trusted-root "$RUNNER_TEMP/trusted_root.jsonl"
      - name: The tag names this commit, which is on main; the set of these files
        id: verify-tag
        run: cargo xtask release verify dist --tag "$TAG" --commit "$COMMIT" --output "$GITHUB_OUTPUT"
      # What the release changes about going back (section 8.3) is read from the builds
      # themselves: `kbf --version --json` of this release and of the one before it. A
      # binary runs here only after the attestation step above has verified the files it
      # comes from (the workflow lint holds the order). No previous release, no second file.
      - name: The release before this one, if any
        id: previous
        run: cargo xtask release previous --tag "$TAG" --commit "$COMMIT" --output "$GITHUB_OUTPUT"
      - name: This release's identity, from the verified linux tarball
        run: cargo xtask release identity dist --commit "$COMMIT" --out version.json
      - name: The previous release's files
        if: ${{ steps.previous.outputs.previous != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS: ${{ steps.previous.outputs.previous }}
        run: gh release download "$PREVIOUS" --repo "$GITHUB_REPOSITORY" --dir previous
      - name: The previous release's files against its SHA256SUMS
        if: ${{ steps.previous.outputs.previous != '' }}
        working-directory: previous
        run: sha256sum --check --strict SHA256SUMS
      # The previous release is held to the same rules as this one: the version facts of its `kbf`,
      # and the facts and the CycloneDX SBOM of its task image, are all listed. No flag waives them
      # (the workflow lint refuses one on either `release check`).
      - name: Every one is an asset of the previous release's commit, with its bundle
        if: ${{ steps.previous.outputs.previous != '' }}
        env:
          PREVIOUS_COMMIT: ${{ steps.previous.outputs.previous-commit }}
        run: cargo xtask release check previous --commit "$PREVIOUS_COMMIT"
      - name: Verify the previous release's attestations as these were
        if: ${{ steps.previous.outputs.previous != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_COMMIT: ${{ steps.previous.outputs.previous-commit }}
        run: cargo xtask verify-assets attestations previous --repo "$GITHUB_REPOSITORY" --workflow-ref "$GITHUB_REPOSITORY/.github/workflows/artifacts.yml" --commit "$PREVIOUS_COMMIT" --trusted-root "$RUNNER_TEMP/trusted_root.jsonl"
      - name: The previous release's identity, from its verified linux tarball
        if: ${{ steps.previous.outputs.previous != '' }}
        env:
          PREVIOUS_COMMIT: ${{ steps.previous.outputs.previous-commit }}
        run: cargo xtask release identity previous --commit "$PREVIOUS_COMMIT" --out previous-version.json
      # Refuses (fail closed) when there is a previous release and no file for it (the path
      # is empty when there is none), and when the file names another build.
      - name: Write the release notes
        env:
          PREVIOUS_IDENTITY: ${{ steps.previous.outputs.previous != '' && 'previous-version.json' || '' }}
        run: cargo xtask release notes dist --tag "$TAG" --commit "$COMMIT" --version-json version.json --previous-version-json "$PREVIOUS_IDENTITY" --out release-notes.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: release-notes.md
          retention-days: 7
          if-no-files-found: error

  # The files the earlier jobs checked, as a release of the tag.
  publish:
    needs: [plan, verify, tag, notes]
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository && needs.plan.outputs.code == 'true' && needs.plan.outputs.pipeline != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - run: rustup toolchain install
      # Built before any step holds the token, so no build script runs beside it.
      - run: cargo build -p xtask --locked
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist
      # The notes the notes job wrote: the release body.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes
      - name: Check the files against SHA256SUMS
        working-directory: dist
        run: sha256sum --check --strict SHA256SUMS
      - name: Create the release, or add the files it lacks
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          SET_HASH: ${{ needs.notes.outputs.set-hash }}
        run: cargo xtask release publish dist --repo "$GITHUB_REPOSITORY" --tag "$TAG" --commit "$COMMIT" --run-id "$RUN_ID" --set-hash "$SET_HASH" --notes-file release-notes.md

  bump:
    needs: [plan, tag, publish]
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository && needs.plan.outputs.code == 'true' && needs.plan.outputs.pipeline != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - run: rustup toolchain install
      # Built before any step holds a token, so no build script runs beside one.
      - run: cargo build -p xtask --locked
      # The release bot's token for the internal repository alone: its contents and pull requests.
      - name: The release bot's token
        id: bot
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: komira-ai
          repositories: komira-internal
          permission-contents: write
          permission-pull-requests: write
      - name: Open the pull request that moves the internal repository's submodule to this release
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: cargo xtask release bump-internal --repo "$GITHUB_REPOSITORY" --version "$VERSION" --sha "$COMMIT" --internal-repo komira-ai/komira-internal --submodule kbf

  # The update rehearsal, which the gamma stage needs: a host laid out by hand from the release
  # before this one, as a farm node is, is updated to the release just published by the real
  # helper under the real systemd, through its local socket, the way the updater agent asks for
  # it; the helper fetches the release from this repository's releases itself
  # (crates/kbf-host-install/tests/update_rehearsal.rs). A release the hosts cannot take stops
  # here, before the farm is told about it. It holds `contents: read` and no secret; sudo clears
  # the environment, so the run's read-only token and the release's tag are left in files.
  rehearse:
    needs: [plan, publish]
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository && needs.plan.outputs.code == 'true' && needs.plan.outputs.pipeline != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - run: rustup toolchain install
      - name: Token file of the rehearsal, readable by its owner alone
        run: install -m 0600 /dev/null /var/tmp/kbf-update-rehearsal.token
      - name: Token of the rehearsal
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" > /var/tmp/kbf-update-rehearsal.token
      - name: The release the rehearsal updates to
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: printf '%s\n' "$TAG" > /var/tmp/kbf-update-rehearsal.to
      - run: cargo xtask sudo-test -p kbf-host-install --test update_rehearsal -- --exact the_helper_updates_a_hand_laid_host_from_the_last_release_to_the_next --nocapture

  # The rehearsal of the control loop, which the gamma stage needs too: the host of the rehearsal
  # above is updated by the real agent that the real coordinator of this commit orders, after
  # `cargo xtask deploy-farm` told that coordinator "desired = this release"; the farm's frontend
  # is the release before this one, and only the issuer of the OIDC token is a stand-in
  # (crates/kbf-host-install/tests/update_rehearsal_agent.rs). A release whose version the hosts
  # never report, or whose coordinator and agent do not agree, stops here. It holds
  # `contents: read` and no secret, as the rehearsal above.
  rehearse-agent:
    needs: [plan, publish]
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository && needs.plan.outputs.code == 'true' && needs.plan.outputs.pipeline != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - run: rustup toolchain install
      - name: Token file of the rehearsal, readable by its owner alone
        run: install -m 0600 /dev/null /var/tmp/kbf-update-rehearsal.token
      - name: Token of the rehearsal
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" > /var/tmp/kbf-update-rehearsal.token
      - name: The release the rehearsal updates to
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: printf '%s\n' "$TAG" > /var/tmp/kbf-update-rehearsal.to
      - name: The coordinator of this commit
        run: cargo build --locked -p kbf-coordinator
      - run: cargo xtask sudo-test -p kbf-host-install --test update_rehearsal_agent -- --exact the_agent_updates_the_host_when_the_coordinator_is_told_the_next_release --nocapture

  # deploy-digest and deploy: the frontend on Docker Swarm (docs/deploy/swarm-frontend.md). They
  # run only while the repository variables CP_DEPLOY_ENDPOINT and CP_DEPLOY_TAILSCALE_TAGS are
  # both not empty: with either unset or empty, both jobs are skipped and the release ends as it
  # did without them. CP_DEPLOY_TAILSCALE_TAGS is the tailnet tag the deploy runner joins
  # with, one its Tailscale workload-identity client can issue. The workflow lint
  # (crates/kbf-integration-test/tests/release_workflow, `deploy.rs`) holds the two jobs to
  # this shape.
  #
  # deploy-digest  reads the published release (`contents: read`) and nothing else: `cargo
  #          xtask release image-digest` downloads SHA256SUMS, the linux-x86_64 frontend image
  #          and its bundle, holds the image to the sums, and outputs the manifest digest its
  #          index.json names and the release's download addresses of the image and the bundle.
  # deploy   calls the reusable workflow deploy.yml of komira-ai/docker-swarm-updater, pinned
  #          like any action by a full commit with its version comment, with exactly
  #          `id-token: write`: the called workflow asks GitHub for an OIDC token for every
  #          request and runs in this repository's environment `controlplane` (main only, no
  #          required reviewer, no wait timer). It sends the service `kbf-frontend`, the commit
  #          as the version, that digest and those addresses; docker-swarm-updater checks the
  #          token's claims and the bundle against this repository's artifacts.yml on main,
  #          then updates the service by digest, and Swarm rolls back an update whose task does
  #          not become ready. The run is a `workflow_run` of main, so the token's `ref` is
  #          refs/heads/main. It needs `gamma`: the frontend takes a release only after the
  #          farm has. The job ends once the deploy is reported converged and fails otherwise;
  #          it waits up to 240 minutes, since a frontend's drain waits for its open work.
  deploy-digest:
    needs: [plan, publish]
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository && needs.plan.outputs.code == 'true' && needs.plan.outputs.pipeline != 'true' && vars.CP_DEPLOY_ENDPOINT != '' && vars.CP_DEPLOY_TAILSCALE_TAGS != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.image.outputs.digest }}
      image-url: ${{ steps.image.outputs.image-url }}
      bundle-url: ${{ steps.image.outputs.bundle-url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - run: rustup toolchain install
      # Built before any step holds a token, so no build script runs beside one.
      - run: cargo build -p xtask --locked
      - name: The frontend image's manifest digest and the release's addresses of it and its bundle
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: cargo xtask release image-digest --repo "$GITHUB_REPOSITORY" --tag "$TAG" --commit "$COMMIT" --output "$GITHUB_OUTPUT"

  deploy:
    needs: [plan, gamma, deploy-digest]
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository && needs.plan.outputs.code == 'true' && needs.plan.outputs.pipeline != 'true' && vars.CP_DEPLOY_ENDPOINT != '' && vars.CP_DEPLOY_TAILSCALE_TAGS != '' }}
    permissions:
      id-token: write
    uses: komira-ai/docker-swarm-updater/.github/workflows/deploy.yml@c1fcc47610e2886d4d9e561be3c0c76f0452d1f6 # v0.1.3
    with:
      service: kbf-frontend
      version: ${{ github.event.workflow_run.head_sha }}
      image-digest: ${{ needs.deploy-digest.outputs.digest }}
      image-url: ${{ needs.deploy-digest.outputs.image-url }}
      bundle-url: ${{ needs.deploy-digest.outputs.bundle-url }}
      endpoint: ${{ vars.CP_DEPLOY_ENDPOINT }}
      audience: ${{ vars.CP_DEPLOY_AUDIENCE }}
      environment: controlplane
      wait-minutes: 240
      tailscale-oauth-client-id: ${{ vars.CP_DEPLOY_TAILSCALE_CLIENT_ID }}
      tailscale-audience: ${{ vars.CP_DEPLOY_TAILSCALE_AUDIENCE }}
      tailscale-tags: ${{ vars.CP_DEPLOY_TAILSCALE_TAGS }}

  # The gamma stage, the last step of a release. The farm's Linux nodes are deployed by
  # hostkeeper, which hostkeeper-desired.yml tells after this workflow (it is on when the
  # repository variable KBF_SETS_DESIRED is `true`), so this job no longer sets kbf's update
  # coordinator. What it still does is prove the farm: when KBF_SETS_DESIRED is `true`, it joins
  # the farm's Tailscale network and builds a small project against the farm with Buck2, remote
  # only. Its first step after the checkout prints a notice that says so, and every later step
  # runs only under that variable, so with it unset the job ends green after the notice. It holds
  # the run's OIDC token (`id-token: write`) for the tailnet join alone, no write scope and no
  # secret. The release stays published whatever this job says.
  gamma:
    needs: [plan, publish, rehearse, rehearse-agent]
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository && needs.plan.outputs.code == 'true' && needs.plan.outputs.pipeline != 'true' }}
    runs-on: ubuntu-24.04
    # Every step has a timeout of its own, and the job's is at least their sum.
    timeout-minutes: 90
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      BUCK2_VERSION: 2026-10-01
      BUCK2_SHA256: 828aba01bf80e8ba50ed27d89be86efe0246b3807c3d040e1ea7b4810a55fb78
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: The farm's Linux nodes are deployed by hostkeeper
        timeout-minutes: 1
        run: echo "::notice title=gamma::The farm's Linux nodes are deployed by hostkeeper, which hostkeeper-desired.yml tells after this workflow when the repository variable KBF_SETS_DESIRED is true. This job no longer sets kbf's update coordinator, and its other steps run only when that variable is true."
      - run: rustup toolchain install
        timeout-minutes: 10
        if: ${{ vars.KBF_SETS_DESIRED == 'true' }}
      # The tailnet's address and key are in the environment of every later step of this job, the
      # build's scripts included: the build runs from the locked dependency set.
      - run: cargo build -p xtask --locked
        timeout-minutes: 30
        if: ${{ vars.KBF_SETS_DESIRED == 'true' }}
      # When the farm is reachable only on a Tailscale network: join it, after the build (its
      # scripts never see that network), as an ephemeral node. Tailscale's workload identity
      # federation takes this run's OIDC token, so the job still holds no secret. The client id and
      # the audience are the variables TS_CLIENT_ID and TS_AUDIENCE, the trust credential CI jobs
      # join the network with, as `tag:ci`. With TS_CLIENT_ID or FARM_ADDRESS unset (a fork, a
      # repository with no farm or no network) the step is skipped.
      - name: Join the farm's Tailscale network
        timeout-minutes: 5
        if: ${{ vars.KBF_SETS_DESIRED == 'true' && vars.TS_CLIENT_ID != '' && vars.FARM_ADDRESS != '' }}
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ vars.TS_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:ci
      # The proof. Build a small project (four `/bin/sh -c` actions that depend on each other)
      # against the farm with remote execution on and local off, and read Buck2's own count of the
      # actions it ran: some remote, none local. The run id and attempt are an argument of every
      # action, so none is answered from a cache. The farm's address, instance, TLS and platform
      # properties are the organisation variables FARM_*; with FARM_ADDRESS unset the verb prints a
      # notice and passes.
      - name: Fetch buck2 (pinned version, checked by SHA-256)
        timeout-minutes: 5
        if: ${{ vars.KBF_SETS_DESIRED == 'true' }}
        run: cargo xtask fetch --url "https://github.com/facebook/buck2/releases/download/$BUCK2_VERSION/buck2-x86_64-unknown-linux-gnu.zst" --sha256 "$BUCK2_SHA256" --out "$RUNNER_TEMP/tools/buck2" --extract zst
      - name: Prove the farm with a remote-only Buck2 build
        timeout-minutes: 20
        if: ${{ vars.KBF_SETS_DESIRED == 'true' }}
        env:
          FARM_ADDRESS: ${{ vars.FARM_ADDRESS }}
          FARM_INSTANCE: ${{ vars.FARM_INSTANCE }}
          FARM_TLS: ${{ vars.FARM_TLS }}
          FARM_PROPERTIES: ${{ vars.FARM_LINUX_X86_64_PROPERTIES }}
          NONCE: ${{ github.run_id }}-${{ github.run_attempt }}
        run: cargo xtask prove-farm --address "$FARM_ADDRESS" --instance "$FARM_INSTANCE" --tls "$FARM_TLS" --properties "$FARM_PROPERTIES" --buck2 "$RUNNER_TEMP/tools/buck2" --project crates/kbf-integration-test/gamma/buck2 --nonce "$NONCE"

  # Builds the `xtask` binary that every apt read, index and write job runs. A job of its own so
  # that the build, whose scripts run code from the locked dependency set, is in no job that holds
  # `id-token: write` or the signing key.
  deploy-tool:
    needs: [plan]
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository && needs.plan.outputs.code == 'true' && needs.plan.outputs.pipeline != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo build -p xtask --locked --release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deploy-tool
          path: target/release/xtask
          if-no-files-found: error
          retention-days: 1

  # PUBLICATION, the apt repository of the organisation's products (packages.komira.ai/apt), suite
  # `testing`: the release's two native .debs (`kbf-native-<commit>-linux-<platform>.deb`), signed
  # into the pool pool/kbf/ and the index of the suite. The same three jobs, and up to three
  # attempts, for each suite, and no job holds both the signing key and the cloud role. No job
  # that holds one of them checks out the repository or compiles: each downloads the `xtask` that
  # `deploy-tool` built, in a job with no token and no secret, and runs `tool/xtask channels ...`:
  #   testing-apt-read   (environment apt-publish: the role, no key) reads the index of the suite
  #                      with the ETag of each object, from S3, never through the CDN;
  #   testing-apt-index  (environment apt-signing: the key, no role) checks the files against
  #                      SHA256SUMS and each .deb against its bundle, merges the .debs into the
  #                      index that was read (every other product's entries are kept) and signs
  #                      Release;
  #   testing-apt-write  (environment apt-publish) checks the files again, uploads each .deb once,
  #                      then writes the signed index with If-Match on the ETags that were read.
  # A write that finds the index changed in between (another product's release) reports
  # conflict=true and ends green; attempt 2 (the jobs with the suffix -2), and then 3, read, merge
  # and sign again, and the last one fails instead of asking for a fourth. A job without its
  # settings (the variables of the environments apt-publish and apt-signing) ends green with a
  # notice and writes nothing. The version of the package is the output `package-version` of
  # `verify`, which read it from the two .debs.

  testing-apt-read:
    needs: [plan, publish, deploy-tool]
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository && needs.plan.outputs.code == 'true' && needs.plan.outputs.pipeline != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: apt-publish
    permissions:
      contents: read
      id-token: write
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deploy-tool
          path: tool
      - name: Make the tool executable
        run: chmod +x tool/xtask
      - name: Gate on the settings of the apt repository, a job without them does nothing and ends green
        id: gate
        env:
          APT_PUBLISH_ROLE_ARN: ${{ vars.APT_PUBLISH_ROLE_ARN }}
          APT_BUCKET: ${{ vars.APT_BUCKET }}
          APT_DISTRIBUTION_ID: ${{ vars.APT_DISTRIBUTION_ID }}
          APT_HOSTNAME: ${{ vars.APT_HOSTNAME }}
        run: tool/xtask channels gate --label testing-apt-read --output "$GITHUB_OUTPUT" --setting "APT_PUBLISH_ROLE_ARN=$APT_PUBLISH_ROLE_ARN" --setting "APT_BUCKET=$APT_BUCKET" --setting "APT_DISTRIBUTION_ID=$APT_DISTRIBUTION_ID" --setting "APT_HOSTNAME=$APT_HOSTNAME"
      - name: Assume the apt publish role through OIDC
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        env:
          ROLE_ARN: ${{ vars.APT_PUBLISH_ROLE_ARN }}
        run: tool/xtask channels assume --role-arn "$ROLE_ARN" --session-name "kbf-testing-apt-read-$GITHUB_RUN_ID" --region us-east-1 --env-file "$GITHUB_ENV" --token-url "$ACTIONS_ID_TOKEN_REQUEST_URL"
      - name: Read the current index and the ETag of each object from S3, never through the CDN, which caches the index
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        env:
          APT_BUCKET: ${{ vars.APT_BUCKET }}
        run: tool/xtask channels apt read --suite testing --bucket "$APT_BUCKET" --out "$RUNNER_TEMP/apt-current"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        with:
          name: apt-current
          path: ${{ runner.temp }}/apt-current
          if-no-files-found: error
          retention-days: 1

  testing-apt-index:
    needs: [plan, verify, testing-apt-read, deploy-tool]
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository && needs.plan.outputs.code == 'true' && needs.plan.outputs.pipeline != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: apt-signing
    permissions:
      contents: read
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
      signed: ${{ steps.sign.outputs.signed }}
    env:
      PACKAGE_VERSION: ${{ needs.verify.outputs.package-version }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deploy-tool
          path: tool
      - name: Make the tool executable
        run: chmod +x tool/xtask
      - name: Gate on the signing key and on the read, a job without them does nothing and ends green
        id: gate
        env:
          READ_ENABLED: ${{ needs.testing-apt-read.outputs.enabled }}
          APT_GPG_FINGERPRINT: ${{ vars.APT_GPG_FINGERPRINT }}
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: tool/xtask channels gate --label testing-apt-index --output "$GITHUB_OUTPUT" --require "READ_ENABLED=$READ_ENABLED" --setting "APT_GPG_FINGERPRINT=$APT_GPG_FINGERPRINT" --secret APT_GPG_PRIVATE_KEY --secret APT_GPG_PASSPHRASE
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        with:
          name: apt-current
          path: ${{ runner.temp }}/apt-current
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        with:
          name: release-assets
          path: dist
      - name: The files are exactly the assets of this run, and match SHA256SUMS
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        working-directory: dist
        run: sha256sum --check --strict SHA256SUMS
      - name: The amd64 .deb is the one artifacts.yml attested, from main at this commit (from its bundle)
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh attestation verify "dist/kbf-native-$COMMIT-linux-x86_64.deb" --bundle "dist/kbf-native-$COMMIT-linux-x86_64.deb.sigstore.json" --repo "$REPO" --signer-workflow "$REPO/.github/workflows/artifacts.yml" --source-ref refs/heads/main --source-digest "$COMMIT" --deny-self-hosted-runners
      - name: The arm64 .deb is the one artifacts.yml attested, from main at this commit (from its bundle)
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh attestation verify "dist/kbf-native-$COMMIT-linux-arm64.deb" --bundle "dist/kbf-native-$COMMIT-linux-arm64.deb.sigstore.json" --repo "$REPO" --signer-workflow "$REPO/.github/workflows/artifacts.yml" --source-ref refs/heads/main --source-digest "$COMMIT" --deny-self-hosted-runners
      - name: Merge the .debs into the index that was read, the entries of every other product are kept
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        env:
          OWNER: ${{ github.repository_owner }}
        run: tool/xtask channels apt index --suite testing --current "$RUNNER_TEMP/apt-current" --out "$RUNNER_TEMP/apt-next" --debs dist --commit "$COMMIT" --version "$PACKAGE_VERSION" --origin "$OWNER" --label "$OWNER" --description "$OWNER packages"
      - name: Sign Release with the signing subkey, InRelease and Release.gpg, then remove the key
        id: sign
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        env:
          APT_GPG_FINGERPRINT: ${{ vars.APT_GPG_FINGERPRINT }}
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: tool/xtask channels apt sign --dir "$RUNNER_TEMP/apt-next/dists/testing" --work "$RUNNER_TEMP/apt-sign" --fingerprint "$APT_GPG_FINGERPRINT" --key-env APT_GPG_PRIVATE_KEY --passphrase-env APT_GPG_PASSPHRASE --output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        with:
          name: apt-next
          path: |
            ${{ runner.temp }}/apt-next/dists
            ${{ runner.temp }}/apt-next/etags.txt
          if-no-files-found: error
          retention-days: 1

  testing-apt-write:
    needs: [plan, verify, testing-apt-read, testing-apt-index, deploy-tool]
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository && needs.plan.outputs.code == 'true' && needs.plan.outputs.pipeline != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: apt-publish
    permissions:
      contents: read
      id-token: write
    outputs:
      conflict: ${{ steps.put.outputs.conflict }}
    env:
      PACKAGE_VERSION: ${{ needs.verify.outputs.package-version }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deploy-tool
          path: tool
      - name: Make the tool executable
        run: chmod +x tool/xtask
      - name: Gate on the settings of the apt repository and on the signed index, a job without them does nothing and ends green
        id: gate
        env:
          READ_ENABLED: ${{ needs.testing-apt-read.outputs.enabled }}
          INDEX_SIGNED: ${{ needs.testing-apt-index.outputs.signed }}
