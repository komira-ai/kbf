  # INSTALL CHECK (release time only; a failure stops the promotion before anything is made public
  # to the hosts). check-apt-amd64 and check-apt-arm64: a clean Ubuntu container, pinned by digest,
  # on a hosted runner of its architecture, adds packages.komira.ai with the published keyring and
  # the suite `testing`, installs kbf=<version>, and holds the installed system to what the package
  # promises (`xtask channels check-apt`). The two are separate jobs because this repository's
  # workflow lint refuses an expression in `runs-on`. The xtask binary built on the runner, which
  # holds no token, is mounted into the container, which has nothing else of this repository. They
  # run only when a write of testing landed.
  check-apt-amd64:
    needs: [plan, verify, testing-apt-write, testing-apt-write-2, testing-apt-write-3]
    if: ${{ !cancelled() && !failure() && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository && needs.plan.outputs.code == 'true' && needs.plan.outputs.pipeline != 'true' && (needs.testing-apt-write.outputs.conflict == 'false' || needs.testing-apt-write-2.outputs.conflict == 'false' || needs.testing-apt-write-3.outputs.conflict == 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      PACKAGE_VERSION: ${{ needs.verify.outputs.package-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo build -p xtask --locked
      - name: Install kbf from the suite testing in a clean Ubuntu container
        run: docker run --rm --volume "$PWD/target/debug/xtask:/usr/local/bin/xtask:ro" ubuntu@sha256:fe81560990fae86dc4743202b2cb4d3df98d0bcf949173cecef15ce1127ef852 xtask channels check-apt --arch amd64 --version "$PACKAGE_VERSION" --commit "$COMMIT"

  check-apt-arm64:
    needs: [plan, verify, testing-apt-write, testing-apt-write-2, testing-apt-write-3]
    if: ${{ !cancelled() && !failure() && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository && needs.plan.outputs.code == 'true' && needs.plan.outputs.pipeline != 'true' && (needs.testing-apt-write.outputs.conflict == 'false' || needs.testing-apt-write-2.outputs.conflict == 'false' || needs.testing-apt-write-3.outputs.conflict == 'false') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      PACKAGE_VERSION: ${{ needs.verify.outputs.package-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
