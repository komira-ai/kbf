        run: tool/xtask channels assume --role-arn "$ROLE_ARN" --session-name "kbf-stable-apt-read-$GITHUB_RUN_ID" --region us-east-1 --env-file "$GITHUB_ENV" --token-url "$ACTIONS_ID_TOKEN_REQUEST_URL"
