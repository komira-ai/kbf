# A GitHub release of the exact files the artifacts workflow built and attested for one
# commit on main (docs/artifacts.md). Nothing is rebuilt: the files are the ones the
# push run of artifacts.yml on main left for that commit, checked again here, so a held
# script can pin a release asset, which outlives the run's 90-day workflow artifacts.
#
# Pushing a tag `v*` cuts a release of the commit the tag names. The verify job, with
# read-only scopes, refuses a commit that is not on main and one with no successful
# main push run of artifacts.yml (cargo xtask release locate, crates/xtask/src/release.rs),
# downloads that run's artifacts, checks them against SHA256SUMS, refuses a file that is
# not an asset of the commit, or a tarball without its provenance bundle (cargo xtask
# release check), and verifies every attestation as a deployment does and every bundle
# offline for the commit as a host does (cargo xtask verify-assets attestations). Only
# then does the publish job create the release with those files and the bundles, or add
# the ones an existing release lacks. It is the one job that may write: `contents: write`, under the exact tag-push
# `if:` the workflow lint (crates/kbf-integration-test/tests/workflows) requires for that scope. A
# re-run creates no second release and replaces no asset: every asset the release
# already holds must be one of the verified files, byte for byte, or the run fails and
# changes nothing.
#
# The tag is annotated and its message is the Beta record (docs/design/kbf-cicd.md,
# section 8.1), an audit record that nothing gates on. The verify job checks the tag
# (cargo xtask release verify): it names this commit, which is on main; it prints the hash of
# the set of files SHA256SUMS lists, which publish must be given. It reads no verdict. It
# writes the release notes (cargo xtask release notes) and uploads them as the artifact `release-notes`, so a dry run shows them before anyone approves; they start with
# "Before you click" (what is not reversible, computed from `kbf --version --json` of this
# release and the previous one, run only from attested tarballs). The publish job downloads
# that artifact and its body is that file (`release publish --notes-file`). It runs in the
# `prod` environment, whose required reviewer approves it.
#
# Run by hand (workflow_dispatch) with a commit and a tag, only the verify job runs: a dry run
# of every check that publishes nothing. The workflow lint (crates/kbf-integration-test/tests/release_workflow)
# holds this file to all of that.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      commit:
        description: The full SHA of a commit on main, checked as a release would check it; nothing is published
        required: true
        type: string
      tag:
        description: The annotated v* tag whose message is the Beta record, checked as a release would check it
        required: true
        type: string

permissions: {}

# One release at a time across the repository, none cancelled: every tag push shares the one
# group `release-push` (a second tag waits for the first; a third pending one replaces the
# second while it waits, as GitHub keeps one pending run per group). A dry run by hand
# (workflow_dispatch) publishes nothing, so each has its own group and never holds a release.
concurrency:
  group: release-${{ github.event_name == 'push' && 'push' || github.run_id }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

defaults:
  run:
    shell: bash

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      attestations: read
    env:
      # The tag's commit on a tag push; the input on a dry run.
      COMMIT: ${{ github.event_name == 'push' && github.sha || inputs.commit }}
      # The pushed tag; the input on a dry run.
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    outputs:
      run-id: ${{ steps.locate.outputs.run-id }}
      set-hash: ${{ steps.verify-tag.outputs.set-hash }}
    steps:
      # The whole history, every branch and every tag: the annotated tag object (whose
      # message is the Beta record) and origin/main, which the tag check and the notes read.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install
      # Built before any step holds a token, so no build script runs beside one.
      - run: cargo build -p xtask --locked
      - name: Refuse a commit not on main; find the main push run that built it
        id: locate
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask release locate --repo "$GITHUB_REPOSITORY" --commit "$COMMIT" --output "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: assets-*
          path: dist
          merge-multiple: true
          run-id: ${{ steps.locate.outputs.run-id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sha256sums
          path: dist
          run-id: ${{ steps.locate.outputs.run-id }}
          github-token: ${{ github.token }}
      # The provenance bundle of each tarball (`<tarball>.sigstore.json`), which the sums do
      # not list: the attestation that made it signed the files they list.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bundles-*
          path: dist
          merge-multiple: true
          run-id: ${{ steps.locate.outputs.run-id }}
          github-token: ${{ github.token }}
      - name: Check the files against SHA256SUMS
        working-directory: dist
        run: sha256sum --check --strict SHA256SUMS
      - name: Every file is listed once, matches, and is an asset of this commit, with its bundle
        run: cargo xtask release check dist --commit "$COMMIT"
      - name: Fetch the Sigstore trusted root, for the offline check of the bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation trusted-root > "$RUNNER_TEMP/trusted_root.jsonl"
      - name: Verify every attestation as a deployment does, and every bundle as a host does
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask verify-assets attestations dist --repo "$GITHUB_REPOSITORY" --workflow-ref "$GITHUB_REPOSITORY/.github/workflows/artifacts.yml" --commit "$COMMIT" --trusted-root "$RUNNER_TEMP/trusted_root.jsonl"
      - name: The tag names this commit, which is on main; the set of these files
        id: verify-tag
        run: cargo xtask release verify dist --tag "$TAG" --commit "$COMMIT" --output "$GITHUB_OUTPUT"
      # What the release changes about going back (section 8.3) is read from the builds
      # themselves: `kbf --version --json` of this release and of the one before it. A
      # binary runs here only after the attestation step above has verified the files it
      # comes from (the workflow lint holds the order). No previous release, no second file.
      - name: The release before this one, if any
        id: previous
        run: cargo xtask release previous --tag "$TAG" --commit "$COMMIT" --output "$GITHUB_OUTPUT"
      - name: This release's identity, from the verified linux tarball
        run: cargo xtask release identity dist --commit "$COMMIT" --out version.json
      - name: The previous release's files
        if: ${{ steps.previous.outputs.previous != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS: ${{ steps.previous.outputs.previous }}
        run: gh release download "$PREVIOUS" --repo "$GITHUB_REPOSITORY" --dir previous
      - name: The previous release's files against its SHA256SUMS
        if: ${{ steps.previous.outputs.previous != '' }}
        working-directory: previous
        run: sha256sum --check --strict SHA256SUMS
      # The release before the build jobs recorded version facts has none, and this is the
      # only check that waives them: the release being made (`release check dist`) never does.
      # Remove the flag once the release before this one was made with the facts.
      - name: Every one is an asset of the previous release's commit, with its bundle
        if: ${{ steps.previous.outputs.previous != '' }}
        env:
          PREVIOUS_COMMIT: ${{ steps.previous.outputs.previous-commit }}
        run: cargo xtask release check previous --commit "$PREVIOUS_COMMIT" --without-version-facts
      - name: Verify the previous release's attestations as these were
        if: ${{ steps.previous.outputs.previous != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_COMMIT: ${{ steps.previous.outputs.previous-commit }}
        run: cargo xtask verify-assets attestations previous --repo "$GITHUB_REPOSITORY" --workflow-ref "$GITHUB_REPOSITORY/.github/workflows/artifacts.yml" --commit "$PREVIOUS_COMMIT" --trusted-root "$RUNNER_TEMP/trusted_root.jsonl"
      - name: The previous release's identity, from its verified linux tarball
        if: ${{ steps.previous.outputs.previous != '' }}
        env:
          PREVIOUS_COMMIT: ${{ steps.previous.outputs.previous-commit }}
        run: cargo xtask release identity previous --commit "$PREVIOUS_COMMIT" --out previous-version.json
      # Refuses (fail closed) when there is a previous release and no file for it (the path
      # is empty when there is none), and when the file names another build.
      - name: Write the release notes
        env:
          PREVIOUS_IDENTITY: ${{ steps.previous.outputs.previous != '' && 'previous-version.json' || '' }}
        run: cargo xtask release notes dist --tag "$TAG" --commit "$COMMIT" --version-json version.json --previous-version-json "$PREVIOUS_IDENTITY" --out release-notes.md
      # Shown by a dry run; the release is made from the verified files only.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: release-notes.md
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: dist/
          retention-days: 7
          if-no-files-found: error

  # Tag push only: the files the verify job checked, as a release of the tag.
  publish:
    needs: [verify]
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The required reviewer of this environment approves the publish.
    environment: prod
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      # Built before any step holds the token, so no build script runs beside it.
      - run: cargo build -p xtask --locked
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist
      # The notes the approver read in the dry run and in verify: the release body.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes
      - name: Create the release, or add the files it lacks
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ needs.verify.outputs.run-id }}
          SET_HASH: ${{ needs.verify.outputs.set-hash }}
        run: cargo xtask release publish dist --repo "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME" --commit "$GITHUB_SHA" --run-id "$RUN_ID" --set-hash "$SET_HASH" --notes-file release-notes.md
      # The kbf.dev upload (packages, attestations, checksums to the bucket, and the site
      # sync) goes here, after the release exists, through a GitHub OIDC deploy role. It is
      # a separate change: it adds its scope to WRITERS in
      # crates/kbf-integration-test/tests/release_workflow and settles how the workflow lint admits
      # `id-token: write` under a tag push.
