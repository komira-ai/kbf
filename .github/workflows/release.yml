        if: ${{ steps.gate.outputs.enabled == 'true' }}
        env:
          APT_GPG_FINGERPRINT: ${{ vars.APT_GPG_FINGERPRINT }}
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: tool/xtask channels apt sign --dir "$RUNNER_TEMP/apt-next/dists/stable" --work "$RUNNER_TEMP/apt-sign" --fingerprint "$APT_GPG_FINGERPRINT" --key-env APT_GPG_PRIVATE_KEY --passphrase-env APT_GPG_PASSPHRASE --output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        with:
          name: apt-promoted
          path: |
            ${{ runner.temp }}/apt-next/dists
            ${{ runner.temp }}/apt-next/etags.txt
          if-no-files-found: error
          retention-days: 1

  stable-apt-write:
    needs: [plan, check-apt-amd64, check-apt-arm64, stable-apt-read, stable-apt-index, testing-apt-write, deploy-tool]
    if: ${{ !cancelled() && !failure() && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository && needs.plan.outputs.code == 'true' && needs.plan.outputs.pipeline != 'true' && needs.check-apt-amd64.result == 'success' && needs.check-apt-arm64.result == 'success' }}
