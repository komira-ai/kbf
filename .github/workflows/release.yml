          APT_HOSTNAME: ${{ vars.APT_HOSTNAME }}
        run: tool/xtask channels apt write --suite stable --bucket "$APT_BUCKET" --distribution-id "$APT_DISTRIBUTION_ID" --hostname "$APT_HOSTNAME" --next "$RUNNER_TEMP/apt-next" --no-pool --output "$GITHUB_OUTPUT"

  # Attempt 2: the write of attempt 1 lost the race for the index.

