# A GitHub release of the exact files the artifacts workflow built and attested for one
# commit of main (docs/artifacts.md), cut by one run that owns the whole chain. Nothing is
# rebuilt: the files are the ones the push run of artifacts.yml left for that commit, checked
# again here, so a held script can pin a release asset, which outlives the run's 90-day
# workflow artifacts.
#
# The run is started by every push to main and by hand (workflow_dispatch), and nothing else: no
# tag starts it (a tag the release bot makes would start a second run, and a hand-pushed `v*`
# tag starts nothing, since only the release bot may create one). The workflow lint
# (crates/kbf-integration-test/tests/release_workflow) pins the events, and refuses `push`
# unless every job of the chain below is present. The jobs that write run only for a push to
# main, so a dispatch is a dry run through `verify`.
#
# gates    waits for the push runs of ci, beta and artifacts for this commit on main to have
#          succeeded (cargo xtask release gates). Read-only. When a newer push to main cancelled
#          a run of this commit (the concurrency group of ci, beta or artifacts replaces the
#          older commit's pending run), and main's head is now a commit ahead of this one, the
#          job ends green with `superseded=true`: a later code release includes this commit (the
#          newer push's own run releases only when that push is code; a docs, site or pipeline
#          push releases nothing, and the next code push does). The newer commit's checks are
#          not awaited. A manual Cancel of a run of a commit main has since passed also reads
#          as superseded. Every job below is skipped on that output. A cancelled run while this commit
#          is still main's head, a failure of any kind, and a run that is absent stay red.
# plan     reads VERSION and the tags: the next version, and whether the push is code (it
#          ships in a release), the site, or the pipeline itself (cargo xtask release plan).
#          A push of docs only makes no release and the run stays green; a push that changes
#          the pipeline does not release itself, the next push that does not releases both.
# verify   refuses a commit not on main, downloads the files of the artifacts run the gates saw, checks
#          the files against SHA256SUMS and the commit's assets, and verifies every attestation
#          as a deployment does and every bundle offline as a host does. Read-only, and it
#          runs before anything is tagged.
# tag      writes the Beta record (an audit record nothing gates on) and creates the annotated
#          tag, create-only, naming exactly this commit, with a token of the release bot,
#          the only identity the `v*` tag ruleset lets create one. The token is minted in
#          this job and the bump job and nowhere else.
# notes    everything that reads the tag: `release verify` (the tag names this commit, which is
#          on main; the hash of the set of files), the identity of this release and of the one
#          before it (a binary runs only after the attestations of its files are verified
#          again), and the notes. Read-only.
# publish  the one job that holds `contents: write`: the GitHub release with those files and
#          those notes. A re-run adds the files the release lacks and replaces none. The job
#          is named `publish`; the release lint pins the job list.
# bump     opens the pull request in the internal repository that moves its submodule to the
#          released commit, with a token of the release bot scoped to that repository.
#
# A run releases one commit; a run of a superseded commit ends at `gates` (above), and a run of
# an old commit that was not superseded tags and publishes nothing (the highest
# release tag must name this commit or an ancestor of it: `release tag` and `release publish`
# both refuse otherwise). Re-run the failed jobs only: a re-run of all jobs writes another
# Beta record, and a tag that exists must carry the record it was made with.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# One release at a time across the repository, none cancelled: every push shares the one group
# `release-push` (a second push waits for the first; a third pending one replaces the second
# while it waits, as GitHub keeps one pending run per group; `plan` diffs each push from its own
# `before`, so a replaced code push is released with the next code push, not by a docs-only one).
# A dry run by hand publishes nothing, so each has its own group and never holds a release.
concurrency:
  group: release-${{ github.event_name == 'push' && 'push' || github.run_id }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

defaults:
  run:
    shell: bash

jobs:
  gates:
    runs-on: ubuntu-24.04
    # `release gates` gives up, red, after 3 hours.
    timeout-minutes: 200
    permissions:
      contents: read
      actions: read
    outputs:
      ci-run: ${{ steps.gates.outputs.ci_run }}
      beta-run: ${{ steps.gates.outputs.beta_run }}
      artifacts-run: ${{ steps.gates.outputs.artifacts_run }}
      superseded: ${{ steps.gates.outputs.superseded }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      # Built before any step holds a token, so no build script runs beside one.
      - run: cargo build -p xtask --locked
      - name: The push runs of ci, beta and artifacts for this commit on main have succeeded
        id: gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask release gates --repo "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" --branch main --output "$GITHUB_OUTPUT"

  plan:
    needs: [gates]
    # Not for a commit a newer push to main replaced.
    if: ${{ needs.gates.outputs.superseded != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      code: ${{ steps.plan.outputs.code }}
      site: ${{ steps.plan.outputs.site }}
      pipeline: ${{ steps.plan.outputs.pipeline }}
    steps:
      # The whole history and every tag: the files the push changed, and the highest tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo build -p xtask --locked
      - name: The next version, and what the push is
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          # A dispatch has no commit before it: all zeros reads as the first push, which is code.
          BEFORE: ${{ github.event.before || '0000000000000000000000000000000000000000' }}
          # The stop switch: any value refuses every release until an admin clears it.
          FREEZE: ${{ vars.RELEASE_FREEZE }}
        run: cargo xtask release plan --repo "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" --before "$BEFORE" --freeze "$FREEZE" --output "$GITHUB_OUTPUT"

  verify:
    needs: [gates, plan]
    # Not for a push that ships nothing, nor one that changes the pipeline.
    if: ${{ needs.gates.outputs.superseded != 'true' && needs.plan.outputs.code == 'true' && needs.plan.outputs.pipeline != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      attestations: read
    env:
      COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      # Built before any step holds a token, so no build script runs beside one.
      - run: cargo build -p xtask --locked
      # Refuses a commit not on main, and a main push run that no longer holds every artifact a
      # release needs. The files are downloaded from the artifacts run the gates saw, so the
      # Beta record names the run that built them.
      - name: Refuse a commit not on main, or a build that lost an artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask release locate --repo "$GITHUB_REPOSITORY" --commit "$COMMIT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: assets-*
          path: dist
          merge-multiple: true
          run-id: ${{ needs.gates.outputs.artifacts-run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sha256sums
          path: dist
          run-id: ${{ needs.gates.outputs.artifacts-run }}
          github-token: ${{ github.token }}
      # The provenance bundle of each tarball (`<tarball>.sigstore.json`), which the sums do
      # not list: the attestation that made it signed the files they list.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bundles-*
          path: dist
          merge-multiple: true
          run-id: ${{ needs.gates.outputs.artifacts-run }}
          github-token: ${{ github.token }}
      - name: Check the files against SHA256SUMS
        working-directory: dist
        run: sha256sum --check --strict SHA256SUMS
      - name: Every file is listed once, matches, and is an asset of this commit, with its bundle
        run: cargo xtask release check dist --commit "$COMMIT"
      - name: Fetch the Sigstore trusted root, for the offline check of the bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation trusted-root > "$RUNNER_TEMP/trusted_root.jsonl"
      - name: Verify every attestation as a deployment does, and every bundle as a host does
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask verify-assets attestations dist --repo "$GITHUB_REPOSITORY" --workflow-ref "$GITHUB_REPOSITORY/.github/workflows/artifacts.yml" --commit "$COMMIT" --trusted-root "$RUNNER_TEMP/trusted_root.jsonl"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: dist/
          retention-days: 7
          if-no-files-found: error

  tag:
    needs: [gates, plan, verify]
    if: ${{ needs.gates.outputs.superseded != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.plan.outputs.code == 'true' && needs.plan.outputs.pipeline != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The release bot's key is read only by jobs of this environment; a branch policy that
    # admits main alone is a setting (docs/artifacts.md, "Releases").
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      # Built before any step holds a token, so no build script runs beside one.
      - run: cargo build -p xtask --locked
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist
      # The Beta record is the tag's message, an audit record nothing gates on.
      - name: Write the Beta record
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          CI_RUN: ${{ needs.gates.outputs.ci-run }}
          BETA_RUN: ${{ needs.gates.outputs.beta-run }}
          ARTIFACTS_RUN: ${{ needs.gates.outputs.artifacts-run }}
        run: cargo xtask release verdict-write dist --commit "$GITHUB_SHA" --tag "$TAG" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --ci-run "$CI_RUN" --beta-run "$BETA_RUN" --artifacts-run "$ARTIFACTS_RUN" --out verdict.json
      # The token of the release bot, for this repository alone and for contents only.
      - name: The release bot's token
        id: bot
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - name: Create the annotated tag at this commit (create-only)
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: cargo xtask release tag --repo "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" --tag "$TAG" --message-file verdict.json

  notes:
    needs: [gates, plan, verify, tag]
    if: ${{ needs.gates.outputs.superseded != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.plan.outputs.code == 'true' && needs.plan.outputs.pipeline != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      attestations: read
    env:
      COMMIT: ${{ github.sha }}
      TAG: ${{ needs.plan.outputs.tag }}
    outputs:
      set-hash: ${{ steps.verify-tag.outputs.set-hash }}
    steps:
      # The whole history, every branch and every tag: the annotated tag object (whose
      # message is the Beta record) and origin/main, which the tag check and the notes read.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo build -p xtask --locked
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist
      - name: Check the files against SHA256SUMS
        working-directory: dist
        run: sha256sum --check --strict SHA256SUMS
      - name: Every file is listed once, matches, and is an asset of this commit, with its bundle
        run: cargo xtask release check dist --commit "$COMMIT"
      - name: Fetch the Sigstore trusted root, for the offline check of the bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation trusted-root > "$RUNNER_TEMP/trusted_root.jsonl"
      - name: Verify every attestation as a deployment does, and every bundle as a host does
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask verify-assets attestations dist --repo "$GITHUB_REPOSITORY" --workflow-ref "$GITHUB_REPOSITORY/.github/workflows/artifacts.yml" --commit "$COMMIT" --trusted-root "$RUNNER_TEMP/trusted_root.jsonl"
      - name: The tag names this commit, which is on main; the set of these files
        id: verify-tag
        run: cargo xtask release verify dist --tag "$TAG" --commit "$COMMIT" --output "$GITHUB_OUTPUT"
      # What the release changes about going back (section 8.3) is read from the builds
      # themselves: `kbf --version --json` of this release and of the one before it. A
      # binary runs here only after the attestation step above has verified the files it
      # comes from (the workflow lint holds the order). No previous release, no second file.
      - name: The release before this one, if any
        id: previous
        run: cargo xtask release previous --tag "$TAG" --commit "$COMMIT" --output "$GITHUB_OUTPUT"
      - name: This release's identity, from the verified linux tarball
        run: cargo xtask release identity dist --commit "$COMMIT" --out version.json
      - name: The previous release's files
        if: ${{ steps.previous.outputs.previous != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS: ${{ steps.previous.outputs.previous }}
        run: gh release download "$PREVIOUS" --repo "$GITHUB_REPOSITORY" --dir previous
      - name: The previous release's files against its SHA256SUMS
        if: ${{ steps.previous.outputs.previous != '' }}
        working-directory: previous
        run: sha256sum --check --strict SHA256SUMS
      # The release before the build jobs recorded version facts has none, and this is the
      # only check that waives them: the release being made (`release check dist`) never does.
      # Remove the flag once the release before this one was made with the facts.
      - name: Every one is an asset of the previous release's commit, with its bundle
        if: ${{ steps.previous.outputs.previous != '' }}
        env:
          PREVIOUS_COMMIT: ${{ steps.previous.outputs.previous-commit }}
        run: cargo xtask release check previous --commit "$PREVIOUS_COMMIT" --without-version-facts
      - name: Verify the previous release's attestations as these were
        if: ${{ steps.previous.outputs.previous != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_COMMIT: ${{ steps.previous.outputs.previous-commit }}
        run: cargo xtask verify-assets attestations previous --repo "$GITHUB_REPOSITORY" --workflow-ref "$GITHUB_REPOSITORY/.github/workflows/artifacts.yml" --commit "$PREVIOUS_COMMIT" --trusted-root "$RUNNER_TEMP/trusted_root.jsonl"
      - name: The previous release's identity, from its verified linux tarball
        if: ${{ steps.previous.outputs.previous != '' }}
        env:
          PREVIOUS_COMMIT: ${{ steps.previous.outputs.previous-commit }}
        run: cargo xtask release identity previous --commit "$PREVIOUS_COMMIT" --out previous-version.json
      # Refuses (fail closed) when there is a previous release and no file for it (the path
      # is empty when there is none), and when the file names another build.
      - name: Write the release notes
        env:
          PREVIOUS_IDENTITY: ${{ steps.previous.outputs.previous != '' && 'previous-version.json' || '' }}
        run: cargo xtask release notes dist --tag "$TAG" --commit "$COMMIT" --version-json version.json --previous-version-json "$PREVIOUS_IDENTITY" --out release-notes.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: release-notes.md
          retention-days: 7
          if-no-files-found: error

  # The files the earlier jobs checked, as a release of the tag.
  publish:
    needs: [gates, plan, verify, tag, notes]
    if: ${{ needs.gates.outputs.superseded != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.plan.outputs.code == 'true' && needs.plan.outputs.pipeline != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      # Built before any step holds the token, so no build script runs beside it.
      - run: cargo build -p xtask --locked
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist
      # The notes the notes job wrote: the release body.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes
      - name: Check the files against SHA256SUMS
        working-directory: dist
        run: sha256sum --check --strict SHA256SUMS
      - name: Create the release, or add the files it lacks
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          RUN_ID: ${{ needs.gates.outputs.artifacts-run }}
          SET_HASH: ${{ needs.notes.outputs.set-hash }}
        run: cargo xtask release publish dist --repo "$GITHUB_REPOSITORY" --tag "$TAG" --commit "$GITHUB_SHA" --run-id "$RUN_ID" --set-hash "$SET_HASH" --notes-file release-notes.md

  bump:
    needs: [gates, plan, tag, publish]
    if: ${{ needs.gates.outputs.superseded != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.plan.outputs.code == 'true' && needs.plan.outputs.pipeline != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      # Built before any step holds a token, so no build script runs beside one.
      - run: cargo build -p xtask --locked
      # The release bot's token for the internal repository alone: its contents and pull requests.
      - name: The release bot's token
        id: bot
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: komira-ai
          repositories: komira-internal
          permission-contents: write
          permission-pull-requests: write
      - name: Open the pull request that moves the internal repository's submodule to this release
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: cargo xtask release bump-internal --repo "$GITHUB_REPOSITORY" --version "$VERSION" --sha "$GITHUB_SHA" --internal-repo komira-ai/komira-internal --submodule kbf
