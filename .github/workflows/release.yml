      - run: cargo build -p xtask --locked
      - name: Install kbf from the suite testing in a clean Ubuntu container
        run: docker run --rm --volume "$PWD/target/debug/xtask:/usr/local/bin/xtask:ro" ubuntu@sha256:fe81560990fae86dc4743202b2cb4d3df98d0bcf949173cecef15ce1127ef852 xtask channels check-apt --arch arm64 --version "$PACKAGE_VERSION" --commit "$COMMIT"

  # PROMOTION, the apt repository: the same three jobs for the suite `stable`, after both install
  # checks succeeded (a failed or skipped check promotes nothing). The read job reads the index of
  # testing and of stable; the index job lists the entries of this release that testing holds in
  # the index of stable (`channels apt promote`: held to the digests of SHA256SUMS, every other
  # product's entries kept, an older version or other bytes at the same version refused); the
