# Clean-state spike (branch spike/mac-pool-clean-state only; this file is not for main).
# What a pool user can leave behind, what the clean removes, what proves it gone: the
# plants and probes of crates/kbf-driver-native/tests/clean_state_spike, one job per slice
# of the rows so the slices run on separate hosted Macs. It prints CELL / ASSERT / CLEAN /
# WIPE / SNAPDIFF / BUILD* lines and asserts only that the harness ran and left no user
# behind. By hand only (workflow_dispatch); dispatch once per push, because
# `cancel-in-progress` ends a run when a second one starts on the branch.
name: spike-slot-reach

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: spike-slot-reach-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cs-channels-1:
    runs-on: macos-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sw_vers
      - run: uname -m
      - run: rustup toolchain install
      - name: channels_1 (root, real users)
        run: cargo xtask sudo-test -p kbf-driver-native --test clean_state_spike -- --test-threads=1 --nocapture channels_1

  cs-channels-2:
    runs-on: macos-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sw_vers
      - run: uname -m
      - run: rustup toolchain install
      - name: channels_2 (root, real users)
        run: cargo xtask sudo-test -p kbf-driver-native --test clean_state_spike -- --test-threads=1 --nocapture channels_2

  cs-channels-3:
    runs-on: macos-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sw_vers
      - run: uname -m
      - run: rustup toolchain install
      - name: Remote Login for the sshd row (printed; the row says what happened)
        run: |
          sudo systemsetup -getremotelogin || true
          sudo systemsetup -setremotelogin on || true
          sudo launchctl enable system/com.openssh.sshd || true
          sudo systemsetup -getremotelogin || true
      - name: channels_3 (root, real users)
        run: cargo xtask sudo-test -p kbf-driver-native --test clean_state_spike -- --test-threads=1 --nocapture channels_3

  cs-channels-4:
    runs-on: macos-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sw_vers
      - run: uname -m
      - run: rustup toolchain install
      - name: channels_4 (root, real users)
        run: cargo xtask sudo-test -p kbf-driver-native --test clean_state_spike -- --test-threads=1 --nocapture channels_4

  cs-wipe-1:
    runs-on: macos-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sw_vers
      - run: uname -m
      - run: rustup toolchain install
      - name: wipe_1 (root, real users)
        run: cargo xtask sudo-test -p kbf-driver-native --test clean_state_spike -- --test-threads=1 --nocapture wipe_1

  cs-wipe-2:
    runs-on: macos-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sw_vers
      - run: uname -m
      - run: rustup toolchain install
      - name: wipe_2 (root, real users)
        run: cargo xtask sudo-test -p kbf-driver-native --test clean_state_spike -- --test-threads=1 --nocapture wipe_2

  cs-wipe-3:
    runs-on: macos-latest
    timeout-minutes: 120
