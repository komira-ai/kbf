# SPIKE (spike/mac-apps-gpu, never merges): the GPU state a pool user leaves behind, and what the slot clean removes
# (crates/kbf-driver-native/tests/gpu_state_spike.rs, tools/spike/macos-apps-gpu).
name: spike-slot-reach

on:
  workflow_dispatch:

permissions: {}

jobs:
  apps-gpu:
    runs-on: macos-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sw_vers; uname -m; xcodebuild -version; python3 --version; ls /opt/homebrew/bin | grep -i python | head
      - run: system_profiler SPDisplaysDataType SPHardwareDataType | head -50
      - run: rustup toolchain install
      - name: Build the probes
        run: |
          set -x
          B=/private/tmp/kbf-spike-bin; L=/private/tmp/kbf-spike-logs
          mkdir -p $B $L
          D=tools/spike/macos-apps-gpu
          swiftc -O $D/gpu_probe.swift -o $B/gpu_probe
          cp $D/*.sh $D/mlx_probe.py $B/
          cp -R tools/spike/macos/fixtures $B/fixtures
          # The precompiled-library path needs the Metal toolchain; Xcode 26 ships it as a download.
          (xcrun -sdk macosx metal -c $D/kernel.metal -o $B/k.air && xcrun -sdk macosx metallib $B/k.air -o $B/probe.metallib && echo METALLIB_OK) || echo "METALLIB_UNAVAILABLE"
          # The ad hoc signed app.
          mkdir -p $B/Hello.app/Contents/MacOS
          swiftc -O $D/hello_app.swift -o $B/Hello.app/Contents/MacOS/hello
          printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' '<plist version="1.0"><dict>' '<key>CFBundleExecutable</key><string>hello</string>' '<key>CFBundleIdentifier</key><string>test.kbf.hello</string>' '<key>CFBundleName</key><string>Hello</string>' '<key>CFBundlePackageType</key><string>APPL</string>' '</dict></plist>' > $B/Hello.app/Contents/Info.plist
          codesign --force --sign - --deep $B/Hello.app
          # MLX, if it installs fast.
          PY=/opt/homebrew/bin/python3; [ -x $PY ] || PY=python3
          ($PY -m venv $B/venv && perl -e 'alarm shift; exec @ARGV' 300 $B/venv/bin/pip install mlx 2>&1 | tail -3) || echo "MLX_INSTALL_FAILED"
          chmod -R a+rX $B
      - name: Pool user arms (root, real users)
        run: cargo xtask sudo-test -p kbf-driver-native --test gpu_state_spike -- --test-threads=1 --nocapture 2>&1 | tee /private/tmp/kbf-spike-logs/pool-arms.out
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: apps-gpu
          path: /private/tmp/kbf-spike-logs
          retention-days: 7
