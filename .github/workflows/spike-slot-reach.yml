# Experiment round E1h of the Mac pool plan (branch spike/mac-pool-e1 only; this file is not for main).
# POSIX IPC hermeticity follow-up: pinned CPython leases (e1h-py), simulator leases (e1h-sim) and
# `launchctl reboot userspace` (e1h-reboot). One job per slice, so the slices run on separate hosted Macs.
# By hand only (workflow_dispatch); dispatch once per push, because `cancel-in-progress` ends a run
# when a second one starts on the branch.
name: spike-slot-reach

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: spike-slot-reach-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e1h-py:
    runs-on: macos-latest
    timeout-minutes: 170
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sw_vers
      - run: rustup toolchain install
      - name: E1h pinned CPython leases (root, real users)
        run: cargo xtask sudo-test -p kbf-driver-native --test clean_state_spike -- --test-threads=1 --nocapture e1h_py
  e1h-sim:
    runs-on: macos-latest
    timeout-minutes: 170
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sw_vers
      - run: rustup toolchain install
      - name: E1h simulator leases (root, real users)
        run: cargo xtask sudo-test -p kbf-driver-native --test clean_state_spike -- --test-threads=1 --nocapture e1h_sim
  e1h-reboot:
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sw_vers
      - run: rustup toolchain install
      - name: E1h launchctl reboot userspace (root, real users)
        run: cargo xtask sudo-test -p kbf-driver-native --test clean_state_spike -- --test-threads=1 --nocapture e1h_reboot
