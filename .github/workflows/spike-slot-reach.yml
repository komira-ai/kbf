# Experiment round E1 of the Mac pool plan (branch spike/mac-pool-e1 only; this file is not for main).
# One job per slice, so the slices run on separate hosted Macs. They print the harness's lines
# (CELL / CLEAN / E1ROW / E1DOOR / E1BUILD / ...) and assert only that the harness ran and left no
# user behind. By hand only (workflow_dispatch); dispatch once per push, because
# `cancel-in-progress` ends a run when a second one starts on the branch.
name: spike-slot-reach

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: spike-slot-reach-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e1-xl:
    runs-on: macos-latest
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sw_vers
      - run: uname -m
      - run: rustup toolchain install
      - name: X-L, X8 (root, real users)
        run: cargo xtask sudo-test -p kbf-driver-native --test clean_state_spike -- --test-threads=1 --nocapture e1_xl

  e1-canaries:
    runs-on: macos-latest
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sw_vers
      - run: uname -m
      - run: rustup toolchain install
      - name: v2 canaries, X1 (root, real users)
        run: cargo xtask sudo-test -p kbf-driver-native --test clean_state_spike -- --test-threads=1 --nocapture e1_canaries

  e1-builds:
    runs-on: macos-latest
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sw_vers
      - run: uname -m
      - run: rustup toolchain install
      - name: X-Bprime builds (root, real users)
        run: cargo xtask sudo-test -p kbf-driver-native --test clean_state_spike -- --test-threads=1 --nocapture e1_builds

  e1-xcode:
    runs-on: macos-latest
    timeout-minutes: 170
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sw_vers
      - run: uname -m
      - run: rustup toolchain install
      - name: X-Bprime xcodebuild (root, real users)
        run: cargo xtask sudo-test -p kbf-driver-native --test clean_state_spike -- --test-threads=1 --nocapture e1_xcode

  e1-x5:
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sw_vers
      - run: uname -m
      - run: rustup toolchain install
      - name: X5 mounts (root, real users)
        run: cargo xtask sudo-test -p kbf-driver-native --test clean_state_spike -- --test-threads=1 --nocapture e1_x5

  e1-tcc:
    runs-on: macos-latest
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sw_vers
      - run: uname -m
      - run: rustup toolchain install
      - name: TCC on an image volume
        run: cargo xtask sudo-test -p kbf-driver-native --test clean_state_spike -- --test-threads=1 --nocapture e1_tcc_vol
      - name: TCC in /Users
        if: always()
        run: cargo xtask sudo-test -p kbf-driver-native --test clean_state_spike -- --test-threads=1 --nocapture e1_tcc_users
      - name: TCC in the spike homes
        if: always()
        run: cargo xtask sudo-test -p kbf-driver-native --test clean_state_spike -- --test-threads=1 --nocapture e1_tcc_var

  e1-x6:
    runs-on: macos-latest
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sw_vers
      - run: uname -m
      - run: rustup toolchain install
      - name: X6 cores and reports
        run: cargo xtask sudo-test -p kbf-driver-native --test clean_state_spike -- --test-threads=1 --nocapture e1_x6

  e1-x7:
