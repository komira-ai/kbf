# Probe: how long the sandbox log reads take on a macOS 26 runner, cold and warm, how late a
# denial reaches `log show` and `log stream`, and whether a profile's `(with message ...)`
# reaches the log line. Measurement only; reverted before the change is reviewed.
name: spike-slot-reach

on:
  workflow_dispatch:

permissions: {}

jobs:
  log-timing:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - run: sw_vers; uptime; sysctl -n hw.ncpu hw.memsize; whoami
      - name: probe
        shell: bash
        run: |
          set +e
          set -u
          now() { perl -MTime::HiRes=time -e 'printf "%.3f\n", time'; }
          P='sender == "Sandbox" OR subsystem == "com.apple.sandbox.reporting" OR eventMessage BEGINSWITH "Sandbox: " OR eventMessage CONTAINS "deny("'
          timed() { local label="$1"; shift; local s e; s=$(now); "$@" > "$RUNNER_TEMP/out.txt" 2>"$RUNNER_TEMP/err.txt"; local rc=$?; e=$(now); echo "TIMING $label rc=$rc secs=$(echo "$e - $s" | bc) lines=$(wc -l < "$RUNNER_TEMP/out.txt") bytes=$(wc -c < "$RUNNER_TEMP/out.txt")"; head -c 300 "$RUNNER_TEMP/err.txt"; }
          sudo du -sh /private/var/db/diagnostics /private/var/db/uuidtext 2>/dev/null
          timed idle-120s-driver /usr/bin/log show --style compact --last 120s --predicate "$P"
          N=$(sysctl -n hw.ncpu); PIDS=""; for i in $(seq 1 $((N*2))); do yes > /dev/null & PIDS="$PIDS $!"; done
          timed loaded-120s-driver /usr/bin/log show --style compact --last 120s --predicate "$P"
          timed loaded-10s-driver /usr/bin/log show --style compact --last 10s --predicate "$P"
          kill $PIDS; wait $PIDS 2>/dev/null
          echo "== sample of the driver predicate's lines"; /usr/bin/log show --style compact --last 120s --predicate "$P" | tail -n 15 | cut -c1-250
          echo "== a denial: how long until log show has it"
          mkdir -p /private/tmp/probe-d
          T0=$(now); /usr/bin/sandbox-exec -p '(version 1)(allow default)(deny file-write* (subpath "/private/tmp/probe-d"))' /usr/bin/touch /private/tmp/probe-d/show-1; echo "touch rc=$? pid-unknown"
          for i in $(seq 1 40); do if /usr/bin/log show --style compact --last 60s --predicate "$P" | grep -q 'probe-d/show-1'; then echo "SHOW-LATENCY found after $(echo "$(now) - $T0" | bc)s (try $i)"; break; fi; sleep 0.5; done
          /usr/bin/log show --style ndjson --last 60s --predicate "$P" | grep 'probe-d/show-1' | head -n 2
          echo "== log stream: readiness and arrival"
          for round in 1 2 3; do
            S="$RUNNER_TEMP/stream-$round.txt"
            /usr/bin/log stream --style compact --predicate "$P" > "$S" 2>&1 &
            SP=$!
            TS=$(now)
            /usr/bin/sandbox-exec -p '(version 1)(allow default)(deny file-write* (subpath "/private/tmp/probe-d"))' /usr/bin/touch /private/tmp/probe-d/r$round-immediate
            for i in $(seq 1 100); do if [ -s "$S" ]; then echo "STREAM round $round first output after $(echo "$(now) - $TS" | bc)s"; break; fi; sleep 0.05; done
            /usr/bin/sandbox-exec -p '(version 1)(allow default)(deny file-write* (subpath "/private/tmp/probe-d"))' /usr/bin/touch /private/tmp/probe-d/r$round-after-header
            TH=$(now)
            for i in $(seq 1 200); do if grep -q "r$round-after-header" "$S"; then echo "STREAM round $round after-header line arrived after $(echo "$(now) - $TH" | bc)s"; break; fi; sleep 0.05; done
            sleep 0.3
            /usr/bin/sandbox-exec -p '(version 1)(allow default)(deny file-write* (subpath "/private/tmp/probe-d"))' /usr/bin/touch /private/tmp/probe-d/r$round-later
            sleep 3
            kill $SP; wait $SP 2>/dev/null
            echo "STREAM round $round: immediate=$(grep -c "r$round-immediate" "$S") after-header=$(grep -c "r$round-after-header" "$S") later=$(grep -c "r$round-later" "$S") total-lines=$(wc -l < "$S")"
            head -n 3 "$S" | cut -c1-250; grep "probe-d" "$S" | cut -c1-250
          done
          echo "== logger probe through the stream"
          S="$RUNNER_TEMP/stream-logger.txt"
          /usr/bin/log stream --style compact --predicate "$P OR (process == \"logger\" AND eventMessage CONTAINS \"kbf-ready-\")" > "$S" 2>&1 &
          SP=$!; TS=$(now)
          for i in $(seq 1 60); do /usr/bin/logger "kbf-ready-$i"; sleep 0.05; if grep -q "kbf-ready-" "$S"; then echo "LOGGER first seen after $(echo "$(now) - $TS" | bc)s, probe $i"; break; fi; done
          sleep 1; kill $SP; wait $SP 2>/dev/null; head -n 4 "$S" | cut -c1-250
          echo "== with message"
          S="$RUNNER_TEMP/stream-msg.txt"
          /usr/bin/log stream --style compact --predicate "$P" > "$S" 2>&1 &
          SP=$!; sleep 2
          mkdir -p /private/tmp/probe-m
          /usr/bin/sandbox-exec -p '(version 1)(allow default)(deny file-write* (subpath "/private/tmp/probe-m") (with message "kbf-marker-1234"))' /usr/bin/touch /private/tmp/probe-m/x; echo "with-message rc=$?"
          sleep 4; kill $SP; wait $SP 2>/dev/null
          cat "$S" | cut -c1-400
          /usr/bin/log show --style ndjson --last 30s --predicate 'eventMessage CONTAINS "kbf-marker" OR eventMessage CONTAINS "probe-m"' | head -n 3
          echo "== stream as root"
          S="$RUNNER_TEMP/stream-root.txt"
          sudo /usr/bin/log stream --style compact --predicate "$P" > "$S" 2>&1 &
          SP=$!; sleep 2
          /usr/bin/sandbox-exec -p '(version 1)(allow default)(deny file-write* (subpath "/private/tmp/probe-d"))' /usr/bin/touch /private/tmp/probe-d/root-1
          sleep 3; sudo pkill -f "log stream --style compact" ; sleep 1
          grep -c "root-1" "$S"; head -n 2 "$S" | cut -c1-200
          echo "== cold again: a second kind of read"
          timed final-120s-driver /usr/bin/log show --style compact --last 120s --predicate "$P"
