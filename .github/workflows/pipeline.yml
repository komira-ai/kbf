# The one pipeline of a push to main, in this order, each stage needing the one before it:
#
#   ci  ->  artifacts  ->  beta  ->  the release (release.yml)
#
# ci.yml is the pull-request gate, run again on the merged result. artifacts.yml builds, signs
# and attests the files of the commit. beta.yml runs the full suite and installs and tests the
# kbf of THOSE files, read from this run's artifacts (no run id, no rebuild). The release
# (release.yml) publishes the same files; it starts from this workflow's success and from
# nothing else (see "Cancelling" below). Each stage is a called workflow (`workflow_call`),
# so the pull request and the merge queue keep running ci.yml and artifacts.yml as before and
# a push to main runs each check exactly once: none of the three has a push trigger of its
# own. A stage that is red or cancelled stops the stages after it.
#
# Cancelling. A newer push to main cancels this run, every job of it, whatever stage it is in
# (workflow-level `cancel-in-progress`): the newest commit is the one worth building. Nothing
# that writes is in this workflow: no tag, no release, no push to another repository, so a
# cancel can leave only an unfinished build behind, never a half-done release. The release is a
# separate workflow, started by the completion of this one (`workflow_run`) and only when it
# succeeded; it has its own group that never cancels a run, so a release that has started
# finishes, whatever is pushed meanwhile.
#
# Least privilege. A called workflow gets at most what its caller job grants. Every stage gets
# `contents: read`; only the artifacts stage is also granted the two scopes that sign build
# provenance (`id-token`, `attestations`), under the same exact `if:` the signing jobs of
# artifacts.yml carry, and those jobs alone use them (the workflow lint, tests/workflows).
name: pipeline

on:
  push:
    branches: [main]

permissions: {}

# One pipeline per ref; a newer push cancels the older run.
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  artifacts:
    needs: [ci]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/artifacts.yml
    permissions:
      contents: read
      id-token: write
      attestations: write

  # Installs and tests the files `artifacts` built and attested in this run.
  beta:
    needs: [artifacts]
    uses: ./.github/workflows/beta.yml
    permissions:
      contents: read

  # Leaves the commit this push replaced for the release run, which diffs the push from it
  # (a run started by `workflow_run` has no push event of its own).
  push:
    needs: [beta]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Write the commit before this push
        env:
          BEFORE: ${{ github.event.before }}
        run: printf '%s\n' "$BEFORE" > before
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: push-before
          path: before
          retention-days: 7
          if-no-files-found: error
