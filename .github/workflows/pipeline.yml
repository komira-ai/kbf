# The one pipeline of a push to main, the path to the release:
#
#   ci --------------------------------------------+
#   artifacts (build) --+--> artifacts-sign (also needs ci) --+--> passed --> the release (release.yml)
#                       +--> smoke -------------------------+
#
# ci.yml is the pull-request gate, run again on the merged result. artifacts.yml is called twice.
# `artifacts` (stage build) builds and sums the files of the commit and needs nothing, so its
# builds start with ci. `artifacts-sign` (stage sign) needs ci and `artifacts` and attests and
# verifies those files (a commit that fails the gate is built but never signed). Both calls are
# the one file, artifacts.yml, because the installers verify that file as the signer of every
# attestation. smoke.yml needs only `artifacts`, so it runs beside the signing: it is the one job
# that tests the files the build stage made (the files `artifacts-sign` signs beside it). It
# assembles and checks the files of this run's artifacts (no run id, no rebuild) and runs the
# images the stage built. The release (release.yml) publishes the same files; it starts from this
# workflow's success and from nothing else. Each stage is a called workflow (`workflow_call`), so
# the pull request and the merge queue keep running ci.yml and artifacts.yml as before and a push
# to main runs each check exactly once: none of the three has a push trigger of its own. `passed`
# needs every stage (the two artifacts calls included), and does nothing else: a skipped stage
# skips it.
#
# The source suite (beta.yml: the whole nextest run, the Arm run, Postgres, S3 stores, the
# mixed-version farm, macOS, the packages; about an hour) is not a stage of this pipeline. It is
# the job `beta` of suites.yml, which a push to main starts beside this run, so the release never
# waits for it and its red never stops a release; its red keeps the RELEASE-RED issue
# (`cargo xtask release-red`, suites.yml). pipeline_workflow refuses a call of beta.yml here.
#
# Fail fast. GitHub cancels the rest of a run for a failed job only inside one matrix, never
# across the jobs of a workflow, and a failed job does not stop the jobs that do not need it:
# a red job would leave the builds and tests beside it running in a lane the next push waits
# for. `cancel-after-ci` and `cancel-after-build` end the run for it: each needs one of the two
# stages that start the run and, when that stage has failed, cancels the run (`gh run cancel`;
# the job that failed keeps its conclusion, the run ends cancelled and starts no release). They
# are jobs that wait for a stage, not a job that polls beside it, so a green push pays for none
# (a skipped job holds no runner) and a red one for a few seconds. A job needs its stage to have
# ended, and a stage ends when its last job has, so a red job cancels the run when its stage is
# over, not at the moment it fails: the build stage is the one that matters (the four builds end
# in 12 to 15 minutes, `ci` runs longer), and a failure of `ci` still skips the signing and the
# release. Neither job checks out or runs the repository's code: the one step holds the token
# and runs `gh`, which is the only thing that may hold `actions: write` here, under the lint's
# exact `failure()` and push-to-main condition.
#
# Queueing. A pipeline that has started always finishes (or is cancelled by a cancel job, never by a
# push): a busy main cannot starve it. Pushes that arrive meanwhile wait in the group, and GitHub
# keeps only the newest waiting run (a pending run is replaced by a newer one). Nothing is lost by
# that: `release plan` measures from the highest release tag, not from the push, so the code of a
# push that was replaced, or whose run failed, is in the next release. The release is a separate
# workflow, started by the completion of this one (`workflow_run`) and only when it succeeded; it
# has its own group that never cancels a run. The builds of a push start with its pipeline, so a
# push that waits in the group has built nothing yet.
#
# Least privilege. A called workflow gets at most what its caller job grants. Every stage gets
# `contents: read`; only the two calls of artifacts.yml are also granted the two scopes that sign
# build provenance (`id-token`, `attestations`), under the same exact `if:` the signing jobs of
# artifacts.yml carry (their own adds the sign stage), and those jobs alone use them: they are
# skipped in the build call, which runs beside ci and so cannot sign (the build call has the grant
# because a called workflow is checked against it statically; tests/pipeline_workflow requires
# every signing job of artifacts.yml to be in the sign stage). The two cancel jobs alone hold
# `actions: write`, to cancel this run, and nothing else, under the exact `if:` above, and the
# token is in the environment of the one step they have (the workflow lint, tests/workflows and
# tests/pipeline_workflow).
name: pipeline

on:
  push:
    branches: [main]

permissions: {}

# One pipeline per ref; a running one is never cancelled by a push, and the newest waiting push queues behind it.
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      # The `test` job of ci lists the run's jobs and artifacts to wait for the coverage shards.
      actions: read

  # Builds and sums the files of the commit, beside ci: nothing in this call is signed (every job
  # of artifacts.yml that signs is skipped in stage build), so a commit that fails ci is built but
  # never signed. It is granted the scopes of the sign call below only because GitHub checks a
  # called workflow's job permissions against the caller's grant statically, skipped jobs
  # included: with `contents: read` alone the whole pipeline would fail at startup.
  artifacts:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/artifacts.yml
    with:
      stage: build
    permissions:
      contents: read
      id-token: write
      attestations: write

  # Signs (attests) and verifies the files `artifacts` built, after ci. The same workflow file,
  # because the signer identity the installers verify is that file. Its group is the build call's
  # (`artifacts-${{ github.run_id }}`, cancel-in-progress false): the sign call waits for the
  # build call, which it needs anyway, so the expression is unchanged.
  artifacts-sign:
    needs: [ci, artifacts]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/artifacts.yml
    with:
      stage: sign
      # The digests of the SHA256SUMS the build call published: the attest jobs refuse other sums.
      sums_linux_sha256: ${{ needs.artifacts.outputs.sums_linux_sha256 }}
      sums_darwin_arm64_sha256: ${{ needs.artifacts.outputs.sums_darwin_arm64_sha256 }}
    permissions:
      contents: read
      id-token: write
      attestations: write

  # Installs and tests the files `artifacts` built in this run, beside `artifacts-sign`, which
  # signs those same files: smoke reads the run's artifacts and needs no signature.
  smoke:
    needs: [artifacts]
    uses: ./.github/workflows/smoke.yml
    permissions:
      contents: read

  # The fail-fast (see "Fail fast"): each of the two stages that start the run, when it ends red,
  # cancels the run. A job that needs a stage runs only when the stage has ended, so these cost
  # nothing on a green push (skipped) and a few seconds on a red one.
  cancel-after-ci:
    needs: [ci]
    if: ${{ failure() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Cancel the run, ci failed
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY"

  cancel-after-build:
    needs: [artifacts]
    if: ${{ failure() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Cancel the run, the build failed
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY"

  # Needs every stage and does nothing: the pipeline is green when this ran (a stage that failed
  # or was cancelled skips it).
  passed:
    needs: [ci, artifacts, artifacts-sign, smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - run: echo "ci, artifacts, artifacts-sign and smoke passed"
