# The M1 exit test on a hosted runner: MinIO (pinned by digest), one kbf-server and one
# daemon, and the sample projects in crates/kbf-it/m1 built remote-only with pinned
# Bazel and buck2, twice each. The second build of each must be all remote cache hits
# A last buck2 build holds a lease in flight (an action that sleeps) while the node is
# drained through the operator API (`kbf-cell m1`, crates/kbf-it/src/m1.rs, says exactly
# what is checked).
#
# Its own workflow, using GitHub-owned actions only, so that it starts under the
# repository's Actions policy whatever the other workflows use. Same hosted-runner,
# pinning and permission rules as ci.yml (crates/kbf-it/tests/repo_lints.rs).
name: integration

on:
  pull_request:
    # Only a change to what the job builds and runs: the crates of kbf-server, kbf-it,
    # kbf-testkit, kbf-objstore and xtask, with their workspace dependencies (the closure
    # of their Cargo.toml files), and the build inputs. The merge queue and pushes to main
    # always run it.
    paths:
      - crates/kbf-auth/**
      - crates/kbf-caps/**
      - crates/kbf-daemon/**
      - crates/kbf-deploy/**
      - crates/kbf-front/**
      - crates/kbf-history/**
      - crates/kbf-host/**
      - crates/kbf-invocation/**
      - crates/kbf-it/**
      - crates/kbf-log/**
      - crates/kbf-mac-session/**
      - crates/kbf-map/**
      - crates/kbf-mapsync/**
      - crates/kbf-mdm/**
      - crates/kbf-mdm-api/**
      - crates/kbf-meta/**
      - crates/kbf-objstore/**
      - crates/kbf-peer/**
      - crates/kbf-proto/**
      - crates/kbf-raft/**
      - crates/kbf-route/**
      - crates/kbf-sched/**
      - crates/kbf-segments/**
      - crates/kbf-server/**
      - crates/kbf-sim/**
      - crates/kbf-state/**
      - crates/kbf-storage/**
      - crates/kbf-store/**
      - crates/kbf-testkit/**
      - crates/kbf-threads/**
      - crates/kbf-tier/**
      - crates/kbf-tls/**
      - crates/kbf-transfer/**
      - crates/kbf-types/**
      - crates/kbf-ui/**
      - crates/xtask/**
      - .cargo/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain*
      - .github/workflows/integration.yml
  merge_group:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  m1-cell:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      minio:
        # The digest the objstore-s3 job in ci.yml pins (Chainguard's build of MinIO).
        image: cgr.dev/chainguard/minio@sha256:e7ca559d9f7c0b5f24f5f669bb92f40f3ca88d56273b808bf3a7c116c17d2ffa
        command: server /data
        env:
          MINIO_ROOT_USER: kbf-ci-access
          MINIO_ROOT_PASSWORD: kbf-ci-throwaway
        ports:
          - 9000:9000
    env:
      # A throwaway key pair for the service container, which lives only for this job.
      AWS_ACCESS_KEY_ID: kbf-ci-access
      AWS_SECRET_ACCESS_KEY: kbf-ci-throwaway
      BAZEL_VERSION: 8.8.1
      BAZEL_SHA256: 5b5bab2095065817d3416ca9a0678bd39c10c9ede432dbe8187bfe74de285160
      BUCK2_VERSION: 2026-10-01
      BUCK2_SHA256: 828aba01bf80e8ba50ed27d89be86efe0246b3807c3d040e1ea7b4810a55fb78
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      # kbf-act (kbf-testkit) is the program the samples' `shout` action runs.
      - run: cargo build -p kbf-server -p kbf-it -p kbf-testkit --bins --locked
      - name: Fetch Bazel (pinned version, checked by SHA-256)
        run: cargo xtask fetch --url "https://github.com/bazelbuild/bazel/releases/download/$BAZEL_VERSION/bazel-$BAZEL_VERSION-linux-x86_64" --sha256 "$BAZEL_SHA256" --out "$RUNNER_TEMP/tools/bazel"
      - name: Fetch buck2 (pinned version, checked by SHA-256)
        run: cargo xtask fetch --url "https://github.com/facebook/buck2/releases/download/$BUCK2_VERSION/buck2-x86_64-unknown-linux-gnu.zst" --sha256 "$BUCK2_SHA256" --out "$RUNNER_TEMP/tools/buck2" --extract zst
      - run: $RUNNER_TEMP/tools/bazel --version
      - run: $RUNNER_TEMP/tools/buck2 --version
      - name: Wait for MinIO, then run the store conformance suite on it
        run: cargo run -p kbf-objstore --example s3_conformance --locked -- --endpoint http://127.0.0.1:9000 --bucket kbf-m1-conformance --create-bucket --conditional-put --wait-ready 60
      - name: M1 cell, Bazel and buck2 twice each
        run: target/debug/kbf-cell m1 --bin-dir target/debug --projects crates/kbf-it/m1 --work "$RUNNER_TEMP/m1" --s3-endpoint http://127.0.0.1:9000 --s3-bucket kbf-m1 --bazel "$RUNNER_TEMP/tools/bazel" --buck2 "$RUNNER_TEMP/tools/buck2"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: m1-cell-logs
          path: ${{ runner.temp }}/m1/logs
          if-no-files-found: warn
