# The account of the host's update agent: it connects to the local socket of
# kbf-host-install and to nothing else of the host. Own group, no login, no home.
u kbf-updater - "kbf update agent" /nonexistent /usr/sbin/nologin
# The group whose members may register with the root part of the host updater
# (kbf-updater-root.service): a service account joins it in its unit (SupplementaryGroups=).
g updater-register -
