# /etc/kbf/host-install-frontend.toml: the frontend container of this host, as root describes it
# (docs/deploy/host-install.md, "A frontend container"). Root's alone to write.
#
# At the start of a switch this is copied into the pending record; the new container, and the old
# one put back, are made from the copy. Make the first container with the same options, from the
# image `kbf-frontend:<commit>` that `docker image load` of the release's image prints.
[frontend]
name = "kbf-frontend"
restart = "unless-stopped"
network = "bridge"
user = "65532:65532"
# Optional, docker --group-add: numeric gids, quoted. A frontend that reaches kbf-signer's socket
# through the signer's --client-group needs that group here, or a recreated container cannot sign.
# group_add = ["990"]
# docker --publish, one entry each: the REAPI, worker and operator listeners as the load balancer
# reaches them, and the operator API on this host's loopback for /readyz and /healthz.
ports = ["8980:8980", "8981:8981", "127.0.0.1:8982:8982"]
# docker --volume: the configuration, the certificates and the state the frontend names in kbf.toml.
mounts = ["/etc/kbf:/etc/kbf:ro", "/var/lib/kbf:/var/lib/kbf"]
# The flags after the image; this is the image's own default.
command = ["--config", "/etc/kbf/kbf.toml"]
# Where this host reaches the operator API (the published port above).
api = "127.0.0.1:8982"
# The operator token, as a path inside the container: the drain is `kbf cluster drain --frontend`
# run in the container, where the API is on loopback.
drain_token_file = "/etc/kbf/operator.token"
# Other frontends' operator APIs this host can reach (replace the documentation address). One that
# does not answer /readyz with 200 keeps this frontend up. Without peers nothing here guards the
# last ready frontend; only the coordinator's order does (docs/deploy/host-install.md).
peers = ["203.0.113.11:8982"]
# Optional. Left out, a switch waits for the old container to end however long its builds take; it
# never stops, removes or replaces a container that still runs. Set, it is how long the switch waits
# before it gives up: it then fails with the old container still running and draining, and asking
# again resumes. No upper limit; at least 1. It cuts no work either way. Keep it below about 9
# minutes: the updater gives a switch call 10 minutes, so during a longer drain it reports the host
# Unreachable while the helper goes on and finishes the switch.
# drain_secs = 3600
# The most a new container has to be ready; counted inside the trial window (--window-secs).
ready_secs = 90
