# kbf-installer's runtime directory: the order and control sockets, the lock and
# status.json (0755; the sockets inside set their own modes). Made by tmpfiles.d, not by
# the unit, so it survives a restart of kbf-installer.service and a package upgrade.
d /run/kbf-installer 0755 root root -
# The fetch child's download area: a directory per fetch, made and removed by the installer.
d /var/cache/kbf-fetch 0711 root root -
