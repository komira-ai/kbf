# The directories of the kbf-installer package (docs/design/kbf-installer.md, sections
# 3 and 4). systemd-tmpfiles makes them at boot; `kbf-installer setup` does too.
# /var/lib/kbf-installer: the installer tree, root's (releases, state, links).
d /var/lib/kbf-installer 0755 root root -
# /run/kbf-installer: the order and control sockets, the status file and the lock; made
# here so it survives restarts of the service and package upgrades.
d /run/kbf-installer 0755 root root -
# /var/cache/kbf-fetch: the parent of the per-fetch download directories.
d /var/cache/kbf-fetch 0755 root root -
