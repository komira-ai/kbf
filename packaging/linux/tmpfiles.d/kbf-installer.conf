# The runtime directory of the host-side tools: the lock (0755), installed with the kbf package as
# /usr/lib/tmpfiles.d/kbf.conf. The installer has no
# order socket, no control socket and no listener. Made by tmpfiles.d, not by the unit, so
# it survives a restart of kbf-installer.service and a package upgrade.
d /run/kbf-installer 0755 root root -
# The fetch child's download area: a directory per fetch, made and removed by the installer.
d /var/cache/kbf-fetch 0711 root root -
