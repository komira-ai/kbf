# The users of the kbf-installer package (docs/design/kbf-installer.md, section 3).
# systemd-sysusers makes them at boot; `kbf-installer setup` does too. No maintainer
# script does. Each gets a group of its own name and no login.
#
# kbf: the runtime. Its state directory is /var/lib/kbf, made by the units.
u kbf - "kbf runtime" /var/lib/kbf /usr/sbin/nologin
# kbf-server: the frontend and storage units. Not kbf: the user builds run as must not
# read the state store, the operator token or the keys. Its state directory is
# /var/lib/kbf-server, made by the units.
u kbf-server - "kbf frontend and storage" /var/lib/kbf-server /usr/sbin/nologin
# kbf-fetch: runs the release download with no other privilege; owns only
# /var/cache/kbf-fetch/<random>, made per fetch and removed after.
u kbf-fetch - "kbf release download" /nonexistent /usr/sbin/nologin
# kbf-verify: runs the pinned gh and `--version` of a release, with no network.
u kbf-verify - "kbf release verification" /nonexistent /usr/sbin/nologin
