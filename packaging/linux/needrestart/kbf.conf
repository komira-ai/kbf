# needrestart (installed by default on Ubuntu, restarting services after a library
# update) must never restart a kbf unit: a restart in the middle of a build makes the
# blobs that member holds unreadable and fails the client's build. kbf units are
# restarted only by kbf's own update path (kbf-installer). Matches kbf-*.service,
# kbf-*.socket, kbf.slice and templated instances such as kbf-frontend@a.service.
$nrconf{override_rc}{qr(^kbf[-.@])} = 0;
