# The release stages, and which workflow job belongs to which. The workflow lint
# (crates/kbf-integration-test/tests/workflows/stages.rs) reads this file and refuses:
# - a job row that names a stage this file does not list, and an `after` that names a stage
#   not listed before it;
# - an `actions` stage with no job, and a stage marked `planned` that has one (delete
#   `planned` in the change that adds the first job, so the mark cannot outlive the gap);
# - a job of a stage workflow that no row lists, and a row whose job does not exist;
# - a trigger on a stage workflow that no stage of its jobs allows under `events`;
# - `id-token: write` or `attestations: write` in any job of any workflow that is not a
#   row marked `signing: true`, and a signing row whose job holds neither.
# What it does not check: that a job only runs for the events of its own stage (a
# stage workflow's triggers are checked as a whole), and that the operator stages are
# verified before release (the release workflow's own steps do that).
stages:
  # pipeline.yml, on a push to main, runs the stages: ci (the pull-request gate, ci.yml, run
  # again on the merged result) and the suite (beta.yml, below) start together; the build calls of
  # artifacts.yml start with ci too (stage `build`, no signing), and the signing call
  # (`artifacts-sign`) needs ci and the build call; the beta smoke needs build; the release (prod) is a workflow of its own started by the
  # pipeline's success, which needs every stage. The pipeline's own jobs are the callers of the
  # stage workflows, `watch` (the fail-fast: it cancels the run when a job has failed, so it
  # belongs to the stage the run starts with, and its trigger is `push`) and `passed` (needs
  # every stage and does nothing else), which leaves the commit the push replaced for the release run.
  - name: ci
    runs: actions
    after: []
    result: ci green
    events: [push]
  # beta.yml, called by the pipeline beside ci: everything the pull-request gate (ci.yml) leaves
  # out that tests the commit's source, each job building what it runs. The whole nextest run with
  # its slow tests, the Arm run, the jobs that need a service, root, crun or a Mac, and the Linux
  # packages. It needs no artifact of the run, so it waits for no stage. beta.yml has no trigger
  # of its own: no pull request, no merge queue entry, no push.
  - name: suite
    runs: actions
    after: []
    result: suite green
    events: [workflow_call]
  # artifacts.yml builds, tests and (on a push to main, called by the pipeline) attests the files
  # every later stage uses. It also runs for pull requests and the merge queue, which attest
  # nothing.
  # `after: [ci]` is for the signed result: the pipeline's build call starts with ci, and the
  # signing call (`artifacts-sign`) needs ci.
  - name: build
    runs: actions
    after: [ci]
    result: SHA256SUMS
    events: [pull_request, merge_group, workflow_call]
  # smoke.yml, called by the pipeline after build: the end-to-end smoke (scenario B0, the farm
  # under Buck2 load), whose farm runs the kbf of build's linux-x86_64 tarball of the same run;
  # its result document records no set hash and so says it is unattested. The full run on the
  # attested bytes with the update and kill scenarios, and the `signing: true` job that attests
  # its result, are added to `jobs` by the changes that build them. smoke.yml has no trigger of
  # its own.
  - name: beta
    runs: actions
    after: [build]
    result: beta-result.json
    events: [workflow_call]
  # release.yml plans, verifies, tags with the release bot, publishes, bumps the internal
  # repository, and then its `gamma` job sets the release as the farm's desired version on the
  # update coordinator, waits for the farm to converge, and proves the farm with a remote-only
  # Buck2 build (`cargo xtask prove-farm`). All of it is one run, in the stage below. It is
  # started by the completion of a successful pipeline run (`workflow_run`), the one workflow
  # that is, so that the release is a run of its own that no push cancels once it has started.
  # gamma.yml is deleted, and the 24 hour bake and its verdict run outside Actions.
  - name: prod
    runs: actions
    after: [beta, suite]
    result: release.json
    events: [workflow_run]
jobs:
  - job: pipeline.yml#ci
    stage: ci
  # Granted the signing scopes like the sign call (GitHub checks a called workflow's job
  # permissions against its caller's grant statically), but every signing job of artifacts.yml
  # is skipped in stage build (tests/pipeline_workflow).
  - job: pipeline.yml#artifacts
    stage: build
    signing: true
  - job: pipeline.yml#artifacts-sign
    stage: build
    signing: true
  - job: pipeline.yml#beta
    stage: suite
  - job: pipeline.yml#smoke
    stage: beta
  - job: pipeline.yml#watch
    stage: ci
  - job: pipeline.yml#passed
    stage: beta
  - job: artifacts.yml#darwin-arm64
    stage: build
  - job: artifacts.yml#linux-x86_64
    stage: build
  - job: artifacts.yml#linux-arm64
    stage: build
  - job: artifacts.yml#sums-linux
    stage: build
  - job: artifacts.yml#sums-darwin-arm64
    stage: build
  - job: artifacts.yml#sums
    stage: build
  - job: artifacts.yml#attest-linux
    stage: build
    signing: true
  - job: artifacts.yml#attest-darwin-arm64
    stage: build
    signing: true
  - job: artifacts.yml#verify-linux
    stage: build
  - job: artifacts.yml#verify-darwin-arm64
    stage: build
  - job: smoke.yml#smoke
    stage: beta
  - job: beta.yml#test-x86
    stage: suite
  - job: beta.yml#test-arm
    stage: suite
  - job: beta.yml#state-postgres
    stage: suite
  - job: beta.yml#objstore-s3
    stage: suite
  - job: beta.yml#crun-x86
    stage: suite
  - job: beta.yml#crun-arm
    stage: suite
  - job: beta.yml#m2-container
    stage: suite
  - job: beta.yml#native-macos
    stage: suite
  - job: beta.yml#packages
    stage: suite
  - job: beta.yml#m1-cell
    stage: suite
  - job: beta.yml#cross-version
    stage: suite
  - job: beta.yml#mixed-version
    stage: suite
  # Green, and a check of its own until the change that makes the js core the farm's default lands (js-core-gate-pr.yml calls it for
  # pull requests); pipeline.yml does not call it yet. That change adds `pipeline.yml#js-core-gate` (js-core-gate.yml says how).
  - job: js-core-gate.yml#m1-cell-js
    stage: suite
  - job: release.yml#plan
    stage: prod
  - job: release.yml#verify
    stage: prod
  - job: release.yml#tag
    stage: prod
  - job: release.yml#notes
    stage: prod
  - job: release.yml#publish
    stage: prod
  - job: release.yml#bump
    stage: prod
  - job: release.yml#rehearse
    stage: prod
  - job: release.yml#rehearse-agent
    stage: prod
  # Presents the run's OIDC token to the farm's update coordinator and signs nothing: the row is
  # `signing: true` because the job holds `id-token: write`, which only a signing row may.
  - job: release.yml#gamma
    stage: prod
    signing: true
