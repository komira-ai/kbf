# The release stages, and which workflow job belongs to which. The workflow lint
# (crates/kbf-it/tests/workflows/stages.rs) reads this file and refuses:
# - a job row that names a stage this file does not list, and an `after` that names a stage
#   not listed before it;
# - an `actions` stage with no job, and a stage marked `planned` that has one (delete
#   `planned` in the change that adds the first job, so the mark cannot outlive the gap);
# - a job of a stage workflow that no row lists, and a row whose job does not exist;
# - a trigger on a stage workflow that no stage of its jobs allows under `events`;
# - `id-token: write` or `attestations: write` in any job of any workflow that is not a
#   row marked `signing: true`, and a signing row whose job holds neither.
# What it does not check: that a job only runs for the events of its own stage (a
# stage workflow's triggers are checked as a whole), and that the operator stages are
# verified before release (the release workflow's own steps do that).
stages:
  # artifacts.yml builds, tests and (on a push) attests the files every later stage uses.
  # It also runs for pull requests and the merge queue, which attest nothing.
  - name: build
    runs: actions
    after: []
    result: SHA256SUMS
    events: [pull_request, merge_group, push]
  # The full run, on a push: everything the pull-request gate (ci.yml) leaves out. The whole
  # nextest run with its slow tests, the Arm run, the jobs that need a service, root, crun
  # or a Mac, the Linux packages, and the end-to-end smoke of beta.yml (scenario B0, the farm
  # under Buck2 load), which builds its own binaries, so its result says it is unattested.
  # The full run on the attested bytes (a job of artifacts.yml, after `verify`), and the
  # `signing: true` job that attests its result, are added to `jobs` by the changes that
  # build them. beta.yml runs on a push only: no pull request and no merge queue entry.
  - name: beta
    runs: actions
    after: [build]
    result: beta-result.json
    events: [push]
  # gamma.yml follows a cut release (a completed run of release.yml on main) to the one gamma
  # host, our own build farm's frontend: its `offer` job stages the offer, and its `deploy`
  # job is skipped unless the repository variables are set, and otherwise runs
  # `kbf-installer deploy` there. The 24 hour bake and its verdict run outside Actions.
  - name: gamma
    runs: actions
    after: [build]
    result: gamma-verdict.json
    events: [workflow_run]
  # release.yml publishes a pushed v* tag, or dry-runs a commit by hand.
  - name: prod
    runs: actions
    after: [gamma]
    result: release.json
    events: [push, workflow_dispatch]
jobs:
  - job: artifacts.yml#darwin-arm64
    stage: build
  - job: artifacts.yml#linux-x86_64
    stage: build
  - job: artifacts.yml#linux-arm64
    stage: build
  - job: artifacts.yml#sums-linux
    stage: build
  - job: artifacts.yml#sums-darwin-arm64
    stage: build
  - job: artifacts.yml#sums
    stage: build
  - job: artifacts.yml#attest-linux
    stage: build
    signing: true
  - job: artifacts.yml#attest-darwin-arm64
    stage: build
    signing: true
  - job: artifacts.yml#verify-linux
    stage: build
  - job: artifacts.yml#verify-darwin-arm64
    stage: build
  - job: beta.yml#smoke
    stage: beta
  - job: beta.yml#test-x86
    stage: beta
  - job: beta.yml#test-arm
    stage: beta
  - job: beta.yml#state-postgres
    stage: beta
  - job: beta.yml#objstore-s3
    stage: beta
  - job: beta.yml#crun-x86
    stage: beta
  - job: beta.yml#crun-arm
    stage: beta
  - job: beta.yml#m2-container
    stage: beta
  - job: beta.yml#native-macos
    stage: beta
  - job: beta.yml#pkg-macos
    stage: beta
  - job: beta.yml#packages
    stage: beta
  - job: beta.yml#m1-cell
    stage: beta
  - job: gamma.yml#offer
    stage: gamma
  - job: gamma.yml#deploy
    stage: gamma
  - job: release.yml#verify
    stage: prod
  - job: release.yml#publish
    stage: prod
