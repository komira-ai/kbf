# The release stages, and which workflow job belongs to which. The workflow lint
# (crates/kbf-integration-test/tests/workflows/stages.rs) reads this file and refuses:
# - a job row that names a stage this file does not list, and an `after` that names a stage
#   not listed before it;
# - an `actions` stage with no job, and a stage marked `planned` that has one (delete
#   `planned` in the change that adds the first job, so the mark cannot outlive the gap);
# - a job of a stage workflow that no row lists, and a row whose job does not exist;
# - a trigger on a stage workflow that no stage of its jobs allows under `events`;
# - `id-token: write` or `attestations: write` in any job of any workflow that is not a
#   row marked `signing: true`, and a signing row whose job holds neither.
# What it does not check: that a job only runs for the events of its own stage (a
# stage workflow's triggers are checked as a whole), and that the operator stages are
# verified before release (the release workflow's own steps do that).
stages:
  # pipeline.yml, on a push to main, runs the stages in order, each needing the one before:
  # ci (the pull-request gate, ci.yml, run again on the merged result), build, beta, and then
  # the release (prod), which is a workflow of its own started by the pipeline's success.
  # The pipeline's own jobs are the callers of the three stage workflows, and `push`, which
  # leaves the commit the push replaced for the release run.
  - name: ci
    runs: actions
    after: []
    result: ci green
    events: [push]
  # artifacts.yml builds, tests and (on a push to main, called by the pipeline) attests the files
  # every later stage uses. It also runs for pull requests and the merge queue, which attest
  # nothing.
  - name: build
    runs: actions
    after: [ci]
    result: SHA256SUMS
    events: [pull_request, merge_group, workflow_call]
  # The full run, called by the pipeline after build: everything the pull-request gate (ci.yml)
  # leaves out. The whole nextest run with its slow tests, the Arm run, the jobs that need a
  # service, root, crun or a Mac, the Linux packages, and the end-to-end smoke of beta.yml
  # (scenario B0, the farm under Buck2 load), whose farm runs the kbf of build's linux-x86_64
  # tarball of the same run; its result document records no set hash and so says it is
  # unattested. The full run on the attested bytes with the update and kill scenarios, and the
  # `signing: true` job that attests its result, are added to `jobs` by the changes that build
  # them. beta.yml has no trigger of its own: no pull request, no merge queue entry, no push.
  - name: beta
    runs: actions
    after: [build]
    result: beta-result.json
    events: [workflow_call]
  # Gamma has no stage here: gamma.yml is deleted, and gamma moves to kbf-updater (the
  # package-update design, section 13). The 24 hour bake and its verdict run outside Actions.
  # release.yml plans, verifies, tags with the release bot, publishes, bumps the internal
  # repository and sets the release as the farm's desired version, in one run. It is started by
  # the completion of a successful pipeline run (`workflow_run`), the one workflow that is, so
  # that a newer push cancelling the pipeline never cancels a release that has started.
  - name: prod
    runs: actions
    after: [beta]
    result: release.json
    events: [workflow_run]
jobs:
  - job: pipeline.yml#ci
    stage: ci
  - job: pipeline.yml#artifacts
    stage: build
    signing: true
  - job: pipeline.yml#beta
    stage: beta
  - job: artifacts.yml#darwin-arm64
    stage: build
  - job: artifacts.yml#linux-x86_64
    stage: build
  - job: artifacts.yml#linux-arm64
    stage: build
  - job: artifacts.yml#sums-linux
    stage: build
  - job: artifacts.yml#sums-darwin-arm64
    stage: build
  - job: artifacts.yml#sums
    stage: build
  - job: artifacts.yml#attest-linux
    stage: build
    signing: true
  - job: artifacts.yml#attest-darwin-arm64
    stage: build
    signing: true
  - job: artifacts.yml#verify-linux
    stage: build
  - job: artifacts.yml#verify-darwin-arm64
    stage: build
  - job: beta.yml#smoke
    stage: beta
  - job: beta.yml#test-x86
    stage: beta
  - job: beta.yml#test-arm
    stage: beta
  - job: beta.yml#state-postgres
    stage: beta
  - job: beta.yml#objstore-s3
    stage: beta
  - job: beta.yml#crun-x86
    stage: beta
  - job: beta.yml#crun-arm
    stage: beta
  - job: beta.yml#m2-container
    stage: beta
  - job: beta.yml#native-macos
    stage: beta
  - job: beta.yml#native-macos-assert
    stage: beta
  - job: beta.yml#pkg-macos
    stage: beta
  - job: beta.yml#packages
    stage: beta
  - job: beta.yml#m1-cell
    stage: beta
  - job: beta.yml#cross-version
    stage: beta
  - job: beta.yml#mixed-version
    stage: beta
  - job: release.yml#plan
    stage: prod
  - job: release.yml#verify
    stage: prod
  - job: release.yml#tag
    stage: prod
  - job: release.yml#notes
    stage: prod
  - job: release.yml#publish
    stage: prod
  - job: release.yml#bump
    stage: prod
  # Presents the run's OIDC token to the farm's update coordinator and signs nothing: the row is
  # `signing: true` because the job holds `id-token: write`, which only a signing row may.
  - job: release.yml#deploy
    stage: prod
    signing: true
